const FORM = {"code": "T509", "form": "Environmental Hazards", "rev": "Residential Environmental Hazards Booklet, January 2011", "title": {"vi": "Booklet chất độc trong nhà: amiăng, CO, chì, mold, radon", "en": "Environmental hazards booklet: asbestos, CO, lead, mold, radon"}, "one": {"vi": "Cuốn 48 trang của tiểu bang nói về 8 loại chất độc hay gặp trong nhà: amiăng, khí CO, formaldehyde, rác thải độc, chì, mold, radon. Mỗi chương nói nó nằm đâu, hại gì, và ai test.", "en": "A 48-page state booklet on the hazards most often found in homes: asbestos, carbon monoxide, formaldehyde, hazardous waste, lead, mold and radon. Each chapter says where it hides, why it matters, and who tests for it."}, "eli10": {"vi": "<b>Nói cho dễ hiểu:</b> giống tờ hướng dẫn an toàn trong xe mới. Không ai đọc hết, nhưng khi có chuyện thì nó chỉ mình chỗ nào nguy hiểm và gọi ai. Cuốn này là tờ đó cho căn nhà: sơn cũ có chì, trần “popcorn” có thể có amiăng, bếp gas sinh khí CO.", "en": "<b>In plain words:</b> like the safety booklet in a new car. Nobody reads all of it, but when something comes up it shows you what's dangerous and who to call. This is that booklet for a house: old paint may have lead, a “popcorn” ceiling may have asbestos, a gas stove makes CO."}, "facts": [{"vi": "Seller hoặc agent đưa cho buyer. Buyer ký nhận đã có booklet.", "en": "The seller or agent hands it to the buyer. The buyer signs that they received it."}, {"vi": "Trong bộ disclosure khi mua nhà. Chủ nhà và người thuê cũng dùng được.", "en": "In the disclosure package when you buy. Owners and tenants can use it too."}, {"vi": "48 trang (8 chương + phụ lục)", "en": "48 pages (8 chapters + appendices)"}, {"vi": "AB 983 (1989) · Civil Code §2079.7 · luật chì liên bang 1992", "en": "AB 983 (1989) · Civil Code §2079.7 · federal lead law of 1992"}], "steps": [{"title": {"vi": "Lời mở đầu: đưa booklet không thay việc khai", "en": "Introduction: the booklet doesn't replace disclosure"}, "short": {"vi": "Mở đầu", "en": "Intro"}, "ref": "Trang 3 · Introduction", "crop": "s01.jpg", "pins": [{"box": [8.33, 3.65, 31.77, 7.47], "t": {"vi": "Seller phải khai điều mình biết", "en": "Sellers must disclose what they know"}, "d": {"vi": "Seller biết nhà có chất độc (mold, bồn dầu chôn, amiăng) thì phải khai. Đây là luật, không phải lịch sự.", "en": "If the seller knows of a hazard (mold, a buried oil tank, asbestos) it must be disclosed. That's the law, not a courtesy."}, "x": 7.35, "y": 7.39}, {"t": {"vi": "“Không biết” ≠ “không có”", "en": "“Unaware” ≠ “not there”"}, "d": {"vi": "Seller ghi “không biết có chất độc” không bảo đảm nhà sạch. Muốn chắc thì test.", "en": "A seller saying “I'm not aware of hazards” doesn't guarantee the home is clean. Test if you want to know."}, "x": 7.35, "y": 11.89}, {"t": {"vi": "Đưa booklet là đủ thông tin chung", "en": "The booklet covers the general info"}, "d": {"vi": "Đưa cuốn này rồi thì agent và seller không phải giảng thêm về chất độc nói chung.", "en": "Once the booklet is given, agents and sellers don't have to explain these hazards in general."}, "x": 7.35, "y": 83.64}, {"t": {"vi": "Nhưng vẫn phải khai cái biết", "en": "But known hazards still must be disclosed"}, "d": {"vi": "Booklet không che cho seller giấu chuyện. Biết mà không khai là vẫn bị kiện.", "en": "The booklet doesn't cover a seller who hides things. Knowing and not disclosing still gets you sued."}, "x": 7.35, "y": 92.61}], "example": {"vi": "Bà Hoa bán 1234 Example Lane, San Jose. Năm ngoái phòng tắm bị mold, bà cho thợ cạo rồi sơn lại. Đưa booklet xong bà vẫn phải ghi chuyện mold đó trên TDS.", "en": "Mrs. Hoa sells 1234 Example Lane, San Jose. Last year the bathroom had mold; she had it scraped and repainted. Handing over the booklet doesn't change it: the mold still goes on her TDS."}, "page": "p03.jpg"}, {"title": {"vi": "Chương I: Amiăng (asbestos) nằm ở đâu", "en": "Chapter I: Where asbestos hides"}, "short": {"vi": "Amiăng", "en": "Asbestos"}, "ref": "Trang 5 · Chapter I", "crop": "s02.jpg", "pins": [{"t": {"vi": "Danh sách chỗ hay có", "en": "Common places"}, "d": {"vi": "Sàn vinyl cũ, ống gió máy lạnh, ống nước nóng, ván lợp, tường, trần, bột trét sheetrock.", "en": "Old vinyl floors, duct wrap, hot water pipe insulation, shingles and siding, walls, ceilings, drywall compound."}, "x": 13.24, "y": 40.02}, {"t": {"vi": "Trần “popcorn”", "en": "“Popcorn” ceilings"}, "d": {"vi": "Trần phun xốp như “cottage cheese”. Nhà San Jose xây thập niên 60–70 gặp rất nhiều.", "en": "Spray-on ceilings that look like cottage cheese. Very common in 1960s–70s San Jose homes."}, "x": 7.35, "y": 65.7}, {"t": {"vi": "Cách nhiệt vermiculite trên attic", "en": "Vermiculite attic insulation"}, "d": {"vi": "Hạt nhỏ màu nâu hoặc vàng. Có thể chứa amiăng, test thường cũng khó ra.", "en": "Pebble-like, light brown or gold. May contain asbestos; standard tests may miss it."}, "x": 7.35, "y": 78.79}, {"box": [8.33, 85.46, 7.51, 5.33], "t": {"vi": "Ai test?", "en": "Who tests?"}, "d": {"vi": "Certified asbestos consultant (Cal/OSHA cấp) lấy mẫu gửi lab. Nhìn bằng mắt không biết được.", "en": "A Cal/OSHA certified asbestos consultant takes samples for a lab. You can't tell by looking."}, "x": 7.35, "y": 88.12}], "warn": {"vi": "Amiăng còn nguyên, không vỡ vụn thì chưa hại. Hại là lúc mình cạo trần, đập sàn để remodel. Test <b>trước</b> khi sửa, đừng test sau.", "en": "Intact asbestos isn't harmful. The danger starts when you scrape the ceiling or tear out floors to remodel. Test <b>before</b> the work, not after."}, "page": "p05.jpg"}, {"title": {"vi": "Chương II: Khí CO, kẻ giết người không mùi", "en": "Chapter II: Carbon monoxide, the odorless killer"}, "short": {"vi": "Khí CO", "en": "CO"}, "ref": "Trang 11 · Chapter II", "crop": "s03.jpg", "pins": [{"box": [32.9, 11.42, 7.75, 5.79], "t": {"vi": "Luật bắt gắn báo CO", "en": "CO alarms required"}, "d": {"vi": "Nhà có thiết bị đốt gas/dầu, fireplace, hoặc garage dính nhà phải gắn báo CO (từ 01/07/2011).", "en": "Homes with a fuel-burning appliance, a fireplace or an attached garage need CO alarms (since 07/01/2011)."}, "x": 31.92, "y": 14.32}, {"t": {"vi": "Bảo trì thiết bị gas", "en": "Maintain gas appliances"}, "d": {"vi": "Lò sưởi, bình nước nóng gas phải lắp đúng, có ống thoát ra ngoài. Cho người coi định kỳ.", "en": "Furnaces and gas water heaters must be installed and vented right. Have them serviced regularly."}, "x": 13.24, "y": 53.47}, {"t": {"vi": "Mở flue khi đốt lò", "en": "Open the flue"}, "d": {"vi": "Đốt fireplace mà quên mở flue là khói và CO vô nhà.", "en": "Light the fireplace with the flue closed and smoke and CO come inside."}, "x": 13.24, "y": 85.75}, {"t": {"vi": "Quan trọng nhất", "en": "Most important"}, "d": {"vi": "Gắn báo CO khắp nhà. Không thấy, không ngửi được CO, chỉ cái máy mới biết.", "en": "Put CO alarms throughout the home. You can't see or smell CO; only the alarm can."}, "x": 13.24, "y": 93.82}], "example": {"vi": "1234 Example Lane có bếp gas, bình nước nóng gas và garage dính nhà. Ba lý do, một kết luận: phải có báo CO. Seller ký form WCMD/WHSD xác nhận đã gắn.", "en": "1234 Example Lane has a gas range, a gas water heater and an attached garage. Three reasons, one answer: CO alarms are required. The seller certifies it on the WCMD/WHSD form."}, "page": "p11.jpg"}, {"title": {"vi": "Chương III: Formaldehyde từ gỗ ép", "en": "Chapter III: Formaldehyde from pressed wood"}, "short": {"vi": "Formaldehyde", "en": "Formaldehyde"}, "ref": "Trang 13 · Chapter III", "crop": "s04.jpg", "pins": [{"t": {"vi": "Mobile home cao gấp ~2.5 lần", "en": "Mobile homes run ~2.5× higher"}, "d": {"vi": "Nhà thường trung bình 14 ppb. Manufactured home 37 ppb vì xài nhiều gỗ ép.", "en": "Regular homes average 14 ppb. Manufactured homes 37 ppb, from more pressed wood."}, "x": 7.35, "y": 16.19}, {"t": {"vi": "Nhà mới cũng cao", "en": "New homes can be high too"}, "d": {"vi": "Đã đo được trên 200 ppb ở cả nhà mới. Tủ bếp, sàn gỗ ép mới thải nhiều nhất.", "en": "Levels over 200 ppb were found in new homes too. New cabinets and pressed-wood floors emit the most."}, "x": 7.35, "y": 25.31}, {"box": [8.33, 66.95, 40.01, 6.55], "t": {"vi": "Nguồn lớn nhất", "en": "Biggest source"}, "d": {"vi": "Particleboard, MDF, plywood trong tủ, kệ, sàn. Nhà flip vừa thay toàn bộ tủ bếp thì mở cửa sổ cho thoáng.", "en": "Particleboard, MDF and plywood in cabinets, shelves, floors. A freshly flipped home with all-new cabinets: open the windows."}, "x": 7.35, "y": 70.22}], "warn": {"vi": "Mùi hăng, cay mắt sau khi dọn vô nhà mới sửa thường là formaldehyde. Nó giảm dần theo thời gian. Mở cửa, giảm nóng ẩm. Muốn đo thì lấy mẫu không khí gửi lab.", "en": "A sharp smell and stinging eyes after moving into a fresh remodel is often formaldehyde. It fades over time. Ventilate, keep it cooler and drier. To measure, have air samples sent to a lab."}, "page": "p13.jpg"}, {"title": {"vi": "Chương VI: Chì trong sơn, đất, nước", "en": "Chapter VI: Lead in paint, soil and water"}, "short": {"vi": "Chì", "en": "Lead"}, "ref": "Trang 25 · Chapter VI", "crop": "s05.jpg", "pins": [{"box": [8.33, 14.81, 27.71, 4.57], "t": {"vi": "Trước 1978: coi như có chì", "en": "Pre-1978: assume lead paint"}, "d": {"vi": "Năm 1978 cấm sơn chì. Nhà xây trước đó thì cứ coi như có, cho tới khi test ra không.", "en": "Lead paint was banned in 1978. If the home is older, assume it has it until a test says otherwise."}, "x": 7.35, "y": 17.09}, {"t": {"vi": "Chỗ nguy hiểm nhất", "en": "Most dangerous spots"}, "d": {"vi": "Cửa sổ, bậu cửa, cửa, cầu thang, lan can, hàng rào. Chỗ cọ xát sinh bụi chì.", "en": "Windows, sills, doors, stairs, railings, fences: anywhere surfaces rub and make lead dust."}, "x": 7.35, "y": 32.51}, {"t": {"vi": "Nguồn ngoài sơn", "en": "Sources beyond paint"}, "d": {"vi": "Kẹo me, kẹo ớt nhập, chén gốm men, thuốc dân gian, nghề sửa bình xe. Đem chì vô nhà mà không biết.", "en": "Imported tamarind or chili candy, glazed pottery, folk remedies, radiator or battery work can bring lead home."}, "x": 7.35, "y": 88.77}, {"t": {"vi": "Ống nước cũ", "en": "Old pipes"}, "d": {"vi": "Ống chì gần như chỉ có ở nhà trước 1930. Hàn chì trên ống đồng bị cấm từ 1988.", "en": "Lead pipes are mostly in pre-1930 homes. Lead solder on copper pipes was banned in 1988."}, "x": 7.35, "y": 98.3}], "example": {"vi": "1234 Example Lane xây năm 1962. Bậu cửa sổ sơn tróc. Anh Tâm có con 2 tuổi. Việc đầu tiên: cho bé thử máu chì, và gọi inspector có chứng chỉ CDPH coi sơn trước khi đụng tới cửa sổ.", "en": "1234 Example Lane was built in 1962 and the window sills are peeling. Tâm has a 2-year-old. First steps: a blood lead test for the child, and a CDPH-certified inspector before anyone touches the windows."}, "page": "p25.jpg"}, {"title": {"vi": "Bán, cho thuê, sửa nhà trước 1978: ai phải làm gì", "en": "Selling, renting, remodeling pre-1978: who must do what"}, "short": {"vi": "Luật chì", "en": "Lead rules"}, "ref": "Trang 28 · Chapter VI", "crop": "s06.jpg", "pins": [{"t": {"vi": "Chủ cho thuê", "en": "Landlords"}, "d": {"vi": "Khai điều biết về chì, đưa pamphlet chì, kèm form liên bang trong hợp đồng thuê.", "en": "Disclose known lead info, give the lead pamphlet, include the federal lead form in the lease."}, "x": 7.35, "y": 40.07}, {"t": {"vi": "Người bán", "en": "Sellers"}, "d": {"vi": "Giống vậy: khai, đưa pamphlet, hợp đồng mua có form chì liên bang.", "en": "Same idea: disclose, give the pamphlet, and the purchase contract includes the federal lead form."}, "x": 7.35, "y": 63.77}, {"box": [14.22, 75.16, 42.45, 7.08], "t": {"vi": "Buyer có tới 10 ngày", "en": "Buyers get up to 10 days"}, "d": {"vi": "Buyer có quyền tới 10 ngày để test chì. Xem tool T510 để tính ngày.", "en": "Buyers have up to 10 days to check for lead. See T510 to count the date."}, "x": 13.24, "y": 78.7}, {"t": {"vi": "Thợ sửa nhà", "en": "Renovators"}, "d": {"vi": "Phải đưa pamphlet trước khi bắt đầu làm.", "en": "Must hand you a lead pamphlet before starting work."}, "x": 7.35, "y": 92.45}], "page": "p28.jpg"}, {"title": {"vi": "Chương VII: Mold, lớn hay nhỏ", "en": "Chapter VII: Mold, small or large"}, "short": {"vi": "Mold", "en": "Mold"}, "ref": "Trang 34 · Chapter VII", "crop": "s07.jpg", "pins": [{"box": [8.33, 10.51, 27.87, 4.17], "t": {"vi": "Dưới 10 sq ft: tự làm được", "en": "Under 10 sq ft: DIY is OK"}, "d": {"vi": "Đeo khẩu trang, kính, găng tay, tự lau dọn được.", "en": "With a mask, goggles and gloves, a homeowner can clean it."}, "x": 7.35, "y": 12.59}, {"t": {"vi": "Trên 100 sq ft: gọi thợ", "en": "Over 100 sq ft: hire a pro"}, "d": {"vi": "Mảng lớn thì thuê công ty chuyên làm mold.", "en": "Large areas need an experienced professional contractor."}, "x": 18.09, "y": 15.5}, {"t": {"vi": "Sửa nguồn nước trước", "en": "Fix the water first"}, "d": {"vi": "Không sửa chỗ rỉ, dột thì mold mọc lại. Lau trước sửa sau là làm hai lần.", "en": "If the leak isn't fixed the mold comes back. Clean first, fix later and you do it twice."}, "x": 13.24, "y": 33.87}, {"t": {"vi": "Phơi khô trong 48 giờ", "en": "Dry within 48 hours"}, "d": {"vi": "Bể ống, ngập: phải làm khô đồ ướt trong 48 giờ.", "en": "After a leak or flood, wet materials must dry within 48 hours."}, "x": 7.35, "y": 90.29}], "warn": {"vi": "Sơn đè lên vết mold không phải là sửa. Inspector thấy vết sơn mới ở trần phòng tắm là hỏi liền. Seller biết mà không khai thì rắc rối to.", "en": "Painting over mold is not a fix. Inspectors notice fresh paint on a bathroom ceiling. A seller who knew and didn't disclose has a real problem."}, "page": "p34.jpg"}, {"title": {"vi": "Chương VIII: Radon, khí phóng xạ từ đất", "en": "Chapter VIII: Radon, radioactive gas from the soil"}, "short": {"vi": "Radon", "en": "Radon"}, "ref": "Trang 37 · Chapter VIII", "crop": "s08.jpg", "pins": [{"t": {"vi": "Tầng sát đất cao nhất", "en": "Lowest floor is highest"}, "d": {"vi": "Radon đi từ đất lên. Tầng trệt, basement cao nhất. Lầu trên thấp.", "en": "Radon comes up from the soil. Ground floors and basements are highest; upper floors are low."}, "x": 31.06, "y": 8.96}, {"t": {"vi": "Nhà kế bên khác nhà mình", "en": "Next door ≠ your home"}, "d": {"vi": "Hàng xóm test thấp không có nghĩa nhà mình thấp. Phải test chính căn đó.", "en": "A low test next door doesn't mean yours is low. Test the actual home."}, "x": 7.35, "y": 26.72}, {"box": [8.33, 53.19, 43.36, 3.81], "t": {"vi": "Mốc 4 pCi/L", "en": "The 4 pCi/L line"}, "d": {"vi": "Trung bình năm từ 4 pCi/L trở lên thì nên làm hệ thống giảm radon.", "en": "At or above 4 pCi/L (annual average), take action to reduce it."}, "x": 7.35, "y": 55.09}, {"t": {"vi": "Kit test rẻ", "en": "Cheap test kits"}, "d": {"vi": "Năm 2011 CDPH bán kit $7. Giá nay có thể khác. Bán nhà thì thường dùng máy của người test chuyên nghiệp.", "en": "In 2011 CDPH sold kits for $7; prices may differ now. Sales usually use a professional tester's active device."}, "x": 7.35, "y": 93.29}], "warn": {"vi": "Luật <b>không bắt</b> giảm radon (trang 38). Là quyết định của chủ nhà. Nhưng buyer có quyền test trong thời gian inspection.", "en": "The law does <b>not</b> require radon mitigation (page 38). It's the owner's call. Buyers can still test during the inspection period."}, "page": "p37.jpg"}], "tool": {"intro": {"vi": "Nhập vài điều về căn nhà. Tool cho biết <b>nên check chất độc nào</b>, theo đúng booklet, và <b>ai là người test</b>.", "en": "Enter a few facts about the home. The tool lists <b>which hazards to check</b>, based on the booklet, and <b>who tests for each</b>."}, "inputs": [{"id": "year", "type": "number", "def": 1965, "min": 1850, "max": 2030, "label": {"vi": "Năm xây", "en": "Year built"}}, {"id": "fuel", "type": "check", "def": true, "label": {"vi": "Có đồ đốt gas/củi (bếp, lò sưởi, bình nước nóng gas, fireplace) hoặc garage dính nhà", "en": "Has gas or wood-burning items (range, furnace, gas water heater, fireplace) or an attached garage"}}, {"id": "ground", "type": "select", "def": "crawl", "label": {"vi": "Nhà nằm trên", "en": "Home sits on"}, "options": [{"v": "slab", "l": {"vi": "Sàn bê tông (slab)", "en": "Concrete slab"}}, {"v": "crawl", "l": {"vi": "Crawl space (gầm nhà)", "en": "Crawl space"}}, {"v": "base", "l": {"vi": "Basement / tầng hầm", "en": "Basement"}}, {"v": "upper", "l": {"vi": "Condo lầu 2 trở lên", "en": "Condo on 2nd floor or higher"}}]}, {"id": "water", "type": "select", "def": "city", "label": {"vi": "Nước xài", "en": "Water source"}, "options": [{"v": "city", "l": {"vi": "Nước thành phố / công ty nước", "en": "City or water company"}}, {"v": "well", "l": {"vi": "Giếng riêng", "en": "Private well"}}]}, {"id": "sign", "type": "select", "def": "none", "label": {"vi": "Có dấu hiệu nào?", "en": "Any of these?"}, "options": [{"v": "none", "l": {"vi": "Không có gì đặc biệt", "en": "Nothing special"}}, {"v": "wet", "l": {"vi": "Từng dột, rỉ nước, mùi ẩm mốc", "en": "Past leaks, water stains, musty smell"}}, {"v": "near", "l": {"vi": "Gần cây xăng, tiệm giặt khô, xưởng, bãi rác", "en": "Near a gas station, dry cleaner, factory or landfill"}}, {"v": "wood", "l": {"vi": "Mobile home, hoặc tủ/sàn gỗ ép mới thay", "en": "Mobile home, or brand-new pressed-wood cabinets/floors"}}, {"v": "remodel", "l": {"vi": "Định remodel (đập tường, cạo trần, thay sàn)", "en": "Planning a remodel (walls, ceilings, floors)"}}]}]}, "myths": [{"t": {"vi": "“Seller nói không biết có chất độc, vậy là nhà sạch.”", "en": "“The seller says no known hazards, so the home is clean.”"}, "d": {"vi": "Booklet nói thẳng ở trang 3: câu “không biết” không phải bảo đảm. Radon, CO, chì không thấy, không ngửi được. Chỉ test mới biết.", "en": "Page 3 says it plainly: “unaware” is not a guarantee. Radon, CO and lead can't be seen or smelled. Only testing tells you."}}, {"t": {"vi": "“Sơn đè lên là hết chì, hết mold.”", "en": "“Painting over it fixes lead or mold.”"}, "d": {"vi": "Sơn thường đè lên sơn chì không phải cách sửa lâu dài (tr. 26). Mold sơn đè thì mọc lại nếu nguồn nước còn.", "en": "Regular paint over lead paint is not a permanent fix (p. 26). Painted-over mold returns if the water source remains."}}, {"t": {"vi": "“Nhà hàng xóm test radon thấp, nhà mình khỏi test.”", "en": "“The neighbor's radon test was low, so we're fine.”"}, "d": {"vi": "Trang 37: nhà cùng xóm có mức radon khác nhau. Đất và cách xây mỗi nhà mỗi khác.", "en": "Page 37: homes in the same neighborhood have different radon levels. Soil and construction differ."}}], "next": [{"href": "/t510/", "t": {"vi": "T510 · Pamphlet chì: 10 ngày test", "en": "T510 · Lead pamphlet: the 10-day window"}, "d": {"vi": "Nhà trước 1978: tính hạn chót test chì.", "en": "Pre-1978 homes: count your lead test deadline."}}, {"href": "/t70/", "t": {"vi": "T70 · Nên làm inspection gì", "en": "T70 · Which inspections to order"}, "d": {"vi": "Chọn inspection theo tuổi nhà và loại nhà.", "en": "Pick inspections by age and type of home."}}, {"href": "/t500/", "t": {"vi": "T500 · TDS: bản khai của seller", "en": "T500 · TDS: the seller's disclosure"}, "d": {"vi": "Câu C1 của TDS hỏi đúng các chất độc này.", "en": "TDS question C1 asks about exactly these hazards."}}, {"href": "/t28/", "t": {"vi": "T28 · Disclosures người bán là gì", "en": "T28 · Seller disclosures explained"}, "d": {"vi": "Trọn bộ giấy seller phải đưa.", "en": "Every disclosure a seller owes."}}], "sources": [{"t": "Civil Code §2079.7", "u": "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=2079.7"}, {"t": "CalEPA Cortese List", "u": "https://calepa.ca.gov/sitecleanup/corteselist/"}, {"t": "U.S. EPA · Radon", "u": "https://www.epa.gov/radon"}, {"t": "U.S. EPA · Asbestos", "u": "https://www.epa.gov/asbestos"}, {"t": "U.S. EPA · Lead", "u": "https://www.epa.gov/lead"}]};
FORM.tool.compute=(function (v, H) {
      const vi = H.lang() === 'vi';
      const y = Number(v.year) || 0, it = [];
      const row = (n, why, who) => '<b>' + n + '</b> — ' + why + ' <i>' + (vi ? 'Ai test: ' : 'Who tests: ') + who + '</i>';
      let hi = 0;
      if (y && y < 1978) { hi++; it.push(row(vi ? 'Chì (lead)' : 'Lead', vi ? 'Xây trước 1978: booklet nói cứ coi như có sơn chì (tr. 25). Có form lead disclosure + 10 ngày test.' : 'Built before 1978: the booklet says assume lead paint (p. 25). Lead disclosure form + 10-day test window apply.', vi ? 'inspector/risk assessor có chứng chỉ CDPH.' : 'a CDPH-certified inspector/assessor.')); }
      if (y && y < 1930) it.push(row(vi ? 'Ống nước chì' : 'Lead pipes', vi ? 'Ống chì gần như chỉ có ở nhà trước 1930 (tr. 27).' : 'Lead pipes are mostly found in pre-1930 homes (p. 27).', vi ? 'lab nước có chứng chỉ CDPH.' : 'a CDPH-certified water lab.'));
      else if (y && y < 1988) it.push(row(vi ? 'Chì trong nước (hàn chì)' : 'Lead in water (solder)', vi ? 'Hàn chì trên ống đồng bị cấm từ 1988 (tr. 27). Rủi ro thấp hơn sơn, nhưng có con nhỏ thì test.' : 'Lead solder was banned in 1988 (p. 27). Lower risk than paint, but test if you have small children.', vi ? 'lab nước có chứng chỉ CDPH, hoặc hỏi công ty nước.' : 'a CDPH-certified lab, or ask your water utility.'));
      if (y && y < 1981 || v.sign === 'remodel') { if (y && y < 1981) hi++; it.push(row(vi ? 'Amiăng (asbestos)' : 'Asbestos', (vi ? 'Sản xuất giảm mạnh từ cuối thập niên 1970 (tr. 5). Coi trần popcorn, sàn vinyl cũ, ống gió, vermiculite trên attic.' : 'Production dropped sharply after the late 1970s (p. 5). Look at popcorn ceilings, old vinyl floors, duct wrap, attic vermiculite.') + (v.sign === 'remodel' ? (vi ? ' <b>Định remodel: test trước khi đập.</b>' : ' <b>Remodeling: test before demolition.</b>') : ''), vi ? 'certified asbestos consultant (Cal/OSHA) + lab.' : 'a Cal/OSHA certified asbestos consultant + lab.')); }
      if (v.fuel) { hi++; it.push(row(vi ? 'Khí CO' : 'Carbon monoxide', vi ? 'Có đồ đốt nhiên liệu hoặc garage dính nhà: luật bắt gắn báo CO (tr. 11).' : 'Fuel-burning appliance or attached garage: CO alarms are required (p. 11).', vi ? 'PG&E hoặc thợ heating coi lò, bình nước nóng; home inspector check ống thoát.' : 'your utility or a heating contractor checks appliances; the home inspector checks venting.')); }
      if (v.sign === 'wood') it.push(row('Formaldehyde', vi ? 'Mobile home trung bình 37 ppb so với 14 ppb nhà thường; gỗ ép mới thải nhiều nhất (tr. 13–14).' : 'Mobile homes average 37 ppb vs 14 ppb in regular homes; new pressed wood emits the most (pp. 13–14).', vi ? 'lấy mẫu không khí gửi lab. Mở cửa cho thoáng trước.' : 'air samples analyzed by a lab. Ventilate first.'));
      if (v.sign === 'wet' || v.ground === 'crawl' || v.ground === 'base') { if (v.sign === 'wet') hi++; it.push(row(vi ? 'Mold' : 'Mold', v.sign === 'wet' ? (vi ? 'Từng có nước: sửa nguồn nước trước. Dưới 10 sq ft tự lau, trên 100 sq ft gọi thợ (tr. 34).' : 'Past water: fix the source first. Under 10 sq ft DIY, over 100 sq ft hire a pro (p. 34).') : (vi ? 'Crawl space/basement ẩm là nguồn mold hay gặp (tr. 31). Nhờ inspector soi gầm.' : 'A damp crawl space or basement is a common mold source (p. 31). Have the inspector look underneath.'), vi ? 'home inspector trước; mảng lớn thì công ty mold.' : 'the home inspector first; a mold contractor for large areas.')); }

      if (v.sign === 'near') { hi++; it.push(row(vi ? 'Rác thải độc gần nhà' : 'Nearby hazardous waste', vi ? 'Tra danh sách “Hazardous Waste and Substances Sites” (Cortese list) của CalEPA và coi kỹ báo cáo NHD/environmental (tr. 17).' : 'Check CalEPA’s “Hazardous Waste and Substances Sites” (Cortese) list and read the NHD/environmental report (p. 17).', vi ? 'registered environmental assessor nếu cần.' : 'a registered environmental assessor if needed.')); }
      if (!it.length) return { big: vi ? 'Ít rủi ro theo booklet' : 'Low risk per the booklet', sub: vi ? 'Nhà mới, lầu trên, không đồ đốt gas, không dấu hiệu ẩm. Vẫn đọc TDS và inspection như thường.' : 'Newer home, upper floor, no fuel-burning items, no moisture signs. Still read the TDS and inspection report.', items: [] };
      it.push(vi ? '<span class="tag">Lưu ý</span> Tool chỉ gợi ý theo booklet 2011. Mốc năm amiăng 1981 là ước tính thực hành, không phải luật.' : '<span class="tag">Note</span> Suggestions follow the 2011 booklet. The 1981 asbestos cutoff is a rule of thumb, not law.');

let lang='vi';try{const s=localStorage.getItem('kl_lang');if(s==='en'||s==='vi')lang=s;}catch(e){}
const qs=new URLSearchParams(location.search);if(qs.get('lang')==='en'||qs.get('lang')==='vi')lang=qs.get('lang');
const $=id=>document.getElementById(id);
const L=o=>o==null?'':(typeof o==='string'?o:(o[lang]??o.vi??''));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur=0, last=null;
function fmtMoney(n){return '$'+Math.round(n).toLocaleString('en-US')}
function fmtDate(d){if(!(d instanceof Date)||isNaN(d))return '—';return lang==='vi'?(String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()):d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function parseDate(s){if(!s)return null;const [y,m,dd]=s.split('-').map(Number);return new Date(y,m-1,dd)}
const H={fmtMoney,fmtDate,addDays,parseDate,L:o=>L(o),lang:()=>lang};

function renderStatic(){
  const u=UI[lang];document.documentElement.lang=lang;
  document.title=L(FORM.title)+' · Ken Lam Tools';
  $('eb').textContent=u.eb;$('lang').textContent=u.lang;
  $('code').textContent=FORM.code+' · '+FORM.form+' · '+FORM.rev;
  $('h1').textContent=L(FORM.title);$('one').innerHTML=L(FORM.one);
  $('facts').innerHTML=['k1','k2','k3','k4'].map((k,i)=>'<div><b>'+u.keys[k]+'</b><span>'+L(FORM.facts[i])+'</span></div>').join('');
  $('eli').innerHTML=L(FORM.eli10);
  ['vidH','vidP','walkH','walkP','toolH','mythH','nextH','mail','sms','vbtn','upd','allF','allT','disc'].forEach(k=>$(k).textContent=u[k]);
  $('prev').textContent=u.prev;$('nxt').textContent=u.nxt;
  $('srcL').innerHTML=u.src+': '+FORM.sources.map(s=>'<a href="'+s.u+'" target="_blank" rel="noopener">'+esc(s.t)+'</a>').join(' · ');
  $('myths').innerHTML=FORM.myths.map(m=>'<div class="warn"><b>'+L(m.t)+'</b>'+L(m.d)+'</div>').join('');
  $('next').innerHTML=FORM.next.map(n=>'<li><a href="'+n.href+'"><b>'+L(n.t)+'</b><br><span style="color:var(--muted);font-size:15px">'+L(n.d)+'</span></a></li>').join('');
  $('toolP').innerHTML=L(FORM.tool.intro);
  renderInputs();renderStep();compute();
}
function renderInputs(){
  const vals=readInputs(true);
  $('inputs').innerHTML=FORM.tool.inputs.map(f=>{
    const lab=L(f.label), hint=f.hint?'<small>'+L(f.hint)+'</small>':'';
    if(f.type==='check')return '<label class="chk" style="grid-column:1/-1"><input type="checkbox" id="f_'+f.id+'"'+((vals[f.id]??f.def)?' checked':'')+'><span>'+lab+hint+'</span></label>';
    if(f.type==='select')return '<label class="fld" for="f_'+f.id+'">'+lab+'<select id="f_'+f.id+'">'+f.options.map(o=>'<option value="'+o.v+'"'+(String(vals[f.id]??f.def)===String(o.v)?' selected':'')+'>'+L(o.l)+'</option>').join('')+'</select>'+hint+'</label>';
    const v=vals[f.id]??f.def??'';
    return '<label class="fld" for="f_'+f.id+'">'+lab+'<input id="f_'+f.id+'" type="'+f.type+'"'+(f.type==='number'?' inputmode="decimal"':'')+(f.min!=null?' min="'+f.min+'"':'')+(f.max!=null?' max="'+f.max+'"':'')+(f.step!=null?' step="'+f.step+'"':'')+' value="'+esc(v)+'">'+hint+'</label>';
  }).join('');
  $('inputs').querySelectorAll('input,select').forEach(e=>e.addEventListener('input',compute));
}
function readInputs(soft){
  const o={};FORM.tool.inputs.forEach(f=>{const e=$('f_'+f.id);if(!e){if(!soft)o[f.id]=f.def;return}
    o[f.id]=f.type==='check'?e.checked:(f.type==='number'?(e.value===''?null:Number(e.value)):e.value)});return o;
}
function compute(){
  let r;try{r=FORM.tool.compute(readInputs(false),H)}catch(e){r={big:'—',items:[]};console.error(e)}
  last=r;
  $('res').innerHTML='<div class="big'+(r.bad?' bad':'')+'">'+r.big+'</div>'+(r.sub?'<div class="sub">'+r.sub+'</div>':'')+(r.items&&r.items.length?'<ul>'+r.items.map(i=>'<li>'+i+'</li>').join('')+'</ul>':'');
}
function renderStep(){
  const u=UI[lang],s=FORM.steps[cur];
  $('chips').innerHTML=FORM.steps.map((x,i)=>'<button type="button" class="chip'+(i<cur?' done':'')+'" data-i="'+i+'"'+(i===cur?' aria-current="step"':'')+'>'+(i+1)+'. '+L(x.short||x.title)+'</button>').join('');
  const pins=(s.pins||[]).map((p,i)=>(p.box?'<span class="mark" style="left:'+p.box[0]+'%;top:'+p.box[1]+'%;width:'+p.box[2]+'%;height:'+p.box[3]+'%"></span>':'')+'<span class="pin" style="left:'+p.x+'%;top:'+p.y+'%">'+(i+1)+'</span>').join('');
  $('step').innerHTML='<div class="ref">'+u.step+' '+(cur+1)+' · '+esc(s.ref||'')+'</div><h3>'+L(s.title)+'</h3>'+(s.intro?'<p>'+L(s.intro)+'</p>':'')+
   (s.crop?'<div class="desk"><div class="scroll"><div class="sheet"><img src="'+s.crop+'" alt="'+esc(L(s.title))+'" loading="lazy">'+pins+'</div></div><div class="zoom"><span class="hint">'+u.hint+'</span><button type="button" id="zbtn" data-p="'+s.page+'">'+u.zoom+' ↗</button></div></div>':'')+
   '<ol class="pins">'+(s.pins||[]).map((p,i)=>'<li><span class="n">'+(i+1)+'</span><div><b class="pt">'+L(p.t)+'</b>'+L(p.d)+'</div></li>').join('')+'</ol>'+
   (s.example?'<div class="ex"><b>'+u.ex+'</b>'+L(s.example)+'</div>':'')+

  $('cnt').textContent=(cur+1)+u.of+FORM.steps.length;
  $('prev').disabled=cur===0;$('nxt').disabled=cur===FORM.steps.length-1;
  const z=$('zbtn');if(z)z.onclick=()=>{$('lbImg').src=z.dataset.p;$('lb').hidden=false};
}
$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;cur=+b.dataset.i;renderStep()});
$('prev').onclick=()=>{if(cur>0){cur--;renderStep();$('walkH').scrollIntoView({behavior:'smooth'})}};
