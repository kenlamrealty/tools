<script id="kl-commas">
/* Ken Lam Realty: ô nhập tiền / sqft tự thêm dấu phẩy (1,200,000). Code cũ vẫn đọc .value ra số thuần. */
(function(){
  var d=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
  function fmt(v){
    var s=String(v==null?'':v).replace(/[^0-9.\-]/g,''),neg=s.charAt(0)==='-';
    s=s.replace(/-/g,'');
    var i=s.indexOf('.'),ip=i<0?s:s.slice(0,i),dp=i<0?'':s.slice(i).replace(/\./g,'');
    if(i>=0)dp='.'+dp;
    ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return (neg?'-':'')+ip+dp;
  }
  function want(el){
    if(el.type!=='number'||el.__klc)return false;
    var c=el.closest&&el.closest('.ctl');if(!c)return false;
    var pre=c.querySelector('.pre'),post=c.querySelector('.post');
    if(pre&&pre.textContent.indexOf('$')>-1)return true;
    if(post&&/^\s*(sqft|sq ?ft)\s*$/i.test(post.textContent))return true;
    return false;
  }
  function conv(el){
    if(!want(el))return;
    el.__klc=1;
    var cur=d.get.call(el),ph=el.getAttribute('placeholder');
    el.type='text';
    if(!el.getAttribute('inputmode'))el.setAttribute('inputmode','numeric');
    Object.defineProperty(el,'value',{configurable:true,
      get:function(){return d.get.call(this).replace(/,/g,'')},
      set:function(v){d.set.call(this,fmt(v))}});
    d.set.call(el,fmt(cur));
    if(ph&&/^[0-9.]{5,}$/.test(ph))el.setAttribute('placeholder',fmt(ph));
    el.addEventListener('input',function(){
      var raw=d.get.call(el),pos=el.selectionStart,n=0,k;
      for(k=0;k<pos;k++)if(/[0-9.]/.test(raw.charAt(k)))n++;
      var out=fmt(raw);
      if(out===raw)return;
      d.set.call(el,out);
      for(k=0,pos=0;k<out.length&&n>0;k++){pos=k+1;if(/[0-9.]/.test(out.charAt(k)))n--;}
      try{el.setSelectionRange(pos,pos)}catch(e){}
    });
  }
  function scan(r){
    if(r.nodeType!==1)return;
    if(r.tagName==='INPUT')conv(r);
    var l=r.querySelectorAll?r.querySelectorAll('input[type=number]'):[];
    for(var i=0;i<l.length;i++)conv(l[i]);
  }
  new MutationObserver(function(m){
    for(var i=0;i<m.length;i++)for(var j=0;j<m[i].addedNodes.length;j++)scan(m[i].addedNodes[j]);
  }).observe(document.documentElement,{childList:true,subtree:true});
  document.addEventListener('DOMContentLoaded',function(){scan(document.body)});
})();
</script>

/*CALC-START*/
const DAY=864e5;
const parseD=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(Date.UTC(+m[1],+m[2]-1,+m[3])):null;};
const iso=d=>d.toISOString().slice(0,10);
const add=(d,n)=>new Date(d.getTime()+n*DAY);
const HMAP=new Map(HOLIDAYS.map(h=>[h[0],h]));
const wknd=d=>{const w=d.getUTCDay();return w===0||w===6;};
const hol=d=>HMAP.get(iso(d));
function perf(d){let x=d;while(wknd(x)||hol(x))x=add(x,1);return x;}
function addBiz(d,n){let x=d,k=0;while(k<n){x=add(x,1);if(!wknd(x)&&!hol(x))k++;}return x;}
function coeDay(d){let x=d;for(;;){const h=hol(x);if(wknd(x)||(h&&h[3]===1))x=add(x,1);else return x;}}
/* inp: {price,dep,downPct,acc:Date,coeDays} */
function cpa(inp){
  const down=inp.price*inp.downPct/100, loan=inp.price-down, bal=inp.price-inp.dep-loan;
  const coeRaw=add(inp.acc,inp.coeDays), coe=coeDay(coeRaw);
  const row=(k,raw,fin)=>({k,raw,d:fin,moved:iso(raw)!==iso(fin)});
  const v3=add(inp.acc,CPA.VERIFY), d7=add(inp.acc,CPA.DOCS), c17=add(inp.acc,CPA.CONT), fv=add(coe,-CPA.FV);
  const depRaw=add(inp.acc,CPA.DEP_BD);
  const rows=[row('dep',depRaw,addBiz(inp.acc,CPA.DEP_BD)),row('v3',v3,perf(v3)),row('d7',d7,perf(d7)),row('c17',c17,perf(c17)),row('fv',fv,perf(fv)),row('coe',coeRaw,coe)];
  return {down,loan,bal,depPct:inp.price>0?inp.dep/inp.price*100:0,coe,rows,shortCoe:inp.coeDays<=CPA.CONT,over3:inp.price>0&&inp.dep/inp.price*100>CPA.LD_PCT};
}

'3':{en:{n:'Terms of Purchase and Allocation of Costs (the big table)',s:'Every number and deadline in one place',say:'<b>A</b> price, all-cash or not. <b>B</b> close of escrow: days after acceptance or a date (no printed default). <b>C</b> offer expires 3 calendar days after the buyer signs, 5 PM, unless changed. <b>D</b> deposit within 3 business days by wire; increased deposit by addendum. <b>E</b> first loan and any second loan, max rate and points; occupancy type (investment by default). <b>F</b> balance of down payment. <b>G</b> seller credits; seller paying the buyer’s broker if checked. <b>H</b> proof of funds and lender letter: attached or 3 days. <b>J</b> final verification 5 days before close. <b>K</b> assignment request 17 days. <b>L</b> contingencies, mostly 17 days; seller documents, title report, HOA papers and leased items 17 days or 5 days after delivery, whichever is later. <b>M</b> possession; tenants stay unless delivered vacant. <b>N</b> seller documents 7 days, escrow papers 5 days after delivery, HOA fees 3 days, alarms/bracing 7 days, signer proof 3 days. <b>P</b> included/excluded items. <b>Q</b> who pays each cost. <b>R</b> income statements and tenant estoppels. <b>S</b> other terms.',ex:'A: $1,850,000, financed. B: 45 days. D(1): $55,500 (3%). E(1): $1,387,500 (75%) conventional, rate ≤ 7.25%. F: $407,000. H: lender letter attached. L: all 17 days. M(1): 3 units delivered with tenants, unit 4 vacant. Q(11): county transfer tax, seller. R: income/expense statements and tenant estoppels checked.',ask:'Which of these 17-day items can we realistically finish on a 4-unit building with tenants?'},

'5':{en:{n:'Additional Terms Affecting Purchase Price',s:'Deposit, all-cash, loans, lender limits on credits',say:'<b>A</b> Buyer wires the deposit straight to escrow; making it non-refundable needs a valid liquidated-damages clause. <b>B</b> All cash = no loan contingency; show proof of funds. <b>C</b> Loans are conventional unless seller-carry, assumption or “subject to” is checked; seller may call your lender for status; tell the seller any lender-required repairs in time. <b>D</b> Rest of the down payment goes to escrow per escrow’s instructions. <b>E</b> If the lender allows less credit than agreed, the credit shrinks and the price does not change by itself.',ex:'Anh Minh wires $55,500 on 11/12/2026. Seller credit agreed $20,000, lender allows $18,500 on an investment loan. Credit drops to $18,500; price stays $1,850,000.',ask:'What is the maximum seller credit my lender allows on a 4-unit investment loan?'},

'6':{en:{n:'Additional Financing Terms',s:'Proof of down payment, lender letter, no switching excuses',say:'Proof of down payment and closing costs on time. A lender letter saying you are prequalified or preapproved (ARMs judged at the qualifying rate). The seller relies on the financing you described; you may chase a backup loan, but failing to get it doesn’t excuse you.',ex:'Lender letter dated 11/05/2026 attached. Bank statement showing $480,000 delivered 11/12/2026.',ask:'If my lender changes terms, can I switch lenders without risking the deal?'},

'7':{en:{n:'Closing and Possession',s:'As-is, keys, tenants, seller staying',say:'Occupancy type affects financing. Property is sold “as-is” in its condition at acceptance and must be kept that way; seller removes debris and personal items (after 3 days’ notice the buyer may remove them and bill the seller). Investigate everything; permits may be missing. Seller staying after close: get insurance and legal advice. Warranties and all leases transfer at close. Keys, codes, openers handed over at close.',ex:'Unit 4 is vacant at close. Bác Hùng hands over 5 key sets, the laundry-room coin box key and the gate code. All 3 leases are assigned to the Nguyens on 12/24/2026.',ask:'What if a tenant moves out or stops paying before we close?'},
     vi:{n:'Closing and Possession (close và giao nhà)',s:'As-is, chìa khóa, người thuê, seller ở lại',say:'Mục đích ở ảnh hưởng tiền vay. Nhà bán "as-is" (nguyên trạng) như lúc acceptance và phải giữ y vậy; seller dọn rác và đồ cá nhân (báo 3 ngày không dọn thì người mua tự dọn và đòi tiền seller). Phải tự điều tra hết; có thể thiếu permit. Seller ở lại sau close: hỏi bảo hiểm và luật sư. Bảo hành và mọi hợp đồng thuê chuyển qua người mua lúc close. Chìa khóa, mã, remote giao lúc close.',ex:'Căn 4 trống lúc close. Bác Hùng giao 5 bộ chìa, chìa thùng xu phòng giặt và mã cổng. Cả 3 hợp đồng thuê chuyển qua Anh Minh & Chị Lan ngày 24/12/2026.',ask:'Người thuê dọn đi hay ngưng trả tiền trước khi close thì sao?'}},
'8':{en:{n:'Contingencies and Removal of Contingencies',s:'Your exits, and how they close',say:'<b>A</b> Loan: work in good faith; no appraisal or insurance contingency means a low value or insurance condition won’t let you cancel under the loan contingency; deposit and down payment are not contingencies. <b>B</b> Appraisal at or above the price (or a set gap), value only, with a Fair Appraisal Act notice and BREA complaint line. <b>C</b> Investigation of the property. <b>D</b> Insurance availability and cost. <b>E</b> Seller documents. <b>F</b> Title: preliminary report; 5 days to review a revised one. <b>G</b> HOA papers if any. <b>H</b> Leased or liened items you must take over. <b>I</b> You don’t have to remove a contingency before the seller delivers what it needs; removing early is against agent advice. <b>J</b> Remove or cancel in writing by the deadline; if you don’t, the seller can cancel only after a Notice to Buyer to Perform. <b>K</b> Sale of your other property is not a contingency unless COP is checked.',ex:'All 17 days → 11/26/2026, Thanksgiving, so it moves to Fri 11/27/2026. Appraisal comes in at $1,800,000 on 11/20. The Nguyens cancel in writing on 11/24 under the appraisal contingency and get the $55,500 back, less their fees.',ask:'Which contingency protects me if the rents turn out lower than the seller said?'},
     vi:{n:'Contingencies and Removal (điều kiện rút lui)',s:'Cửa thoát của mình, và lúc nào nó đóng',say:'<b>A</b> Vay: phải lo vay thiện chí; không có contingency appraisal hay bảo hiểm thì nhà định giá thấp hoặc lender đòi bảo hiểm không cho mình hủy theo contingency vay; tiền cọc và tiền down không phải contingency. <b>B</b> Appraisal bằng hoặc hơn giá mua (hoặc mức chênh đã ghi), chỉ về giá trị, kèm thông báo Fair Appraisal Act và chỗ khiếu nại BREA. <b>C</b> Điều tra căn nhà. <b>D</b> Bảo hiểm: mua được không, bao nhiêu tiền. <b>E</b> Giấy tờ seller. <b>F</b> Title: prelim report; 5 ngày để xem bản sửa. <b>G</b> Giấy HOA nếu có. <b>H</b> Đồ thuê hay còn nợ mình phải nhận lại. <b>I</b> Seller chưa giao đủ giấy thì mình chưa phải bỏ contingency; bỏ sớm là đi ngược lời khuyên của agent. <b>J</b> Tới hạn phải bỏ contingency hoặc hủy bằng giấy; không làm gì thì seller chỉ được hủy sau khi gửi Notice to Buyer to Perform (NBP). <b>K</b> Bán căn nhà khác của mình không phải contingency, trừ khi đánh dấu COP.',ex:'Tất cả 17 ngày → 26/11/2026 là Thanksgiving, nên dời qua Thứ Sáu 27/11/2026. Appraisal ra $1,800,000 ngày 20/11. Anh Minh & Chị Lan hủy bằng giấy ngày 24/11 theo contingency appraisal và lấy lại $55,500, trừ phí của mình.',ask:'Tiền thuê thật thấp hơn seller nói thì contingency nào bảo vệ tôi?'}},
'9':{en:{n:'Items Included in and Excluded from Sale',s:'What comes with the building',say:'MLS and flyers don’t decide what is included; this paragraph and 3P do. Existing attached fixtures and listed items are included, with no seller warranty. Leased or liened items must be disclosed. Some items are excluded by default (for example, audio-video equipment not built in).',ex:'Included: 4 stoves, 4 fridges, coin laundry machines. Excluded: the retail tenant’s shelving (tenant-owned). Leased: solar, disclosed with the lease papers.',ask:'Who owns the laundry machines, the owner or a laundry company lease?'},
     vi:{n:'Items Included and Excluded (đồ theo nhà)',s:'Cái gì đi theo căn nhà',say:'MLS hay tờ quảng cáo không quyết định đồ nào theo nhà; đoạn này và ô 3P mới quyết định. Đồ gắn chặt đang có và đồ được ghi thì theo nhà, seller không bảo hành. Đồ đi thuê hay còn nợ phải khai. Một số đồ mặc định không theo (ví dụ thiết bị âm thanh, video không gắn âm tường).',ex:'Theo nhà: 4 bếp, 4 tủ lạnh, máy giặt bỏ xu. Không theo: kệ của người thuê mặt bằng (đồ của họ). Đồ thuê: solar, khai kèm giấy thuê.',ask:'Máy giặt bỏ xu là của chủ hay thuê của công ty giặt?'}},
'10':{en:{n:'Allocation of Costs',s:'Who pays for reports and city requirements',say:'The 3Q table only says who pays. Government point-of-sale inspections and fixes are paid by whoever is checked; safety items required by law follow 3Q(17). If repairs are required by the city, the work must be permitted.',ex:'3Q(1) NHD report: seller. 3Q(2) Phase I environmental: buyer (because of the retail unit). 3Q(5) smoke/CO alarms: seller. 3Q(8) escrow fees: each pays their own.',ask:'Does San Jose require any point-of-sale inspection for a fourplex?'},
     vi:{n:'Allocation of Costs (ai trả gì)',s:'Ai trả tiền report và yêu cầu của city',say:'Bảng 3Q chỉ nói ai trả tiền. Kiểm tra hay sửa chữa mà nhà nước bắt lúc bán do bên được đánh dấu trả; đồ an toàn luật bắt theo ô 3Q(17). City bắt sửa thì phải có permit.',ex:'3Q(1) báo cáo NHD: seller. 3Q(2) Phase I môi trường: buyer (vì có mặt bằng bán lẻ). 3Q(5) báo khói/CO: seller. 3Q(8) phí escrow: ai trả phần người nấy.',ask:'San Jose có bắt kiểm tra gì lúc bán fourplex không?'}},
'11':{en:{n:'Seller Disclosures',s:'Tax withholding, hazards, permits, known facts',say:'<b>A</b> Escrow withholds federal (FIRPTA) and California tax unless the seller gives the right affidavit. <b>B</b> Pipeline notice. <b>C</b> Natural hazard disclosures. <b>D</b> HOA papers if any. <b>E–F</b> Solar, septic, well, propane. <b>G</b> Water-saving plumbing (Civ. Code §1101.5). <b>H–L</b> Surveys and plans, permits, structural changes, code compliance, violation notices, if the seller has them. <b>M</b> Buildings with 3+ units and elevated balconies/stairs: balcony addendum. <b>N</b> Known material facts, incl. insurance claims in the last 5 years. <b>O</b> Commercial Seller Property Questionnaire. <b>P</b> New problems found before close must be disclosed.',ex:'Bác Hùng is a U.S. citizen, signs C.A.R. Form AS, no FIRPTA withholding. He delivers NHD, permits for the 2019 roof, the 2024 balcony inspection on the 2nd-floor units, and a 2023 water-leak insurance claim, all by 11/16/2026.',ask:'Which seller papers are required by law here, and which are just in the contract?'},
     vi:{n:'Seller Disclosures (seller khai báo)',s:'Giữ thuế, thiên tai, permit, sự thật đã biết',say:'<b>A</b> Escrow giữ lại thuế liên bang (FIRPTA) và thuế California, trừ khi seller ký đúng giấy cam kết. <b>B</b> Thông báo đường ống gas. <b>C</b> Khai báo vùng thiên tai (NHD). <b>D</b> Giấy HOA nếu có. <b>E–F</b> Solar, hầm phân (septic), giếng, bình propane. <b>G</b> Ống nước tiết kiệm nước (Civ. Code §1101.5). <b>H–L</b> Bản đo đạc, bản vẽ, permit, sửa kết cấu, tuân thủ code, thư báo vi phạm, nếu seller có. <b>M</b> Tòa nhà 3 căn trở lên có ban công/cầu thang trên cao: phụ lục ban công. <b>N</b> Sự thật quan trọng đã biết, kể cả claim bảo hiểm 5 năm qua. <b>O</b> Bảng câu hỏi nhà thương mại của seller. <b>P</b> Trước khi close mà phát hiện chuyện mới thì phải khai thêm.',ex:'Bác Hùng là công dân Mỹ, ký C.A.R. Form AS, không bị giữ FIRPTA. Bác giao NHD, permit mái nhà 2019, biên bản kiểm tra ban công tầng 2 năm 2024, và claim bảo hiểm rò nước 2023, tất cả trước 16/11/2026.',ask:'Giấy nào của seller là luật bắt, giấy nào chỉ do hợp đồng?'}},
'12':{en:{n:'Tenancy Related Disclosures',s:'Leases, rent roll, books, estoppels',say:'Within the seller-document deadline: all leases, service contracts, rent amounts, deposits, and any landlord-tenant disputes. If checked in 3R: income and expense statements and tenant estoppel certificates (each tenant confirms their lease terms). Seller states no tenant lawsuits, liens or bankruptcies that it knows of, no secret rent concessions, and the books are the ones used for taxes.',ex:'Rent roll: Unit 1 $2,650, Unit 2 $2,700, Unit 3 $2,600, retail $3,100, Unit 4 vacant. Estoppel from the retail tenant confirms 2 years left and a $6,200 deposit.',ask:'Can we compare the rent roll to the seller’s Schedule E before removing contingencies?'},
     vi:{n:'Tenancy Related Disclosures (giấy người thuê)',s:'Hợp đồng thuê, rent roll, sổ sách, estoppel',say:'Trong hạn giao giấy của seller: mọi hợp đồng thuê, hợp đồng dịch vụ, tiền thuê, tiền cọc, và tranh chấp với người thuê. Nếu đánh dấu ở 3R: báo cáo thu chi và tenant estoppel certificate (từng người thuê tự xác nhận điều kiện thuê). Seller cam kết không biết người thuê nào đang kiện, có lien hay phá sản, không có giảm giá thuê ngầm, và sổ sách là sổ dùng khai thuế.',ex:'Rent roll: Căn 1 $2,650, Căn 2 $2,700, Căn 3 $2,600, mặt bằng $3,100, Căn 4 trống. Estoppel của người thuê mặt bằng xác nhận còn 2 năm và tiền cọc $6,200.',ask:'Mình so rent roll với Schedule E khai thuế của seller trước khi bỏ contingency được không?'}},
'13':{en:{n:'Changes During Escrow',s:'Seller can’t quietly re-lease',say:'Before close the seller may rent a vacant unit, change or extend a lease or service contract, or change the condition, but must give 7 days’ written notice first. The buyer has 5 days to object in writing, and then the seller can’t make the change.',ex:'On 12/01 Bác Hùng notices he wants to lease unit 4 at $2,400 on 12/08. On 12/03 the Nguyens object (they want it vacant to renovate). Unit 4 stays empty.',ask:'Can the seller sign a 3-year lease with the retail tenant during escrow?'},
     vi:{n:'Changes During Escrow (thay đổi trong escrow)',s:'Seller không được lén cho thuê lại',say:'Trước khi close seller được cho thuê căn trống, sửa hay gia hạn hợp đồng thuê hay hợp đồng dịch vụ, hoặc đổi tình trạng nhà, nhưng phải báo bằng giấy trước 7 ngày. Người mua có 5 ngày phản đối bằng giấy, và khi đó seller không được làm.',ex:'Ngày 01/12 Bác Hùng báo muốn cho thuê căn 4 giá $2,400 từ 08/12. Ngày 03/12 Anh Minh & Chị Lan phản đối (muốn để trống sửa). Căn 4 vẫn trống.',ask:'Seller có được ký hợp đồng 3 năm với người thuê mặt bằng trong lúc escrow không?'}},
'14':{en:{n:'Security Deposits and Unearned Rent',s:'Tenant money moves to the buyer',say:'Unused tenant security deposits and prepaid rent transfer to the buyer at close. The seller notifies tenants as the Civil Code requires.',ex:'Deposits $2,650 + $2,700 + $2,600 + $6,200 = $14,150 credited to the Nguyens at close, plus January rent already collected, prorated.',ask:'Will escrow show the tenant deposits as a credit to me on the closing statement?'},
     vi:{n:'Security Deposits and Unearned Rent (tiền cọc người thuê)',s:'Tiền của người thuê chuyển qua người mua',say:'Tiền cọc của người thuê chưa dùng và tiền thuê trả trước chuyển qua người mua lúc close. Seller báo cho người thuê theo Civil Code.',ex:'Tiền cọc $2,650 + $2,700 + $2,600 + $6,200 = $14,150 trừ cho Anh Minh & Chị Lan lúc close, cộng tiền thuê tháng 1 đã thu, chia theo ngày.',ask:'Escrow có ghi tiền cọc của người thuê là credit cho tôi trên bảng close không?'}},
'15':{en:{n:'Buyer’s Investigation of Property',s:'What you can inspect, and the rules',say:'At your cost within the investigation period: general, lead paint, pest (Section 1 / Section 2), and a Phase I environmental survey if allocated (5 days after receiving it to remove that part). Insurance is separate. No destructive testing or city inspectors without seller consent. Seller keeps utilities on. Give the seller copies of reports (not the appraisal) by the deadline or 3 days after receipt. Repair any damage, keep it lien-free, carry insurance.',ex:'General inspection 11/12, sewer scope 11/13, pest 11/14, Phase I ordered 11/10, received 11/23 → 5 days lands on Sat 11/28, so that part may be removed through Mon 11/30. Copies of reports to the seller by 11/27.',ask:'Do I really have to hand the seller my inspection reports?'},
     vi:{n:'Buyer’s Investigation (người mua kiểm tra nhà)',s:'Được kiểm tra gì, luật ra sao',say:'Tự trả tiền, trong hạn investigation: kiểm tra tổng quát, sơn chì, mối mọt (Section 1 / Section 2), và Phase I môi trường nếu ghi (nhận báo cáo rồi có 5 ngày để bỏ phần đó). Bảo hiểm là chuyện riêng. Không khoan đục hay mời thanh tra city khi seller chưa đồng ý. Seller giữ điện, nước, gas. Gửi seller bản sao report (trừ appraisal) trước hạn hoặc 3 ngày sau khi nhận. Làm hư thì sửa, không để lien, phải có bảo hiểm.',ex:'Kiểm tra tổng quát 12/11, soi ống cống 13/11, mối mọt 14/11, Phase I đặt 10/11, nhận 23/11 → 5 ngày rơi Thứ Bảy 28/11, nên phần đó được bỏ tới Thứ Hai 30/11. Gửi bản sao report cho seller trước 27/11.',ask:'Tôi có thật sự phải đưa report kiểm tra cho seller không?'}},
'16':{en:{n:'Title and Vesting',s:'Prelim, condition of title, deed, policy',say:'Buyer gets a current preliminary report. Title comes as-is except liens the seller must pay off. Seller discloses known title matters. Buyer gets a grant deed; vesting has legal and tax effects, so ask a pro. Standard CLTA owner’s policy; ask about an ALTA policy and its cost.',ex:'Prelim shows a 1962 utility easement along the back fence and the seller’s loan (paid off at close). Title: “Minh Nguyen and Lan Nguyen, husband and wife as community property with right of survivorship” (their CPA advised).',ask:'Is an ALTA owner’s policy worth it on a 4-unit building?'},
     vi:{n:'Title and Vesting (giấy chủ quyền)',s:'Prelim, tình trạng title, deed, bảo hiểm title',say:'Người mua nhận prelim report mới. Title nhận nguyên trạng, trừ các khoản nợ seller phải trả hết. Seller khai chuyện title đã biết. Người mua nhận grant deed; cách đứng tên có hệ quả luật và thuế, nên hỏi chuyên gia. Bảo hiểm title chủ nhà loại CLTA tiêu chuẩn; hỏi thêm loại ALTA và giá.',ex:'Prelim có easement điện nước năm 1962 dọc hàng rào sau và nợ nhà của seller (trả hết lúc close). Đứng tên: "Minh Nguyen and Lan Nguyen, husband and wife as community property with right of survivorship" (theo CPA của họ khuyên).',ask:'Nhà 4 căn có đáng mua bảo hiểm title ALTA không?'}},
'17':{en:{n:'Time Periods; Removal of Contingencies; Cancellation Rights',s:'The clock, and who can cancel',say:'<b>A</b> Seller delivers its reports within the 3N(1) time (7 days default). <b>B</b> Buyer investigates, may ask for repairs (seller need not agree), then removes or cancels in writing; a report delivered after you removed a contingency doesn’t revive it; until the seller actually cancels, you can still remove or cancel. <b>C</b> Seller may cancel only after a Notice to Buyer to Perform, if you miss a removal, the deposit, proof of funds, lender letter, signer proof, FinCEN cooperation, or a separate liquidated-damages form for an increased deposit. <b>D</b> Buyer may cancel after a Notice to Seller to Perform if the seller misses deliveries. <b>E</b> Notices give at least 2 days and can’t go out more than 2 days early. <b>F</b> Removing a contingency means you accept the risk. <b>G</b> Before cancelling over a missed close, send a Demand to Close (at least 3 days). <b>H</b> Deposits go back by signed mutual instructions; refusing in bad faith can cost up to $1,000 plus the deposit (Civ. Code §1057.3).',ex:'The Nguyens miss 11/27/2026. On 11/28 the seller’s agent delivers an NBP. The Nguyens have until 11:59 PM 11/30 (2 days) to remove or cancel. They remove all contingencies on 11/29.',ask:'If the seller is late with the rent roll, do my 17 days get longer?'},
     vi:{n:'Time Periods; Removal; Cancellation (hạn chót và quyền hủy)',s:'Đồng hồ, và ai được hủy',say:'<b>A</b> Seller giao report trong hạn ô 3N(1) (mặc định 7 ngày). <b>B</b> Người mua kiểm tra, được xin sửa (seller không bắt buộc đồng ý), rồi bỏ contingency hay hủy bằng giấy; report giao sau khi mình đã bỏ contingency thì không làm contingency sống lại; chừng nào seller chưa thật sự hủy, mình vẫn bỏ hay hủy được. <b>C</b> Seller chỉ được hủy sau khi gửi Notice to Buyer to Perform, nếu mình trễ bỏ contingency, trễ tiền cọc, chứng minh tiền, thư lender, giấy quyền ký, hợp tác FinCEN, hay chưa ký tờ liquidated damages riêng cho tiền cọc thêm. <b>D</b> Người mua được hủy sau khi gửi Notice to Seller to Perform nếu seller trễ giao giấy. <b>E</b> Notice cho ít nhất 2 ngày và không được gửi sớm hơn 2 ngày trước hạn. <b>F</b> Bỏ contingency là mình nhận rủi ro. <b>G</b> Trước khi hủy vì bên kia không close, phải gửi Demand to Close (ít nhất 3 ngày). <b>H</b> Tiền cọc trả lại khi hai bên ký giấy; cố tình không ký có thể bị phạt tới $1,000 cộng tiền cọc (Civ. Code §1057.3).',ex:'Anh Minh & Chị Lan trễ hạn 27/11/2026. Ngày 28/11 agent seller gửi NBP. Họ có tới 11:59 PM 30/11 (2 ngày) để bỏ contingency hay hủy. Ngày 29/11 họ bỏ hết contingency.',ask:'Seller giao rent roll trễ thì 17 ngày của tôi có dài ra không?'}},
'18':{en:{n:'Repairs',s:'Done right, with receipts',say:'Agreed repairs are finished before the final verification, comply with permits, look comparable, and come with invoices, receipts and a written list.',ex:'Seller agrees to replace the unit 2 water heater. Licensed plumber, city permit finaled 12/16, invoice $2,350 handed over at the 12/21 walk-through.',ask:'Can we ask for a credit instead of repairs, so we pick the contractor?'},
     vi:{n:'Repairs (sửa chữa)',s:'Sửa đúng, có hóa đơn',say:'Sửa chữa đã thỏa thuận phải xong trước final verification, đúng permit, nhìn tương đương đồ cũ, và có hóa đơn, biên nhận, bảng liệt kê.',ex:'Seller đồng ý thay bình nước nóng căn 2. Thợ có license, permit city đóng 16/12, hóa đơn $2,350 giao lúc đi coi lần cuối 21/12.',ask:'Mình xin credit thay vì sửa để tự chọn thợ được không?'}},
'19':{en:{n:'Final Verification of Condition',s:'A last look, not a new contingency',say:'Within the time in 3J (5 days before close), the buyer may check that the property was maintained, repairs are done, and the seller kept its promises. It is not a way out of the deal.',ex:'COE 12/24/2026 → 5 days before is Sat 12/19, so the scheduled day moves to Mon 12/21. The Nguyens walk all units with Ken, check the new water heater and test smoke alarms.',ask:'What if we find new damage at the final walk-through?'},
     vi:{n:'Final Verification of Condition (đi coi lần cuối)',s:'Coi lần cuối, không phải contingency mới',say:'Trong hạn ô 3J (5 ngày trước close), người mua được coi nhà có được giữ gìn, sửa xong chưa, seller làm đúng lời hứa chưa. Không phải cửa để rút khỏi hợp đồng.',ex:'COE 24/12/2026 → 5 ngày trước là Thứ Bảy 19/12, nên dời qua Thứ Hai 21/12. Anh Minh & Chị Lan đi hết các căn với Ken, coi bình nước nóng mới và thử báo khói.',ask:'Đi coi lần cuối mà thấy hư mới thì sao?'}},
'20':{en:{n:'Prorations of Property Taxes and Other Items',s:'Splitting taxes, rent, bonds',say:'Taxes, interest, rents, HOA dues, assumed insurance and bonds are prorated to the close date on a 30-day month. Seller pays HOA special assessments due before close. Mello-Roos and similar bonds due later pass to the buyer without credit. Supplemental tax bills after close are between buyer and seller directly.',ex:'December rent $11,050 collected by the seller. Close 12/24: the seller keeps 23 days and credits 7/30 × $11,050 ≈ $2,578 to the buyer (ESTIMATE; escrow computes the exact day count).',ask:'Who pays the supplemental property tax bill that comes after we buy?'},
     vi:{n:'Prorations (chia thuế, tiền thuê)',s:'Chia thuế nhà, tiền thuê, bond',say:'Thuế nhà, lãi, tiền thuê, phí HOA, bảo hiểm và bond nhận lại được chia tới ngày close, tính tháng 30 ngày. Seller trả special assessment HOA tới hạn trước close. Mello-Roos và bond tương tự tới hạn sau close thì người mua nhận, không được trừ tiền. Bill thuế bổ sung (supplemental) sau close hai bên tự giải quyết.',ex:'Tiền thuê tháng 12 $11,050 seller đã thu. Close 24/12: seller giữ 23 ngày và trừ cho người mua 7/30 × $11,050 ≈ $2,578 (ƯỚC TÍNH; escrow tính số ngày chính xác).',ask:'Bill thuế supplemental tới sau khi mua thì ai trả?'}},
'21':{en:{n:'Brokers and Agents',s:'Commission by separate agreement; what agents don’t do',say:'Each side pays its own broker by its own written agreement; percentages are of the final price; the buyer’s broker can’t take more than the buyer agreement allows. If the seller agreed to pay the buyer’s broker (3G(3)), that broker can enforce it. Agents don’t set price, guarantee condition, verify square footage or give legal/tax advice.',ex:'3G(3) checked: seller pays BRG Realty Corp 2% of the final price = $37,000 at $1,850,000. Ken’s buyer agreement with the Nguyens says 2%, so nothing more is owed.',ask:'If the seller won’t pay my agent, what do I owe under my own buyer agreement?'},
     vi:{n:'Brokers and Agents (broker, agent)',s:'Commission theo hợp đồng riêng; agent không làm gì',say:'Mỗi bên trả broker của mình theo hợp đồng giấy riêng; % tính trên giá cuối; broker bên mua không được nhận hơn mức trong hợp đồng với người mua. Nếu seller đồng ý trả broker bên mua (ô 3G(3)) thì broker đó được đòi. Agent không quyết giá, không bảo đảm tình trạng nhà, không đo diện tích, không tư vấn luật/thuế.',ex:'Đánh dấu 3G(3): seller trả BRG Realty Corp 2% giá cuối = $37,000 với giá $1,850,000. Hợp đồng người mua của Ken với Anh Minh & Chị Lan ghi 2%, nên không ai nợ thêm.',ask:'Seller không chịu trả agent của tôi thì tôi nợ bao nhiêu theo hợp đồng người mua?'}},
'22':{en:{n:'Joint Escrow Instructions to Escrow Holder',s:'What escrow follows, and federal reporting',say:'Listed paragraphs are escrow’s instructions. Escrow’s general provisions must be signed within 5 days of delivery. The agreement goes to escrow within 3 days. A FinCEN report applies, if in force, to 1–4 unit residential bought all-cash by an entity or trust; give requested data within 7 days. Escrow may pay brokers per their agreements, ask for invoices (3 days), confirms the deposit, and gets amendments within 3 days.',ex:'Escrow opened 11/09/2026. General provisions signed 11/12. The Nguyens buy in their own names with a bank loan, so the FinCEN rule wouldn’t apply anyway.',ask:'Is the FinCEN reporting rule in force right now?'},
     vi:{n:'Joint Escrow Instructions (chỉ dẫn cho escrow)',s:'Escrow làm theo cái gì, và báo cáo liên bang',say:'Các đoạn được liệt kê là chỉ dẫn cho escrow. Giấy general provisions của escrow phải ký trong 5 ngày sau khi nhận. Hợp đồng đưa escrow trong 3 ngày. Báo cáo FinCEN, nếu đang có hiệu lực, áp dụng cho nhà ở 1–4 căn mua bằng cash bởi tổ chức hay trust; phải đưa thông tin trong 7 ngày khi được hỏi. Escrow được trả broker theo hợp đồng, xin hóa đơn (3 ngày), xác nhận tiền cọc, và nhận bản sửa đổi trong 3 ngày.',ex:'Mở escrow 09/11/2026. Ký general provisions 12/11. Anh Minh & Chị Lan mua tên cá nhân, có vay ngân hàng, nên luật FinCEN đằng nào cũng không áp dụng.',ask:'Luật báo cáo FinCEN bây giờ có đang áp dụng không?'}},
'23':{en:{n:'Selection of Service Providers',s:'Agents don’t guarantee vendors',say:'Agents may refer inspectors, lenders and contractors, but don’t guarantee them. Pick your own if you like.',ex:'Ken gives three inspectors’ names. The Nguyens choose one who does 4-unit buildings weekly.',ask:'Do you get anything for referring this vendor?'},
     vi:{n:'Selection of Service Providers (chọn người làm)',s:'Agent không bảo đảm người làm',say:'Agent được giới thiệu inspector, lender, thợ, nhưng không bảo đảm họ. Muốn thì tự chọn.',ex:'Ken đưa tên 3 inspector. Anh Minh & Chị Lan chọn người tuần nào cũng kiểm nhà 4 căn.',ask:'Anh có được gì khi giới thiệu người này không?'}},
'24':{en:{n:'Multiple Listing Service (MLS)',s:'The deal and price get reported',say:'Agents may report the accepted offer and, at close, the price and terms to the MLS. Once online, nobody can pull those images or data back.',ex:'MLSListings shows “Pending” on 11/10 and “Sold $1,850,000” on 12/24.',ask:'Can the sale price be kept off public sites?'},
     vi:{n:'Multiple Listing Service (MLS)',s:'Giao dịch và giá được báo lên MLS',say:'Agent được báo lên MLS là offer đã được chấp nhận, và lúc close thì báo giá và điều kiện. Đã lên mạng thì không ai rút về được.',ex:'MLSListings hiện "Pending" ngày 10/11 và "Sold $1,850,000" ngày 24/12.',ask:'Giá bán có giấu khỏi các trang công khai được không?'}},
'25':{en:{n:'Attorney Fees and Costs',s:'Loser pays, between buyer and seller',say:'In a legal fight between buyer and seller, the winner collects reasonable attorney fees and costs, except as limited by the mediation rule.',ex:'If the Nguyens sue to get the deposit back and win, the seller pays their lawyer, unless they skipped mediation.',ask:'How much could a deposit fight cost if it goes to court?'},
     vi:{n:'Attorney Fees and Costs (tiền luật sư)',s:'Bên thua trả, giữa buyer và seller',say:'Buyer và seller kiện nhau thì bên thắng được đòi tiền luật sư và chi phí hợp lý, trừ khi bị luật hòa giải giới hạn.',ex:'Anh Minh & Chị Lan kiện đòi lại tiền cọc và thắng thì seller trả luật sư cho họ, trừ khi họ đã bỏ qua bước hòa giải.',ask:'Kiện giành tiền cọc ra tòa thì tốn khoảng bao nhiêu?'}},
'26':{en:{n:'Assignment/Nomination',s:'Your own LLC is OK; others need consent',say:'Buyer may assign to its own wholly-owned entity or trust. Anyone else needs the seller’s written consent, which can’t be unreasonably withheld, but refusal is reasonable if the buyer is paid for the assignment, misrepresents it, or asks after the 3K deadline (17 days). The assignee gives a lender letter; the original buyer stays liable unless the seller agrees.',ex:'On 11/20 the Nguyens assign to “Nguyen Family 1234 LLC,” 100% theirs. No consent needed. The LLC’s lender letter goes to the seller; the assignment goes to escrow within 1 day.',ask:'Will my lender still fund if the LLC takes title?'},
     vi:{n:'Assignment/Nomination (chuyển nhượng hợp đồng)',s:'LLC của mình thì được; người khác phải xin',say:'Người mua được chuyển cho công ty hay trust 100% của mình. Chuyển cho ai khác phải có seller đồng ý bằng giấy; seller không được từ chối vô lý, nhưng từ chối là hợp lý nếu người mua lấy tiền khi chuyển, khai gian, hay xin sau hạn 3K (17 ngày). Người nhận phải đưa thư lender; người mua ban đầu vẫn chịu trách nhiệm trừ khi seller đồng ý.',ex:'Ngày 20/11 Anh Minh & Chị Lan chuyển cho "Nguyen Family 1234 LLC", 100% của họ. Không cần xin. Thư lender của LLC gửi seller; giấy chuyển nhượng gửi escrow trong 1 ngày.',ask:'LLC đứng tên thì lender của tôi còn cho vay không?'}},
'27':{en:{n:'Successors and Assigns',s:'Binds heirs and assigns',say:'The agreement binds and benefits both sides’ successors and assigns.',ex:'If Bác Hùng passed away during escrow, his estate would still be bound to sell.',ask:'What happens to escrow if the seller dies before closing?'},
     vi:{n:'Successors and Assigns (người kế tục)',s:'Ràng buộc người thừa kế',say:'Hợp đồng ràng buộc và có lợi cho người kế tục, người được chuyển nhượng của cả hai bên.',ex:'Nếu Bác Hùng mất trong lúc escrow, di sản của bác vẫn phải bán.',ask:'Seller mất trước khi close thì escrow ra sao?'}},
'28':{en:{n:'Environmental Hazard Consultation',s:'Cleanup liability can follow the owner',say:'Laws can make owners liable for contamination even if they didn’t cause it. Agents aren’t experts; hire one.',ex:'The retail unit was a dry cleaner in the 1980s. The Nguyens order a Phase I; it flags possible solvent (PCE), so they order a Phase II before removing the investigation contingency.',ask:'Should I get a Phase I even for a small mixed-use building?'},
     vi:{n:'Environmental Hazard Consultation (môi trường)',s:'Trách nhiệm dọn ô nhiễm có thể theo chủ',say:'Luật có thể bắt chủ nhà chịu trách nhiệm ô nhiễm dù mình không gây ra. Agent không phải chuyên gia; phải thuê người có nghề.',ex:'Mặt bằng bán lẻ từng là tiệm giặt khô thập niên 1980. Anh Minh & Chị Lan đặt Phase I; báo cáo nghi có dung môi (PCE), nên đặt thêm Phase II trước khi bỏ contingency investigation.',ask:'Nhà nhỏ có mặt bằng bán lẻ thì có nên làm Phase I không?'}},
'29':{en:{n:'Americans With Disabilities Act',s:'Commercial space may need access fixes',say:'The ADA bans disability discrimination in public places, which can require changes to commercial space. Agents can’t judge compliance; ask an expert (a CASp inspector in California).',ex:'The retail unit’s entry has a 6-inch step. A CASp inspection estimates a ramp at $8,000 (ESTIMATE). The Nguyens ask for a credit.',ask:'Who is responsible if a customer sues the retail tenant over access?'},
     vi:{n:'Americans With Disabilities Act (ADA)',s:'Mặt bằng thương mại có thể phải sửa cho người khuyết tật',say:'ADA cấm phân biệt với người khuyết tật ở nơi công cộng, có thể bắt sửa mặt bằng thương mại. Agent không đánh giá được; hỏi chuyên gia (ở CA là CASp inspector).',ex:'Cửa mặt bằng có bậc 6 inch. CASp ước tính làm dốc $8,000 (ƯỚC TÍNH). Anh Minh & Chị Lan xin credit.',ask:'Khách kiện người thuê mặt bằng vì lối vào thì ai chịu?'}},
'30':{en:{n:'Copies',s:'Copies are true copies',say:'Both sides say the copies of documents they hand over are true copies of what they have.',ex:'The rent roll PDF Bác Hùng sends is the same one his property manager uses.',ask:'Can I ask for the originals of the leases?'},
     vi:{n:'Copies (bản sao)',s:'Bản sao là bản thật',say:'Hai bên cam kết bản sao giấy tờ đưa nhau là đúng bản mình đang có.',ex:'File rent roll Bác Hùng gửi đúng là file người quản lý nhà đang dùng.',ask:'Tôi xin coi bản gốc hợp đồng thuê được không?'}},
'31':{en:{n:'Legally Authorized Signer',s:'Signing for an entity, proof in 3 days',say:'Someone signing for a trust, LLC, estate or under a power of attorney signs in that role, promises the entity exists, and gives escrow proof within 3 days after acceptance.',ex:'If the seller were “Hung Tran Family Trust,” Bác Hùng signs as trustee and sends a Certification of Trust to escrow by 11/12/2026.',ask:'Which document does escrow need from the seller’s trust?'},
     vi:{n:'Legally Authorized Signer (người ký thay)',s:'Ký cho tổ chức, có giấy trong 3 ngày',say:'Người ký thay trust, LLC, di sản hay theo giấy ủy quyền thì ký với tư cách đó, cam kết tổ chức có thật, và đưa escrow giấy chứng minh trong 3 ngày sau acceptance.',ex:'Nếu seller là "Hung Tran Family Trust", Bác Hùng ký với tư cách trustee và gửi Certification of Trust cho escrow trước 12/11/2026.',ask:'Escrow cần giấy gì từ trust của seller?'}},
'32':{en:{n:'Definitions and Instructions',s:'How days are counted',say:'Acceptance is when the signed final offer or counter reaches the other side. The day of an event is Day 0; count calendar days; deadlines end 11:59 PM. A deadline on a Saturday, Sunday or legal holiday moves to the next day that isn’t one; close moves to a day the recorder, lender and escrow are all open. The deposit counts business days. “Delivered” means received by the party or agent (an inbox counts).',ex:'Accepted Mon 11/09/2026 = Day 0. Day 17 = Thu 11/26, Thanksgiving → Fri 11/27. Deposit: 3 business days, skipping Veterans Day 11/11 → Fri 11/13.',ask:'What exact time did the acceptance reach us? That sets Day 0.'},
     vi:{n:'Definitions and Instructions (định nghĩa, cách đếm ngày)',s:'Đếm ngày ra sao',say:'Acceptance là lúc offer hay counter cuối đã ký tới tay bên kia. Ngày xảy ra sự kiện là Ngày 0; đếm ngày lịch; hạn hết 11:59 PM. Hạn rơi Thứ Bảy, Chủ nhật hay lễ thì dời qua ngày kế tiếp không phải mấy ngày đó; ngày close dời tới ngày recorder, lender và escrow cùng mở. Tiền cọc đếm business days. "Delivered" (đã giao) là tới tay bên kia hay agent của họ (vô inbox là tính).',ex:'Chấp nhận Thứ Hai 09/11/2026 = Ngày 0. Ngày 17 = Thứ Năm 26/11, Thanksgiving → Thứ Sáu 27/11. Tiền cọc: 3 business days, bỏ Veterans Day 11/11 → Thứ Sáu 13/11.',ask:'Acceptance tới tay mình lúc mấy giờ? Cái đó quyết định Ngày 0.'}},
'33':{en:{n:'Equal Housing Opportunity',s:'Fair housing applies',say:'The property is sold under anti-discrimination laws.',ex:'Offers are compared on price and terms only.',ask:'What should I leave out of a cover letter to the seller?'},
     vi:{n:'Equal Housing Opportunity (không phân biệt)',s:'Luật fair housing áp dụng',say:'Căn nhà được bán theo luật chống phân biệt đối xử.',ex:'Offer chỉ so giá và điều kiện.',ask:'Viết thư kèm offer thì nên bỏ những gì?'}},
'34':{en:{n:'Terms and Conditions of Offer',s:'Initials, counters, backup offers',say:'Liquidated damages and arbitration apply only if everyone initials. If only some initial, a counter is needed. The seller can keep marketing for backups after acceptance. A buyer who defaults may owe broker fees. Signing means you read it all.',ex:'Both Nguyens and Bác Hùng initial 36 (liquidated damages); nobody initials 38 (arbitration).',ask:'Should I initial liquidated damages on an investment purchase?'},
     vi:{n:'Terms and Conditions of Offer (điều kiện offer)',s:'Ký tắt, counter, offer dự phòng',say:'Liquidated damages và trọng tài chỉ có hiệu lực khi mọi người ký tắt. Chỉ vài người ký thì cần counter. Sau acceptance seller vẫn được nhận offer dự phòng. Người mua bỏ ngang có thể phải trả tiền broker. Ký là coi như đã đọc hết.',ex:'Anh Minh, Chị Lan và Bác Hùng đều ký tắt đoạn 36 (liquidated damages); không ai ký tắt đoạn 38 (trọng tài).',ask:'Mua đầu tư thì có nên ký tắt liquidated damages không?'}},
'35':{en:{n:'Time of Essence; Entire Contract; Changes',s:'Deadlines matter; changes only in writing',say:'Time is of the essence. The written agreement is the whole deal; California law applies; changes only in a writing signed by both.',ex:'The seller’s agent texts “sure, take a few more days.” Not signed by Bác Hùng = no extension. Ken sends a signed addendum instead.',ask:'Can we put the extension in writing today, signed by both?'},
     vi:{n:'Time of Essence; Entire Contract; Changes (đúng hạn, chỉ giấy mới tính)',s:'Hạn chót quan trọng; sửa phải có giấy',say:'Đúng hạn là điều cốt lõi. Hợp đồng giấy là toàn bộ thỏa thuận; áp dụng luật California; sửa gì phải có giấy hai bên ký.',ex:'Agent seller nhắn "ừ, cho thêm vài ngày." Bác Hùng chưa ký = chưa gia hạn. Ken gửi phụ lục có chữ ký thay vì tin tin nhắn.',ask:'Mình làm giấy gia hạn hôm nay, hai bên ký luôn được không?'}},
'36':{en:{n:'Liquidated Damages',s:'If initialed, the deposit is the seller’s only remedy',say:'If the buyer defaults and both sides initialed, the seller keeps the deposit actually paid as the agreed damages. Release still needs signed instructions, a court or an arbitrator. An increased deposit needs a separate liquidated-damages form (DID). For 1–4 units the buyer will live in, over 3% of price is presumed unreasonable (Civ. Code §1675); for investment buyers that cap doesn’t apply.',ex:'Initialed. Deposit $55,500 = 3% of $1,850,000. If the Nguyens just walk after removing contingencies, Bác Hùng keeps $55,500 and can’t sue for more.',ask:'If we don’t initial, can the seller sue me for more than the deposit?'},
     vi:{n:'Liquidated Damages (mất cọc định sẵn)',s:'Nếu ký tắt, tiền cọc là thứ duy nhất seller được giữ',say:'Người mua bỏ ngang mà hai bên đã ký tắt thì seller giữ số tiền cọc đã nộp làm tiền bồi thường định sẵn. Muốn nhả tiền vẫn cần giấy hai bên ký, tòa hay trọng tài. Cọc thêm phải ký riêng tờ DID. Nhà 1–4 căn người mua định ở: trên 3% giá bị coi là không hợp lý (Civ. Code §1675); người mua đầu tư thì không có mức 3% đó.',ex:'Đã ký tắt. Tiền cọc $55,500 = 3% của $1,850,000. Nếu Anh Minh & Chị Lan bỏ ngang sau khi đã bỏ contingency, Bác Hùng giữ $55,500 và không kiện đòi thêm được.',ask:'Không ký tắt thì seller kiện đòi tôi hơn số tiền cọc được không?'}},
'37':{en:{n:'Mediation',s:'Try a mediator first',say:'Buyer and seller mediate before arbitration or court (C.A.R. Dispute Resolution Center or another agreed provider), split the fee. Skip it or refuse it, and you can’t recover attorney fees even if you win. Applies whether or not you initial arbitration.',ex:'Deposit dispute: they book mediation in January 2027, fee split 50/50.',ask:'How long does real-estate mediation usually take?'},
     vi:{n:'Mediation (hòa giải)',s:'Thử hòa giải trước',say:'Buyer và seller phải hòa giải trước khi ra trọng tài hay tòa (C.A.R. Dispute Resolution Center hay nơi hai bên chọn), chia đôi phí. Bỏ qua hay từ chối hòa giải thì thắng kiện cũng không đòi được tiền luật sư. Áp dụng dù có ký tắt trọng tài hay không.',ex:'Giành tiền cọc: hai bên hẹn hòa giải tháng 1/2027, phí chia đôi.',ask:'Hòa giải chuyện nhà đất thường mất bao lâu?'}},
'38':{en:{n:'Arbitration of Disputes',s:'Only if everyone initials: no jury, limited appeal',say:'If initialed by all, disputes not settled in mediation go to binding arbitration before a retired judge or a lawyer with 5+ years of real-estate practice, under the Federal Arbitration Act procedures. Excluded: probate, small claims, bankruptcy, evictions, foreclosures. Filing to preserve a deadline, record a lis pendens or file a mechanic’s lien doesn’t waive it. You give up a jury trial and most appeals.',ex:'Nobody initialed 38. If mediation fails, the deposit fight goes to Santa Clara County Superior Court.',ask:'For a $55,500 deposit, would arbitration or small claims make more sense?'},
     vi:{n:'Arbitration of Disputes (trọng tài)',s:'Chỉ khi mọi người ký tắt: không bồi thẩm đoàn, khó kháng cáo',say:'Nếu mọi người ký tắt, tranh chấp hòa giải không xong thì ra trọng tài ràng buộc, trước thẩm phán về hưu hoặc luật sư có trên 5 năm làm nhà đất, theo thủ tục Federal Arbitration Act. Không áp dụng: probate, small claims, phá sản, đuổi người thuê, foreclosure. Nộp đơn giữ thời hiệu, ghi lis pendens hay mechanic’s lien không bị coi là từ bỏ. Mình bỏ quyền ra tòa có bồi thẩm và phần lớn quyền kháng cáo.',ex:'Không ai ký tắt đoạn 38. Hòa giải không xong thì vụ tiền cọc ra Tòa Thượng thẩm Santa Clara County.',ask:'Tiền cọc $55,500 thì trọng tài hay small claims hợp lý hơn?'}},
'39':{en:{n:'Offer',s:'Expiration, entity buyers, buyer signatures',say:'The offer dies, and any deposit comes back, unless the seller signs and the signed copy reaches the buyer or agent by the 3C deadline. The seller doesn’t have to respond. Entity buyers write the full entity name and the authorized signer. The buyer confirms reading all 17 pages.',ex:'The Nguyens sign Thu 11/05/2026 at 4 PM. Default expiry: 3 calendar days → Sun 11/08 at 5 PM. Seller accepts Mon 11/09? Too late, the offer had expired, so they re-sign a fresh offer dated 11/09.',ask:'Should we shorten the expiration to push the seller to answer?'},
     vi:{n:'Offer (hết hạn offer, chữ ký người mua)',s:'Hết hạn, người mua là tổ chức, chữ ký',say:'Offer hết hiệu lực, tiền cọc nếu có được trả lại, trừ khi seller ký và bản đã ký tới tay người mua hay agent trước hạn ô 3C. Seller không bắt buộc trả lời. Người mua là tổ chức thì ghi đủ tên tổ chức và người ký thay. Người mua xác nhận đã đọc đủ 17 trang.',ex:'Anh Minh & Chị Lan ký Thứ Năm 05/11/2026 lúc 4 giờ chiều. Mặc định hết hạn: 3 ngày lịch → Chủ nhật 08/11 lúc 5 giờ chiều. Seller ký Thứ Hai 09/11? Trễ rồi, offer đã hết hạn, nên hai bên ký lại offer mới ngày 09/11.',ask:'Mình có nên rút ngắn hạn offer để seller phải trả lời nhanh không?'}},
'40':{en:{n:'Acceptance',s:'Seller signs, or counters',say:'The seller promises it owns the property or can sign, accepts the terms, and may attach a counter offer or back-up addendum. Entity sellers name the entity and signer. The brokers section and escrow’s acknowledgment follow.',ex:'Bác Hùng signs Mon 11/09/2026 at 10 AM; Ken receives the signed copy at 10:20 AM. Acceptance = 11/09, Day 0.',ask:'Did the seller sign everything, including the counter, with no changes?'},
     vi:{n:'Acceptance (chấp nhận)',s:'Seller ký, hoặc counter',say:'Seller cam kết mình là chủ hay có quyền ký, đồng ý các điều kiện, và có thể kèm counter offer hay phụ lục offer dự phòng. Seller là tổ chức thì ghi tên tổ chức và người ký. Sau đó là phần thông tin broker và escrow xác nhận đã nhận.',ex:'Bác Hùng ký Thứ Hai 09/11/2026 lúc 10 giờ sáng; Ken nhận bản đã ký lúc 10:20. Acceptance = 09/11, Ngày 0.',ask:'Seller đã ký hết, kể cả counter, không sửa gì phải không?'}}

const I18N={
 en:{lang:'Tiếng Việt',back:'← All tools',kicker:'C.A.R. Form CPA · Revised 6/26',title:'Buying a fourplex or commercial building: the CPA, line by line',sub:'The purchase contract for income and commercial property: deposit, 17-day contingencies, tenant papers and what happens if someone backs out.',
  eli_t:'In plain words',eli:'This is the rulebook for buying a building with tenants or a shop in it. You put down a deposit, then you get about two and a half weeks to check everything: the loan, the value, the building, the leases. Each check is a door you can still walk out of. When the time is up, the doors close one by one, and after that backing out can cost you the deposit. It is like a test drive with a timer: drive it, open the hood, read the service records, but give the keys back before the timer runs out or you just bought the car.',

  l_price:'Purchase price',l_dep:'Initial deposit',l_down:'Down payment',l_coe:'Close of escrow',u_days:'days',l_coe_s:'The form prints no default for close of escrow: you write the days or a date. 45 is only a starting example.',l_acc:'Acceptance date',l_acc_s:'(Day 0: the day the signed acceptance reaches you)',

  dl:{dep:['Deposit due at escrow','3 business days (¶3D(1), ¶32J)'],v3:['Proof of funds, lender letter, signer authority, HOA doc fees','3 days, if not attached to the offer (¶3H, ¶3N(3), ¶3N(5))'],d7:['Seller delivers documents, leases, rent roll; smoke/CO/bracing','7 days (¶3N(1), ¶3N(4), ¶17A)'],c17:['Remove or cancel: loan, appraisal, investigation, insurance; assignment request','17 days. Seller docs, title report, HOA, leased items: 17 days or 5 days after delivery, whichever is later (¶3L, ¶3K)'],fv:['Final verification of condition','5 days before close (¶3J). Not a contingency.'],coe:['Close of escrow','Your number (¶3B)']},
  moved:'Original {d} falls on {w} → moved',
  ok:'<b>Dates line up.</b> Contingencies end before close. After you remove them, your deposit is at risk if you walk away without a reason the contract allows.',
  short:'<b>Close is on or before Day 17.</b> Your contingency deadlines would run up to or past close. Remove contingencies in writing before close, or shorten the 3L days in the offer.',
  over3:' Deposit is over 3% of price. If you plan to live in a 1–4 unit building, a liquidated-damages amount over 3% is presumed unreasonable (Civ. Code §1675). For an investment purchase that cap doesn’t apply.',
  r_disc:'Explanation and estimate only. Not legal or tax advice. Holiday list covers 2026–2027. The signed contract and escrow’s calendar control.',
  fw_t:'Read this form, paragraph by paragraph',fw_s:'Our own plain-language walk-through of CPA 6/26 (40 paragraphs, 17 pages), not the form’s wording. Example: Anh Minh & Chị Lan Nguyen buy a fourplex with a corner shop at 1234 Example Lane, San Jose, CA 95100 from Bác Hùng Tran for $1,850,000; Ken Lam, BRG Realty Corp represents the buyers. Accepted Mon 11/09/2026.',
  L_say:'What the form says',L_ex:'Example, filled in',L_ask:'Ask your agent',
  sg_t:'Who signs, when, where it goes',sg_tbl:'<table class="sg"><thead><tr><th>Who</th><th>When</th><th>Then</th></tr></thead><tbody><tr><td>Buyer(s): sign ¶39, initial each page, initial ¶36 / ¶38 only if you choose</td><td>When making the offer (AD first)</td><td>Buyer’s agent delivers it to the seller’s agent</td></tr><tr><td>Seller(s): sign ¶40 or attach a counter</td><td>Before the offer expires (3C)</td><td>Signed copy delivered to buyer’s agent = Acceptance, Day 0</td></tr><tr><td>Both agents: brokers section</td><td>At acceptance</td><td>Contract goes to escrow within 3 days (¶22)</td></tr><tr><td>Escrow holder: acknowledgment</td><td>On opening escrow</td><td>Confirms the deposit to everyone (¶22G)</td></tr><tr><td>Buyer: contingency removal (CR-B) or cancellation (CC)</td><td>By each 3L deadline</td><td>To seller’s agent; copy to escrow</td></tr></tbody></table>',
  my_t:'What many people get wrong',
  my1:'<b>“17 days means 17 business days.”</b> No. Calendar days. Weekends count. Only the last day moves if it lands on a weekend or holiday. The deposit is the one item counted in business days.',
  my2:'<b>“If I miss a deadline, the deal is dead.”</b> Not automatically. The seller must first send a Notice to Buyer to Perform and wait at least 2 days. Here is my sharper take: the buyers who get hurt are not the ones who miss a date. They are the ones who remove contingencies on day 3 to “look strong” and then find the rent roll was fiction.',
  my3:'<b>“Commercial and residential contracts are basically the same.”</b> They aren’t. On a CPA the 3% deposit cap for owner-occupants usually doesn’t protect an investor, tenants stay, and the leases are the asset you are buying. Read the estoppels before you read the paint colors. Controversial but true after 23 years: on a fourplex I’d rather skip a cosmetic inspection than skip a tenant estoppel.',
  nx_t:'Next steps',nx1:'Run the building’s numbers before you write: <a href="/t146/">T146 cap rate &amp; cash flow</a> · <a href="/t262/">T262 rental loans: cash needed</a>.',nx2:'Deposit at risk? <a href="/t08/">T08 earnest money: when can you lose it</a>. Residential version of the calendar: <a href="/t60/">T60 escrow timeline (RPA)</a>.',nx3:'Seller is foreign or doing a 1031? <a href="/t325/">T325 FIRPTA withholding</a> · <a href="/t27/">T27 1031 calculator</a>.',nx4:'Listing side of the same deal: <a href="/t430/">T430 CLA explained</a>. All forms: <a href="/t402/">T402 every real-estate form</a>.',

 vi:{lang:'English',back:'← Tất cả tool',kicker:'C.A.R. Form CPA · bản 6/26',title:'Mua fourplex hay nhà thương mại: đọc CPA từng dòng',sub:'Hợp đồng mua nhà cho thuê nhiều căn và nhà thương mại: tiền cọc, 17 ngày contingency, giấy người thuê, và chuyện gì xảy ra khi có người bỏ ngang.',
  eli_t:'Nói cho dễ hiểu',eli:'Đây là luật chơi khi mua một căn nhà có người thuê hay có tiệm buôn bán. Mình đặt tiền cọc, rồi có chừng hai tuần rưỡi để kiểm hết: tiền vay, giá trị, căn nhà, hợp đồng thuê. Mỗi thứ cần kiểm là một cánh cửa mình còn bước ra được. Hết giờ thì từng cánh cửa đóng lại, và sau đó bỏ ngang có thể mất tiền cọc. Giống lái thử xe có hẹn giờ: cứ lái, mở nắp máy, đọc sổ bảo trì, nhưng trả chìa trước khi hết giờ, không thì coi như mình đã mua xe.',
  tl_t:'Kiểm tra nhanh: lịch escrow của mình',tl_s:'Nhập giá, tiền cọc, % tiền down và ngày acceptance. Ngày tính theo số mặc định in trên form, tự dời khỏi cuối tuần và ngày lễ.',

  dl:{dep:['Hạn tiền cọc vào escrow','3 business days (¶3D(1), ¶32J)'],v3:['Chứng minh tiền, thư lender, giấy quyền ký, phí giấy HOA','3 ngày, nếu chưa kèm theo offer (¶3H, ¶3N(3), ¶3N(5))'],d7:['Seller giao giấy, hợp đồng thuê, rent roll; báo khói/CO/dây giữ bình nước nóng','7 ngày (¶3N(1), ¶3N(4), ¶17A)'],c17:['Bỏ contingency hoặc hủy: vay, appraisal, kiểm tra nhà, bảo hiểm; xin chuyển nhượng','17 ngày. Giấy seller, prelim title, HOA, đồ thuê: 17 ngày hoặc 5 ngày sau khi nhận, lấy cái trễ hơn (¶3L, ¶3K)'],fv:['Final verification (đi coi lần cuối)','5 ngày trước close (¶3J). Không phải contingency.'],coe:['Close of escrow','Số của mình (¶3B)']},
  moved:'Ngày gốc {d} rơi vào {w} → đã dời',
  ok:'<b>Lịch khớp.</b> Contingency hết trước ngày close. Bỏ contingency rồi mà rút lui không có lý do hợp đồng cho phép thì tiền cọc bị rủi ro.',
  short:'<b>Ngày close trùng hoặc trước Ngày 17.</b> Hạn contingency sẽ chạm hoặc vượt ngày close. Phải bỏ contingency bằng giấy trước khi close, hoặc rút ngắn số ngày ô 3L trong offer.',
  over3:' Tiền cọc trên 3% giá mua. Nếu mình định ở trong nhà 1–4 căn, khoản liquidated damages trên 3% bị coi là không hợp lý (Civ. Code §1675). Mua đầu tư thì không có mức 3% đó.',
  r_disc:'Chỉ là giải thích và ước tính. Không phải tư vấn luật hay thuế. Danh sách ngày lễ có cho 2026–2027. Hợp đồng đã ký và lịch của escrow mới là cái quyết định.',
  fw_t:'Đọc form này từng đoạn',fw_s:'Phần giải thích bằng lời của mình cho CPA bản 6/26 (40 đoạn, 17 trang), không chép chữ của form. Ví dụ: Anh Minh & Chị Lan Nguyen mua căn fourplex có tiệm ở góc, 1234 Example Lane, San Jose, CA 95100, của Bác Hùng Tran giá $1,850,000; Ken Lam, BRG Realty Corp đại diện người mua. Chấp nhận Thứ Hai 09/11/2026.',
  L_say:'Form nói gì',L_ex:'Ví dụ đã điền',L_ask:'Hỏi agent',
  sg_t:'Ai ký, khi nào, ký xong đi đâu',sg_tbl:'<table class="sg"><thead><tr><th>Ai</th><th>Khi nào</th><th>Rồi sao</th></tr></thead><tbody><tr><td>Người mua: ký đoạn 39, ký tắt từng trang, ký tắt đoạn 36 / 38 chỉ khi mình chọn</td><td>Lúc làm offer (ký AD trước)</td><td>Agent bên mua gửi agent bên bán</td></tr><tr><td>Người bán: ký đoạn 40 hoặc kèm counter</td><td>Trước khi offer hết hạn (ô 3C)</td><td>Bản đã ký tới tay agent bên mua = Acceptance, Ngày 0</td></tr><tr><td>Hai agent: phần thông tin broker</td><td>Lúc acceptance</td><td>Hợp đồng gửi escrow trong 3 ngày (¶22)</td></tr><tr><td>Escrow: ký xác nhận</td><td>Lúc mở escrow</td><td>Xác nhận tiền cọc với mọi bên (¶22G)</td></tr><tr><td>Người mua: bỏ contingency (CR-B) hay hủy (CC)</td><td>Trước từng hạn ô 3L</td><td>Gửi agent bên bán; bản sao cho escrow</td></tr></tbody></table>',
  my_t:'Nhiều người hiểu sai',
  my1:'<b>"17 ngày là 17 ngày làm việc."</b> Không. Ngày lịch. Thứ Bảy, Chủ nhật đều tính. Chỉ ngày cuối được dời nếu rơi cuối tuần hay ngày lễ. Riêng tiền cọc là đếm ngày làm việc.',
  my2:'<b>"Trễ một hạn là hợp đồng chết."</b> Không tự động. Seller phải gửi Notice to Buyer to Perform trước và chờ ít nhất 2 ngày. Còn đây là nhận xét thẳng của tôi: người mua bị thiệt không phải người trễ hạn. Mà là người bỏ contingency từ ngày thứ 3 cho "mạnh", rồi mới phát hiện rent roll là bịa.',
  my3:'<b>"Hợp đồng thương mại với nhà ở thì cũng vậy."</b> Không giống. Với CPA, mức trần 3% tiền cọc cho người mua để ở thường không che chở nhà đầu tư, người thuê ở lại, và hợp đồng thuê chính là tài sản mình đang mua. Đọc estoppel trước khi lo màu sơn. Nói ra dễ bị cãi nhưng là sự thật sau 23 năm: mua fourplex, tôi thà bỏ một cái inspection thẩm mỹ còn hơn bỏ tenant estoppel.',
  nx_t:'Bước tiếp theo',nx1:'Tính số của căn nhà trước khi viết offer: <a href="/t146/">T146 cap rate &amp; cash flow</a> · <a href="/t262/">T262 vay mua nhà cho thuê: cần bao nhiêu tiền</a>.',nx2:'Tiền cọc có rủi ro không? <a href="/t08/">T08 tiền cọc, khi nào mất</a>. Lịch escrow bản nhà ở: <a href="/t60/">T60 lịch escrow theo RPA</a>.',nx3:'Seller là người nước ngoài hay đang làm 1031? <a href="/t325/">T325 FIRPTA giữ thuế</a> · <a href="/t27/">T27 máy tính 1031</a>.',nx4:'Phía người bán của cùng giao dịch: <a href="/t430/">T430 giải nghĩa CLA</a>. Mọi forms: <a href="/t402/">T402 mọi forms địa ốc</a>.',

  ft_est:'Thông tin chung, không phải tư vấn luật hay thuế. Ngày tính theo số mặc định in trên form; hợp đồng của mình có thể đổi bất kỳ số nào. Ngày close không có số in sẵn.',
  ft_src:'Nguồn (tra 06/11/2026):',ft_links:'C.A.R. Form CPA bản 6/26 · <a href="https://california.public.law/codes/ca_civ_code_section_1057.3" target="_blank" rel="noopener">Civil Code §1057.3</a> · <a href="https://california.public.law/codes/civil_code_section_1675" target="_blank" rel="noopener">Civil Code §1675</a> · <a href="https://california.public.law/codes/government_code_section_6700" target="_blank" rel="noopener">Gov. Code §6700 (ngày lễ)</a> · <a href="https://www.gibsondunn.com/fincen-residential-real-estate-reporting-rule-vacated-nationwide/" target="_blank" rel="noopener">Gibson Dunn: luật FinCEN bị hủy 19/03/2026</a> · <a href="https://blog.softprocorp.com/fincen-appeals-decision-vacating-residential-real-estate-rule" target="_blank" rel="noopener">SoftPro: FinCEN kháng cáo</a>',

  subj:'Lịch escrow CPA — {n}',body:'Tên: {n}\nEmail: {e}\nPhone: {ph}\n\nGiá: {price}\nTiền cọc: {dep} ({dp}%) hạn {depd}\nTiền vay: {loan}\nPhần tiền down còn lại: {bal}\nAcceptance: {acc}\nViệc 3 ngày: {v3}\nSeller giao giấy: {d7}\nContingency 17 ngày: {c17}\nĐi coi lần cuối: {fv}\nClose escrow: {coe}\n\nGửi từ tool T437 tools.kenlamrealty.com'}
};

function numIn(id,def,min,max){const v=parseFloat($(id).value);return isFinite(v)?Math.min(max,Math.max(min,v)):def;}
function whyD(d){const h=hol(d);if(h)return lang==='vi'?h[1]:h[2];return WD[lang][d.getUTCDay()];}
function calc(){
  const d=I18N[lang];
  const inp={price:numIn('price',0,0,1e10),dep:numIn('dep',0,0,1e10),downPct:numIn('down',25,0,100),acc:parseD($('acc').value)||parseD('2026-11-09'),coeDays:Math.round(numIn('coe',45,1,365))};
  const r=cpa(inp);
  const coeRow=r.rows[5];
  $('big').textContent=fdate(r.coe);
  $('bigS').textContent=fill(d.r_sub,{n:inp.coeDays,mv:coeRow.moved?d.r_mv:'',loan:fmt(r.loan),down:fmt(r.down)});
  $('vLoan').textContent=fmt(r.loan);
  $('vLoanS').textContent=fill(d.v_loan_s,{p:(+(100-inp.downPct).toFixed(2)),dp:(+inp.downPct.toFixed(2))});
  $('vBal').textContent=fmt(r.bal);
  $('vDep').textContent=fmt(inp.dep);
  $('vDepS').textContent=fill(d.v_dep_s,{p:r.depPct.toFixed(2)});
  $('dl').innerHTML=r.rows.map(x=>{const t=d.dl[x.k];return '<div class="line"><span class="n"><b>'+t[0]+'</b><small>'+t[1]+'</small>'+(x.moved&&x.k!=='dep'?'<small>'+fill(d.moved,{d:fdate(x.raw),w:whyD(x.raw)})+'</small>':'')+'</span><span class="a" id="d_'+x.k+'">'+fdate(x.d)+'</span></div>';}).join('');
  const v=$('verdict');
  v.className=r.shortCoe?'note bad':'note';
  v.innerHTML=(r.shortCoe?d.short:d.ok)+(r.over3?d.over3:'');
  const D=k=>fdate(r.rows.find(x=>x.k===k).d);
  last={price:fmt(inp.price),dep:fmt(inp.dep),dp:r.depPct.toFixed(2),depd:D('dep'),loan:fmt(r.loan),bal:fmt(r.bal),acc:fdate(inp.acc),v3:D('v3'),d7:D('d7'),c17:D('c17'),fv:D('fv'),coe:fdate(r.coe)};
  $('smsBtn').href='sms:4086662825?&body='+encodeURIComponent(fill(d.sms,last));
  klSend();
}

/* ===== shared page logic (lang, form walkthrough, email/sms, embed) ===== */
let lang='vi'; try{ if(localStorage.getItem('kl_lang')==='en') lang='en'; }catch(e){}
const $=id=>document.getElementById(id);
const fmt=n=>(n<0?'−':'')+'$'+Math.round(Math.abs(n)).toLocaleString('en-US');
const fill=(s,o)=>s.replace(/\{(\w+)\}/g,(m,k)=>o[k]??m);
const pad=n=>String(n).padStart(2,'0');
const WD={vi:['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'],en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat']};
const fdate=d=>WD[lang][d.getUTCDay()]+', '+(lang==='vi'?pad(d.getUTCDate())+'/'+pad(d.getUTCMonth()+1):pad(d.getUTCMonth()+1)+'/'+pad(d.getUTCDate()))+'/'+d.getUTCFullYear();
let last={};
function buildParas(){
  const d=I18N[lang], open=new Set([...document.querySelectorAll('details.li[open]')].map(x=>x.id));
  let h='';
  for(const g of PG){
    h+='<article class="pg"><div class="ph"><h2>'+g[lang]+'</h2><span>'+g.pp+'</span></div>';
    for(const no of g.items){ const p=PARAS[no], e=p[lang], id='p-'+no;
      h+='<details class="li" id="'+id+'"'+(open.has(id)?' open':'')+'><summary><span class="n"><i>'+no+'</i> <b>'+e.n+'</b><small>'+e.s+'</small></span><span class="a"></span></summary>'+
        '<div class="ex"><p><span class="t">'+d.L_say+'</span>'+e.say+'</p><p><span class="t">'+d.L_ex+'</span>'+e.ex+'</p>'+
        '<p class="ask"><span class="t">'+d.L_ask+'</span>“'+e.ask+'”</p><span class="lk"><a href="#'+id+'">#'+id+'</a></span></div></details>';
    }
    h+='</article>';
  }
  $('paras').innerHTML=h;
}
function applyLang(){
  const d=I18N[lang];
  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.getAttribute('data-i'); if(typeof d[k]==='string') el.innerHTML=d[k];});
  $('langBtn').textContent=d.lang; $('klBack').textContent=d.back; document.documentElement.lang=lang;
  buildParas(); calc();
}
const EMBED=/[?&]embed=1/.test(location.search);
let klSend=()=>{};
if(EMBED){ document.documentElement.classList.add('embed'); let lastH=0;
  klSend=()=>{ const w=document.querySelector('.wrap'); const h=Math.ceil(w.getBoundingClientRect().bottom+window.scrollY+40); if(Math.abs(h-lastH)<4) return; lastH=h; try{ parent.postMessage({klToolsHeight:h},'*'); }catch(e){} };
  window.addEventListener('resize',()=>klSend()); new ResizeObserver(()=>klSend()).observe(document.body);
  document.addEventListener('click',e=>{ const a=e.target.closest&&e.target.closest('a[href]'); if(!a) return; const h=a.getAttribute('href'); if(h.startsWith('#')||a.target==='_blank') return; if(h.startsWith('/')) a.href='https://tools.kenlamrealty.com'+h; a.target='_top'; },true); }
document.querySelectorAll('.inputs input').forEach(el=>{el.addEventListener('input',calc);el.addEventListener('change',calc);});
document.querySelectorAll('.seg').forEach(s=>s.addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; s.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false')); calc();}));
$('langBtn').onclick=()=>{lang=lang==='vi'?'en':'vi'; try{localStorage.setItem('kl_lang',lang)}catch(e){} applyLang();};
$('emailBtn').onclick=()=>{$('form').classList.toggle('open'); if($('form').classList.contains('open')) $('fname').focus(); klSend();};
$('sendBtn').onclick=()=>{
  const d=I18N[lang], o=Object.assign({},last,{n:$('fname').value.trim()||'—',e:$('femail').value.trim()||'—',ph:$('fphone').value.trim()||'—'});
  const href='mailto:ken@kenlamrealty.com?subject='+encodeURIComponent(fill(d.subj,o))+'&body='+encodeURIComponent(fill(d.body,o));
  const a=document.createElement('a'); a.href=href; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove();
  $('sent').hidden=false; klSend();
};
$('copyBtn').onclick=async()=>{ try{ await navigator.clipboard.writeText('4086662825'); $('copyBtn').textContent='✓'; }catch(e){ const r=document.createRange(); r.selectNodeContents($('copyBtn').previousElementSibling); const s=getSelection(); s.removeAllRanges(); s.addRange(r);} };
$('paras').addEventListener('toggle',()=>klSend(),true);
function openHash(){ const h=decodeURIComponent(location.hash.slice(1)); if(!h) return; const el=document.getElementById(h); if(!el) return; if(el.tagName==='DETAILS') el.open=true; setTimeout(()=>el.scrollIntoView({block:'start'}),30); }
window.addEventListener('hashchange',openHash);
applyLang(); openHash();
</script>
</body>
