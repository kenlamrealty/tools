<script id="kl-commas">
/* Ken Lam Realty: ô nhập tiền / sqft tự thêm dấu phẩy (1,200,000). Code cũ vẫn đọc .value ra số thuần. */
(function(){
  var d=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
  function fmt(v){
    var s=String(v==null?'':v).replace(/[^0-9.\-]/g,''),neg=s.charAt(0)==='-';
    s=s.replace(/-/g,'');
    var i=s.indexOf('.'),ip=i<0?s:s.slice(0,i),dp=i<0?'':s.slice(i).replace(/\./g,'');
    if(i>=0)dp='.'+dp;
    ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return (neg?'-':'')+ip+dp;
  }
  function want(el){
    if(el.type!=='number'||el.__klc)return false;
    var c=el.closest&&el.closest('.ctl');if(!c)return false;
    var pre=c.querySelector('.pre'),post=c.querySelector('.post');
    if(pre&&pre.textContent.indexOf('$')>-1)return true;
    if(post&&/^\s*(sqft|sq ?ft)\s*$/i.test(post.textContent))return true;
    return false;
  }
  function conv(el){
    if(!want(el))return;
    el.__klc=1;
    var cur=d.get.call(el),ph=el.getAttribute('placeholder');
    el.type='text';
    if(!el.getAttribute('inputmode'))el.setAttribute('inputmode','numeric');
    Object.defineProperty(el,'value',{configurable:true,
      get:function(){return d.get.call(this).replace(/,/g,'')},
      set:function(v){d.set.call(this,fmt(v))}});
    d.set.call(el,fmt(cur));
    if(ph&&/^[0-9.]{5,}$/.test(ph))el.setAttribute('placeholder',fmt(ph));
    el.addEventListener('input',function(){
      var raw=d.get.call(el),pos=el.selectionStart,n=0,k;
      for(k=0;k<pos;k++)if(/[0-9.]/.test(raw.charAt(k)))n++;
      var out=fmt(raw);
      if(out===raw)return;
      d.set.call(el,out);
      for(k=0,pos=0;k<out.length&&n>0;k++){pos=k+1;if(/[0-9.]/.test(out.charAt(k)))n--;}
      try{el.setSelectionRange(pos,pos)}catch(e){}
    });
  }
  function scan(r){
    if(r.nodeType!==1)return;
    if(r.tagName==='INPUT')conv(r);
    var l=r.querySelectorAll?r.querySelectorAll('input[type=number]'):[];
    for(var i=0;i<l.length;i++)conv(l[i]);
  }
  new MutationObserver(function(m){
    for(var i=0;i<m.length;i++)for(var j=0;j<m[i].addedNodes.length;j++)scan(m[i].addedNodes[j]);
  }).observe(document.documentElement,{childList:true,subtree:true});
  document.addEventListener('DOMContentLoaded',function(){scan(document.body)});
})();
</script>

<script>
/* ===== RULES — T430 CLA (C.A.R. Form CLA, Revised 6/26). Looked up 06/11/2026. Facts: /home/claude/forms/facts/T430.md =====
   Form ¶2A(1): listing period; not over 24 months if 1–4 units and owner is not an entity; over 24 months on residential 1–4 = void unless corp/LLC/partnership.
     Matches Civil Code §1670.12(b)(1) (AB 1345, in force since 01/01/2024): exclusive listing on 1–4 units max 24 months; no auto-renewal; renewal in writing, max 12 months.
   Form ¶2C(1)/¶4: commission % of listing price (or of purchase price if a purchase agreement is signed). NOT fixed by law, negotiable (form notice + BCA).
   Form ¶2C(3)/¶4D(2): continuation period = ___ calendar days (form has NO default) after listing period; needs written list of names (C.A.R. NPB) before the agreement expires.
   Form ¶2F(3): owner pays for selected reports within 5 (or __) days of the Beginning Date.
   Form ¶17: broker/manager may cancel within 5 days after execution (tool uses start date as the signing date).
   Form ¶22: entity signer gives proof of authority within 3 days after execution.
   Form ¶4E(1): if the buyer breaches, broker gets the lesser of half the damages collected or the commission, after title/escrow and collection costs.
*/
const RULES={MAX_MONTHS_14:24,RENEW_MAX:12,REPORT_DAYS:5,MGMT_DAYS:5,AUTH_DAYS:3};
/*CALC-START*/
const DAY=864e5;
const parseD=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(Date.UTC(+m[1],+m[2]-1,+m[3])):null;};
const addD=(d,n)=>new Date(d.getTime()+n*DAY);
function addMonths(d,n){const y=d.getUTCFullYear(),m=d.getUTCMonth()+n,day=d.getUTCDate();const lastDay=new Date(Date.UTC(y,m+1,0)).getUTCDate();return new Date(Date.UTC(y,m,Math.min(day,lastDay)));}
/* inp: {price,pct,start:Date,months,prot,type:'14'|'5p',owner:'ind'|'ent'} */
function cla(inp){
  const comm=inp.price*inp.pct/100;
  const end=addD(addMonths(inp.start,inp.months),-1);
  const protEnd=addD(end,inp.prot);
  const voidRisk=inp.type==='14'&&inp.owner==='ind'&&inp.months>RULES.MAX_MONTHS_14;
  return {comm,end,protEnd,npb:end,rep:addD(inp.start,RULES.REPORT_DAYS),mgmt:addD(inp.start,RULES.MGMT_DAYS),per10k:10000*inp.pct/100,voidRisk};
}
if(typeof module!=='undefined'){module.exports={cla,addMonths,parseD};}
/*CALC-END*/

const PG=[
 {pp:'p. 1–2',vi:'Trang 1–2 · Bảng điều khoản chính',en:'Pages 1–2 · The key-terms table',items:['1','2','3']},
 {pp:'p. 2–3',vi:'Trang 2–3 · Tiền commission',en:'Pages 2–3 · The commission',items:['4']},
 {pp:'p. 3–5',vi:'Trang 3–5 · Nhà, giấy tờ, bổn phận',en:'Pages 3–5 · Property, papers, duties',items:['5','6','7','8','9']},
 {pp:'p. 5–6',vi:'Trang 5–6 · Quảng cáo, chìa khóa, an toàn',en:'Pages 5–6 · Marketing, keys, safety',items:['10','11','12','13','14','15']},
 {pp:'p. 6–7',vi:'Trang 6–7 · Luật chơi & chữ ký',en:'Pages 6–7 · Ground rules & signatures',items:['16','17','18','19','20','21','22']}
];
const PARAS={
'1':{en:{n:'Exclusive Authorization',s:'Who hires whom, for what, on which property',say:'The owner hires one brokerage, and only that brokerage, to sell (or lease, exchange, option) a commercial or residential-income property. City, county, ZIP and the parcel number (APN) go here.',ex:'Owner: Bác Hùng Tran. Broker: Ken Lam, BRG Realty Corp. Box checked: SELL. Box checked: residential income. Property: 1234 Example Lane, San Jose, Santa Clara County, CA 95100, a fourplex.',ask:'Is this exclusive right to sell, so you get paid even if I find the buyer myself?'},
     vi:{n:'Exclusive Authorization (giao độc quyền)',s:'Ai thuê ai, làm việc gì, cho căn nào',say:'Chủ nhà thuê một công ty môi giới, chỉ một công ty đó thôi, để bán (hoặc cho thuê, đổi, option) nhà thương mại hay nhà cho thuê nhiều căn. Ghi city, county, ZIP và số APN (số thửa đất của county).',ex:'Chủ nhà: Bác Hùng Tran. Broker: Ken Lam, BRG Realty Corp. Ô đánh dấu: SELL. Ô đánh dấu: residential income. Nhà: 1234 Example Lane, San Jose, Santa Clara County, CA 95100, một căn fourplex (4 căn).',ask:'Đây là độc quyền bán, nghĩa là tôi tự kiếm được người mua thì vẫn trả commission phải không?'}},
'2':{en:{n:'Terms of Listing Agreement (the big table)',s:'Dates, price, commission, protection days, MLS, offers, reports',say:'Almost every number lives here. <b>A(1)</b> start and end date (max 24 months on 1–4 units owned by a person; longer is void unless the owner is a corporation, LLC or partnership). <b>A(2)</b> list price. <b>B</b> mobile home or probate add-ons. <b>C(1)</b> commission % or flat $. <b>C(2)</b> optional extra if the buyer has no agent. <b>C(3)</b> continuation (protection) days, the form leaves it blank. <b>C(4)</b> any earlier broker still owed. <b>C(5)</b> referral fee. <b>D</b> items included, excluded, leased, liened, smart-home. <b>E</b> MLS, concessions marketing, no-photo choice. <b>F</b> when offers are shown, buyer letters, which reports the owner pays for within 5 days. <b>G</b> title exceptions. <b>J</b> no lockbox / no sign.',ex:'A(1): 11/09/2026 to 11:59 PM 05/08/2027. A(2): $1,850,000. C(1): 2.5% of list price. C(3): 90 days. E(1): MLSListings. F(1): offers presented as received. F(3): Preliminary Report + General Property Inspection, owner pays within 5 days (by 11/14/2026).',ask:'Which boxes in this table did we leave blank, and what happens because they are blank?'},
     vi:{n:'Terms of Listing Agreement (bảng lớn)',s:'Ngày, giá, commission, ngày bảo vệ, MLS, offer, report',say:'Gần như mọi con số nằm ở đây. <b>A(1)</b> ngày bắt đầu, ngày hết (tối đa 24 tháng nếu nhà 1–4 căn đứng tên cá nhân; dài hơn là vô hiệu, trừ khi chủ là corporation, LLC hay partnership). <b>A(2)</b> giá list. <b>B</b> phụ lục mobile home hoặc probate. <b>C(1)</b> commission % hay số tiền cố định. <b>C(2)</b> tiền thêm (tùy chọn) nếu người mua không có agent. <b>C(3)</b> số ngày continuation (bảo vệ), form để trống. <b>C(4)</b> broker cũ còn đòi tiền không. <b>C(5)</b> phí giới thiệu. <b>D</b> đồ đi theo nhà, đồ không theo, đồ thuê, đồ còn nợ, smart-home. <b>E</b> MLS, có quảng cáo sẵn lòng hỗ trợ (concessions) không, không cho chụp hình. <b>F</b> khi nào đưa offer, có đưa thư người mua không, report nào chủ nhà trả trong 5 ngày. <b>G</b> ngoại lệ về title. <b>J</b> không gắn lockbox / không cắm bảng.',ex:'A(1): 09/11/2026 tới 11:59 PM 08/05/2027. A(2): $1,850,000. C(1): 2.5% giá list. C(3): 90 ngày. E(1): MLSListings. F(1): có offer là đưa liền. F(3): Preliminary Report + General Property Inspection, chủ nhà trả trong 5 ngày (trước 14/11/2026).',ask:'Trong bảng này ô nào mình còn để trống, và để trống thì chuyện gì xảy ra?'}},
'3':{en:{n:'Advisories and Addenda',s:'Extra papers that ride along',say:'Check-boxes for advisories you received (Broker Compensation Advisory, REO, Trust) and addenda that become part of the contract (for example a short-sale addendum).',ex:'Checked: Broker Compensation Advisory (BCA). No short sale. Bác Hùng owns in his own name, so no Trust Advisory.',ask:'Which of these attachments actually change my contract, and which are just reading material?'},
     vi:{n:'Advisories and Addenda (giấy khuyến cáo, phụ lục)',s:'Giấy đi kèm',say:'Ô đánh dấu những tờ khuyến cáo (advisory) mình đã nhận (BCA về commission, REO, Trust) và phụ lục (addendum) trở thành một phần hợp đồng, ví dụ phụ lục short sale.',ex:'Đánh dấu: Broker Compensation Advisory (BCA). Không short sale. Bác Hùng đứng tên cá nhân nên không cần Trust Advisory.',ask:'Tờ nào trong mấy tờ kèm theo thật sự đổi hợp đồng, tờ nào chỉ để đọc?'}},
'4':{en:{n:'Compensation to Broker',s:'When the commission is earned, and the protection period',say:'Commission is not set by law and is negotiable. It is earned when: <b>D(1)</b> anyone, even the owner, brings a buyer whose offer the owner accepts, and the buyer closes or the owner blocks the closing (paid even if escrow closes after the listing ends); <b>D(2)</b> within the continuation period after the listing ends or is cancelled, the owner signs with someone who toured the property or made a written offer during the listing, <i>but only if</i> the broker gave the owner a written list of those names before the listing ended (C.A.R. Form NPB); <b>D(3)</b> the owner pulls the property off the market, transfers or leases it, or makes it unmarketable without the broker’s written OK. <b>E(1)</b> If the buyer breaks the deal, the broker gets the smaller of half of what the owner collects or the full commission, after costs. <b>E(2)</b> Escrow can pay the broker straight from the owner’s proceeds. <b>F</b> If an earlier broker is still owed for a named buyer, this broker is not paid on that sale.',ex:'Ken shows the fourplex to a buyer on 03/02/2027. Listing ends 05/08/2027. On 05/06/2027 Ken delivers an NPB naming that buyer. The buyer signs with Bác Hùng on 07/15/2027, inside 90 days (protection ends 08/06/2027). Commission is owed: 2.5% × $1,850,000 = $46,250 if it sells at list. No NPB delivered? No commission under D(2).',ask:'If the buyer walks and keeps fighting me over the deposit, what do I owe you?'},
     vi:{n:'Compensation to Broker (commission)',s:'Lúc nào phải trả commission, và thời gian bảo vệ',say:'Commission không do luật ấn định, thương lượng được. Broker được trả khi: <b>D(1)</b> bất kỳ ai, kể cả chủ nhà, đem tới người mua mà chủ nhà chấp nhận offer, và người mua close hoặc bị chủ nhà cản không cho close (close sau khi listing hết hạn vẫn phải trả); <b>D(2)</b> trong thời gian continuation sau khi listing hết hoặc bị hủy, chủ nhà ký bán cho người đã được dẫn đi coi nhà hoặc đã gửi offer bằng giấy trong thời gian listing, <i>nhưng chỉ khi</i> broker đã gửi chủ nhà danh sách tên mấy người đó bằng giấy trước ngày listing hết hạn (C.A.R. Form NPB); <b>D(3)</b> chủ nhà tự rút nhà khỏi thị trường, sang tên, cho thuê, hay làm nhà không bán được mà không có broker đồng ý bằng giấy. <b>E(1)</b> Người mua bỏ ngang: broker nhận số nhỏ hơn giữa một nửa tiền chủ nhà đòi được và commission, sau khi trừ chi phí. <b>E(2)</b> Escrow trả broker thẳng từ tiền bán. <b>F</b> Nếu broker cũ còn quyền với một người mua có tên, broker này không ăn commission vụ đó.',ex:'Ken dẫn một người mua đi coi fourplex ngày 02/03/2027. Listing hết 08/05/2027. Ngày 06/05/2027 Ken gửi NPB có tên người đó. Người đó ký mua với Bác Hùng ngày 15/07/2027, còn trong 90 ngày (bảo vệ tới 06/08/2027). Phải trả commission: 2.5% × $1,850,000 = $46,250 nếu bán đúng giá list. Không có NPB? Không có commission theo D(2).',ask:'Người mua bỏ ngang rồi còn giành tiền cọc với tôi, vậy tôi nợ anh bao nhiêu?'}},
'5':{en:{n:'Items Excluded and Included',s:'What stays with the building',say:'Attached fixtures stay, personal property goes, unless the purchase agreement says otherwise. What you list here is only your intention; the purchase contract decides. Leased items (solar, water softener, alarm) and items with a lien must be disclosed with their paperwork.',ex:'Included: 4 refrigerators, 4 stoves, coin washer/dryer. Excluded: the owner’s tools in the garage. Leased: solar on the roof. Liened: none.',ask:'If the solar is leased, will a buyer’s lender care, and what papers do I need ready?'},
     vi:{n:'Items Excluded and Included (đồ theo nhà)',s:'Cái gì ở lại với căn nhà',say:'Đồ gắn chặt vào nhà thì ở lại, đồ cá nhân thì mang đi, trừ khi hợp đồng mua bán ghi khác. Ghi ở đây chỉ là ý muốn của mình; hợp đồng mua mới là cái quyết định. Đồ đi thuê (solar, máy lọc nước, alarm) và đồ còn nợ có lien phải khai, kèm giấy tờ.',ex:'Theo nhà: 4 tủ lạnh, 4 bếp, máy giặt sấy bỏ xu. Không theo: đồ nghề của chủ trong garage. Đồ thuê: solar trên mái. Có lien: không.',ask:'Solar đi thuê thì lender của người mua có ngại không, tôi cần chuẩn bị giấy gì?'}},
'6':{en:{n:'Owner Representations',s:'Five things the owner says are NOT happening',say:'The owner says they know of no: notice of default, late loan payments, bankruptcy, lawsuit or government action affecting the property, or special assessment. If one shows up during the listing, tell the broker in writing right away.',ex:'Bác Hùng is current on his loan, no lawsuit with a tenant, no city assessment notice. He checks nothing. In February a tenant files a small-claims case over a deposit: he emails Ken that day.',ask:'Does a tenant dispute count as a lawsuit I have to tell you about?'},
     vi:{n:'Owner Representations (chủ nhà cam kết)',s:'Năm chuyện chủ nhà nói là KHÔNG có',say:'Chủ nhà nói mình không biết có: notice of default (thư báo trễ nợ nhà), tiền nợ trả trễ, phá sản, kiện tụng hay cơ quan nhà nước đang làm việc liên quan căn nhà, hay khoản thuế đặc biệt (special assessment). Trong thời gian listing mà có chuyện nào thì báo broker bằng giấy liền.',ex:'Bác Hùng trả nợ đúng hạn, không kiện tụng với người thuê, không có thư thuế đặc biệt của city. Tháng 2 một người thuê nộp đơn small claims đòi tiền cọc: bác email Ken liền ngày đó.',ask:'Người thuê kiện đòi tiền cọc có tính là kiện tụng phải báo anh không?'}},
'7':{en:{n:"Broker's and Owner's Duties",s:'Marketing, offers, buyer letters, reports, honesty',say:'<b>A</b> Broker uses reasonable effort, may order reports, market anywhere incl. MLS and internet, and may tell other agents that offers exist and their prices. <b>B</b> Offers are shown as they come in, unless you choose a set date (a strategy some buyers dislike); some buyers may ask the owner to pay their agent. <b>C</b> Buyer “love letters” can reveal protected traits; the broker won’t read them, and using them is against the broker’s advice. <b>D</b> Owner considers offers in good faith, allows showings, sends all inquiries to the broker, and sets the price. <b>E</b> Owner orders and pays for the chosen reports. <b>F</b> Owner covers the broker for anything the owner hid or got wrong.',ex:'Bác Hùng picks “offers on 11/23/2026”. Ken tells him two buyers may skip that and send a short-fuse preemptive offer. He chooses no buyer letters. He knows the back unit’s sewer line backed up twice in 2025, so he discloses it in writing.',ask:'If I hold offers until a date, how many buyers usually walk away instead of waiting?'},
     vi:{n:"Broker's and Owner's Duties (bổn phận hai bên)",s:'Quảng cáo, offer, thư người mua, report, trung thực',say:'<b>A</b> Broker cố gắng hợp lý, được đặt report, quảng cáo mọi nơi kể cả MLS và internet, được nói với agent khác là đã có offer và giá offer. <b>B</b> Offer có là đưa liền, trừ khi mình chọn một ngày cố định (có người mua không thích kiểu này); có người mua xin chủ nhà trả tiền agent của họ. <b>C</b> Thư "tình cảm" của người mua có thể lộ đặc điểm được luật bảo vệ (chủng tộc, tôn giáo, gia đình…); broker không đọc, dựa vào thư là đi ngược lời khuyên của broker. <b>D</b> Chủ nhà xét offer thiện chí, cho coi nhà, chuyển mọi người hỏi qua broker, và tự quyết giá. <b>E</b> Chủ nhà đặt và trả tiền report đã chọn. <b>F</b> Chủ nhà chịu trách nhiệm thay broker nếu giấu hoặc khai sai.',ex:'Bác Hùng chọn "nhận offer ngày 23/11/2026". Ken nói trước có người mua sẽ không chờ mà gửi offer ép hạn ngắn. Bác chọn không nhận thư người mua. Bác biết ống cống căn sau bị nghẹt 2 lần năm 2025, nên khai bằng giấy.',ask:'Nếu tôi giữ offer tới một ngày, thường có bao nhiêu người mua bỏ đi thay vì chờ?'}},
'8':{en:{n:'Deposit',s:'Broker may hold the buyer’s deposit',say:'The broker may accept and hold buyer deposits for the owner, to be applied to the price. In practice the deposit is wired to escrow.',ex:'The buyer’s 3% deposit goes by wire to the escrow company, not to Ken or Bác Hùng.',ask:'Will the deposit go straight to escrow? Who confirms the wire instructions by phone?'},
     vi:{n:'Deposit (tiền cọc)',s:'Broker được giữ tiền cọc của người mua',say:'Broker được nhận và giữ tiền cọc của người mua thay chủ nhà, tính vào giá bán. Thực tế tiền cọc wire thẳng vào escrow.',ex:'Tiền cọc 3% của người mua wire vào công ty escrow, không đưa cho Ken hay Bác Hùng.',ask:'Tiền cọc vô thẳng escrow phải không? Ai gọi điện xác nhận hướng dẫn wire?'}},
'9':{en:{n:'Agency Relationship',s:'Who represents whom, and dual agency',say:'Owner confirms receiving the agency disclosure (AD). Broker represents the owner. If the same brokerage finds the buyer, the owner agrees ahead of time to dual agency: the broker won’t tell the buyer the owner would take less, or tell the owner the buyer would pay more, but must share material facts. Brokers need a written agreement before showing homes to a buyer. The broker may list competing properties. If a buyer has no agent, the broker gets a signed non-agency paper. Agency ends when the listing ends or the sale closes.',ex:'Ken’s colleague at BRG Realty brings Anh Minh & Chị Lan Nguyen. BRG becomes a dual agent. Ken never tells them Bác Hùng would take $1.8M.',ask:'If your own buyer makes an offer, who is fighting for my price?'},
     vi:{n:'Agency Relationship (đại diện ai)',s:'Ai đại diện ai, và dual agency',say:'Chủ nhà xác nhận đã nhận tờ AD về quan hệ đại diện. Broker đại diện chủ nhà. Nếu cùng công ty kiếm ra người mua, chủ nhà đồng ý trước cho dual agency (đại diện hai bên): broker không được nói với người mua là chủ chịu bán rẻ hơn, không được nói với chủ là người mua chịu trả cao hơn, nhưng phải nói các sự thật quan trọng về căn nhà. Broker phải có hợp đồng giấy với người mua trước khi dẫn đi coi nhà. Broker được nhận listing của nhà cạnh tranh. Người mua không có agent thì broker cho ký giấy không đại diện. Quan hệ đại diện hết khi listing hết hạn hoặc bán xong.',ex:'Một đồng nghiệp của Ken ở BRG Realty đem tới Anh Minh & Chị Lan Nguyen. BRG thành dual agent. Ken không bao giờ nói với họ là Bác Hùng chịu bán $1.8M.',ask:'Nếu chính người mua của công ty anh làm offer, ai giữ giá cho tôi?'}},
'10':{en:{n:'Owner Concessions',s:'Money the owner may give toward buyer costs',say:'Concessions are payments toward the buyer’s costs: escrow, title, lender fees, repairs, inspections, even the buyer’s agent. An MLS mention only says the owner will consider requests; it is not a promise until it is in the accepted contract, and MLS concessions can’t be earmarked for agent pay.',ex:'MLS remark: “Seller will consider concessions.” Anh Minh asks for $15,000 toward closing costs in the offer. It binds only if Bác Hùng accepts that term.',ask:'Should I advertise concessions, or does it make buyers ask for more?'},
     vi:{n:'Owner Concessions (chủ nhà hỗ trợ tiền)',s:'Tiền chủ nhà có thể góp vào chi phí người mua',say:'Concessions là tiền chủ nhà góp vào chi phí người mua: escrow, title, phí lender, sửa nhà, inspection, kể cả tiền agent bên mua. Ghi trên MLS chỉ có nghĩa chủ nhà sẽ xem xét; chưa phải lời hứa cho tới khi nằm trong hợp đồng đã chấp nhận, và concessions trên MLS không được ghi là để trả agent.',ex:'MLS ghi: "Seller will consider concessions." Anh Minh xin $15,000 closing costs trong offer. Chỉ ràng buộc nếu Bác Hùng chấp nhận điều đó.',ask:'Có nên ghi sẵn concessions không, hay ghi rồi người mua đòi thêm?'}},
'11':{en:{n:'Security, Insurance, Showings, Audio and Video',s:'Protect valuables; cameras need a notice',say:'The broker is not responsible for loss, damage or injury from showings or the lockbox. Inspectors, appraisers and buyers may film inside. Owner protects valuables and carries insurance. Hidden cameras: post a notice.',ex:'Bác Hùng locks the owner’s storage room, confirms his landlord policy covers showings, and puts a “video recording” sign by the doorbell camera.',ask:'Does my insurance cover a buyer who trips on the stairs during a showing?'},
     vi:{n:'Security, Insurance, Showings, Audio and Video (an toàn, bảo hiểm, xem nhà, camera)',s:'Cất đồ quý; có camera thì dán thông báo',say:'Broker không chịu trách nhiệm mất mát, hư hỏng, bị thương do đi coi nhà hay do lockbox. Inspector, appraiser và người mua có thể quay phim bên trong. Chủ nhà tự cất đồ quý và mua bảo hiểm. Có camera giấu kín thì dán bảng báo.',ex:'Bác Hùng khóa phòng chứa đồ của chủ, hỏi bảo hiểm nhà cho thuê có che lúc dẫn coi nhà không, và dán bảng "đang quay video" cạnh camera chuông cửa.',ask:'Người mua trượt cầu thang lúc coi nhà thì bảo hiểm của tôi có trả không?'}},
'12':{en:{n:'Photographs and Internet Advertising',s:'Who owns the photos; AI-edited images',say:'Unless the owner opted out, the broker may photograph and film the property for MLS, websites and marketing. The owner assigns the image rights to the broker, who can reuse them later. Once online, nobody controls copies. Digitally altered images must carry a visible “altered” note plus a link or QR code to the original (Bus. & Prof. Code §10140.8).',ex:'Ken virtually stages the empty unit 3 with AI furniture. Under the photo: “Digitally altered. See original at [link to the original photo].” Lighting and color fixes alone don’t need the label.',ask:'Can I ask you to take the photos down after the sale?'},
     vi:{n:'Photographs and Internet Advertising (hình ảnh)',s:'Hình là của ai; hình chỉnh bằng AI',say:'Trừ khi chủ nhà chọn không cho, broker được chụp hình, quay phim căn nhà để đăng MLS, website và quảng cáo. Chủ nhà nhường quyền hình cho broker, broker được dùng lại sau này. Đã lên mạng thì không ai kiểm soát được bản sao. Hình chỉnh sửa (thêm, bớt, đổi đồ vật) phải ghi rõ "đã chỉnh sửa" kèm link hoặc QR tới hình gốc (Bus. & Prof. Code §10140.8).',ex:'Ken dùng AI đặt nội thất ảo cho căn số 3 đang trống. Dưới hình ghi: "Hình đã chỉnh sửa. Coi hình gốc tại [link hình gốc]." Chỉ chỉnh sáng, màu thì không cần ghi.',ask:'Bán xong tôi xin gỡ hình xuống được không?'}},
'13':{en:{n:'Key Safe/Lockbox',s:'Who can get in; tenants must agree',say:'A lockbox lets agents, inspectors and accompanied buyers in. The broker may let inspectors, appraisers and repair people in without asking again. Nobody insures against theft through the lockbox. Unless opted out in 2J, a lockbox is allowed. Tenant-occupied: the owner must get tenants’ written OK (C.A.R. Form KLA).',ex:'Units 1–3 are rented. Bác Hùng gets each tenant to sign a KLA. Ken sets showings with 24-hour written notice to tenants.',ask:'How much notice must tenants get before a showing?'},
     vi:{n:'Key Safe/Lockbox',s:'Ai được vào; người thuê phải đồng ý',say:'Lockbox cho agent, inspector và người mua có agent đi kèm vào nhà. Broker được cho inspector, appraiser, thợ sửa vào mà không cần hỏi lại. Không ai bảo hiểm mất trộm qua lockbox. Không chọn "không lockbox" ở ô 2J thì được gắn. Nhà có người thuê: chủ nhà phải xin người thuê đồng ý bằng giấy (C.A.R. Form KLA).',ex:'Căn 1–3 đang cho thuê. Bác Hùng xin từng người thuê ký KLA. Ken hẹn coi nhà, báo người thuê bằng giấy trước 24 giờ.',ask:'Phải báo người thuê trước bao lâu mới được dẫn khách vào?'}},
'14':{en:{n:'Sign',s:'For Sale sign, unless opted out',say:'Unless 2J says no, the broker may put up a FOR SALE / SOLD / LEASE sign.',ex:'Bác Hùng worries tenants will panic, so he checks “no sign” in 2J. Marketing stays online and in the MLS.',ask:'Does skipping the sign really cost me buyers on an income property?'},
     vi:{n:'Sign (bảng bán nhà)',s:'Bảng For Sale, trừ khi chọn không',say:'Trừ khi ô 2J ghi không, broker được cắm bảng FOR SALE / SOLD / LEASE.',ex:'Bác Hùng sợ người thuê hoang mang nên đánh dấu "không cắm bảng" ở 2J. Quảng cáo vẫn chạy trên mạng và MLS.',ask:'Nhà cho thuê mà không cắm bảng thì có mất người mua không?'}},
'15':{en:{n:'Equal Housing Opportunity',s:'Fair housing applies',say:'The property is offered under federal, state and local anti-discrimination laws.',ex:'No “ideal for…” wording about who should live there. Offers are compared on price and terms only.',ask:'What wording should I avoid in the ad?'},
     vi:{n:'Equal Housing Opportunity (không phân biệt đối xử)',s:'Luật fair housing áp dụng',say:'Căn nhà được rao bán theo luật chống phân biệt đối xử của liên bang, tiểu bang và địa phương.',ex:'Không viết quảng cáo kiểu "hợp với gia đình…" về người ở. Offer chỉ so giá và điều kiện.',ask:'Quảng cáo nên tránh những chữ gì?'}},
'16':{en:{n:'Attorney Fees',s:'Each side pays its own lawyer',say:'In a fight between owner and broker, each pays its own attorney, except the mediation rule in 19A.',ex:'Bác Hùng and BRG disagree over a protection-period buyer. Each hires and pays its own lawyer.',ask:'So even if I win, I still pay my own lawyer?'},
     vi:{n:'Attorney Fees (tiền luật sư)',s:'Bên nào trả luật sư bên đó',say:'Chủ nhà và broker tranh chấp thì ai trả luật sư người nấy, trừ luật hòa giải ở 19A.',ex:'Bác Hùng và BRG bất đồng về một người mua trong thời gian bảo vệ. Mỗi bên tự thuê, tự trả luật sư.',ask:'Vậy tôi thắng kiện vẫn phải tự trả luật sư?'}},
'17':{en:{n:'Management Approval',s:'The brokerage can cancel within 5 days',say:'If an agent signs for the brokerage, the broker or manager can cancel the listing in writing within 5 days after it is signed.',ex:'Signed 11/09/2026. BRG’s broker of record may cancel in writing through 11/14/2026.',ask:'Has your broker approved this listing yet?'},
     vi:{n:'Management Approval (công ty duyệt)',s:'Công ty được hủy trong 5 ngày',say:'Nếu agent ký thay công ty, broker hay manager được hủy listing bằng giấy trong 5 ngày sau khi ký.',ex:'Ký 09/11/2026. Broker chính của BRG được hủy bằng giấy tới 14/11/2026.',ask:'Broker của anh duyệt listing này chưa?'}},
'18':{en:{n:'Successors and Assigns',s:'It binds heirs and assigns',say:'The listing binds the owner’s successors and assigns.',ex:'If Bác Hùng puts the fourplex into his living trust mid-listing, the trust is still bound.',ask:'If I move it into my trust, do we need to re-sign?'},
     vi:{n:'Successors and Assigns (người thừa kế)',s:'Ràng buộc cả người kế tục',say:'Hợp đồng listing ràng buộc cả người kế tục và người được chuyển nhượng của chủ nhà.',ex:'Nếu giữa chừng Bác Hùng chuyển fourplex vào living trust, trust vẫn bị ràng buộc.',ask:'Tôi chuyển vào trust thì có phải ký lại không?'}},
'19':{en:{n:'Dispute Resolution',s:'Mediation first; arbitration only if you sign ARB',say:'<b>A</b> Owner and broker mediate before arbitration or court; split the mediator’s fee. Skip mediation or refuse it, then lose, and you can’t stop the winner from collecting attorney fees. <b>B</b> Excluded: foreclosure, eviction (unlawful detainer), mechanic’s liens, probate/small claims/bankruptcy matters. Filing to record a pending-action notice or get an injunction doesn’t break the rule. <b>C</b> Arbitration only if both sign a separate C.A.R. Form ARB.',ex:'BRG says a buyer bought within the protection period. Bác Hùng disagrees. They first book mediation and split a $1,200 fee ($600 each, ESTIMATE). No ARB was signed, so if mediation fails it goes to court.',ask:'Do I want arbitration (fast, private, hard to appeal) or court?'},
     vi:{n:'Dispute Resolution (giải quyết tranh chấp)',s:'Hòa giải trước; trọng tài chỉ khi ký ARB',say:'<b>A</b> Chủ nhà và broker phải hòa giải (mediation) trước khi ra trọng tài hay tòa; chia đôi phí hòa giải. Bỏ qua hay từ chối hòa giải rồi thua kiện thì bên thắng được đòi tiền luật sư. <b>B</b> Không áp dụng cho: foreclosure, kiện đuổi người thuê (unlawful detainer), mechanic\'s lien, việc thuộc tòa probate/small claims/phá sản. Nộp đơn để ghi notice of pending action hay xin lệnh cấm tạm thời không bị coi là vi phạm. <b>C</b> Trọng tài (arbitration) chỉ khi hai bên ký thêm tờ C.A.R. Form ARB.',ex:'BRG nói người mua đã mua trong thời gian bảo vệ. Bác Hùng không chịu. Hai bên hẹn hòa giải trước, chia phí $1,200 (mỗi bên $600, ƯỚC TÍNH). Không ký ARB nên hòa giải không xong thì ra tòa.',ask:'Tôi nên chọn trọng tài (nhanh, kín, khó kháng cáo) hay ra tòa?'}},
'20':{en:{n:'Entire Agreement',s:'Only what is written counts',say:'This paper replaces all earlier talks and side promises. If one part is invalid, the rest still stands. It can be signed in counterparts.',ex:'Ken said over coffee he’d “do 2% if it sells fast.” Not written = not in the deal. They add it as an addendum.',ask:'Can we put every verbal promise into the additional terms?'},
     vi:{n:'Entire Agreement (chỉ giấy mới tính)',s:'Chỉ cái gì viết ra mới tính',say:'Tờ này thay mọi lời bàn và hứa miệng trước đó. Một điều bị vô hiệu thì phần còn lại vẫn giữ. Ký trên nhiều bản riêng vẫn được.',ex:'Ken nói lúc uống cà phê là "bán nhanh thì lấy 2%". Không viết ra là không có. Hai bên thêm vào phụ lục.',ask:'Mình ghi hết mấy lời hứa miệng vào phần additional terms được không?'}},
'21':{en:{n:'Ownership, Title and Authority',s:'Owner promises they can sell',say:'The owner promises they own it, nobody else is on title, and they have authority to sign and sell. Exceptions go in 2G.',ex:'Bác Hùng’s late wife was co-owner. 2G notes it; escrow will need the right paperwork to clear her name from title.',ask:'Everyone on title has to sign, right? What if one owner passed away?'},
     vi:{n:'Ownership, Title and Authority (quyền sở hữu)',s:'Chủ nhà cam kết mình có quyền bán',say:'Chủ nhà cam kết mình là chủ, không ai khác đứng tên, và có quyền ký và bán. Ngoại lệ ghi ở ô 2G.',ex:'Vợ Bác Hùng đã mất, trước đứng tên chung. Ô 2G ghi chuyện này; escrow sẽ cần giấy tờ đúng để gỡ tên bà khỏi title.',ask:'Ai có tên trên title đều phải ký phải không? Một người đã mất thì sao?'}},
'22':{en:{n:'Legally Authorized Signer',s:'Signing for a trust, LLC or estate',say:'Someone signing for a trust, company or estate signs in that role, not personally, promises the entity exists and is in good standing, and gives proof of authority within 3 days (certification of trust, letters testamentary, power of attorney, corporate resolution…).',ex:'If the fourplex were owned by “Hung Tran Family Trust”, Bác Hùng signs as trustee and hands Ken a Certification of Trust (Probate Code §18100.5) within 3 days.',ask:'Which exact document proves I can sign for my trust or LLC?'},
     vi:{n:'Legally Authorized Signer (người ký thay)',s:'Ký cho trust, LLC hay di sản',say:'Người ký thay trust, công ty hay di sản thì ký với tư cách đó, không phải cá nhân; cam kết tổ chức đó có thật và còn hoạt động hợp lệ; và đưa giấy chứng minh quyền ký trong 3 ngày (certification of trust, letters testamentary, power of attorney, nghị quyết công ty…).',ex:'Nếu fourplex đứng tên "Hung Tran Family Trust", Bác Hùng ký với tư cách trustee và đưa Ken tờ Certification of Trust (Probate Code §18100.5) trong 3 ngày.',ask:'Giấy nào chính xác chứng minh tôi được ký cho trust hay LLC của mình?'}}
};

 en:{lang:'Tiếng Việt',back:'← All tools',kicker:'C.A.R. Form CLA · Revised 6/26',title:'Listing your fourplex or commercial building: the CLA, line by line',sub:'The contract an owner signs to hire a broker to sell an income property: dates, commission, and the protection period.',
  eli_t:'In plain words',eli:'You hire one company to sell your building, for a set number of months. If it sells, you pay the agreed commission. Even after the listing ends, there is a short “protection” window: if someone the agent already showed the building to comes back and buys, the agent still gets paid. Think of a babysitter you booked for six months: if you switch sitters the day after the contract ends but keep a kid the first sitter already brought home from school, she still gets paid for that pickup.',

  l_type:'Property type',t14:'1–4 units',t5p:'5+ units / commercial',l_owner:'Who owns it',o_ind:'Person or trust',o_ent:'Corp, LLC, partnership',

  ok:'<b>Length is within the rules.</b> On 1–4 units owned by a person or trust, an exclusive listing can’t run past 24 months, can’t auto-renew, and a written renewal can’t run past 12 months (Civil Code §1670.12). An LLC, corporation or partnership owner is exempt from the 24-month cap.',

  fw_t:'Read this form, paragraph by paragraph',fw_s:'Our own plain-language walk-through of CLA 6/26 (22 paragraphs, 7 pages), not the form’s wording. Example: Bác Hùng Tran lists his fourplex at 1234 Example Lane, San Jose, CA 95100 with Ken Lam, BRG Realty Corp. Tap a line to open it.',

  my_t:'What many people get wrong',
  my1:'<b>“6% is the legal rate.”</b> There is no legal rate. The form itself says so twice. If someone tells you a number is “standard,” that is a sales line, not a law. Negotiate the number and the services together.',
  my2:'<b>“My listing ended, so I can sell to that buyer and skip the commission.”</b> Maybe, maybe not. If the agent named that buyer in writing before the end date and you sign inside the protection window, you owe it. Here is the part agents don’t love hearing: if the agent forgot the NPB, the protection clause does nothing. I’ve seen good agents lose a full commission over one missing email.',
  my3:'<b>“Longer listing = safer for the owner.”</b> It is the opposite. A long listing locks you in. On a 1–4 unit building in your own name, anything over 24 months makes the whole agreement void. My opinion after 23 years: six months is plenty for a priced-right fourplex in San Jose; if it hasn’t sold, the problem is usually the price, not the calendar.',

  eli_t:'Nói cho dễ hiểu',eli:'Mình thuê một công ty bán căn nhà của mình, trong một số tháng nhất định. Bán được thì trả commission đã thỏa thuận. Listing hết hạn rồi vẫn còn một khoảng "bảo vệ" ngắn: người mà agent đã dẫn đi coi nhà quay lại mua thì agent vẫn được trả. Giống thuê người giữ con 6 tháng: hết hợp đồng mình đổi người khác, nhưng đứa nhỏ mà người cũ đã đón về hôm trước thì người cũ vẫn được trả tiền chuyến đó.',

  fw_t:'Đọc form này từng đoạn',fw_s:'Phần giải thích bằng lời của mình cho CLA bản 6/26 (22 đoạn, 7 trang), không chép chữ của form. Ví dụ: Bác Hùng Tran ký listing căn fourplex ở 1234 Example Lane, San Jose, CA 95100 với Ken Lam, BRG Realty Corp. Bấm vào từng dòng để mở.',

  sg_t:'Ai ký, khi nào, ký xong đi đâu',sg_tbl:'<table class="sg"><thead><tr><th>Ai</th><th>Khi nào</th><th>Rồi sao</th></tr></thead><tbody><tr><td>Chủ nhà (mọi người có tên trên title, hoặc người ký thay trust/LLC)</td><td>Trước khi đăng bán. Ký tờ AD (quan hệ đại diện) trước.</td><td>Chủ nhà giữ một bản. Broker lưu hồ sơ.</td></tr><tr><td>Agent ký cho công ty (Ken Lam, BRG Realty Corp)</td><td>Cùng ngày</td><td>Broker/manager có 5 ngày để hủy (¶17).</td></tr><tr><td>Chủ nhà ký tắt từng trang; ký MLSA, PRBS, BCA, FHDA, CCPA đi kèm</td><td>Cùng lúc ký listing</td><td>Chỉ dẫn MLSA gửi MLS; mấy tờ kia lưu hồ sơ broker.</td></tr><tr><td>Người ký thay tổ chức</td><td>Trong 3 ngày</td><td>Giấy chứng minh quyền ký gửi broker (¶22).</td></tr><tr><td>Broker → chủ nhà: danh sách tên người mua (NPB)</td><td>Trước khi listing hết hạn</td><td>Mở thời gian bảo vệ cho mấy tên đó (¶4D(2)).</td></tr></tbody></table>',
  my_t:'Nhiều người hiểu sai',
  my1:'<b>"6% là mức luật định."</b> Không có mức luật định. Chính tờ form ghi điều này hai lần. Ai nói con số nào đó là "chuẩn" thì đó là câu bán hàng, không phải luật. Thương lượng con số cùng lúc với việc agent sẽ làm cho mình.',
  my2:'<b>"Listing hết rồi, tôi bán cho người đó khỏi trả commission."</b> Chưa chắc. Nếu agent đã gửi tên người đó bằng giấy trước ngày hết hạn, và mình ký trong thời gian bảo vệ, thì vẫn phải trả. Còn đây là điều agent không thích nghe: agent quên gửi NPB thì điều khoản bảo vệ coi như không có. Tôi đã thấy agent giỏi mất trọn commission chỉ vì thiếu một cái email.',
  my3:'<b>"Listing càng dài càng chắc cho chủ nhà."</b> Ngược lại. Listing dài là trói mình lâu. Nhà 1–4 căn đứng tên mình mà ký quá 24 tháng thì cả hợp đồng vô hiệu. Ý kiến của tôi sau 23 năm: fourplex ở San Jose đặt giá đúng thì 6 tháng là dư; chưa bán được thường là do giá, không phải do lịch.',
  nx_t:'Bước tiếp theo',nx1:'Trước khi ký, coi bán xong cầm về bao nhiêu sau commission và chi phí: <a href="/t21/">T21 tiền bán cầm về</a>.',nx2:'Coi người mua sẽ định giá căn nhà ra sao: <a href="/t146/">T146 cap rate &amp; cash flow</a> · <a href="/t268/">T268 so sánh nhà cho thuê</a>.',nx3:'Tính mua căn khác? <a href="/t220/">T220 có đổi 1031 được không</a> · <a href="/t27/">T27 máy tính 1031</a>.',nx4:'Có offer bằng form thương mại: <a href="/t437/">T437 giải nghĩa CPA</a>. Mọi forms: <a href="/t402/">T402 mọi forms địa ốc</a>.',
  vd_t:'Xem video 45 giây',b_email:'Gửi kết quả qua email',b_sms:'Hỏi Ken',b_video:'Xem video 45 giây',
  f_title:'Gửi kết quả này về email',f_sub:'Ken sẽ trả lời và cùng mình dò lại các điều khoản listing. Không spam.',f_name:'Tên',f_phone:'Phone (không bắt buộc)',f_send:'Gửi',f_ok:'Đã mở email. Bấm Send là xong. Không mở được thì copy số dưới đây nhắn Ken.',f_or:'Hoặc text:',f_copy:'Copy',
  ft_est:'Thông tin chung, không phải tư vấn luật hay thuế. Ngày tính theo số mình nhập; ngày ghi trên form đã ký mới là cái quyết định. Thời gian bảo vệ không có mặc định trên form.',
  ft_src:'Nguồn (tra 06/11/2026):',ft_links:'C.A.R. Form CLA bản 6/26 (kèm MLSA 12/25, BCA 6/25, PRBS-S 6/26) · <a href="https://codes.findlaw.com/ca/civil-code/civ-sect-1670-12/" target="_blank" rel="noopener">Civil Code §1670.12</a> · <a href="https://california.public.law/codes/ca_bus_and_prof_code_section_10140.8" target="_blank" rel="noopener">B&amp;P Code §10140.8</a> · <a href="https://losangeles.ticortitle.com/getattachment/Resources/Flyers-EBooks/New_Laws_2024.pdf?lang=en-US" target="_blank" rel="noopener">Ticor: luật mới 2024 (AB 1345)</a>',
  ft_upd:'Cập nhật',ft_t500:'Mọi forms địa ốc',ft_all:'Tất cả tool',

function segVal(id){const b=document.querySelector('#'+id+' button[aria-pressed="true"]');return b?b.dataset.v:'';}
function numIn(id,def,min,max){const v=parseFloat($(id).value);return isFinite(v)?Math.min(max,Math.max(min,v)):def;}
function calc(){
  const d=I18N[lang];
  const inp={price:numIn('price',0,0,1e10),pct:numIn('pct',0,0,100),start:parseD($('start').value)||parseD('2026-11-09'),months:Math.round(numIn('months',6,1,120)),prot:Math.round(numIn('prot',0,0,3650)),type:segVal('segType'),owner:segVal('segOwner')};
  const r=cla(inp);
  const pctS=(+inp.pct.toFixed(3)).toString();
  $('big').textContent=fmt(r.comm);
  $('bigS').textContent=fill(d.r_sub,{pct:pctS,price:fmt(inp.price)});
  $('vEnd').textContent=fdate(r.end);
  $('vProt').textContent=inp.prot>0?fdate(r.protEnd):'—';
  $('vProtS').textContent=fill(d.v_prot_s,{n:inp.prot});
  $('vNpb').textContent=fdate(r.npb);
  $('vRep').textContent=fdate(r.rep);
  $('vMgmt').textContent=fdate(r.mgmt);
  $('v10k').textContent=fmt(r.per10k);
  const v=$('verdict');
  if(r.voidRisk){v.className='note bad';v.innerHTML=d.bad;} else {v.className='note';v.innerHTML=inp.type==='14'?d.ok:d.ok5;}
  last={price:fmt(inp.price),pct:pctS,comm:fmt(r.comm),start:fdate(inp.start),end:fdate(r.end),months:inp.months,pd:inp.prot,prot:inp.prot>0?fdate(r.protEnd):'—',chk:(r.voidRisk?d.bad:(inp.type==='14'?d.ok:d.ok5)).replace(/<[^>]+>/g,'')};
  $('smsBtn').href='sms:4086662825?&body='+encodeURIComponent(fill(d.sms,last));
  klSend();
}

/* ===== shared page logic (lang, form walkthrough, email/sms, embed) ===== */
let lang='vi'; try{ if(localStorage.getItem('kl_lang')==='en') lang='en'; }catch(e){}
const $=id=>document.getElementById(id);
const fmt=n=>(n<0?'−':'')+'$'+Math.round(Math.abs(n)).toLocaleString('en-US');
const fill=(s,o)=>s.replace(/\{(\w+)\}/g,(m,k)=>o[k]??m);
const pad=n=>String(n).padStart(2,'0');
const WD={vi:['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'],en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat']};
const fdate=d=>WD[lang][d.getUTCDay()]+', '+(lang==='vi'?pad(d.getUTCDate())+'/'+pad(d.getUTCMonth()+1):pad(d.getUTCMonth()+1)+'/'+pad(d.getUTCDate()))+'/'+d.getUTCFullYear();
let last={};
function buildParas(){
  const d=I18N[lang], open=new Set([...document.querySelectorAll('details.li[open]')].map(x=>x.id));
  let h='';
  for(const g of PG){
    h+='<article class="pg"><div class="ph"><h2>'+g[lang]+'</h2><span>'+g.pp+'</span></div>';
    for(const no of g.items){ const p=PARAS[no], e=p[lang], id='p-'+no;
      h+='<details class="li" id="'+id+'"'+(open.has(id)?' open':'')+'><summary><span class="n"><i>'+no+'</i> <b>'+e.n+'</b><small>'+e.s+'</small></span><span class="a"></span></summary>'+
        '<div class="ex"><p><span class="t">'+d.L_say+'</span>'+e.say+'</p><p><span class="t">'+d.L_ex+'</span>'+e.ex+'</p>'+
        '<p class="ask"><span class="t">'+d.L_ask+'</span>“'+e.ask+'”</p><span class="lk"><a href="#'+id+'">#'+id+'</a></span></div></details>';
    }
    h+='</article>';
  }
  $('paras').innerHTML=h;
}
function applyLang(){
  const d=I18N[lang];
  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.getAttribute('data-i'); if(typeof d[k]==='string') el.innerHTML=d[k];});
  $('langBtn').textContent=d.lang; $('klBack').textContent=d.back; document.documentElement.lang=lang;
  buildParas(); calc();
}
const EMBED=/[?&]embed=1/.test(location.search);
let klSend=()=>{};
if(EMBED){ document.documentElement.classList.add('embed'); let lastH=0;
  klSend=()=>{ const w=document.querySelector('.wrap'); const h=Math.ceil(w.getBoundingClientRect().bottom+window.scrollY+40); if(Math.abs(h-lastH)<4) return; lastH=h; try{ parent.postMessage({klToolsHeight:h},'*'); }catch(e){} };
  window.addEventListener('resize',()=>klSend()); new ResizeObserver(()=>klSend()).observe(document.body);
  document.addEventListener('click',e=>{ const a=e.target.closest&&e.target.closest('a[href]'); if(!a) return; const h=a.getAttribute('href'); if(h.startsWith('#')||a.target==='_blank') return; if(h.startsWith('/')) a.href='https://tools.kenlamrealty.com'+h; a.target='_top'; },true); }
document.querySelectorAll('.inputs input').forEach(el=>{el.addEventListener('input',calc);el.addEventListener('change',calc);});
document.querySelectorAll('.seg').forEach(s=>s.addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; s.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false')); calc();}));
$('langBtn').onclick=()=>{lang=lang==='vi'?'en':'vi'; try{localStorage.setItem('kl_lang',lang)}catch(e){} applyLang();};
$('emailBtn').onclick=()=>{$('form').classList.toggle('open'); if($('form').classList.contains('open')) $('fname').focus(); klSend();};
$('sendBtn').onclick=()=>{
  const d=I18N[lang], o=Object.assign({},last,{n:$('fname').value.trim()||'—',e:$('femail').value.trim()||'—',ph:$('fphone').value.trim()||'—'});
  const href='mailto:ken@kenlamrealty.com?subject='+encodeURIComponent(fill(d.subj,o))+'&body='+encodeURIComponent(fill(d.body,o));
  const a=document.createElement('a'); a.href=href; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove();
  $('sent').hidden=false; klSend();
};
$('copyBtn').onclick=async()=>{ try{ await navigator.clipboard.writeText('4086662825'); $('copyBtn').textContent='✓'; }catch(e){ const r=document.createRange(); r.selectNodeContents($('copyBtn').previousElementSibling); const s=getSelection(); s.removeAllRanges(); s.addRange(r);} };
$('paras').addEventListener('toggle',()=>klSend(),true);
function openHash(){ const h=decodeURIComponent(location.hash.slice(1)); if(!h) return; const el=document.getElementById(h); if(!el) return; if(el.tagName==='DETAILS') el.open=true; setTimeout(()=>el.scrollIntoView({block:'start'}),30); }
window.addEventListener('hashchange',openHash);
applyLang(); openHash();
</script>
