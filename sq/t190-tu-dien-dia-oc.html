<!-- KEN LAM: Từ Điển Địa Ốc (T190) — dán vào 1 Code block trên trang /tu-dien-dia-oc. Display Source: OFF -->
<div id="kl-t190" style="max-width:760px;margin:0 auto">
  <iframe id="kl-t190-frame" title="Từ Điển Địa Ốc — Ken Lam Realty" loading="eager"
    style="width:100%;height:1600px;border:0;display:block;background:transparent" allow="clipboard-write"></iframe>
</div>
<script>
(function(){
  var f=document.getElementById('kl-t190-frame');
  var base='https://tools.kenlamrealty.com/t190/?embed=1';
  if(location.hash){ try{ history.scrollRestoration='manual'; }catch(e){} }
  f.src=base+(location.hash||'');
  window.addEventListener('message',function(e){
    if(e.origin!=='https://tools.kenlamrealty.com'||!e.data) return;
    if(e.data.klToolsHeight) f.style.height=Math.max(600,Math.min(250000,e.data.klToolsHeight))+'px';
    if(typeof e.data.klToolsScroll==='number'){
      if(e.data.klToolsScroll<0) return;
      var y=f.getBoundingClientRect().top+window.scrollY+e.data.klToolsScroll-90;
      window.scrollTo(0,Math.max(0,y));
    }
  });
})();
</script>
