"S": "Tôi là: {role}\nTình huống: {sit}\nĐã ký hợp đồng với agent: {sg}\n\nAGENT NÀY LÀ: {p}\nHết lòng vì tôi (fiduciary): {f}\nLúc nhận form AD: {w}\n\n{note}\n\nCÂU NÊN HỎI:\n{q}",
"qa_who": "Mỗi agent có làm việc thật với bạn (không chỉ chào hỏi qua loa). Agent bên bán đưa cho người bán, agent bên mua đưa cho người mua.",
"qa_sign": "Người mua / người bán (cả chủ nhà và người thuê nếu thuê trên 1 năm) ký là <b>đã nhận</b>. Agent và công ty cũng ký.",
"qa_when": "Người bán: trước khi ký listing. Người mua: càng sớm càng tốt, trước khi ký buyer-broker agreement (hợp đồng đại diện người mua) và trước khi ký offer.",
"qa_req": "Có. Civil Code bắt agent phải đưa. Nếu bạn không chịu ký, agent ghi lại sự việc, ký và đề ngày.",
"qa_pages": "2 trang (trang 2 in phần luật Civil Code §§2079.13–2079.24)",
"qa_rev": "Bản sửa 12/24 (Revised 12/24)",
"e0t": "Ô đầu trang: thuê trên 1 năm",
"e0b": "Nếu ô này được đánh dấu, form đang dùng cho một hợp đồng thuê dài hơn 1 năm. Luật coi loại thuê đó giống giao dịch nhà. Mua bán bình thường thì để trống.",
"e1t": "Mở đầu: hỏi ngay từ đầu",
"e1b": "Form khuyên: vừa bắt đầu nói chuyện với agent là nên hiểu mình muốn quan hệ kiểu nào với họ. Đừng đợi tới lúc viết offer mới hỏi.",
"e2t": "Seller's Agent (agent bên bán)",
"e2b": "Agent ký listing với người bán thì chỉ làm cho người bán. Với người bán: fiduciary duty (bổn phận hết lòng — cẩn thận, liêm chính, trung thực, trung thành). Với cả hai bên: làm việc cẩn thận có tay nghề; trung thực, công bằng, thiện chí; và nói ra những sự thật quan trọng ảnh hưởng tới giá trị hay sự đáng mua của căn nhà mà bên kia không biết và không tự thấy được. Bí mật của bên này thì không bắt buộc kể cho bên kia, trừ khi nó dính tới mấy bổn phận vừa kể.",
"e3t": "Buyer's Agent (agent bên mua)",
"e3b": "Agent có thể làm riêng cho người mua nếu người mua đồng ý, kể cả khi có buyer-broker representation agreement (hợp đồng đại diện người mua). Điểm hay bị hiểu lầm: dù hoa hồng do người bán trả một phần hay toàn bộ, agent này vẫn không phải agent bên bán. Bổn phận giống y như trên, chỉ đổi chiều: hết lòng với người mua, trung thực với cả hai.",
"e4t": "Agent đại diện cả hai bên (dual agent)",
"e4b": "Một agent — làm trực tiếp, hoặc qua nhiều agent cùng công ty — được phép đại diện cả hai bên. Điều kiện: cả người bán lẫn người mua biết và đồng ý. Lúc đó agent phải hết lòng với cả hai. Không có phép rõ ràng thì không được kể thông tin mật: tài chính, lý do mua bán, thế mặc cả, chuyện riêng ảnh hưởng giá, người bán chịu bán thấp hơn giá list, người mua chịu trả cao hơn giá offer.",
"e5t": "Trách nhiệm của người mua và người bán",
"e5b": "Hợp đồng mua bán, hoặc một giấy riêng, sẽ xác nhận ai là agent của ai và có phải dual không. Đọc kỹ chỗ đó. Bổn phận của agent không thay việc bạn tự lo cho mình: đọc kỹ mọi giấy ký. Agent tư vấn nhà đất; chuyện luật hay thuế thì hỏi người có chuyên môn. Người mua còn phải tự cẩn thận với những gì mình biết hoặc tự thấy được về căn nhà. Form cũng khuyên cả hai bên hỏi chuyên gia thuế, vì thuế liên bang và tiểu bang phức tạp và hay đổi.",
"e6t": "Có thể nhận nhiều bản AD",
"e6b": "Mỗi agent làm việc với bạn hơn mức xã giao đều phải đưa bạn form này. Nhiều agent thì nhiều bản. Mỗi lần nhận, đọc lại và nghĩ coi agent đó đứng ở đâu với bạn. Thêm một dòng đáng nhớ: hoa hồng không do luật định, thương lượng được.",
"e7t": "Chỗ ký",
"e7b": "Bạn ký là xác nhận đã nhận một bản form này và phần luật in ở trang 2. Ký không có nghĩa là đã thuê agent. Phía dưới là tên công ty (broker), agent ký thay công ty, số DRE và ngày.",
"e8t": "Trang 2: định nghĩa và lúc phải đưa form (§2079.13–2079.15)",
"e8b": "Trang 2 in phần luật. §2079.13 định nghĩa các chữ như agent, buyer, seller, dual agent, listing price, offering price. Có một ý quan trọng: bổn phận của agent làm dưới một broker cũng như bổn phận của chính broker. §2079.14 nói lúc phải đưa form (như khung nhanh ở trên). §2079.15: khách không chịu ký nhận thì agent tự viết, ký, ghi ngày một bản tường trình việc từ chối.",
"e9t": "Trang 2: xác nhận agency (§2079.17)",
"e9b": "Agent bên mua phải sớm cho cả hai bên biết mình là agent bên mua hay dual. Agent bên bán phải cho người bán biết. Sau đó xác nhận trong hợp đồng hoặc giấy riêng, ký trước hoặc cùng lúc với hợp đồng. Mẫu xác nhận có 4 dòng: công ty bên bán, agent bên bán, công ty bên mua, agent bên mua — mỗi dòng đánh dấu \"chỉ một bên\" hay \"cả hai bên (dual)\".",
"e10t": "Trang 2: tiền hoa hồng, thông tin mật, đổi quan hệ (§2079.19–2079.24)",
"e10b": "Ai trả hoa hồng không quyết định agent làm cho ai (§2079.19). Dual agent không được kể thông tin mật của bên này cho bên kia nếu không có phép (§2079.21). Bạn chọn không có agent thì agent bên kia không tự động thành dual (§2079.22). Quan hệ agency đổi được nếu các bên đồng ý bằng giấy, trước khi việc làm xong (§2079.23). Và không điều nào ở đây làm nhẹ bổn phận nói thật của agent (§2079.24).",
"ex_story": "Anh Tâm & chị Hoa Nguyễn muốn mua căn 1234 Example Lane, San Jose, CA 95100 của bà Mai Trần. Lần đầu gặp, trước khi ký buyer-broker agreement, Ken đưa form AD và giải thích từng phần. Hai anh chị ký nhận. Bên kia, agent của bà Mai (ở công ty khác) đã đưa AD cho bà trước khi ký listing. Khi viết offer, phần xác nhận agency ghi rõ ai làm cho ai.",
"ex_mh": "Form AD (mô phỏng) + phần xác nhận agency",
"ex_end": "Giả sử bà Mai đổi ý, nhờ luôn Ken bán. Lúc đó Ken thành dual agent. Phải có cả anh Tâm, chị Hoa và bà Mai biết và đồng ý. Và Ken không được nói với bà Mai là anh chị chịu trả tới bao nhiêu, cũng không được nói với anh chị là bà Mai chịu bớt bao nhiêu.",

"my0": "<b>\"Ký form AD là thuê agent.\"</b> Không phải. Bạn chỉ ký là đã nhận bản giải thích. Thuê agent là hợp đồng khác (listing hoặc buyer-broker agreement).",
"my1": "<b>\"Ai trả hoa hồng thì agent làm cho người đó.\"</b> Sai. Form nói rõ: agent bên mua có thể được người bán trả hoa hồng mà vẫn là agent của người mua. Hoa hồng cũng không do luật định — thương lượng được.",
"my2": "<b>\"Agent bên bán được nói gì cũng được miễn có lợi cho chủ nhà.\"</b> Sai. Agent nào cũng phải trung thực, công bằng với cả hai bên và nói ra sự thật quan trọng về căn nhà mà họ biết.",
"ken": "Chỗ người mua hở nhiều nhất không phải giá. Là cái miệng. Đi open house, gặp agent bên bán, vui miệng kể \"tụi em duyệt được tới 1 triệu 3, cần dọn trước Tết\". Người đó làm cho người bán. Họ không có bổn phận giữ bí mật cho bạn. Còn dual agent? Tôi không nói là xấu. Nhưng một người không thể vừa ép giá xuống vừa đẩy giá lên. Muốn có người đứng hẳn về phía mình thì có agent riêng.",
"ns0": "Có agent rồi? Đọc tiếp <a href=\"/t434/\">T434 — Fair Housing (FHDA)</a> để biết những câu agent và chủ nhà không được hỏi.",
"ns1": "Sắp đặt cọc? Coi <a href=\"/t436/\">T436 — Lừa đảo chuyển tiền wire (WFA)</a> trước khi chuyển tiền.",
"ns2": "Mua đất trống? <a href=\"/t432/\">T432 — VLPA</a>. Muốn rút offer? <a href=\"/t440/\">T440 — WOO</a>.",
"ns3": "Coi hết các form khác: <a href=\"/t430/\">T430 — Mọi form giải nghĩa</a>."

"dual": "Legal, but only if both you and the other side know and agree. The agent owes loyalty to both, so there are things they may not tell either side.",

"qa_who": "Every agent who works with you more than casually. The seller's agent gives it to the seller, the buyer's agent to the buyer.",
"qa_sign": "Buyer / seller (also landlord and tenant for a lease over one year) sign that they <b>received</b> it. The agent and the firm sign too.",
"qa_when": "Seller: before signing the listing. Buyer: as soon as practical, before the buyer-broker agreement and before the offer.",
"qa_req": "Yes. The Civil Code requires the agent to give it. If you refuse to sign, the agent writes down that fact, signs and dates it.",

"e0t": "The top box: lease over one year",
"e0b": "If this box is checked, the form is being used for a lease longer than one year. The law treats that kind of lease like a real estate deal. For a normal sale, it stays blank.",
"e1t": "Opening: ask from day one",
"e1b": "The form says: as soon as you start talking with an agent, understand what kind of relationship you want with them. Don't wait until the offer to ask.",
"e2t": "Seller's Agent",
"e2b": "An agent with a listing works only for the seller. To the seller: a fiduciary duty (utmost care, integrity, honesty, loyalty). To both sides: reasonable skill and care; honest and fair dealing in good faith; and telling known facts that materially affect the value or desirability of the home that the other side doesn't know and can't easily see. Confidential info from one side need not be shared with the other unless it falls under those duties.",
"e3t": "Buyer's Agent",
"e3b": "An agent can, with the buyer's consent, work only for the buyer, including under a buyer-broker representation agreement. Key point: even if the seller pays part or all of the commission, this agent is still not the seller's agent. Same duties as above, flipped: loyal to the buyer, honest with both.",
"e4t": "Agent for both seller and buyer (dual agent)",
"e4b": "One agent — directly, or through several agents at one firm — can legally represent both sides, but only if both the seller and the buyer know and agree. The agent then owes loyalty to both. Without express permission, they may not share confidential info: finances, motives, bargaining position, personal facts that affect price, that the seller would take less than list, or that the buyer would pay more than the offer.",
"e5t": "Buyer and seller responsibilities",
"e5b": "The purchase contract, or a separate paper, confirms who represents whom and whether anyone is a dual agent. Check it. The agent's duties don't replace protecting yourself: read everything you sign. Agents advise on real estate; for legal or tax advice, see a professional. Buyers must also take reasonable care about what they know or can see. The form also urges both sides to get tax advice, since federal and state tax rules are complex and change.",
"e6t": "You may get more than one AD",
"e6b": "Every agent who works with you more than casually must hand you this form, so you may get several. Read it each time, thinking about where that agent stands with you. One line worth remembering: commissions are not set by law and are fully negotiable.",
"e7t": "Signatures",
"e7b": "Your signature only says you received a copy of this form and the law on page 2. It does not hire the agent. Below are the firm (broker), the agent signing for it, DRE numbers and date.",
"e8t": "Page 2: definitions and timing (§2079.13–2079.15)",
"e8b": "Page 2 prints the law. §2079.13 defines words like agent, buyer, seller, dual agent, listing price and offering price. One key idea: an agent working under a broker owes the same duty as the broker. §2079.14 sets when the form must be given (see Quick facts). §2079.15: if a client refuses to sign, the agent writes, signs and dates a statement of that refusal.",
"e9t": "Page 2: agency confirmation (§2079.17)",
"e9b": "The buyer's agent must tell both sides early whether they act as buyer's agent or dual agent; the seller's agent must tell the seller. This is then confirmed in the contract or a separate paper, signed before or with the contract. The confirmation has four lines: seller's firm, seller's agent, buyer's firm, buyer's agent — each marked \"one side\" or \"both (dual)\".",
"e10t": "Page 2: pay, confidential info, changes (§2079.19–2079.24)",
"e10b": "Who pays the commission doesn't decide whom the agent represents (§2079.19). A dual agent may not pass one side's confidential info to the other without permission (§2079.21). Choosing to have no agent doesn't by itself make the other agent dual (§2079.22). The agency can be changed with written consent before the job is done (§2079.23). And nothing here lessens the agent's duty to disclose (§2079.24).",
"ex_story": "Anh Tâm & chị Hoa Nguyễn want to buy 1234 Example Lane, San Jose, CA 95100 from Bà Mai Trần. At the first meeting, before the buyer-broker agreement, Ken hands them the AD form and walks through it. They sign the receipt. On the other side, Bà Mai's agent (at another firm) gave her an AD before the listing. When the offer is written, the agency confirmation spells out who works for whom.",
"ex_mh": "AD form (mock) + agency confirmation",
"ex_end": "Say Bà Mai changes her mind and asks Ken to sell too. Ken would become a dual agent. Anh Tâm, chị Hoa and Bà Mai would all have to know and agree. And Ken could not tell Bà Mai how high the buyers would go, nor tell the buyers how low Bà Mai would take.",
"m0l": "\"Lease over 1 year\" box",

"m1v": "Tâm Nguyễn · 11/09/2026",
"m2l": "Buyer",
"m2v": "Hoa Nguyễn · 11/09/2026",
"m3l": "Real Estate Broker (Firm)",

"m4v": "Ken Lam · DRE 01401822 · 11/09/2026",

"my0": "<b>\"Signing the AD hires the agent.\"</b> No. You only sign that you received the explanation. Hiring is a different contract (listing or buyer-broker agreement).",
"my1": "<b>\"Whoever pays the commission is the agent's client.\"</b> Wrong. The form says a buyer's agent can be paid by the seller and still work for the buyer. And commissions are not set by law — they are negotiable.",
"my2": "<b>\"The listing agent can say anything that helps the seller.\"</b> Wrong. Every agent must be honest and fair with both sides and tell known material facts about the property.",
"ken": "The buyer's biggest leak isn't price. It's talking. At an open house, buyers chat with the listing agent: \"we're approved up to 1.3 million, need to move before Lunar New Year.\" That agent works for the seller. They have no duty to keep your secrets. Dual agency? I won't call it bad. But one person can't push the price down and up at the same time. If you want someone fully on your side, get your own agent.",

let lang='vi'; try{ if(localStorage.getItem('kl_lang')==='en') lang='en'; }catch(e){}
const $=id=>document.getElementById(id);
const fmt=n=>'$'+Math.round(n).toLocaleString('en-US');
const fill=(s,v)=>String(s).replace(/\{(\w+)\}/g,(m,k)=>v[k]??m);
const strip=s=>String(s).replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&nbsp;/g,' ');
let last={sum:'',r:''};
function applyLang(){
  const d=I18N[lang];
  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.getAttribute('data-i'); if(typeof d[k]==='string') el.innerHTML=d[k];});
  $('langBtn').textContent=d.lang; document.documentElement.lang=lang; document.title=d.doc_title;
  calc();
}
function done(){ const d=I18N[lang];
  $('smsBtn').href='sms:4086662825?&body='+encodeURIComponent(fill(d.sms,last)); }
$('langBtn').onclick=()=>{lang=lang==='vi'?'en':'vi'; try{localStorage.setItem('kl_lang',lang)}catch(e){} applyLang();};
$('emailBtn').onclick=()=>{$('form').classList.toggle('open'); if($('form').classList.contains('open')) $('fname').focus();};
$('sendBtn').onclick=()=>{
  const d=I18N[lang], n=$('fname').value.trim()||'—', e=$('femail').value.trim()||'—', ph=$('fphone').value.trim()||'—';
  const v=Object.assign({},last,{n,e,ph});
  /* LEAD: email tới ken@kenlamrealty.com (FUB email parsing). */
  const body=fill(d.mail_head,v)+'\n\n'+last.sum+'\n\n'+d.mail_foot;
  const href='mailto:ken@kenlamrealty.com?subject='+encodeURIComponent(fill(d.subj,v))+'&body='+encodeURIComponent(body);
  window.__lastMailto=href;
  const a=document.createElement('a'); a.href=href; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove();
  $('sent').hidden=false;
};
$('copyBtn').onclick=async()=>{ try{ await navigator.clipboard.writeText('4086662825'); $('copyBtn').textContent='✓'; }catch(e){ const r=document.createRange(); r.selectNodeContents($('copyBtn').previousElementSibling); const s=getSelection(); s.removeAllRanges(); s.addRange(r);} };


let role='buyer', sit='mine', signed=false;
function model(i){
  const who = i.sit==='mine' ? (i.role==='buyer'?'mine_b':'mine_s') : i.sit==='other' ? (i.role==='buyer'?'other_b':'other_s') : i.sit;
  const fid = i.sit==='mine'?'yes':(i.sit==='other'?'no':'both');
  const when = i.sit==='other'?'other':i.role;
  const wa = i.sit==='other'?'other':(i.signed?'late':'before');
  return {who,fid,when,wa,dual:i.sit==='dual'||i.sit==='dualb'};
}
function calc(){
  const d=I18N[lang], m=model({role,sit,signed});
  $('oWho').textContent=d.W[m.who];
  $('oFid').textContent=d.F[m.fid]; $('oFidS').textContent=d.FS[m.fid];
  $('oWhen').textContent=d.WH[m.when]; $('oWhenA').textContent=d.WA[m.wa];
  const note=d.N[sit]+(sit==='other'?'':(signed?d.N.late:d.N.early));
  $('oNote').textContent=note;
  $('dualBox').classList.toggle('hide',!m.dual);
  $('dualList').innerHTML=d.DL.map(x=>'<li>'+x+'</li>').join('');
  $('askList').innerHTML=d.Q[sit].map(x=>'<li>'+x+'</li>').join('');
  const sitTxt=strip(document.querySelector('#sitSeg [aria-pressed="true"]').innerHTML);
  last={p:d.W[m.who],role:d.role[role],r:d.W[m.who]};
  last.sum=fill(d.S,{role:d.role[role],sit:sitTxt,sg:signed?d.yes:d.no,p:d.W[m.who],f:d.F[m.fid]+' — '+d.FS[m.fid],w:d.WH[m.when],
    note:note+(m.dual?'\n\n'+d.d_h+'\n- '+d.DL.join('\n- '):''),q:d.Q[sit].map((x,n)=>(n+1)+'. '+x).join('\n')});
  done();
}
function seg(id,cb){ $(id).addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return;
  $(id).querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false')); cb(b.dataset.v); calc();}); }
seg('roleSeg',v=>role=v); seg('sitSeg',v=>sit=v); seg('signedSeg',v=>signed=v==='1');
window.__model=model;

applyLang();
</script>
