<script id="kl-commas">
/* Ken Lam Realty: ô nhập tiền / sqft tự thêm dấu phẩy (1,200,000). Code cũ vẫn đọc .value ra số thuần. */
(function(){
  var d=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
  function fmt(v){
    var s=String(v==null?'':v).replace(/[^0-9.\-]/g,''),neg=s.charAt(0)==='-';
    s=s.replace(/-/g,'');
    var i=s.indexOf('.'),ip=i<0?s:s.slice(0,i),dp=i<0?'':s.slice(i).replace(/\./g,'');
    if(i>=0)dp='.'+dp;
    ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return (neg?'-':'')+ip+dp;
  }
  function want(el){
    if(el.type!=='number'||el.__klc)return false;
    var c=el.closest&&el.closest('.ctl');if(!c)return false;
    var pre=c.querySelector('.pre'),post=c.querySelector('.post');
    if(pre&&pre.textContent.indexOf('$')>-1)return true;
    if(post&&/^\s*(sqft|sq ?ft)\s*$/i.test(post.textContent))return true;
    return false;
  }
  function conv(el){
    if(!want(el))return;
    el.__klc=1;
    var cur=d.get.call(el),ph=el.getAttribute('placeholder');
    el.type='text';
    if(!el.getAttribute('inputmode'))el.setAttribute('inputmode','numeric');
    Object.defineProperty(el,'value',{configurable:true,
      get:function(){return d.get.call(this).replace(/,/g,'')},
      set:function(v){d.set.call(this,fmt(v))}});
    d.set.call(el,fmt(cur));
    if(ph&&/^[0-9.]{5,}$/.test(ph))el.setAttribute('placeholder',fmt(ph));
    el.addEventListener('input',function(){
      var raw=d.get.call(el),pos=el.selectionStart,n=0,k;
      for(k=0;k<pos;k++)if(/[0-9.]/.test(raw.charAt(k)))n++;
      var out=fmt(raw);
      if(out===raw)return;
      d.set.call(el,out);
      for(k=0,pos=0;k<out.length&&n>0;k++){pos=k+1;if(/[0-9.]/.test(out.charAt(k)))n--;}
      try{el.setSelectionRange(pos,pos)}catch(e){}
    });
  }
  function scan(r){
    if(r.nodeType!==1)return;
    if(r.tagName==='INPUT')conv(r);
    var l=r.querySelectorAll?r.querySelectorAll('input[type=number]'):[];
    for(var i=0;i<l.length;i++)conv(l[i]);
  }
  new MutationObserver(function(m){
    for(var i=0;i<m.length;i++)for(var j=0;j<m[i].addedNodes.length;j++)scan(m[i].addedNodes[j]);
  }).observe(document.documentElement,{childList:true,subtree:true});
  document.addEventListener('DOMContentLoaded',function(){scan(document.body)});
})();
</script>

<script>
/* ===== DỮ LIỆU — sửa ở đây.
   CAL: lịch chính thức tra ngày 04/11/2026 từ BLS, BEA, Census, Federal Reserve, NAR, FHFA, NAHB, UMich (link trong source_url).
     verified:false = đoán theo quy tắc (Case-Shiller thứ Ba cuối tháng, ISM ngày làm việc 1 & 3, minutes Fed 3 tuần sau họp, hạn mức conforming cuối 11).
     NAR (existing/pending) và JOLTS chưa có lịch 2027 → thêm khi có. Giờ ghi ET; trang tự đổi ra giờ Cali.
   LATEST: số mới nhất tra 05/11/2026 (BLS, BEA, Fed, Freddie Mac, NAR, Census, S&P, FHFA, NAHB, UMich, ISM, C.A.R.). Cập nhật mỗi khi có số mới.
   Sau ngày 06/11 (jobs) và 10/11 (CPI) phải sửa LATEST. ===== */
const UPDATED='2026-11-05';

 ['Fed','Ngân hàng trung ương Mỹ. Ngân hàng của các ngân hàng. Lo cho giá cả đừng lên nhanh và người ta có việc làm.','The Fed','America\'s central bank, the bank for banks. Its two jobs: keep prices steady and keep people employed.','fed'],

 ['Fed funds rate (lãi Fed)','Lãi ngân hàng cho nhau mượn qua đêm. Fed đặt một khoảng, ví dụ 3.75–4.00%.','Fed funds rate','The rate banks charge each other overnight. The Fed sets a range, like 3.75–4.00%.','fed'],

 ['QE / QT','QE: Fed mua trái phiếu, bơm tiền, lãi dễ xuống. QT: Fed bớt giữ trái phiếu, rút tiền ra, lãi dễ lên.','QE / QT','QE: the Fed buys bonds, adds money, rates tend to fall. QT: the Fed shrinks its bonds, rates tend to rise.','fed'],

 ['Core (lõi)','Lạm phát bỏ ra đồ ăn và xăng, vì 2 thứ này lên xuống thất thường. Fed coi core.','Core','Inflation without food and gas, which jump around. The Fed watches core.','gia'],

function calc(){

  $('sens').innerHTML=[-1,-0.5,-0.25,0,0.25,0.5,1].filter(d=>r+d>0).map(d=>{const p=pmt(P,r+d,30),df=p-base;

  const body=L.body.replace('{n}',n).replace('{e}',em).replace('{ph}',ph).replace('{l}',lastCalc.l).replace('{r}',lastCalc.r).replace('{q}',lastCalc.q).replace('{list}',up||'-');
  location.href='mailto:ken@kenlamrealty.com?subject='+encodeURIComponent(L.subj.replace('{n}',n))+'&body='+encodeURIComponent(body);
  $('sent').hidden=false;
};
$('copyBtn').onclick=()=>{try{navigator.clipboard.writeText('4086662825')}catch(e){}};
$('rate').value=DEFAULT_RATE;
EVENTS=buildEvents();
render();
</script>
