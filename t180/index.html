<script id="kl-commas">
/* Ken Lam Realty: ô nhập tiền / sqft tự thêm dấu phẩy (1,200,000). Code cũ vẫn đọc .value ra số thuần. */
(function(){
  var d=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
  function fmt(v){
    var s=String(v==null?'':v).replace(/[^0-9.\-]/g,''),neg=s.charAt(0)==='-';
    s=s.replace(/-/g,'');
    var i=s.indexOf('.'),ip=i<0?s:s.slice(0,i),dp=i<0?'':s.slice(i).replace(/\./g,'');
    if(i>=0)dp='.'+dp;
    ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return (neg?'-':'')+ip+dp;
  }
  function want(el){
    if(el.type!=='number'||el.__klc)return false;
    var c=el.closest&&el.closest('.ctl');if(!c)return false;
    var pre=c.querySelector('.pre'),post=c.querySelector('.post');
    if(pre&&pre.textContent.indexOf('$')>-1)return true;
    if(post&&/^\s*(sqft|sq ?ft)\s*$/i.test(post.textContent))return true;
    return false;
  }
  function conv(el){
    if(!want(el))return;
    el.__klc=1;
    var cur=d.get.call(el),ph=el.getAttribute('placeholder');
    el.type='text';
    if(!el.getAttribute('inputmode'))el.setAttribute('inputmode','numeric');
    Object.defineProperty(el,'value',{configurable:true,
      get:function(){return d.get.call(this).replace(/,/g,'')},
      set:function(v){d.set.call(this,fmt(v))}});
    d.set.call(el,fmt(cur));
    if(ph&&/^[0-9.]{5,}$/.test(ph))el.setAttribute('placeholder',fmt(ph));
    el.addEventListener('input',function(){
      var raw=d.get.call(el),pos=el.selectionStart,n=0,k;
      for(k=0;k<pos;k++)if(/[0-9.]/.test(raw.charAt(k)))n++;
      var out=fmt(raw);
      if(out===raw)return;
      d.set.call(el,out);
      for(k=0,pos=0;k<out.length&&n>0;k++){pos=k+1;if(/[0-9.]/.test(out.charAt(k)))n--;}
      try{el.setSelectionRange(pos,pos)}catch(e){}
    });
  }
  function scan(r){
    if(r.nodeType!==1)return;
    if(r.tagName==='INPUT')conv(r);
    var l=r.querySelectorAll?r.querySelectorAll('input[type=number]'):[];
    for(var i=0;i<l.length;i++)conv(l[i]);
  }
  new MutationObserver(function(m){
    for(var i=0;i<m.length;i++)for(var j=0;j<m[i].addedNodes.length;j++)scan(m[i].addedNodes[j]);
  }).observe(document.documentElement,{childList:true,subtree:true});
  document.addEventListener('DOMContentLoaded',function(){scan(document.body)});
})();
</script>

<script>
/* ===== DỮ LIỆU — sửa ở đây.
   CAL: lịch chính thức tra ngày 04/11/2026 từ BLS, BEA, Census, Federal Reserve, NAR, FHFA, NAHB, UMich (link trong source_url).
     verified:false = đoán theo quy tắc (Case-Shiller thứ Ba cuối tháng, ISM ngày làm việc 1 & 3, minutes Fed 3 tuần sau họp, hạn mức conforming cuối 11).
     NAR (existing/pending) và JOLTS chưa có lịch 2027 → thêm khi có. Giờ ghi ET; trang tự đổi ra giờ Cali.
   LATEST: số mới nhất tra 10/11/2026 (BLS, BEA, Fed, Freddie Mac, NAR, Census, S&P, FHFA, NAHB, UMich, ISM, C.A.R.). Cập nhật mỗi khi có số mới.
   CPI tháng 10/2026: BLS không công bố % 12 tháng (thiếu dữ liệu 10/2025) → ghi % tháng. ===== */
const UPDATED='2026-11-10';

let lang='en';
lang='vi'; try{ if(localStorage.getItem('kl_lang')==='en') lang='en'; }catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- ngày giờ: lịch ghi giờ ET; hiển thị giờ Cali (PT = ET − 3 giờ, cả hai đổi giờ cùng ngày) ---- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function caToday(){ /* hôm nay theo giờ Cali, không theo máy người xem */
  try{const p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); return p;}catch(e){return ymd(new Date());}
}
const dObj=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dayDiff=(a,b)=>Math.round((dObj(b)-dObj(a))/864e5);
function ptTime(et){ if(!et) return ''; let [h,m]=et.split(':').map(Number); h-=3; if(h<0)h+=24; const ap=h>=12?'PM':'AM'; const h12=((h+11)%12)+1; return h12+':'+pad(m)+' '+ap; }
function isDST(s){ /* giờ mùa hè US: Chủ nhật thứ 2 tháng 3 → Chủ nhật đầu tháng 11 */
  const d=dObj(s),y=d.getFullYear();
  const nth=(mo,n)=>{const f=new Date(y,mo,1);return new Date(y,mo,1+((7-f.getDay())%7)+7*(n-1));};
  return d>=nth(2,2)&&d<nth(10,1);
}
function utcStamp(date,et,addMin){ /* cho Google Calendar */
  let [h,m]=(et||'09:00').split(':').map(Number); const off=isDST(date)?4:5;
  const [y,mo,d]=date.split('-').map(Number); const t=new Date(Date.UTC(y,mo-1,d,h+off,m+(addMin||0)));
  return t.getUTCFullYear()+pad(t.getUTCMonth()+1)+pad(t.getUTCDate())+'T'+pad(t.getUTCHours())+pad(t.getUTCMinutes())+'00Z';
}
function niceDate(s){ const d=dObj(s), L=I18N[lang]; return lang==='vi'? L.dow[d.getDay()]+', '+d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear() : L.dow[d.getDay()]+', '+d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
const shortD=s=>{const d=dObj(s);return lang==='vi'?d.getDate()+'/'+(d.getMonth()+1):(d.getMonth()+1)+'/'+d.getDate()};

/* ---- Ghép lịch: sự kiện chính thức + hàng tuần (thứ Tư MBA, thứ Năm claims & Freddie Mac) ---- */
function buildEvents(){
  const ev=CAL.map(e=>Object.assign({},e));
  const have=new Set(ev.map(e=>e.code+e.date));
  const start=dObj(CAL_RANGE[0]), end=dObj(CAL_RANGE[1]);
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    const s=ymd(d), w=d.getDay();
    WEEKLY.forEach(r=>{ if(r.dow!==w) return; let date=s; if(WEEKLY_SHIFT[r.code+':'+s]!==undefined) date=WEEKLY_SHIFT[r.code+':'+s]; if(!date) return;
      if(!have.has(r.code+date)) ev.push({date,time_et:r.time_et,code:r.code,period:'',weekly:true,verified:true,source_url:r.src}); });
  }
  ev.sort((a,b)=>(a.date+a.time_et).localeCompare(b.date+b.time_et)||(IND[b.code]?.stars||0)-(IND[a.code]?.stars||0));
  return ev;
}
let EVENTS=[], range=7, minStars=3;
function stars(n){return '★'.repeat(n)+'<i>'+'★'.repeat(5-n)+'</i>'}
function evName(e){ const I=IND[e.code]; let n=I?I[lang].n:e.code; if(e.label&&e.label[lang]) n=e.label[lang]; return n; }
const pv=p=>Array.isArray(p)?p[lang==='vi'?0:1]:(p||'');
function evPeriod(e){ return e.period?(lang==='vi'?'Số của ':'Covers: ')+pv(e.period):''; }
function gcalLink(e){
  const I=IND[e.code], title=evName(e)+(e.period?' ('+pv(e.period)+')':'');
  const det=(I?I[lang].h+'\n\n':'')+'tools.kenlamrealty.com/t180/';
  const dates=e.time_et? utcStamp(e.date,e.time_et)+'/'+utcStamp(e.date,e.time_et,30) : e.date.replace(/-/g,'')+'/'+ymd(new Date(dObj(e.date).getTime()+864e5)).replace(/-/g,'');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&dates='+dates+'&details='+encodeURIComponent(det);
}
function latestFor(code){ const k=LATEST_MAP[code]; if(!k) return ''; return k.map(c=>LATEST[c]).filter(x=>x&&x.value!=null).map(x=>'<b>'+esc(x.value)+'</b> · '+esc(pv(x.period))+(x.released?' '+I18N[lang].morelatest.replace('{d}',shortD(x.released)):'')).join('<br>'); }
function renderList(){
  const L=I18N[lang], today=caToday();
  const vis=EVENTS.filter(e=>{const dd=dayDiff(today,e.date); return dd>=0&&dd<range&&(IND[e.code]?.stars||1)>=minStars;});
  if(!vis.length){$('list').innerHTML='<div class="empty">'+L.none+'</div>';return vis;}
  let html='',cur='';
  vis.forEach(e=>{
    if(e.date!==cur){ if(cur) html+='</div>'; cur=e.date; const dd=dayDiff(today,e.date);
      html+='<div class="day"><div class="dayh'+(dd===0?' today':'')+'">'+(dd===0?L.today+' · ':dd===1?L.tomorrow+' · ':'')+niceDate(e.date)+'</div>'; }
    const I=IND[e.code]||{stars:1,vi:{n:e.code,e:'',h:'',x:'',w:''},en:{n:e.code,e:'',h:'',x:'',w:''}}, T=I[lang];
    const tags=(e.weekly?' <span class="tag">'+L.wk+'</span>':'')+(e.verified===false?' <span class="tag est">'+L.est+'</span>':'');
    const lt=latestFor(e.code);
    html+='<details class="ev"><summary><span class="tm">'+(e.time_et?ptTime(e.time_et):'—')+'</span><span class="nm">'+esc(evName(e))+tags+(e.period?'<small>'+esc(evPeriod(e))+'</small>':'')+'</span><span class="st" aria-label="'+I.stars+'/5">'+stars(I.stars)+'</span></summary>'
      +'<div class="body"><p><span class="lb">'+L.lb_e+'</span>'+esc(T.e)+'</p><p><span class="lb">'+L.lb_h+'</span>'+esc(T.h)+'</p><p class="x"><span class="lb">'+L.lb_x+'</span>'+esc(T.x)+'</p>'
      +(lt?'<div class="last"><span class="lb">'+L.lb_last+'</span>'+lt+'</div>':'')
      +'<p><span class="lb">'+L.lb_w+'</span>'+esc(T.w)+'</p>'
      +'<div class="links"><a href="'+gcalLink(e)+'" target="_blank" rel="noopener">'+L.gcal+'</a>'+(e.source_url?'<a href="'+esc(e.source_url)+'" target="_blank" rel="noopener">'+L.src+' ↗</a>':'')+'</div></div></details>';
  });
  html+='</div>';
  $('list').innerHTML=html; return vis;
}
function renderHero(){
  const L=I18N[lang], today=caToday();
  const big=EVENTS.filter(e=>dayDiff(today,e.date)>=0&&(IND[e.code]?.stars||0)>=4&&!e.weekly);

  if(LATEST.CAR_ALA) rows.push([lang==='vi'?'Giá giữa nhà Alameda':'Alameda median (C.A.R.)',LATEST.CAR_ALA.value.replace('Alameda ',''),pv(LATEST.CAR_ALA.period)]);
  if(fed) rows.push([L.s_nextfed,shortD(fed.date)+(lang==='vi'?' (còn '+dayDiff(today,fed.date)+' ngày)':' ('+dayDiff(today,fed.date)+' days)'),'']);
  $('snap').innerHTML=rows.map(r=>'<div class="line"><span class="n">'+r[0]+'</span><span class="a">'+esc(r[1])+(r[2]?'<small>'+esc(r[2])+'</small>':'')+'</span></div>').join('');
  const wk=EVENTS.filter(e=>{const dd=dayDiff(today,e.date);return dd>=0&&dd<7&&(IND[e.code]?.stars||0)>=4&&!e.weekly;}).length;

function pmt(P,r,y){ if(P<=0) return 0; const i=r/100/12,n=y*12; return i===0?P/n:P*i/(1-Math.pow(1+i,-n)); }
function loanFor(pay,r){ const i=r/100/12,n=360; return i===0?pay*n:pay*(1-Math.pow(1+i,-n))/i; }
let lastCalc={};
function calc(){
  const L=I18N[lang], P=Math.max(0,parseFloat($('loan').value)||0), r=Math.max(0,parseFloat($('rate').value)||0);
  const base=pmt(P,r,30), q=pmt(P,r+0.25,30)-base;
  $('qtr').innerHTML=fmt(q)+'<small>'+L.permo+'</small>';
  $('sens').innerHTML=[-1,-0.5,-0.25,0,0.25,0.5,1].filter(d=>r+d>0).map(d=>{const p=pmt(P,r+d,30),df=p-base;
    return '<div class="line"><span class="n">'+L.sens.replace('{r}',(Math.round((r+d)*1000)/1000))+'</span><span class="a">'+fmt(p)+L.permo+'<small>'+(d===0?L.same:L.sens_s.replace('{d}',(df>0?'+':'−')+fmt(Math.abs(df))))+'</small></span></div>';}).join('');
  const a=P-loanFor(base,r+1), b=r>1?loanFor(base,r-1)-P:0;
  $('buyPower').innerHTML=L.bp.replace('{p}',fmt(base)+L.permo).replace('{a}',fmt(a)).replace('{b}',fmt(b));
  lastCalc={l:fmt(P),r:r,q:fmt(q)};
}

  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.getAttribute('data-i'); if(typeof L[k]==='string') el.textContent=L[k];});
  $('langBtn').textContent=L.lang; $('gq').placeholder=L.g_ph; $('tzNote').textContent=L.tz;
  $('chain').innerHTML=L.chain.map(c=>'<li><b>'+c[0]+'</b><small>'+c[1]+'</small></li>').join('');
  $('myth').innerHTML=L.myth;
  $('tips').innerHTML=L.tips.map(t=>'<li>'+esc(t)+'</li>').join('');
  $('rank').innerHTML=Object.entries(IND).filter(([k])=>k!=='MIN').sort((a,b)=>b[1].stars-a[1].stars).map(([k,v])=>'<div><span>'+esc(v[lang].n)+'</span><span class="st">'+stars(v.stars)+'</span></div>').join('');
  $('gchips').innerHTML='<button type="button" class="chip" data-t="all" aria-pressed="'+(gtag==='all')+'">'+L.g_all+'</button>'+Object.entries(GTAG).map(([k,v])=>'<button type="button" class="chip" data-t="'+k+'" aria-pressed="'+(gtag===k)+'">'+v[lang==='vi'?0:1]+'</button>').join('');
  $('upd').textContent=lang==='vi'?UPDATED.split('-').reverse().join('/'):UPDATED.slice(5).replace('-','/')+'/'+UPDATED.slice(0,4);
}
let shown=[];
function render(){ renderStatic(); renderHero(); shown=renderList(); calc(); renderGlos(); updSms(); }
function updSms(){
  const L=I18N[lang], today=caToday(), n=EVENTS.find(e=>dayDiff(today,e.date)>=0&&(IND[e.code]?.stars||0)>=4&&!e.weekly);
  const s=L.sms.replace('{e}',n?evName(n):'—').replace('{d}',n?shortD(n.date):'').replace('{s}',L.sms_s.replace('{l}',lastCalc.l||''));
  $('smsBtn').href='sms:4086662825?&body='+encodeURIComponent(s);
}
function seg(id,cb){ $(id).addEventListener('click',e=>{const b=e.target.closest('button'); if(!b)return; $(id).querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false')); cb(+b.dataset.v);}); }
seg('rangeSeg',v=>{range=v; shown=renderList();});
seg('impSeg',v=>{minStars=v; shown=renderList();});
$('loan').addEventListener('input',()=>{calc();updSms();}); $('rate').addEventListener('input',()=>{calc();updSms();});
$('gq').addEventListener('input',renderGlos);
$('gchips').addEventListener('click',e=>{const b=e.target.closest('.chip'); if(!b)return; gtag=b.dataset.t; $('gchips').querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false')); renderGlos();});
$('langBtn').onclick=()=>{lang=lang==='vi'?'en':'vi'; try{localStorage.setItem('kl_lang',lang)}catch(e){} render();};
/* .ics: tải các tin đang hiện trong danh sách */
$('icsBtn').onclick=()=>{
  const list=shown.length?shown:EVENTS; const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Ken Lam Realty//T180//EN','CALSCALE:GREGORIAN'];
  const stamp=utcStamp(caToday(),'12:00');
  list.forEach((e,i)=>{ const I=IND[e.code]; const sum=(evName(e)+(e.period?' ('+pv(e.period)+')':'')).replace(/[,;]/g,' ');
    const desc=((I?I[lang].h:'')+' tools.kenlamrealty.com/t180/').replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
    lines.push('BEGIN:VEVENT','UID:t180-'+e.code+'-'+e.date+'@kenlamrealty.com','DTSTAMP:'+stamp,
      e.time_et?'DTSTART:'+utcStamp(e.date,e.time_et):'DTSTART;VALUE=DATE:'+e.date.replace(/-/g,''),
      e.time_et?'DTEND:'+utcStamp(e.date,e.time_et,30):'DTEND;VALUE=DATE:'+ymd(new Date(dObj(e.date).getTime()+864e5)).replace(/-/g,''),
      'SUMMARY:'+sum,'DESCRIPTION:'+desc,'END:VEVENT'); });
  lines.push('END:VCALENDAR');
  const blob=new Blob([lines.join('\r\n')],{type:'text/calendar'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='lich-kinh-te-kenlamrealty.ics'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
};
$('emailBtn').onclick=()=>{$('form').classList.add('open'); $('fname').focus();};
$('sendBtn').onclick=()=>{
  const L=I18N[lang], n=$('fname').value.trim()||'-', em=$('femail').value.trim()||'-', ph=$('fphone').value.trim()||'-', today=caToday();
  const up=EVENTS.filter(e=>dayDiff(today,e.date)>=0&&dayDiff(today,e.date)<31&&(IND[e.code]?.stars||0)>=4&&!e.weekly).map(e=>'• '+shortD(e.date)+(e.time_et?' '+ptTime(e.time_et)+' PT':'')+' — '+evName(e)+(e.period?' ('+pv(e.period)+')':'')).join('\n');
  const body=L.body.replace('{n}',n).replace('{e}',em).replace('{ph}',ph).replace('{l}',lastCalc.l).replace('{r}',lastCalc.r).replace('{q}',lastCalc.q).replace('{list}',up||'-');
  location.href='mailto:ken@kenlamrealty.com?subject='+encodeURIComponent(L.subj.replace('{n}',n))+'&body='+encodeURIComponent(body);
  $('sent').hidden=false;
};
$('copyBtn').onclick=()=>{try{navigator.clipboard.writeText('4086662825')}catch(e){}};
$('rate').value=DEFAULT_RATE;
EVENTS=buildEvents();
render();
</script>
