<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NBP: Notice to Buyer to Perform · Ken Lam Tools</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap">
<style>

/* Layout: one column, inputs on top, live result card below, three actions, footer. Phone first. */
:root{
  --bg:#FBF9F4;        /* ivory */
  --panel:#FFFFFF;
  --fg:#2B2925;
  --muted:#7A7468;
  --line:#E6E0D3;
  --brass:#B8955A;     /* soft brass accent */
  --brass-soft:#F3EBDC;
  --warn:#9A5B2E;
  --ok:#4F7A5A;
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1C1A17;--panel:#24211D;--fg:#F1ECE2;--muted:#A69D8E;--line:#3A352E;
  --brass:#D2B07A;--brass-soft:#302A20;--warn:#D99A6A;--ok:#8CBF9A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1A17;--panel:#24211D;--fg:#F1ECE2;--muted:#A69D8E;--line:#3A352E;
  --brass:#D2B07A;--brass-soft:#302A20;--warn:#D99A6A;--ok:#8CBF9A;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:22px}
header{display:grid;gap:6px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:500}
.lang{border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:12px;padding:5px 10px;border-radius:999px;cursor:pointer}
.lang:focus-visible,button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1{font-family:var(--display);font-weight:300;font-size:38px;line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:15px;margin:0;max-width:40ch}

.inputs{display:grid;gap:14px}
.field{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.field label small{font-weight:400}
.ctl{display:flex;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:0 12px}
.ctl:focus-within{border-color:var(--brass)}
.ctl .pre,.ctl .post{color:var(--muted);font-size:15px}
.ctl input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:20px;padding:12px 8px;font-variant-numeric:tabular-nums}
.ctl input::-webkit-outer-spin-button,.ctl input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ctl input[type=number]{-moz-appearance:textfield}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:380px){.row2{grid-template-columns:1fr}}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:15px;padding:11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brass-soft);color:var(--fg);font-weight:500}

.result{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:grid;gap:16px}
.total .k{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.total .v{font-family:var(--display);font-weight:400;font-size:58px;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--fg)}
.total .v small{font-family:var(--body);font-size:16px;color:var(--muted);font-weight:400}
.lines{display:grid;gap:0;border-top:1px solid var(--line)}
.line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.line .n{color:var(--muted);min-width:0}
.line .n b{color:var(--fg);font-weight:500}
.line .a{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.line.pmi .a{color:var(--warn)}
.line.pmi.off{display:none}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.bar .b1{background:var(--brass)}
.bar .b2{background:#A9B7A0}
.bar .b3{background:#CBB7A3}
.bar .b4{background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
.meta{font-size:13px;color:var(--muted);display:grid;gap:4px}
.meta b{color:var(--fg);font-weight:500}
.note{font-size:13px;color:var(--muted);background:var(--brass-soft);border-radius:10px;padding:10px 12px;line-height:1.45}
.note.hide{display:none}

.actions{display:grid;gap:10px}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;border-radius:10px;padding:14px 16px;font:inherit;font-size:15px;font-weight:500;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#FFFDF8}
.btn.primary:hover{filter:brightness(.96)}
.btn:hover{border-color:var(--brass)}

.form{display:none;background:var(--panel);border:1px solid var(--brass);border-radius:14px;padding:18px;gap:12px}
.form.open{display:grid}
.form h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.form p{margin:0;font-size:14px;color:var(--muted)}
.form .ctl input{font-size:16px}
.form .ok{color:var(--ok);font-weight:500;font-size:14px}
.copyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.copyrow code{background:var(--brass-soft);padding:3px 8px;border-radius:6px;user-select:all;font-family:var(--body)}
.copyrow button{border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;font-size:13px;padding:5px 10px;border-radius:999px;cursor:pointer}

footer{display:grid;gap:8px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
footer a{color:var(--brass);text-decoration:none}
footer a:hover{text-decoration:underline}
footer .who{color:var(--fg)}
@media (prefers-reduced-motion:no-preference){.total .v{transition:opacity .15s}}

/* ===== Thêm cho T42 / T43 / T44 (không đổi class cũ) ===== */
.ctl select{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:18px;padding:12px 4px;-webkit-appearance:none;appearance:none;cursor:pointer}
.ctl .chev{color:var(--muted);font-size:12px;pointer-events:none}
.ctl input[type=date]{font-size:18px;min-height:48px}
.ctl input[type=text]{font-size:18px}
.hint{font-size:12px;color:var(--muted);margin:0;line-height:1.45}
.hint b{color:var(--fg);font-weight:500}
.total .of{font-size:14px;color:var(--muted);margin-top:6px}
.chip{font-size:12px;line-height:1.3;padding:3px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;flex:none;color:var(--muted)}
.chip.ok{color:var(--ok);border-color:var(--ok)}
.chip.mid{color:var(--brass);border-color:var(--brass)}
.chip.no{color:var(--warn);border-color:var(--warn)}
.grp-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass);margin:6px 0 0;font-weight:500}
.myth{font-size:14px;line-height:1.5;border-left:2px solid var(--brass);padding:2px 0 2px 12px;margin:0}
.myth b{font-weight:500}
.next{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:12px}
.next h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1.15}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:st}
.steps li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;font-size:15px;line-height:1.45;counter-increment:st}
.steps li::before{content:counter(st);font-family:var(--display);font-size:22px;line-height:1;color:var(--brass)}
.steps small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.steps a{color:var(--brass);text-decoration:none}
.dline{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.dline .n{color:var(--muted);min-width:0}
.dline .n b{color:var(--fg);font-weight:500}
.dline .a{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.tips{margin:0;padding-left:18px;font-size:14px;line-height:1.5;display:grid;gap:8px;color:var(--fg)}
.tips li::marker{color:var(--brass)}
.tips small{display:block;color:var(--muted);font-size:13px}
.linkbtn{justify-self:start;border:1px solid var(--line);background:transparent;color:var(--brass);font:inherit;font-size:14px;padding:7px 13px;border-radius:999px;cursor:pointer}
.linkbtn:hover{border-color:var(--brass)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:grid;gap:10px}
.panel h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;line-height:1.15}
.prog{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.prog b{color:var(--fg);font-weight:500}
.gcal{color:var(--brass);text-decoration:none;white-space:nowrap;font-size:13px}
.gcal:hover{text-decoration:underline}
footer .src{line-height:1.6}
.hide{display:none!important}
.result > *,.inputs > *,.wrap > *,.panel > *{min-width:0}

/* ===== Riêng T43: lịch 2 tháng ===== */
.best{display:grid;gap:0;border-top:1px solid var(--line)}
.bd{display:grid;gap:4px;padding:12px 0;border-bottom:1px solid var(--line)}
.bd .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.bd .dt{font-family:var(--display);font-size:28px;line-height:1.1;font-weight:400}
.bd .dt small{font-family:var(--body);font-size:14px;color:var(--muted)}
.bd .d{font-size:13px;color:var(--muted);line-height:1.5}
.bd .d b{color:var(--fg);font-weight:500}
.bd.first{background:var(--brass-soft);margin:0 -10px;padding:12px 10px;border-radius:8px;border-bottom-color:transparent}
.cal-wrap{display:grid;gap:18px}
.mon h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 8px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.grid7 .wd{font-size:11px;color:var(--muted);text-align:center;padding:2px 0;letter-spacing:.04em}
.dc{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 2px 4px;display:grid;justify-items:center;gap:1px;cursor:pointer;font:inherit;color:var(--fg);min-height:58px}
.dc .s{font-size:16px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.dc .l{font-size:10.5px;color:var(--muted);line-height:1.2;font-variant-numeric:tabular-nums}
.dc .c{font-size:10px;color:var(--muted);line-height:1.2}
.dc .m{width:6px;height:6px;border-radius:50%;margin-top:2px;background:transparent}
.dc.good{background:var(--brass-soft);border-color:var(--brass)}
.dc.good .m{background:var(--ok)}
.dc.no .m{background:var(--warn)}
.dc.no .s{color:var(--warn)}
.dc.past{opacity:.4}
.dc.sel{outline:2px solid var(--fg);outline-offset:1px}
.dc.top3 .s{text-decoration:underline;text-decoration-color:var(--brass);text-underline-offset:3px}
.dc.blank{visibility:hidden}
.det{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;font-size:14px;line-height:1.5}
.det .dt{font-family:var(--display);font-size:24px;line-height:1.15}
.det .r{color:var(--muted)}
.det .r b{color:var(--fg);font-weight:500}
.legend .lg-g{background:var(--brass-soft);border:1px solid var(--brass)}
.legend .lg-n{background:var(--warn)}

</style>
<style>

/* ===== Forms T700–T714: khung giải thích form ===== */
.kl-back{font-size:13px;color:var(--muted);text-decoration:none;justify-self:start}
.kl-back:hover{color:var(--brass)}
.kl-vid{width:100%;max-width:360px;margin:0 auto;border-radius:12px;display:block;background:var(--panel);border:1px solid var(--line)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:12px}
.panel h2,.tool h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1.15}
.kid{font-size:16px;line-height:1.6;margin:0}
.kid b{font-weight:600}
.code{display:inline-block;font-size:12px;letter-spacing:.1em;color:var(--brass);font-weight:600}
table.who{width:100%;border-collapse:collapse;font-size:14.5px;line-height:1.45}
table.who th{width:34%;text-align:left;vertical-align:top;color:var(--muted);font-weight:500;padding:9px 10px 9px 0;border-bottom:1px solid var(--line)}
table.who td{vertical-align:top;padding:9px 0;border-bottom:1px solid var(--line)}
table.who tr.no th{color:var(--warn)}
.walk{display:grid;gap:22px}
.wk{display:grid;gap:8px}
.wk .ref{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass);font-weight:600}
.wk h3{font-size:17px;font-weight:600;margin:0;line-height:1.35}
.wk figure{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.wk figure img{display:block;width:100%;height:auto}
.wk p{margin:0;font-size:15px;line-height:1.55}
.wk .ex{font-size:14px;background:var(--brass-soft);border-radius:8px;padding:9px 11px;line-height:1.5}
.legend2{font-size:12.5px;color:var(--muted);margin:0}
.legend2 b{color:#1E3CA0;font-weight:600}
.legend2 i{font-style:normal;border:2px solid #EBB400;padding:0 4px;border-radius:3px}
.tool{background:var(--panel);border:1px solid var(--brass);border-radius:14px;padding:20px;display:grid;gap:14px}
.big{font-family:var(--display);font-size:40px;line-height:1.05;font-variant-numeric:tabular-nums;margin:2px 0 0}
.big small{display:block;font-family:var(--body);font-size:14px;color:var(--muted);margin-top:6px;line-height:1.4}
.badge{display:inline-block;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.no{color:var(--warn);border-color:var(--warn)}
.badge.mid{color:var(--brass);border-color:var(--brass)}
.ck{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.45;cursor:pointer}
.ck input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--brass)}
.ck small{display:block;color:var(--muted);font-size:13px}
.ctl select{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:17px;padding:12px 4px;cursor:pointer}
.ctl input[type=date]{font-size:18px;min-height:48px}
.hint{font-size:12.5px;color:var(--muted);margin:0;line-height:1.45}
.myth{font-size:14.5px;line-height:1.55;border-left:2px solid var(--brass);padding:2px 0 2px 12px;margin:0}
.myth b{font-weight:600}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:st}
.steps li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;font-size:15px;line-height:1.45;counter-increment:st}
.steps li::before{content:counter(st);font-family:var(--display);font-size:22px;line-height:1;color:var(--brass)}
.steps small{display:block;margin-top:3px}
.steps a{color:var(--brass);text-decoration:none}
.vidbox{display:grid;gap:10px}
.vidbox[hidden]{display:none}
footer .src a{word-break:break-word}

</style>

<div class="wrap">
  <a class="kl-back" id="klBack" href="/">← All tools</a>
  <header>
    <div class="brand">
      <span>Ken Lam Realty · Tools · T703</span>
      <button class="lang" id="langBtn" type="button" aria-label="Switch language">Tiếng Việt</button>
    </div>
    <h1 data-i="title"></h1>
    <p class="sub" data-i="sub"></p>

  <section class="panel" aria-label="Simple explanation">

    <table class="who"><tbody id="whoT"></tbody></table>
  </section>

  <section class="panel" aria-label="Walk through the form">
    <h2 data-i="walk_h"></h2>
    <p class="legend2" data-i="legend"></p>
    <div class="walk" id="walk"></div>
  </section>


  <section class="tool" aria-label="Calculator">
    <h2 data-i="tool_h"></h2>
    <p class="hint" data-i="tool_s"></p>
    <div class="field"><label for="acc" data-i="l_acc"></label><div class="ctl"><input id="acc" type="date" value="2026-11-02"></div></div>

      <div class="field"><label for="days"><span data-i="l_days"></span> <small data-i="l_days_s"></small></label><div class="ctl"><input id="days" type="number" inputmode="numeric" min="1" max="90" value="17"></div></div>
      <div class="field"><label for="nb"><span data-i="l_nb"></span> <small data-i="l_nb_s"></small></label><div class="ctl"><input id="nb" type="number" inputmode="numeric" min="2" max="30" value="2"></div></div>
    </div>
    <div class="field"><label for="dlv"><span data-i="l_dlv"></span> <small data-i="l_dlv_s"></small></label><div class="ctl"><input id="dlv" type="date" value="2026-11-20"></div></div>
    <div class="result" aria-live="polite">
      <div class="total"><div class="k" id="rK"></div><div class="big" id="rBig"></div></div>
      <div><span class="badge" id="rBadge"></span></div>
      <div class="lines" id="rLines"></div>
      <p class="note" data-i="note"></p>
    </div>

  <section class="panel" aria-label="Common mistakes">
    <h2 data-i="myth_h"></h2>
    <div id="myths" style="display:grid;gap:12px"></div>

  <section class="panel" aria-label="Next steps">
    <h2 data-i="next_h"></h2>
    <ol class="steps" id="nextL"></ol>

    <button class="btn" type="button" id="videoBtn" data-i="b_video"></button>
  </section>

const I18N={"en": {"lang": "Tiếng Việt", "back": "← All tools", "wd": ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], "sat": "Saturday", "sun": "Sunday", "legend": "<b>Blue text</b> = example filled in · <i>yellow</i> = the part to read closely. Cropped from the real C.A.R. form for teaching only.", "ft_src": "Sources:", "ft_chk": "(checked 06/11/2026)", "ft_upd": "Updated", "ft_all": "All tools", "b_sms": "Text Ken", "b_video": "Watch the 45-sec video", "vid_h": "45-second video", "doc_title": "NBP: Notice to Buyer to Perform · Ken Lam Tools", "title": "NBP: Notice to Buyer to Perform", "sub": "The seller's written \"your deadline passed, act now\" notice to the buyer. Send it too early and it is void. Only after it runs out may the seller cancel.", "kid_h": "Explained like you're 10", "kid": "You lend a friend your bike and he promises to bring it back Friday. Friday comes and goes. You can't just grab it and lend it to someone else. First you text: <b>\"You have 2 more days. Then I lend it to someone else.\"</b> The NBP is that text, on paper, signed by the seller. If you send it way too early, it doesn't count. If the 2 days pass and the buyer still did nothing, then the seller may cancel.", "who_h": "Who signs, when to use it, when not to", "who": [["Who signs", "The <b>seller</b> only. The buyer does not sign an NBP."], ["Who receives", "The <b>buyer</b>, delivered the way the contract allows (usually email to the buyer's agent)."], ["When to use", "The buyer missed a deadline: did not remove a contingency (inspection, loan, appraisal…), did not wire the deposit, did not send proof of funds, did not return signed disclosures, etc."], ["Earliest you may send", "No earlier than <b>2 Days before</b> the buyer's deadline (RPA ¶14E). Sent earlier = void for that item."], ["Do NOT use", "To remind the <b>seller</b> (that is the NSP, tool T708). When the buyer already signed the removal. To push the closing date (that is a Demand to Close Escrow, form DCE).", 1]], "walk_h": "Walk through the form, part by part", "alt": "Cropped image of C.A.R. Form NBP,", "walk": [["s01.jpg", "Top of the form", "Which deal, which house, who", "\"No. ___\" is the count: the first NBP in a deal is No. 1, a second one is No. 2. Then the contract date, the property address, buyer and seller names. If the deal uses another contract (new construction, probate), tick \"Other\" and name it.", "Example: No. 1 · Purchase Agreement dated 11/02/2026 · 1234 Example Lane, San Jose, CA 95100 · Buyer: Anh Minh · Seller: Chị Lan."], ["s02.jpg", "Opening paragraph", "Sent too early? Only that item is void", "The seller lists what the buyer must do. If one item is sent earlier than the contract allows, the notice is void <b>for that item only</b>. The rest still count. Tick \"ALL CONTINGENCIES\" and it only works for the contingencies whose window is already open.", ""], ["s03.jpg", "Section I · Contingency", "Which contingency the buyer has not removed", "Tick the exact contingencies: loan (8A), appraisal (8B), buyer investigation / inspection (8C), insurance (8D), seller documents (8E), title prelim (8F), HOA documents (8G), leased or liened items (8H), and the sale of the buyer's own house (form COP). K and L are blank lines for anything else.", "Example: the deal was accepted Mon 11/02/2026 with a 17-day inspection contingency. Day 17 is Thu 11/19/2026. Chị Lan (seller) ticks C (Buyer Investigation)."], ["s04.jpg", "Section II · Contractual Action", "Things the buyer promised to do (not contingencies)", "These are jobs, not escape hatches: wire the initial deposit (M), the increased deposit (N), initial the liquidated damages clause (O), lender info (P), FHA/VA notice (Q), proof of funds (R), loan application (S), return signed disclosures (U, V, W), help title with the GTO rule (X), proof of authority for a trust or company buyer (Z), and the COP items when the buyer must sell first (AA–CC).", "Example: the deposit was due 2 business days after acceptance (Wed 11/04/2026) and escrow has nothing. The seller may tick M."], ["s05.jpg", "Bottom paragraph", "The clock: 2 Days after Delivery", "The buyer gets <b>2 Days after Delivery</b> of the NBP, or more if a bigger number is written in (never less than 2). The buyer acts by signing the removal (C.A.R. CR or RR) or doing the listed action. If not, the seller may cancel. The buyer also always gets at least until the original deadline, whichever is later.", "Example: NBP delivered Fri 11/20/2026. 2 Days lands on Sun 11/22, so it moves to Mon 11/23/2026, 11:59 PM."], ["s06.jpg", "Signatures", "Seller signs and dates it", "Only the seller signs. The count starts from <b>Delivery</b>, not from signing. Day 1 is the first full day after Delivery, and the last day ends at 11:59 PM. If it lands on a Saturday, Sunday or legal holiday, it moves to the next working day.", ""]], "tool_h": "NBP date calculator", "tool_s": "Enter the acceptance date and what the buyer is late on. See the earliest day the seller may deliver the NBP, and the buyer's final deadline.", "l_acc": "Acceptance date", "l_item": "What is the buyer late on?", "l_days": "Days in the contract", "l_days_s": "(check paragraph 3 of your RPA)", "l_nb": "Days in the NBP", "l_nb_s": "(form says 2, never less)", "l_dlv": "Day the NBP is delivered", "l_dlv_s": "(leave blank = deliver on the earliest allowed day)", "items": [["insp", "Inspection / investigation contingency (8C)"], ["loan", "Loan contingency (8A)"], ["appr", "Appraisal contingency (8B)"], ["ins", "Insurance contingency (8D)"], ["docs", "Review of seller documents (8E)"], ["dep", "Initial deposit (3D(1), business days)"], ["ver", "Verification of funds / loan application (3H)"], ["cus", "Other (type the days)"]], "r_k": "Buyer must act by", "r_time": "11:59 PM. If not, the seller may cancel (the seller is not forced to).", "r_void": "VOID — sent too early", "r_void_s": "This NBP is void for this item. Deliver a new one on or after {e}.", "ok": "Valid timing", "void": "Too early", "ln_acc": "Acceptance", "ln_spd": "Buyer's deadline in the contract", "ln_shift": "moved from {r} ({w})", "ln_e": "Earliest day to deliver the NBP", "ln_d": "NBP delivered", "ln_d_auto": "(assumed: earliest day)", "ln_fin": "Buyer's final deadline", "ln_can": "Seller may cancel from", "note": "Under the RPA, silence does not remove a contingency. Until the buyer signs a removal, the contingency stays, even after Day 17. The seller only gets the right to cancel after this NBP runs out. Until the seller actually cancels in writing, the buyer can still remove and keep the deal.", "prompt": "Pick an acceptance date.", "myth_h": "What people get wrong", "myths": [["\"Day 17 passed, so the contingency is gone.\"", "Wrong. Under the current RPA the buyer keeps the contingency until a signed removal. The seller must send an NBP and wait."], ["\"The seller can send the NBP the day after acceptance, just to be safe.\"", "No. Delivered more than 2 Days before the deadline, it is void for that item. You have to send it again."], ["\"NBP expired, so the deal is automatically cancelled.\"", "No. The seller <b>may</b> cancel, by delivering a signed cancellation. If the buyer removes the contingency before the seller cancels, the deal goes on."], ["\"2 Days means 2 business days.\"", "No. Days are calendar days. Only if the last day lands on a weekend or legal holiday does it move to the next working day."], ["\"NBP and NSP are the same form.\"", "No. NBP: seller → buyer. NSP: buyer → seller. Different list, different reasons."]], "next_h": "Next steps", "next": [["See every contingency deadline from the acceptance date.", "/t60/", "Tool T60 · Escrow timeline"], ["Is the buyer's deposit at risk today?", "/t08/", "Tool T08 · Earnest money"], ["The other side: the buyer reminds the seller.", "/t708/", "Tool T708 · NSP"], ["Read the purchase agreement step by step.", "/t401/", "Tool T401 · RPA"], ["Every form in one line.", "/t402/", "Tool T402 · Forms library"]], "b_email": "Email Ken these dates", "mail_subj": "NBP dates - 1234 Example Lane (T703)", "mail_intro": "Hi Ken, here are my NBP dates from tool T703:", "mail_end": "Sent from tools.kenlamrealty.com/t703. For understanding the form only, not legal advice.", "sms": "Hi Ken, question about an NBP (T703):", "ft_dis": "For understanding the form only. Not legal advice. Your contract's numbers win. Ask a real estate attorney before you cancel a deal."}, "vi": {"lang": "English", "back": "← Tất cả tools", "wd": ["Chủ nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"], "sat": "Thứ Bảy", "sun": "Chủ nhật", "legend": "<b>Chữ xanh</b> = ví dụ điền vào · <i>vàng</i> = chỗ cần đọc kỹ. Cắt từ form C.A.R. thật, chỉ để giải thích.", "ft_src": "Nguồn:", "ft_chk": "(tra ngày 06/11/2026)", "ft_upd": "Cập nhật", "ft_all": "Tất cả tools", "b_sms": "Nhắn Ken", "b_video": "Xem video 45 giây", "vid_h": "Video 45 giây", "doc_title": "NBP: Thư Seller Nhắc Buyer Tới Hạn · Ken Lam Tools", "title": "NBP: Thư seller nhắc buyer \"tới hạn rồi, làm đi\"", "sub": "Seller gửi khi buyer trễ hạn bỏ contingency hay trễ việc đã hứa. Gửi sớm quá là vô hiệu. Hết hạn notice rồi seller mới được hủy.", "kid_h": "Giải thích kiểu 10 tuổi", "kid": "Em cho bạn mượn xe đạp, bạn hứa thứ Sáu trả. Thứ Sáu qua rồi. Em chưa được giật xe đem cho đứa khác mượn. Em phải nhắn trước: <b>\"Cho bạn 2 ngày nữa. Không trả là mình cho người khác mượn.\"</b> NBP chính là tin nhắn đó, viết trên giấy, seller ký. Nhắn sớm quá thì không tính. Hết 2 ngày mà buyer vẫn im, seller mới được hủy.", "who_h": "Ai ký, khi nào dùng, khi nào không", "who": [["Ai ký", "Chỉ <b>seller</b>. Buyer không ký NBP."], ["Ai nhận", "<b>Buyer</b>, giao đúng cách hợp đồng cho phép (thường là email cho agent bên mua)."], ["Khi nào dùng", "Buyer trễ hạn: chưa ký bỏ contingency (inspection, loan, appraisal…), chưa wire tiền cọc, chưa đưa giấy chứng minh tiền, chưa ký trả disclosures…"], ["Sớm nhất được gửi", "Không sớm hơn <b>2 Days trước</b> hạn của buyer (RPA ¶14E). Gửi sớm hơn là vô hiệu cho món đó."], ["KHÔNG dùng", "Để nhắc <b>seller</b> (đó là NSP, tool T708). Khi buyer đã ký bỏ contingency rồi. Khi muốn ép ngày close (đó là Demand to Close Escrow, form DCE).", 1]], "walk_h": "Đi qua từng phần form", "alt": "Hình cắt từ C.A.R. Form NBP,", "walk": [["s01.jpg", "Đầu form", "Deal nào, căn nào, ai với ai", "\"No. ___\" là số thứ tự: NBP đầu tiên trong deal ghi No. 1, cái thứ hai ghi No. 2. Rồi ngày ký hợp đồng, địa chỉ nhà, tên buyer, tên seller. Deal dùng hợp đồng khác (nhà mới xây, probate) thì tick \"Other\" và ghi tên hợp đồng.", "Ví dụ: No. 1 · Purchase Agreement ngày 02/11/2026 · 1234 Example Lane, San Jose, CA 95100 · Buyer: Anh Minh · Seller: Chị Lan."], ["s02.jpg", "Đoạn mở đầu", "Gửi sớm? Chỉ món đó vô hiệu", "Seller liệt kê những gì buyer phải làm. Món nào gửi sớm hơn hợp đồng cho phép thì notice vô hiệu <b>riêng cho món đó</b>. Các món khác vẫn tính. Tick \"ALL CONTINGENCIES\" thì chỉ tính cho contingency nào đã tới khung được gửi.", ""], ["s03.jpg", "Phần I · Contingency", "Contingency nào buyer chưa bỏ", "Tick đúng contingency: loan (8A), appraisal (8B), inspection (8C), bảo hiểm (8D), giấy tờ seller (8E), prelim title (8F), giấy HOA (8G), đồ thuê hay đồ còn nợ như solar (8H), và chuyện buyer phải bán nhà mình trước (form COP). K, L là dòng trống cho món khác.", "Ví dụ: deal accepted thứ Hai 02/11/2026, inspection contingency 17 ngày. Ngày 17 là thứ Năm 19/11/2026. Chị Lan (seller) tick ô C (Buyer Investigation)."], ["s04.jpg", "Phần II · Contractual Action", "Việc buyer đã hứa làm (không phải contingency)", "Đây là việc phải làm, không phải lối thoát: wire tiền cọc đầu (M), cọc tăng thêm (N), ký tắt ô liquidated damages (O), thông tin lender (P), FHA/VA (Q), chứng minh tiền (R), đơn vay (S), ký trả disclosures (U, V, W), hợp tác với title về luật GTO (X), giấy chứng minh quyền ký cho trust hay công ty (Z), và giấy tờ COP khi buyer phải bán nhà trước (AA–CC).", "Ví dụ: tiền cọc phải vào escrow trong 2 ngày làm việc sau acceptance (thứ Tư 04/11/2026), escrow vẫn chưa thấy. Seller có thể tick ô M."], ["s05.jpg", "Đoạn cuối", "Đồng hồ chạy: 2 Days sau khi giao", "Buyer có <b>2 Days sau khi nhận NBP</b>, hoặc nhiều hơn nếu ghi số khác (không bao giờ ít hơn 2). Buyer làm bằng cách ký form bỏ contingency (C.A.R. CR hoặc RR) hoặc làm đúng việc ghi trong NBP. Không làm thì seller được quyền hủy. Buyer cũng luôn có ít nhất tới hạn gốc trong hợp đồng, ngày nào trễ hơn thì tính ngày đó.", "Ví dụ: NBP giao thứ Sáu 20/11/2026. Cộng 2 ngày rơi vào Chủ nhật 22/11, nên dời sang thứ Hai 23/11/2026, 11:59 PM."], ["s06.jpg", "Chữ ký", "Seller ký và ghi ngày", "Chỉ seller ký. Đếm ngày từ lúc <b>giao (Delivery)</b>, không phải lúc ký. Ngày 1 là ngày trọn đầu tiên sau khi giao, ngày cuối hết lúc 11:59 PM. Rơi vào thứ Bảy, Chủ nhật hay ngày lễ thì dời sang ngày làm việc kế tiếp.", ""]], "tool_h": "Tính ngày NBP", "tool_s": "Nhập ngày acceptance và buyer đang trễ việc gì. Ra ngày sớm nhất seller được giao NBP, và hạn chót của buyer.", "l_acc": "Ngày acceptance", "l_item": "Buyer đang trễ việc gì?", "l_days": "Số ngày trong hợp đồng", "l_days_s": "(coi đoạn 3 của RPA)", "l_nb": "Số ngày trong NBP", "l_nb_s": "(form ghi 2, không được ít hơn)", "l_dlv": "Ngày giao NBP", "l_dlv_s": "(để trống = giao đúng ngày sớm nhất được phép)", "items": [["insp", "Contingency inspection (8C)"], ["loan", "Contingency loan (8A)"], ["appr", "Contingency appraisal (8B)"], ["ins", "Contingency bảo hiểm (8D)"], ["docs", "Coi giấy tờ seller giao (8E)"], ["dep", "Tiền cọc đầu (3D(1), ngày làm việc)"], ["ver", "Chứng minh tiền / đơn vay (3H)"], ["cus", "Khác (tự gõ số ngày)"]], "r_k": "Buyer phải làm trước", "r_time": "11:59 PM. Quá hạn thì seller được quyền hủy (không bắt buộc hủy).", "r_void": "VÔ HIỆU — gửi sớm quá", "r_void_s": "NBP này vô hiệu cho món này. Giao lại cái mới từ ngày {e} trở đi.", "ok": "Đúng thời điểm", "void": "Sớm quá", "ln_acc": "Acceptance", "ln_spd": "Hạn của buyer trong hợp đồng", "ln_shift": "dời từ {r} ({w})", "ln_e": "Sớm nhất được giao NBP", "ln_d": "Ngày giao NBP", "ln_d_auto": "(giả sử giao ngày sớm nhất)", "ln_fin": "Hạn chót của buyer", "ln_can": "Seller được hủy từ", "note": "Theo RPA, im lặng không phải là bỏ contingency. Buyer chưa ký thì contingency vẫn còn, kể cả qua ngày 17. Seller chỉ có quyền hủy sau khi NBP này hết hạn. Chừng nào seller chưa giao giấy hủy có chữ ký, buyer vẫn có thể ký bỏ contingency và giữ deal.", "prompt": "Chọn ngày acceptance.", "myth_h": "Nhiều người hiểu sai", "myths": [["\"Qua ngày 17 là contingency tự mất.\"", "Sai. Theo RPA hiện hành, buyer giữ contingency tới khi ký bỏ. Seller phải gửi NBP rồi chờ."], ["\"Seller gửi NBP ngay hôm sau acceptance cho chắc.\"", "Không được. Giao sớm hơn 2 Days trước hạn là vô hiệu cho món đó. Phải gửi lại."], ["\"Hết hạn NBP là deal tự hủy.\"", "Không. Seller <b>được quyền</b> hủy, bằng giấy hủy có chữ ký. Buyer ký bỏ contingency trước khi seller hủy thì deal vẫn chạy."], ["\"2 Days là 2 ngày làm việc.\"", "Không. Days là ngày lịch. Chỉ khi ngày cuối rơi vào cuối tuần hay ngày lễ thì mới dời sang ngày làm việc kế."], ["\"NBP với NSP là một.\"", "Không. NBP: seller gửi buyer. NSP: buyer gửi seller. Danh sách khác, lý do khác."]], "next_h": "Bước tiếp theo", "next": [["Coi mọi hạn contingency từ ngày acceptance.", "/t60/", "Tool T60 · Lịch escrow"], ["Tiền cọc của buyer hôm nay có rủi ro không?", "/t08/", "Tool T08 · Tiền cọc"], ["Chiều ngược lại: buyer nhắc seller.", "/t708/", "Tool T708 · NSP"], ["Đọc hợp đồng mua nhà từng bước.", "/t401/", "Tool T401 · RPA"], ["Mọi form, mỗi form một dòng.", "/t402/", "Tool T402 · Thư viện forms"]], "b_email": "Gửi Ken mấy ngày này", "mail_subj": "Ngày NBP - 1234 Example Lane (T703)", "mail_intro": "Chào anh Ken, đây là ngày NBP em tính bằng tool T703:", "mail_end": "Gửi từ tools.kenlamrealty.com/t703. Chỉ để hiểu form, không phải tư vấn luật.", "sms": "Chào anh Ken, em hỏi về NBP (T703):", "ft_dis": "Chỉ để hiểu form. const wknd=d=>{const w=d.getUTCDay();return w===0||w===6;};
const hol=d=>HMAP.get(iso(d));
/* RPA ¶25I(4): hạn rơi T7/CN/Legal Holiday (Civil Code §§7, 7.1) → ngày kế tiếp không phải T7/CN/lễ */
function perf(d){let x=d;while(wknd(x)||hol(x))x=add(x,1);return x;}
/* ¶25J: tiền cọc tính business days */
function addBiz(d,n){let x=d,k=0;while(k<n){x=add(x,1);if(!wknd(x)&&!hol(x))k++;}return x;}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let lang='en';
try{ if(localStorage.getItem('kl_lang')==='vi') lang='vi'; }catch(e){}
const D=()=>I18N[lang];
const fd=d=>{const s=D();const dm=lang==='vi'?pad(d.getUTCDate())+'/'+pad(d.getUTCMonth()+1)+'/'+d.getUTCFullYear():pad(d.getUTCMonth()+1)+'/'+pad(d.getUTCDate())+'/'+d.getUTCFullYear();return s.wd[d.getUTCDay()]+', '+dm;};
const why=d=>{const h=hol(d);if(h)return lang==='vi'?h[1]:h[2];const w=d.getUTCDay();return w===6?D().sat:(w===0?D().sun:'');};
const fmt=(s,o)=>s.replace(/\{(\w+)\}/g,(m,k)=>o[k]!==undefined?o[k]:m);
const clampN=(id,def,min,max)=>{const v=parseInt($(id).value,10);return isFinite(v)?Math.min(max,Math.max(min,v)):def;};
let RESULT='';
function renderStatic(){
  const d=D();
  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.getAttribute('data-i'); if(typeof d[k]==='string') el.innerHTML=d[k];});
  $('whoT').innerHTML=d.who.map(r=>'<tr'+(r[2]?' class="no"':'')+'><th>'+r[0]+'</th><td>'+r[1]+'</td></tr>').join('');
  $('walk').innerHTML=d.walk.map((w,i)=>'<div class="wk"><span class="ref">'+w[1]+'</span><h3>'+w[2]+'</h3><figure><a href="'+w[0]+'" target="_blank" rel="noopener"><img src="'+w[0]+'" alt="'+esc(d.alt+' '+w[1])+'" loading="lazy" width="1000"></a></figure><p>'+w[3]+'</p>'+(w[4]?'<p class="ex">'+w[4]+'</p>':'')+'</div>').join('');
  $('myths').innerHTML=d.myths.map(m=>'<p class="myth"><b>'+m[0]+'</b> '+m[1]+'</p>').join('');
  $('nextL').innerHTML=d.next.map(n=>'<li><span>'+n[0]+(n[1]?'<small><a href="'+n[1]+'">'+n[2]+'</a></small>':'')+'</span></li>').join('');
  $('langBtn').textContent=d.lang; document.documentElement.lang=lang;
  document.title=d.doc_title;
  const a=$('klBack'); if(a) a.textContent=d.back;
}
function setActions(){
  const d=D();
  $('emailBtn').href='mailto:ken@kenlamrealty.com?subject='+encodeURIComponent(d.mail_subj)+'&body='+encodeURIComponent(d.mail_intro+'\n\n'+RESULT+'\n\n'+d.mail_end);
  $('smsBtn').href='sms:4086662825?&body='+encodeURIComponent(d.sms+' '+RESULT.split('\n').slice(0,2).join(' · '));
}

/* ===== Số luật — RPA 12/24 (tra 06/11/2026), sửa ở đây khi C.A.R. đổi form =====
   ¶14E: NBP/NSP "may not be Delivered any earlier than 2 Days prior to the Scheduled Performance Day";
         cho bên kia "at least 2 Days after Delivery (or until the time specified in the applicable paragraph, whichever occurs last)".
   ¶14C(1): seller chỉ được hủy SAU KHI giao NBP.  NBP 6/24: "within 2 (or __ no less than 2) Days after Delivery".
   ¶3L: loan/appraisal/investigation/insurance/seller docs 17 Days (KEN DUYỆT: bản text mất vài số in sẵn, T60 cũng dùng 17).
   ¶3D(1): cọc 2 business days. ¶3H: chứng minh tiền 3 Days. ¶25I: Day 1 = ngày trọn sau sự kiện, hết 11:59 PM, T7/CN/lễ → ngày kế.
   Nguồn: https://media.crmls.org/mediaz/90de9532-e618-4dac-83c6-30ab4c71665d.pdf (RPA 12/24) */
const LAW={NOTICE_MIN:2, EARLY:2, ITEMS:{insp:[17,0],loan:[17,0],appr:[17,0],ins:[17,0],docs:[17,0],dep:[2,1],ver:[3,0],cus:[10,0]}};
function toolLang(){ const d=D(), v=$('item').value||'insp';
  $('item').innerHTML=d.items.map(i=>'<option value="'+i[0]+'">'+i[1]+'</option>').join(''); $('item').value=v; }
$('item').addEventListener('change',()=>{ const it=LAW.ITEMS[$('item').value]; if($('item').value!=='cus') $('days').value=it[0]; calc(); });
['acc','days','nb','dlv'].forEach(id=>$(id).addEventListener('input',calc));
function nbpCalc(A,n,biz,nb,Dv){
  const raw=biz?addBiz(A,n):add(A,n), spd=biz?raw:perf(raw), e=add(spd,-LAW.EARLY);
  const Dd=Dv||e, valid=Dd>=e;
  const dl=perf(add(Dd,Math.max(LAW.NOTICE_MIN,nb))), fin=dl>spd?dl:spd;
  return {raw,spd,e,Dd,valid,fin,can:add(fin,1),auto:!Dv};
}
function calc(){
  const d=D(), A=parse($('acc').value);
  if(!A){ $('rK').textContent=''; $('rBig').textContent=d.prompt; $('rLines').innerHTML=''; $('rBadge').textContent=''; RESULT=''; setActions(); return; }
  const key=$('item').value||'insp', biz=LAW.ITEMS[key][1];
  const n=clampN('days',LAW.ITEMS[key][0],1,90), nb=clampN('nb',2,2,30);
  const r=nbpCalc(A,n,biz,nb,parse($('dlv').value));
  const L=[]; const line=(k,v)=>L.push('<div class="dline"><span class="n">'+k+'</span><span class="a">'+v+'</span></div>');
  line(d.ln_acc,fd(A));
  line(d.ln_spd,fd(r.spd)+(r.raw.getTime()!==r.spd.getTime()?'<br><small class="hint">'+fmt(d.ln_shift,{r:fd(r.raw),w:why(r.raw)})+'</small>':''));
  line(d.ln_e,'<b>'+fd(r.e)+'</b>');
  line(d.ln_d,fd(r.Dd)+(r.auto?'<br><small class="hint">'+d.ln_d_auto+'</small>':''));
  const b=$('rBadge');
  if(!r.valid){
    $('rK').textContent=d.ln_d; $('rBig').innerHTML=d.r_void+'<small>'+fmt(d.r_void_s,{e:fd(r.e)})+'</small>';
    b.className='badge no'; b.textContent=d.void;
    RESULT=d.ln_acc+': '+fd(A)+'\n'+d.ln_spd+': '+fd(r.spd)+'\n'+d.ln_e+': '+fd(r.e)+'\n'+d.ln_d+': '+fd(r.Dd)+' → '+d.void;
  } else {
    line(d.ln_fin,'<b>'+fd(r.fin)+', 11:59 PM</b>'); line(d.ln_can,fd(r.can));
    $('rK').textContent=d.r_k; $('rBig').innerHTML=fd(r.fin)+'<small>'+d.r_time+'</small>';
    b.className='badge ok'; b.textContent=d.ok;
    RESULT=d.ln_acc+': '+fd(A)+'\n'+d.ln_spd+': '+fd(r.spd)+'\n'+d.ln_e+': '+fd(r.e)+'\n'+d.ln_d+': '+fd(r.Dd)+'\n'+d.ln_fin+': '+fd(r.fin)+' 11:59 PM\n'+d.ln_can+': '+fd(r.can);
  }
  $('rLines').innerHTML=L.join(''); setActions();
}

function applyLang(){ renderStatic(); if(typeof toolLang==='function') toolLang(); calc(); }
$('langBtn').onclick=()=>{lang=lang==='vi'?'en':'vi'; try{localStorage.setItem('kl_lang',lang)}catch(e){} applyLang();};
$('videoBtn').onclick=()=>{const b=$('vidBox'); b.hidden=false; b.scrollIntoView({behavior:'smooth',block:'center'}); try{$('vid').play()}catch(e){}};
applyLang();
</script>
