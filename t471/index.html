<script id="kl-commas">
/* Ken Lam Realty: ô nhập tiền / sqft tự thêm dấu phẩy (1,200,000). Code cũ vẫn đọc .value ra số thuần. */
(function(){
  var d=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
  function fmt(v){
    var s=String(v==null?'':v).replace(/[^0-9.\-]/g,''),neg=s.charAt(0)==='-';
    s=s.replace(/-/g,'');
    var i=s.indexOf('.'),ip=i<0?s:s.slice(0,i),dp=i<0?'':s.slice(i).replace(/\./g,'');
    if(i>=0)dp='.'+dp;
    ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return (neg?'-':'')+ip+dp;
  }
  function want(el){
    if(el.type!=='number'||el.__klc)return false;
    var c=el.closest&&el.closest('.ctl');if(!c)return false;
    var pre=c.querySelector('.pre'),post=c.querySelector('.post');
    if(pre&&pre.textContent.indexOf('$')>-1)return true;
    if(post&&/^\s*(sqft|sq ?ft)\s*$/i.test(post.textContent))return true;
    return false;
  }
  function conv(el){
    if(!want(el))return;
    el.__klc=1;
    var cur=d.get.call(el),ph=el.getAttribute('placeholder');
    el.type='text';
    if(!el.getAttribute('inputmode'))el.setAttribute('inputmode','numeric');
    Object.defineProperty(el,'value',{configurable:true,
      get:function(){return d.get.call(this).replace(/,/g,'')},
      set:function(v){d.set.call(this,fmt(v))}});
    d.set.call(el,fmt(cur));
    if(ph&&/^[0-9.]{5,}$/.test(ph))el.setAttribute('placeholder',fmt(ph));
    el.addEventListener('input',function(){
      var raw=d.get.call(el),pos=el.selectionStart,n=0,k;
      for(k=0;k<pos;k++)if(/[0-9.]/.test(raw.charAt(k)))n++;
      var out=fmt(raw);
      if(out===raw)return;
      d.set.call(el,out);
      for(k=0,pos=0;k<out.length&&n>0;k++){pos=k+1;if(/[0-9.]/.test(out.charAt(k)))n--;}
      try{el.setSelectionRange(pos,pos)}catch(e){}
    });
  }
  function scan(r){
    if(r.nodeType!==1)return;
    if(r.tagName==='INPUT')conv(r);
    var l=r.querySelectorAll?r.querySelectorAll('input[type=number]'):[];
    for(var i=0;i<l.length;i++)conv(l[i]);
  }
  new MutationObserver(function(m){
    for(var i=0;i<m.length;i++)for(var j=0;j<m[i].addedNodes.length;j++)scan(m[i].addedNodes[j]);
  }).observe(document.documentElement,{childList:true,subtree:true});
  document.addEventListener('DOMContentLoaded',function(){scan(document.body)});
})();
</script>

<script>
/* ===== Rules — edit here (checked 06/11/2026) =====
   NCOU ¶1: Purchase Price goes UP by the Options and Upgrades Price. Lender decides how much it finances; the rest is cash at COE.
   NCOU ¶2: Option Payment deposited (good funds) with the deposit holder named in NCPA ¶4D(1) when Buyer signs the addendum.
   NCOU ¶3A (only if Buyer AND Seller initial): liquidated damages = lesser of (3% of TOTAL purchase price, initial deposit)
        + Option Payment for options installed, or ordered and not returnable, as of termination. (C.A.R. Form NCOU, Reviewed 6/25)
   NCOU ¶3C: Seller's Notice and Demand served like small claims (CCP §116.340); Buyer has 20 days to object to escrow.
   Civil Code §1675(c)/(d): residential property (1–4 units, buyer intends to live there). Paid ≤3% of price → valid unless buyer
        proves unreasonable; >3% → invalid unless seller proves reasonable.
        https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=1675
   §1675(f): first sale of a new attached condo in a structure of 10+ units — seller keeping >3% must account within 60 days and
        refund anything over the greater of 3% or actual losses within 90 days after all units close.
   Loan math here is a simple estimate: loan = LTV × lower of (price, lender's value). Not a loan quote. */

 en:{title:'New-home options & upgrades: the NCOU addendum',
  sub:'Picked a better kitchen, flooring or a solar package from the builder? This addendum lists them, adds their cost to your price, and takes an Option Payment that you can lose if you back out. See what you pay and what you risk.',
  secs:[
   {id:'0',n:'Top',t:'What it attaches to',b:['It is an addendum to the New Construction Purchase Agreement (NCPA), a counter offer, or another named document. The NCPA’s definitions apply here too.','It lists the contract date, the property, the buyer and the seller.'],ex:'Buyer B and Builder Y, NCPA dated 11/03/2026, 1234 Example Lane, San Jose, CA 95100.'},
   {id:'1',n:'Para. 1',t:'Options and upgrades raise the price',b:['The seller installs the options listed at the end, each at the price written next to it. Together that is the “Options and Upgrades Price,” and the Purchase Price goes up by that amount.','If you are getting a loan, the lender decides how much of the price it will finance. Whatever it won’t finance, you pay in cash at close of escrow.'],ex:'Base price $1,250,000 + $48,000 in upgrades = $1,298,000. If the lender only uses a $1,280,000 value, you cover the gap in cash.'},
   {id:'2',n:'Para. 2',t:'Option Payment',b:['When you sign this addendum, you deposit the Option Payment in good funds with the same person who holds your deposit under paragraph 4D(1) of the NCPA.','The Option Payment raises how much the seller may keep as liquidated damages if you default.'],ex:'You sign and wire a $15,000 Option Payment to escrow the same day.'},
   {id:'3',n:'Para. 3',t:'Liquidated damages (only if both initial)',b:['If you fail to buy because of your own default, the seller can pursue any legal remedy. But if both of you initial this box, the seller instead keeps a set amount: <b>the lesser of 3% of the total purchase price or your initial deposit, plus the Option Payment</b> for options already installed, or ordered and not returnable to the vendor. That is the seller’s only remedy.','How it is paid: the seller sends a written Notice and Demand, served the way small-claims papers are (CCP §116.340), to escrow and to you. You have 20 days from receiving it to object in writing to escrow. No objection in 20 days: escrow pays the seller, and the seller no longer has to sell to you. If you object: the dispute is decided under paragraphs 43 and 44 of the NCPA. If it goes to arbitration, the seller pays the fee to start it; the arbitrator decides who finally pays the cost.','The seller protects escrow from your claims over these payouts. Once the money is paid to the seller, the seller cannot later argue the amount was too low or the clause invalid.','Note 1: Civil Code §1675(d): if the amount actually paid is more than 3% of the price, the clause is invalid unless the side defending it proves it is reasonable. Note 2: for an attached condo in a building of 10 or more condos, keeping more than 3% is subject to §1675(f).'],ex:'Total $1,298,000 × 3% = $38,940. Initial deposit $25,000 is lower, so $25,000 + $15,000 Option Payment (cabinets already ordered) = $40,000 at risk.'},
   {id:'4',n:'Para. 4',t:'Exhibits are part of it',b:['Any exhibits attached and referred to are part of this addendum, as if written into it.'],ex:'The design-center selection sheet with your cabinet color is attached as an exhibit.'},
   {id:'5',n:'Para. 5',t:'If they conflict, this addendum wins',b:['If the NCPA and this addendum say different things, the addendum controls.']},

  secs:[
   {id:'0',n:'Đầu form',t:'Gắn vào giấy nào',b:['Đây là addendum của hợp đồng mua nhà mới xây (NCPA), của counter offer, hoặc giấy khác ghi tên. Định nghĩa trong NCPA dùng luôn ở đây.','Ghi ngày hợp đồng, căn nhà, người mua, người bán.'],ex:'Người mua B và Builder Y, NCPA ngày 03/11/2026, 1234 Example Lane, San Jose, CA 95100.'},
   {id:'1',n:'Đoạn 1',t:'Option và upgrade làm giá nhà tăng',b:['Người bán gắn các món liệt kê ở cuối form, mỗi món theo giá ghi bên cạnh. Cộng lại gọi là “Options and Upgrades Price”, và giá mua (Purchase Price) tăng đúng bằng số đó.','Nếu bạn vay, lender quyết định cho vay bao nhiêu trên giá đó. Phần nào lender không cho vay thì bạn trả tiền mặt lúc close escrow.'],ex:'Giá gốc $1,250,000 + $48,000 upgrade = $1,298,000. Nếu lender chỉ tính giá trị $1,280,000, phần chênh bạn bù tiền mặt.'},
   {id:'2',n:'Đoạn 2',t:'Option Payment',b:['Lúc ký addendum này, bạn nộp Option Payment bằng tiền chắc chắn (good funds) cho đúng người đang giữ tiền cọc theo đoạn 4D(1) của NCPA.','Option Payment làm tăng số tiền người bán được giữ làm liquidated damages (tiền bồi thường định trước) nếu bạn vi phạm hợp đồng.'],ex:'Bạn ký và wire $15,000 Option Payment vô escrow trong ngày.'},
   {id:'3',n:'Đoạn 3',t:'Liquidated damages (chỉ khi hai bên ký tắt)',b:['Nếu bạn không mua vì lỗi của mình, người bán được kiện đòi theo luật. Nhưng nếu hai bên cùng ký tắt ô này, người bán chỉ được giữ một số tiền định sẵn: <b>số nhỏ hơn giữa 3% tổng giá mua và tiền cọc ban đầu, cộng Option Payment</b> của những món đã gắn, hoặc đã đặt mà không trả lại hãng được. Đó là cách đòi duy nhất của người bán.','Cách lấy tiền: người bán gửi giấy Notice and Demand, giao theo cách giao giấy kiện small claims (CCP §116.340), cho escrow và cho bạn. Bạn có 20 ngày từ lúc nhận để phản đối bằng giấy với escrow. Không phản đối trong 20 ngày: escrow trả tiền cho người bán, và người bán hết nghĩa vụ bán cho bạn. Có phản đối: tranh chấp giải quyết theo đoạn 43 và 44 của NCPA. Nếu đưa ra trọng tài (arbitration), người bán trả phí mở hồ sơ; trọng tài quyết định cuối cùng ai chịu chi phí.','Người bán bảo vệ escrow trước khiếu nại của bạn về các khoản chi này. Tiền đã trả cho người bán rồi thì người bán không được kiện lại rằng số tiền thấp quá hay điều khoản không hợp lệ.','Ghi chú 1: Civil Code §1675(d): nếu số tiền thật sự trả hơn 3% giá mua, điều khoản không hợp lệ, trừ khi bên muốn giữ điều khoản chứng minh số đó hợp lý. Ghi chú 2: condo dính vách trong tòa nhà 10 căn trở lên thì giữ quá 3% phải theo §1675(f).'],ex:'Tổng $1,298,000 × 3% = $38,940. Cọc ban đầu $25,000 nhỏ hơn, nên $25,000 + $15,000 Option Payment (tủ bếp đã đặt) = $40,000 có thể mất.'},

function model(i){
  const up=i.ups.reduce((s,u)=>s+(+u.a||0),0), total=i.base+up;
  const pct3=RULES.LD_PCT*total, ld1=Math.min(pct3,i.dep), ld2=i.inst?i.opay:0, ld=ld1+ld2;
  const v=i.appr>0?Math.min(total,i.appr):total, loan=i.ltv/100*v, gap=i.appr>0?Math.max(0,total-i.appr):0;
  const cash=Math.max(0,total-loan-i.dep-i.opay);
  return {up,total,pct3,ld1,ld2,ld,pct:total?ld/total*100:0,loan,v,gap,cash};
}
function upName(u,d){ return u.k?d.UPN[u.k]:(u.name||''); }
function calc(){
  const d=D();

  const i={base:num('base'),ups,dep:num('dep'),opay:num('opay'),inst,appr:num('appr'),ltv:Math.min(100,num('ltv'))};
  const m=model(i);

  $('oLD').textContent=fmt(m.ld); $('oLDp').textContent=fill(d.pct,{p:m.pct.toFixed(2)});
  $('oCash').textContent=fmt(m.cash);
  $('oLD1').textContent=fmt(m.ld1); $('oLD1s').textContent=fill(d.ld1s,{a:fmt(m.pct3),b:fmt(i.dep)});
  $('oLD2').textContent=fmt(m.ld2); $('oLD2s').textContent=inst?d.ld2s1:d.ld2s0;
  $('oLoan').textContent=fmt(m.loan); $('oLoans').textContent=fill(d.loans,{l:i.ltv,v:fmt(m.v)});
  $('oGap').textContent=fmt(m.gap); $('lnGap').className='line'+(m.gap>0?' warn':'');
  const over=m.ld>RULES.LD_PCT*m.total+0.005;
  $('note3').textContent=(over?d.w_over:d.w_ok)+d.w_condo;
  $('note3').style.borderLeft=over?'3px solid var(--warn)':'';
  last={base:fmt(i.base),up:fmt(m.up),total:fmt(m.total),dep:fmt(i.dep),opay:fmt(i.opay),inst:inst?d.i_yes:d.i_no,ld:fmt(m.ld),pct:fill(d.pct,{p:m.pct.toFixed(2)}),
    appr:fmt(i.appr),ltv:i.ltv,loan:fmt(m.loan),gap:fmt(m.gap),cash:fmt(m.cash),
    ups:ups.filter(u=>u.a>0).map(u=>'- '+(upName(u,d)||'—')+': '+fmt(u.a)).join('\n')||'—'};
}
