<script>
const FORM = {"code": "T513", "form": "Earthquake Risk Disclosure", "rev": "Residential Earthquake Risk Disclosure Statement (2020 Edition)", "title": {"vi": "Bản khai rủi ro động đất của nhà ở", "en": "Residential Earthquake Risk Disclosure Statement"}, "one": {"vi": "Đây là trang 13 của cuốn Homeowner’s Guide to Earthquake Safety: 9 câu Có/Không về chỗ yếu của nhà khi động đất (bình nước nóng, bulông móng, tường crawl space…). Nhà khung gỗ 1–4 căn xây trước 1960 thì seller bắt buộc điền và đưa kèm cuốn sách.", "en": "This is page 13 of the Homeowner’s Guide to Earthquake Safety: 9 yes/no questions about the home's earthquake weak spots (water heater, foundation bolts, crawl space walls…). For 1–4 unit wood-frame homes built before 1960, the seller must fill it out and hand over the booklet."}, "eli10": {"vi": "<b>Nói cho dễ hiểu:</b> căn nhà giống cái bàn đặt trên sàn. Không bắt vít xuống thì động đất lắc, bàn trượt khỏi chỗ. Form này hỏi seller: nhà đã “bắt vít” vào móng chưa, chân nhà có gia cố chưa, bình nước nóng có buộc chưa. Câu nào “Không” là chỗ yếu.", "en": "<b>In plain words:</b> a house is like a table sitting on the floor. If it isn't bolted down, an earthquake slides it off. This form asks the seller: is the house bolted to the foundation, are the short walls underneath braced, is the water heater strapped? Every “No” is a weak spot."}, "facts": [{"vi": "Seller trả lời và ký. Buyer ký đã nhận cả cuốn sách và bản khai.", "en": "Seller answers and signs. Buyer signs for the booklet and the statement."}, {"vi": "Trước khi sang tên, thường trong bộ disclosure.", "en": "Before transfer of title, usually in the disclosure package."}, {"vi": "1 trang + 1 trang phụ (addendum)", "en": "1 page + 1 addendum page"}, {"vi": "Gov Code §8897–8897.5 · Civ §2079.8", "en": "Gov Code §8897–8897.5 · Civ §2079.8"}], "steps": [{"title": {"vi": "Đầu trang: căn nào, xây năm nào", "en": "Top: which home, what year built"}, "short": {"vi": "Năm xây", "en": "Year built"}, "ref": "Trang 1 · đầu trang", "crop": "s01.jpg", "pins": [{"t": {"vi": "Bản 2020", "en": "2020 edition"}, "d": {"vi": "Form nằm ở trang 13 cuốn sách của Seismic Safety Commission. Dùng bản mới nhất.", "en": "This is page 13 of the Seismic Safety Commission booklet. Use the current edition."}, "x": 8.83, "y": 43.93}, {"box": [19.7, 71.56, 13.83, 10.47], "t": {"vi": "Địa chỉ, APN", "en": "Address, APN"}, "d": {"vi": "Địa chỉ, city, county, zip và số APN (số thửa đất trên giấy thuế).", "en": "Address, city, county, zip and the APN (parcel number on the tax bill)."}, "x": 18.72, "y": 76.8}, {"box": [68.09, 72.72, 6.92, 10.55], "t": {"vi": "Năm xây: quyết định có bắt buộc không", "en": "Year built decides if it's required"}, "d": {"vi": "Nhà khung gỗ xây <b>trước 1/1/1960</b> là bắt buộc. Tool bên dưới kiểm giùm.", "en": "Wood-frame homes built <b>before 1/1/1960</b> must use it. The tool below checks."}, "x": 67.1, "y": 78.0}], "example": {"vi": "1234 Example Lane, San Jose, Santa Clara County, xây năm 1952, nhà gỗ một tầng có crawl space. Bắt buộc phải có form này.", "en": "1234 Example Lane, San Jose, Santa Clara County, built 1952, one-story wood frame with a crawl space. This form is required."}, "page": "p01.jpg"}, {"title": {"vi": "Cách trả lời: Có, Không, Không biết, Không áp dụng", "en": "How to answer: Yes, No, Don't Know, Doesn't Apply"}, "short": {"vi": "Cách trả lời", "en": "Answers"}, "ref": "Trang 1 · hướng dẫn", "crop": "s02.jpg", "pins": [{"box": [15.48, 16.3, 13.8, 14.2], "t": {"vi": "“No” = rủi ro cao", "en": "“No” = elevated risk"}, "d": {"vi": "Câu nào trả lời “No” thì nhà <b>có thể</b> có rủi ro động đất phải khai.", "en": "Any “No” means the home <b>likely</b> has a disclosable earthquake risk."}, "x": 14.5, "y": 23.41}, {"t": {"vi": "“Don't Know” là được", "en": "“Don't Know” is allowed"}, "d": {"vi": "Seller không biết thật thì ghi “Don't Know”. Đừng đoán “Yes”. Buyer nên cho người coi thêm.", "en": "If the seller truly doesn't know, “Don't Know”. Don't guess “Yes”. The buyer should get it checked."}, "x": 10.0, "y": 31.17}, {"t": {"vi": "Đã sửa thì ghi ra", "en": "Describe fixes"}, "d": {"vi": "Đã gia cố thì ghi chi tiết ở trang phụ (trang 2): ai làm, năm nào, có permit không.", "en": "If work was done, describe it on the addendum (page 2): who, when, permit or not."}, "x": 60.18, "y": 38.93}], "page": "p01.jpg"}, {"title": {"vi": "Câu 1–2: Bình nước nóng và bulông móng", "en": "Q1–2: Water heater and foundation bolts"}, "short": {"vi": "Câu 1–2", "en": "Q1–2"}, "ref": "Trang 1 · câu 1–2", "crop": "s03.jpg", "pins": [{"t": {"vi": "1 · Bình nước nóng có buộc?", "en": "1 · Water heater braced?"}, "d": {"vi": "Bình ngã là đứt ống gas, nguyên nhân cháy nhà sau động đất. Sửa rẻ nhất, nhanh nhất. Xem T507.", "en": "A fallen heater breaks the gas line and causes post-quake fires. The cheapest fix. See T507."}, "x": 9.24, "y": 27.12}, {"box": [10.21, 37.69, 15.24, 24.62], "t": {"vi": "2 · Nhà có bắt bulông vào móng?", "en": "2 · Bolted to the foundation?"}, "d": {"vi": "Nhà cũ thường chỉ “đặt” lên móng. Động đất làm nhà trượt khỏi móng. Nhìn dưới crawl space thấy đầu bulông trên đà gỗ (sill plate) là có.", "en": "Older homes often just sit on the foundation and can slide off. Look in the crawl space for bolt heads in the sill plate."}, "x": 9.23, "y": 50.0}], "page": "p01.jpg"}, {"title": {"vi": "Câu 3–4: Crawl space, trụ, móng gạch", "en": "Q3–4: Crawl space, piers, masonry foundation"}, "short": {"vi": "Câu 3–4", "en": "Q3–4"}, "ref": "Trang 1 · câu 3–4", "crop": "s04.jpg", "pins": [{"box": [11.77, 21.49, 16.11, 14.04], "t": {"vi": "3a · Tường cripple có gia cố?", "en": "3a · Cripple walls braced?"}, "d": {"vi": "Cripple wall là bức tường gỗ thấp giữa móng và sàn nhà. Không đóng plywood thì động đất làm nó sụp như domino.", "en": "Cripple walls are short wood walls between the foundation and the floor. Without plywood they fold like dominoes."}, "x": 10.78, "y": 28.51}, {"t": {"vi": "3b · Trụ bê tông rời", "en": "3b · Loose piers and posts"}, "d": {"vi": "Nhà đứng trên các trụ bê tông rời, không nối nhau: rủi ro rất cao, cần kỹ sư.", "en": "A home on separate, unconnected piers and posts is very high risk. Get an engineer."}, "x": 35.45, "y": 41.56}, {"t": {"vi": "4 · Móng gạch không cốt thép", "en": "4 · Unreinforced masonry foundation"}, "d": {"vi": "Móng xây gạch hay đá không có sắt bên trong. Gặp ở nhà rất cũ.", "en": "Brick or stone with no steel inside. Found in very old homes."}, "x": 9.23, "y": 63.05}], "page": "p01.jpg"}, {"title": {"vi": "Câu 5–7: Đồi dốc, tường gạch, phòng trên garage", "en": "Q5–7: Hillside, masonry walls, room over garage"}, "short": {"vi": "Câu 5–7", "en": "Q5–7"}, "ref": "Trang 1 · câu 5–7", "crop": "s05.jpg", "pins": [{"t": {"vi": "5a · Tường móng cao trên dốc", "en": "5a · Tall hillside walls"}, "d": {"vi": "Nhà trên dốc có tường móng cao một bên. Cần giằng như cripple wall nhưng khó hơn, gần như luôn cần kỹ sư.", "en": "Hillside homes have tall foundation walls on one side. They need bracing, almost always engineered."}, "x": 12.42, "y": 26.29}, {"t": {"vi": "5b · Cột cao chống nhà", "en": "5b · Tall posts"}, "d": {"vi": "Sàn nhà hoặc deck đứng trên cột cao: hỏi đã gia cố chưa.", "en": "Floors or decks on tall posts: ask whether they were strengthened."}, "x": 10.78, "y": 38.32}, {"t": {"vi": "6 · Tường gạch không cốt thép", "en": "6 · Unreinforced masonry walls"}, "d": {"vi": "Tường gạch không sắt là loại dễ sập nhất. Ở San Jose nhà ở loại này ít, nhưng có.", "en": "Unreinforced brick walls collapse most easily. Rare in San Jose homes, but they exist."}, "x": 9.23, "y": 58.14}, {"box": [10.21, 71.48, 21.03, 12.95], "t": {"vi": "7 · Phòng trên garage", "en": "7 · Room over the garage"}, "d": {"vi": "Cửa garage làm bức tường gần như trống. Có phòng ở trên là điểm yếu. Gia cố bằng khung thép hoặc tấm plywood hai bên cửa.", "en": "A garage door leaves that wall nearly empty. With a room above, it's a weak point. Fixed with a steel frame or plywood beside the door."}, "x": 9.23, "y": 77.96}], "page": "p01.jpg"}, {"title": {"vi": "Câu 8–9: Vùng đứt gãy và vùng hóa lỏng", "en": "Q8–9: Fault zone and seismic hazard zone"}, "short": {"vi": "Câu 8–9", "en": "Q8–9"}, "ref": "Trang 1 · câu 8–9", "crop": "s06.jpg", "pins": [{"box": [27.29, 13.87, 9.46, 23.07], "t": {"vi": "8 · Ngoài vùng đứt gãy?", "en": "8 · Outside a fault zone?"}, "d": {"vi": "Vùng Alquist-Priolo là sát đường đứt gãy đang hoạt động.", "en": "An Alquist-Priolo zone hugs a known active fault."}, "x": 26.31, "y": 25.41}, {"t": {"vi": "9 · Ngoài vùng hóa lỏng, sạt lở?", "en": "9 · Outside liquefaction/landslide zones?"}, "d": {"vi": "Đất cát gần nước có thể “hóa lỏng” khi lắc. Một phần San Jose gần vịnh nằm trong vùng này.", "en": "Sandy, wet soil can liquefy when shaken. Parts of San Jose near the Bay are mapped this way."}, "x": 9.23, "y": 60.72}, {"t": {"vi": "Trả lời bằng NHD", "en": "Answered by the NHD"}, "d": {"vi": "Hai câu này lấy từ báo cáo NHD (Natural Hazard Disclosure), không cần seller đoán.", "en": "These two come from the Natural Hazard Disclosure report; no guessing."}, "x": 77.5, "y": 25.41}], "page": "p01.jpg"}, {"title": {"vi": "Chữ ký seller và buyer", "en": "Seller and buyer signatures"}, "short": {"vi": "Ký", "en": "Sign"}, "ref": "Trang 1 · cuối trang", "crop": "s07.jpg", "pins": [{"t": {"vi": "Seller khai theo hiểu biết", "en": "To the seller's knowledge"}, "d": {"vi": "Seller khai điều mình <b>biết thật</b>. Không bắt seller phải đi kiểm hay phải sửa.", "en": "The seller discloses what they <b>actually know</b>. No duty to inspect or retrofit."}, "x": 9.15, "y": 10.26}, {"box": [10.13, 43.81, 14.89, 9.32], "t": {"vi": "Buyer nhận sách + bản khai", "en": "Buyer gets booklet + statement"}, "d": {"vi": "Buyer ký là đã nhận <b>cả cuốn sách</b> và bản khai. “No” hay “Don't Know” là có thể có rủi ro.", "en": "The buyer confirms receiving <b>the booklet</b> and the statement. “No” or “Don't Know” may mean risk."}, "x": 9.15, "y": 48.47}, {"t": {"vi": "Thêm vào TDS, không thay", "en": "In addition to the TDS"}, "d": {"vi": "Bản này đi thêm, không thay TDS.", "en": "This is on top of the TDS, not instead of it."}, "x": 9.15, "y": 84.13}], "warn": {"vi": "Chuyển nhượng không bị hủy nếu seller quên form này (Gov §8897.4). Nhưng seller vẫn có thể bị kiện vì không khai.", "en": "A sale isn't voided if the seller skips this form (Gov §8897.4). But the seller can still be liable for nondisclosure."}, "page": "p01.jpg"}, {"title": {"vi": "Trang 2: Đã sửa gì, khai thêm gì", "en": "Page 2: Work done, anything else"}, "short": {"vi": "Trang phụ", "en": "Addendum"}, "ref": "Trang 2 · addendum", "crop": "s08.jpg", "pins": [{"box": [5.39, 21.87, 14.35, 4.39], "t": {"vi": "Đã gia cố gì", "en": "Retrofit work done"}, "d": {"vi": "Ghi rõ: bulông móng năm nào, plywood cripple wall, ai làm, có permit, có hình không.", "en": "Spell it out: bolting year, cripple wall plywood, who did it, permit, photos."}, "x": 4.41, "y": 24.06}, {"t": {"vi": "Khai thêm", "en": "Anything else"}, "d": {"vi": "Nứt móng, sàn nghiêng, hư hại từ trận động đất cũ: ghi vào đây.", "en": "Foundation cracks, sloping floors, damage from past quakes: write it here."}, "x": 4.41, "y": 76.07}], "example": {"vi": "Bà Hoa ghi: “2019 làm bulông móng và plywood cripple wall qua chương trình Earthquake Brace + Bolt, permit số …, có hình.” Câu này giúp buyer yên tâm, bán dễ hơn.", "en": "Mrs. Hoa writes: “2019 foundation bolting and cripple wall plywood through Earthquake Brace + Bolt, permit #…, photos attached.” This reassures buyers."}, "page": "p02.jpg"}], "tool": {"intro": {"vi": "Bước 1: tool cho biết <b>form này có bắt buộc</b> với căn nhà không. Bước 2: chọn câu trả lời như trên form, tool liệt kê <b>chỗ yếu và nên làm gì</b>.", "en": "Step 1: the tool tells you <b>whether this form is required</b>. Step 2: answer like the form, and it lists <b>weak spots and what to do</b>."}, "inputs": [{"id": "year", "type": "number", "def": 1952, "min": 1850, "max": 2030, "label": {"vi": "Năm xây", "en": "Year built"}}, {"id": "type", "type": "select", "def": "wood", "label": {"vi": "Loại nhà", "en": "Construction"}, "options": [{"v": "wood", "l": {"vi": "Khung gỗ, 1–4 căn", "en": "Wood frame, 1–4 units"}}, {"v": "urm", "l": {"vi": "Tường gạch không cốt thép (URM)", "en": "Unreinforced masonry (URM)"}}, {"v": "mobile", "l": {"vi": "Mobile / manufactured home", "en": "Mobile / manufactured home"}}, {"v": "big", "l": {"vi": "5 căn trở lên / bê tông", "en": "5+ units / concrete"}}]}, {"id": "q1", "type": "select", "def": "no", "label": {"vi": "1 · Bình nước nóng đã buộc?", "en": "1 · Water heater braced?"}, "options": [{"v": "yes", "l": {"vi": "Có (Yes)", "en": "Yes"}}, {"v": "no", "l": {"vi": "Không (No)", "en": "No"}}, {"v": "dk", "l": {"vi": "Không biết", "en": "Don't know"}}, {"v": "na", "l": {"vi": "Không áp dụng", "en": "Doesn't apply"}}]}, {"id": "q2", "type": "select", "def": "dk", "label": {"vi": "2 · Nhà bắt bulông vào móng?", "en": "2 · Bolted to foundation?"}, "options": [{"v": "yes", "l": {"vi": "Có (Yes)", "en": "Yes"}}, {"v": "no", "l": {"vi": "Không (No)", "en": "No"}}, {"v": "dk", "l": {"vi": "Không biết", "en": "Don't know"}}, {"v": "na", "l": {"vi": "Không áp dụng", "en": "Doesn't apply"}}]}, {"id": "q3a", "type": "select", "def": "no", "label": {"vi": "3a · Tường cripple đã giằng?", "en": "3a · Cripple walls braced?"}, "options": [{"v": "yes", "l": {"vi": "Có (Yes)", "en": "Yes"}}, {"v": "no", "l": {"vi": "Không (No)", "en": "No"}}, {"v": "dk", "l": {"vi": "Không biết", "en": "Don't know"}}, {"v": "na", "l": {"vi": "Không áp dụng", "en": "Doesn't apply"}}]}, {"id": "q3b", "type": "select", "def": "na", "label": {"vi": "3b · Trụ rời đã gia cố?", "en": "3b · Piers/posts strengthened?"}, "options": [{"v": "yes", "l": {"vi": "Có (Yes)", "en": "Yes"}}, {"v": "no", "l": {"vi": "Không (No)", "en": "No"}}, {"v": "dk", "l": {"vi": "Không biết", "en": "Don't know"}}, {"v": "na", "l": {"vi": "Không áp dụng", "en": "Doesn't apply"}}]}, {"id": "q4", "type": "select", "def": "na", "label": {"vi": "4 · Móng gạch đã gia cố?", "en": "4 · Masonry foundation strengthened?"}, "options": [{"v": "yes", "l": {"vi": "Có (Yes)", "en": "Yes"}}, {"v": "no", "l": {"vi": "Không (No)", "en": "No"}}, {"v": "dk", "l": {"vi": "Không biết", "en": "Don't know"}}, {"v": "na", "l": {"vi": "Không áp dụng", "en": "Doesn't apply"}}]}, {"id": "q5", "type": "select", "def": "na", "label": {"vi": "5 · Tường/cột cao trên dốc đã giằng?", "en": "5 · Hillside walls/posts braced?"}, "options": [{"v": "yes", "l": {"vi": "Có (Yes)", "en": "Yes"}}, {"v": "no", "l": {"vi": "Không (No)", "en": "No"}}, {"v": "dk", "l": {"vi": "Không biết", "en": "Don't know"}}, {"v": "na", "l": {"vi": "Không áp dụng", "en": "Doesn't apply"}}]}, {"id": "q6", "type": "select", "def": "na", "label": {"vi": "6 · Tường gạch đã gia cố?", "en": "6 · Masonry walls strengthened?"}, "options": [{"v": "yes", "l": {"vi": "Có (Yes)", "en": "Yes"}}, {"v": "no", "l": {"vi": "Không (No)", "en": "No"}}, {"v": "dk", "l": {"vi": "Không biết", "en": "Don't know"}}, {"v": "na", "l": {"vi": "Không áp dụng", "en": "Doesn't apply"}}]}, {"id": "q7", "type": "select", "def": "yes", "label": {"vi": "7 · Tường cửa garage (có phòng trên) đã gia cố?", "en": "7 · Garage door wall (room above) strengthened?"}, "options": [{"v": "yes", "l": {"vi": "Có (Yes)", "en": "Yes"}}, {"v": "no", "l": {"vi": "Không (No)", "en": "No"}}, {"v": "dk", "l": {"vi": "Không biết", "en": "Don't know"}}, {"v": "na", "l": {"vi": "Không áp dụng", "en": "Doesn't apply"}}]}]}, "myths": [{"t": {"vi": "“Seller ghi No là phải sửa.”", "en": "“A ‘No’ means the seller must fix it.”"}, "d": {"vi": "Luật chỉ bắt khai, không bắt retrofit. Sửa hay giảm giá là chuyện thương lượng.", "en": "The law requires disclosure, not retrofitting. Fixing or crediting is negotiable."}}, {"t": {"vi": "“Nhà xây sau 1960 thì an toàn.”", "en": "“Built after 1960 means it's safe.”"}, "d": {"vi": "1960 chỉ là mốc bắt buộc form. Nhà 1960–1980 vẫn hay thiếu bulông và plywood cripple wall.", "en": "1960 is only the form's cutoff. Many 1960–1980 homes still lack bolts and cripple wall plywood."}}, {"t": {"vi": "“Ghi Yes cho chắc, buyer khỏi hỏi.”", "en": "“Just answer Yes so buyers don't ask.”"}, "d": {"vi": "Ghi Yes mà không đúng là khai sai, dễ bị kiện. Không chắc thì ghi “Don't Know”.", "en": "A false Yes is misrepresentation. If unsure, answer “Don't Know”."}}], "next": [{"href": "/t514/", "t": {"vi": "T514 · Trang ký nhận Homeowner’s Guide", "en": "T514 · Homeowner’s Guide signature page"}, "d": {"vi": "Buyer cần nhận những cuốn sách nào.", "en": "Which booklets the buyer should receive."}}, {"href": "/t507/", "t": {"vi": "T507 · WHS: dây buộc bình nước nóng", "en": "T507 · WHS: water heater strapping"}, "d": {"vi": "Câu 1 của form: kiểm dây bình nóng.", "en": "Question 1: check the straps."}}, {"href": "/t500/", "t": {"vi": "T500 · TDS: bản khai tình trạng nhà", "en": "T500 · TDS: seller's condition disclosure"}, "d": {"vi": "Form này đi thêm TDS.", "en": "This form goes with the TDS."}}, {"href": "/t28/", "t": {"vi": "T28 · Disclosures người bán là gì", "en": "T28 · Seller disclosures explained"}, "d": {"vi": "Trọn bộ giấy theo năm xây.", "en": "The full package by year built."}}], "sources": [{"t": "Gov Code §8897.1", "u": "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=GOV&sectionNum=8897.1"}, {"t": "Gov Code §8897.2", "u": "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=GOV&sectionNum=8897.2"}, {"t": "Gov Code §8875.6", "u": "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=GOV&sectionNum=8875.6"}, {"t": "Seismic Safety Commission: Homeowner’s Guide", "u": "https://ssc.ca.gov/"}, {"t": "Earthquake Brace + Bolt", "u": "https://www.earthquakebracebolt.com/"}]};
FORM.tool.compute=(function (v, H) {
      const vi = H.lang() === 'vi';
      const y = v.year;
      let req, sub;
      if (v.type === 'wood' && y != null && y < 1960) { req = vi ? "Bắt buộc" : "Required"; sub = vi ? "Nhà khung gỗ 1–4 căn xây " + y + " (trước 1960): seller phải đưa Homeowner’s Guide và điền form này (Gov §8897.1)." : "Wood-frame 1–4 units built " + y + " (before 1960): the seller must give the Homeowner’s Guide and complete this form (Gov §8897.1)."; }
      else if (v.type === 'wood') { req = vi ? "Không bắt buộc" : "Not required"; sub = vi ? "Nhà xây " + (y == null ? "?" : y) + ", từ 1960 trở đi. Vẫn nên đưa cuốn sách; agent thường đưa cho mọi nhà." : "Built " + (y == null ? "?" : y) + ", 1960 or later. Giving the booklet is still smart; agents usually give it on every sale."; }
      else if (v.type === 'urm') { req = vi ? "Có thể phải dùng giấy khác" : "Other rules may apply"; sub = vi ? "Form này cho nhà khung gỗ. Nhà gạch (sàn/mái gỗ) xây trước 1975: luật bắt đưa Commercial Property Owner’s Guide (Gov §8875.6, §8893.2), vốn viết cho building thương mại. Hỏi agent. <span class=\"tag\">Ước tính</span>" : "This form is for wood frame. Masonry with wood floors/roof built before 1975: the law calls for the Commercial Property Owner’s Guide (Gov §8875.6, §8893.2), written for commercial buildings. Ask your agent. <span class=\"tag\">Estimate</span>"; }
      else if (v.type === 'mobile') { req = vi ? (y != null && y < 1960 ? "Hỏi agent" : "Thường không bắt") : (y != null && y < 1960 ? "Ask your agent" : "Usually not required"); sub = vi ? "§8897 nói nhà khung gỗ thường. Hợp đồng C.A.R. vẫn nhắc cả mobile home xây trước 1960. Hỏi thêm hệ thống chống động đất (ERBS) đã gắn chưa. <span class=\"tag\">Ước tính</span>" : "§8897 covers conventional light-frame homes; C.A.R. contracts also mention mobile homes built before 1960. Ask whether an earthquake-resistant bracing system (ERBS) is installed. <span class=\"tag\">Estimate</span>"; }
      else { req = vi ? "Không thuộc form này" : "Not this form"; sub = vi ? "Form này cho nhà 1–4 căn khung gỗ. Building lớn hay bê tông theo luật khác." : "This form is for 1–4 unit wood-frame homes. Larger or concrete buildings follow other rules."; }
      const fix = {
        q1: [vi ? "1 · Bình nước nóng chưa buộc" : "1 · Water heater not braced", vi ? "Gắn 2 dây thép trên + dưới. Rẻ nhất, làm trong 1 giờ. Xem T507." : "Install upper and lower straps. Cheapest fix, about an hour. See T507."],
        q2: [vi ? "2 · Nhà chưa bắt bulông vào móng" : "2 · Not bolted to the foundation", vi ? "Thuê contractor làm foundation bolting. Coi chương trình Earthquake Brace + Bolt (trợ giá tới $3,000 nếu ZIP đủ điều kiện). <span class=\"tag\">Ước tính</span>" : "Hire a contractor for foundation bolting. Check Earthquake Brace + Bolt (grants up to $3,000 in eligible ZIPs). <span class=\"tag\">Estimate</span>"],
        q3a: [vi ? "3a · Tường cripple chưa giằng" : "3a · Cripple walls not braced", vi ? "Đóng plywood vào tường cripple, thường làm chung với bulông móng (cùng chương trình EBB)." : "Plywood the cripple walls, usually together with bolting (same EBB program)."],
        q3b: [vi ? "3b · Trụ rời chưa gia cố" : "3b · Piers/posts not strengthened", vi ? "Cần kỹ sư kết cấu thiết kế. Không phải việc thợ thường." : "Needs a structural engineer's design. Not a handyman job."],
        q4: [vi ? "4 · Móng gạch không cốt thép" : "4 · Unreinforced masonry foundation", vi ? "Kỹ sư kết cấu coi. Có khi phải thay móng." : "Have a structural engineer evaluate. Sometimes the foundation must be replaced."],
        q5: [vi ? "5 · Tường/cột cao trên dốc chưa giằng" : "5 · Hillside walls/posts not braced", vi ? "Kỹ sư kết cấu thiết kế giằng. Nhà dốc là ca khó nhất." : "Engineered bracing. Hillside homes are the hardest case."],
        q6: [vi ? "6 · Tường gạch không cốt thép" : "6 · Unreinforced masonry walls", vi ? "Rủi ro sập cao nhất. Kỹ sư kết cấu, xin permit." : "Highest collapse risk. Structural engineer and permits."],
        q7: [vi ? "7 · Tường cửa garage có phòng trên chưa gia cố" : "7 · Garage door wall below a room not strengthened", vi ? "Gia cố khung cửa garage (khung thép hoặc plywood hai bên). Contractor có kinh nghiệm retrofit." : "Strengthen the garage opening (steel frame or plywood on both sides). Use a retrofit contractor."]
      };
      const weak = [], unk = [];
      Object.keys(fix).forEach(k => { if (v[k] === 'no') weak.push("<b>" + fix[k][0] + "</b>: " + fix[k][1]); if (v[k] === 'dk') unk.push(fix[k][0].replace(/^(\d+\w?) · .*/, '$1')); });
      const items = [vi ? "<b>" + req + ".</b> " + sub : "<b>" + req + ".</b> " + sub].concat(weak);
      if (unk.length) items.push(vi ? "“Không biết” ở câu " + unk.join(", ") + ": nhờ home inspector hoặc contractor retrofit coi dưới crawl space trước khi bỏ contingency." : "“Don't know” on " + unk.join(", ") + ": have an inspector or retrofit contractor check the crawl space before removing contingencies.");
      items.push(vi ? "Câu 8–9 (vùng đứt gãy, hóa lỏng): coi báo cáo NHD." : "Q8–9 (fault and liquefaction zones): see the NHD report.");
      if (!weak.length && !unk.length) items.push(vi ? "Không thấy chỗ yếu theo câu trả lời. Seller có hồ sơ retrofit thì kèm vào trang 2." : "No weak spots from these answers. If there are retrofit records, attach them on page 2.");
      const n = weak.length;
      return { big: req + " · " + (vi ? n + " chỗ yếu" + (unk.length ? ", " + unk.length + " chưa rõ" : "") : n + " weak spot" + (n === 1 ? "" : "s") + (unk.length ? ", " + unk.length + " unknown" : "")), sub: vi ? "Câu “No” là chỗ yếu, “Không biết” là cần coi thêm." : "Every “No” is a weak spot; “Don't know” needs a closer look.", items: items, bad: n > 0 };
    });
const UI={
 vi:{eb:"Ken Lam Library · Giải nghĩa Forms",lang:"English",vidH:"Xem 45 giây trước",vidP:"Clip ngắn tóm form này. Không tiếng, có chữ. Xem xong rồi đi từng phần bên dưới.",walkH:"Đi từng phần của form",walkP:"Hình chụp thật từ form (địa chỉ đã đổi thành ví dụ 1234 Example Lane). Chấm đỏ khớp với số giải thích bên dưới.",prev:"← Trước",nxt:"Tiếp →",zoom:"Phóng to trang",hint:"Kéo ngang để coi hết",ex:"Ví dụ với 1234 Example Lane",warn:"Coi chừng",toolH:"Tool: thử với nhà của anh chị",mythH:"Nhiều người hiểu sai",nextH:"Bước tiếp theo",mail:"Email kết quả cho Ken",sms:"Nhắn Ken",vbtn:"Xem video 45 giây",src:"Nguồn",upd:"Cập nhật",allF:"Mọi forms giải nghĩa",allT:"Tất cả tools",disc:"Trang này giải thích cho dễ hiểu, không thay form gốc và không phải tư vấn pháp lý hay thuế. Hình trích từ form để minh họa. Chuyện tranh chấp, đứng tên, thuế: hỏi luật sư hoặc CPA.",step:"Phần",of:"/",keys:{k1:"Ai điền / ký",k2:"Khi nào gặp",k3:"Số trang",k4:"Luật nào bắt"}},
 en:{eb:"Ken Lam Library · Forms explained",lang:"Tiếng Việt",vidH:"Watch the 45-second version first",vidP:"A short clip that sums up this form. No sound, on-screen text in Vietnamese. Then walk through it part by part below.",walkH:"Walk through the form",walkP:"Real images from the form (the address was changed to the example 1234 Example Lane). Red pins match the numbered notes.",prev:"← Back",nxt:"Next →",zoom:"Open full page",hint:"Swipe sideways to see it all",ex:"Example: 1234 Example Lane",warn:"Watch out",toolH:"Tool: try it with your home",mythH:"What people get wrong",nextH:"Next steps",mail:"Email my result to Ken",sms:"Text Ken",vbtn:"Watch the 45-second video",src:"Sources",upd:"Updated",allF:"All forms explained",allT:"All tools",disc:"Plain-language explanation only. It does not replace the actual form and is not legal or tax advice. Form images are shown for illustration. For disputes, title or tax questions, ask an attorney or CPA.",step:"Part",of:"/",keys:{k1:"Who fills / signs",k2:"When you see it",k3:"Pages",k4:"Required by"}}
};
let lang='vi';try{const s=localStorage.getItem('kl_lang');if(s==='en'||s==='vi')lang=s;}catch(e){}
const qs=new URLSearchParams(location.search);if(qs.get('lang')==='en'||qs.get('lang')==='vi')lang=qs.get('lang');
const $=id=>document.getElementById(id);
const L=o=>o==null?'':(typeof o==='string'?o:(o[lang]??o.vi??''));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur=0, last=null;
function fmtMoney(n){return '$'+Math.round(n).toLocaleString('en-US')}
function fmtDate(d){if(!(d instanceof Date)||isNaN(d))return '—';return lang==='vi'?(String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()):d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function parseDate(s){if(!s)return null;const [y,m,dd]=s.split('-').map(Number);return new Date(y,m-1,dd)}
const H={fmtMoney,fmtDate,addDays,parseDate,L:o=>L(o),lang:()=>lang};

function renderStatic(){
  const u=UI[lang];document.documentElement.lang=lang;
  document.title=L(FORM.title)+' · Ken Lam Tools';
  $('eb').textContent=u.eb;$('lang').textContent=u.lang;
  $('code').textContent=FORM.code+' · '+FORM.form+' · '+FORM.rev;
  $('h1').textContent=L(FORM.title);$('one').innerHTML=L(FORM.one);
  $('facts').innerHTML=['k1','k2','k3','k4'].map((k,i)=>'<div><b>'+u.keys[k]+'</b><span>'+L(FORM.facts[i])+'</span></div>').join('');
  $('eli').innerHTML=L(FORM.eli10);
  ['vidH','vidP','walkH','walkP','toolH','mythH','nextH','mail','sms','vbtn','upd','allF','allT','disc'].forEach(k=>$(k).textContent=u[k]);
  $('prev').textContent=u.prev;$('nxt').textContent=u.nxt;
  $('srcL').innerHTML=u.src+': '+FORM.sources.map(s=>'<a href="'+s.u+'" target="_blank" rel="noopener">'+esc(s.t)+'</a>').join(' · ');
  $('myths').innerHTML=FORM.myths.map(m=>'<div class="warn"><b>'+L(m.t)+'</b>'+L(m.d)+'</div>').join('');
  $('next').innerHTML=FORM.next.map(n=>'<li><a href="'+n.href+'"><b>'+L(n.t)+'</b><br><span style="color:var(--muted);font-size:15px">'+L(n.d)+'</span></a></li>').join('');
  $('toolP').innerHTML=L(FORM.tool.intro);
  renderInputs();renderStep();compute();
}
function renderInputs(){
  const vals=readInputs(true);
  $('inputs').innerHTML=FORM.tool.inputs.map(f=>{
    const lab=L(f.label), hint=f.hint?'<small>'+L(f.hint)+'</small>':'';
    if(f.type==='check')return '<label class="chk" style="grid-column:1/-1"><input type="checkbox" id="f_'+f.id+'"'+((vals[f.id]??f.def)?' checked':'')+'><span>'+lab+hint+'</span></label>';
    if(f.type==='select')return '<label class="fld" for="f_'+f.id+'">'+lab+'<select id="f_'+f.id+'">'+f.options.map(o=>'<option value="'+o.v+'"'+(String(vals[f.id]??f.def)===String(o.v)?' selected':'')+'>'+L(o.l)+'</option>').join('')+'</select>'+hint+'</label>';
    const v=vals[f.id]??f.def??'';
    return '<label class="fld" for="f_'+f.id+'">'+lab+'<input id="f_'+f.id+'" type="'+f.type+'"'+(f.type==='number'?' inputmode="decimal"':'')+(f.min!=null?' min="'+f.min+'"':'')+(f.max!=null?' max="'+f.max+'"':'')+(f.step!=null?' step="'+f.step+'"':'')+' value="'+esc(v)+'">'+hint+'</label>';
  }).join('');
  $('inputs').querySelectorAll('input,select').forEach(e=>e.addEventListener('input',compute));
}
function readInputs(soft){
  const o={};FORM.tool.inputs.forEach(f=>{const e=$('f_'+f.id);if(!e){if(!soft)o[f.id]=f.def;return}
    o[f.id]=f.type==='check'?e.checked:(f.type==='number'?(e.value===''?null:Number(e.value)):e.value)});return o;
}
function compute(){
  let r;try{r=FORM.tool.compute(readInputs(false),H)}catch(e){r={big:'—',items:[]};console.error(e)}
  last=r;
  $('res').innerHTML='<div class="big'+(r.bad?' bad':'')+'">'+r.big+'</div>'+(r.sub?'<div class="sub">'+r.sub+'</div>':'')+(r.items&&r.items.length?'<ul>'+r.items.map(i=>'<li>'+i+'</li>').join('')+'</ul>':'');
}
function renderStep(){
  const u=UI[lang],s=FORM.steps[cur];
  $('chips').innerHTML=FORM.steps.map((x,i)=>'<button type="button" class="chip'+(i<cur?' done':'')+'" data-i="'+i+'"'+(i===cur?' aria-current="step"':'')+'>'+(i+1)+'. '+L(x.short||x.title)+'</button>').join('');
  const pins=(s.pins||[]).map((p,i)=>(p.box?'<span class="mark" style="left:'+p.box[0]+'%;top:'+p.box[1]+'%;width:'+p.box[2]+'%;height:'+p.box[3]+'%"></span>':'')+'<span class="pin" style="left:'+p.x+'%;top:'+p.y+'%">'+(i+1)+'</span>').join('');
  $('step').innerHTML='<div class="ref">'+u.step+' '+(cur+1)+' · '+esc(s.ref||'')+'</div><h3>'+L(s.title)+'</h3>'+(s.intro?'<p>'+L(s.intro)+'</p>':'')+
   (s.crop?'<div class="desk"><div class="scroll"><div class="sheet"><img src="'+s.crop+'" alt="'+esc(L(s.title))+'" loading="lazy">'+pins+'</div></div><div class="zoom"><span class="hint">'+u.hint+'</span><button type="button" id="zbtn" data-p="'+s.page+'">'+u.zoom+' ↗</button></div></div>':'')+
   '<ol class="pins">'+(s.pins||[]).map((p,i)=>'<li><span class="n">'+(i+1)+'</span><div><b class="pt">'+L(p.t)+'</b>'+L(p.d)+'</div></li>').join('')+'</ol>'+
   (s.example?'<div class="ex"><b>'+u.ex+'</b>'+L(s.example)+'</div>':'')+
   (s.warn?'<div class="warn"><b>'+u.warn+'</b>'+L(s.warn)+'</div>':'');
  $('cnt').textContent=(cur+1)+u.of+FORM.steps.length;
  $('prev').disabled=cur===0;$('nxt').disabled=cur===FORM.steps.length-1;
  const z=$('zbtn');if(z)z.onclick=()=>{$('lbImg').src=z.dataset.p;$('lb').hidden=false};
}
$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;cur=+b.dataset.i;renderStep()});
$('prev').onclick=()=>{if(cur>0){cur--;renderStep();$('walkH').scrollIntoView({behavior:'smooth'})}};
$('nxt').onclick=()=>{if(cur<FORM.steps.length-1){cur++;renderStep();$('walkH').scrollIntoView({behavior:'smooth'})}};
$('lbX').onclick=()=>{$('lb').hidden=true};
$('lang').onclick=()=>{lang=lang==='vi'?'en':'vi';try{localStorage.setItem('kl_lang',lang)}catch(e){}renderStatic()};
$('mail').onclick=()=>{
  const tmp=document.createElement('div');tmp.innerHTML=(last?last.big+'\n'+(last.sub||'')+'\n'+(last.items||[]).join('\n'):'');
  const vals=readInputs(false);
  const lines=FORM.tool.inputs.map(f=>'- '+L(f.label).replace(/<[^>]+>/g,'')+': '+(f.type==='check'?(vals[f.id]?'✓':'—'):(f.type==='select'?L((f.options.find(o=>String(o.v)===String(vals[f.id]))||{}).l):vals[f.id]))).join('\n');
  const subj=(lang==='vi'?'Hỏi về form ':'Question about form ')+FORM.form+' ('+FORM.code+')';
  const body=(lang==='vi'?'Chào anh Ken,\n\nEm vừa dùng tool '+FORM.code+'. Em nhập:\n':'Hi Ken,\n\nI just used tool '+FORM.code+'. My inputs:\n')+lines+'\n\n'+(lang==='vi'?'Kết quả:\n':'Result:\n')+tmp.textContent+'\n\n'+(lang==='vi'?'Em muốn hỏi thêm: ':'My question: ');
  location.href='mailto:ken@kenlamrealty.com?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
};
$('sms').href='sms:4086662825?&body='+encodeURIComponent('Chào anh Ken, em hỏi về form '+FORM.form+' ('+FORM.code+').');
renderStatic();
