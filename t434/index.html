<style>
/* Layout: one column, inputs on top, live result card below, three actions, footer. Phone first. */
:root{
  --bg:#FBF9F4;        /* ivory */
  --panel:#FFFFFF;
  --fg:#2B2925;
  --muted:#7A7468;
  --line:#E6E0D3;
  --brass:#B8955A;     /* soft brass accent */
  --brass-soft:#F3EBDC;
  --warn:#9A5B2E;
  --ok:#4F7A5A;
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1C1A17;--panel:#24211D;--fg:#F1ECE2;--muted:#A69D8E;--line:#3A352E;
  --brass:#D2B07A;--brass-soft:#302A20;--warn:#D99A6A;--ok:#8CBF9A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1A17;--panel:#24211D;--fg:#F1ECE2;--muted:#A69D8E;--line:#3A352E;
  --brass:#D2B07A;--brass-soft:#302A20;--warn:#D99A6A;--ok:#8CBF9A;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:22px}
header{display:grid;gap:6px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:500}
.lang{border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:12px;padding:5px 10px;border-radius:999px;cursor:pointer}
.lang:focus-visible,button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1{font-family:var(--display);font-weight:300;font-size:38px;line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:15px;margin:0;max-width:40ch}

.inputs{display:grid;gap:14px}
.field{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.field label small{font-weight:400}
.ctl{display:flex;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:0 12px}
.ctl:focus-within{border-color:var(--brass)}
.ctl .pre,.ctl .post{color:var(--muted);font-size:15px}
.ctl input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:20px;padding:12px 8px;font-variant-numeric:tabular-nums}
.ctl input::-webkit-outer-spin-button,.ctl input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ctl input[type=number]{-moz-appearance:textfield}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:380px){.row2{grid-template-columns:1fr}}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:15px;padding:11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brass-soft);color:var(--fg);font-weight:500}

.result{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:grid;gap:16px}
.total .k{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

<script id="kl-commas">
/* Ken Lam Realty: ô nhập tiền / sqft tự thêm dấu phẩy (1,200,000). Code cũ vẫn đọc .value ra số thuần. */
(function(){
  var d=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
  function fmt(v){
    var s=String(v==null?'':v).replace(/[^0-9.\-]/g,''),neg=s.charAt(0)==='-';
    s=s.replace(/-/g,'');
    var i=s.indexOf('.'),ip=i<0?s:s.slice(0,i),dp=i<0?'':s.slice(i).replace(/\./g,'');
    if(i>=0)dp='.'+dp;
    ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return (neg?'-':'')+ip+dp;
  }
  function want(el){
    if(el.type!=='number'||el.__klc)return false;
    var c=el.closest&&el.closest('.ctl');if(!c)return false;
    var pre=c.querySelector('.pre'),post=c.querySelector('.post');
    if(pre&&pre.textContent.indexOf('$')>-1)return true;
    if(post&&/^\s*(sqft|sq ?ft)\s*$/i.test(post.textContent))return true;
    return false;
  }
  function conv(el){
    if(!want(el))return;
    el.__klc=1;
    var cur=d.get.call(el),ph=el.getAttribute('placeholder');
    el.type='text';
    if(!el.getAttribute('inputmode'))el.setAttribute('inputmode','numeric');
    Object.defineProperty(el,'value',{configurable:true,
      get:function(){return d.get.call(this).replace(/,/g,'')},
      set:function(v){d.set.call(this,fmt(v))}});
    d.set.call(el,fmt(cur));
    if(ph&&/^[0-9.]{5,}$/.test(ph))el.setAttribute('placeholder',fmt(ph));
    el.addEventListener('input',function(){
      var raw=d.get.call(el),pos=el.selectionStart,n=0,k;
      for(k=0;k<pos;k++)if(/[0-9.]/.test(raw.charAt(k)))n++;
      var out=fmt(raw);
      if(out===raw)return;
      d.set.call(el,out);
      for(k=0,pos=0;k<out.length&&n>0;k++){pos=k+1;if(/[0-9.]/.test(out.charAt(k)))n--;}
      try{el.setSelectionRange(pos,pos)}catch(e){}
    });
  }
  function scan(r){
    if(r.nodeType!==1)return;
    if(r.tagName==='INPUT')conv(r);
    var l=r.querySelectorAll?r.querySelectorAll('input[type=number]'):[];
    for(var i=0;i<l.length;i++)conv(l[i]);
  }
  new MutationObserver(function(m){
    for(var i=0;i<m.length;i++)for(var j=0;j<m[i].addedNodes.length;j++)scan(m[i].addedNodes[j]);
  }).observe(document.documentElement,{childList:true,subtree:true});
  document.addEventListener('DOMContentLoaded',function(){scan(document.body)});
})();
</script>

const PARAS=[

  en:['Attached to the NDA, leased land','This attaches to a signed CML-CNDA and names who gives and who receives info. The buyer\'s on-site people are "Buyer\'s Environmental Representatives." If the leased-property box is checked, <b>nobody enters</b> until the Landlord signs CML-LEC.']},
 {n:'¶1–2',vi:['Định nghĩa, giấy tờ môi trường','Từ ngữ hiểu như trong NDA. Seller đánh dấu đã/sẽ đưa báo cáo Phase I, Phase II hay giấy khác. Mấy báo cáo này và phân tích của buyer đều là thông tin bí mật.'],
  en:['Terms, environmental papers','Words mean what they mean in the NDA. Seller checks which Phase I, Phase II or other reports it has given or will give. Those, and the buyer\'s work on them, are confidential.']},
 {n:'¶3–5',vi:['Giấy phép vào đất (License)','Seller cho buyer và người của buyer quyền vào đất <b>tạm thời, không độc quyền</b>, chỉ để kiểm tra, test, nghiên cứu môi trường. Quyền này của riêng buyer, không chuyển cho ai được.'],
  en:['The License to enter','Seller gives the buyer and its team a <b>temporary, non-exclusive</b> right to enter, only for environmental inspections, tests and studies. It is personal to the buyer and can\'t be assigned.']},
 {n:'¶6',vi:['Bao lâu','Bắt đầu khi NDA ký đủ và buyer làm xong mọi điều kiện trước khi vào. Hết vào ngày sớm nhất trong: ngưng bàn deal, close escrow, deal hoàn tất (nếu không có escrow), hoặc ngày hai bên ghi. Phần bồi thường vẫn còn sau đó.'],
  en:['How long','Starts when the NDA is fully signed and every entry condition is met. Ends on the earliest of: talks end, close of escrow, the deal completes (no escrow), or a date filled in. Indemnity survives.']},
 {n:'¶7',vi:['Báo trước, Work Plan','Báo seller và agent seller ít nhất <b>5 ngày làm việc</b> trước khi làm, kèm tên, địa chỉ, phone, lý do, permit và giấy bảo hiểm. Khoan, lấy mẫu hay việc ngoài Phase I: kèm <b>Work Plan</b> có vị trí lấy mẫu. Seller báo thiếu thì sửa trong <b>3 ngày làm việc</b>. Seller được duyệt kế hoạch, cử người coi, lấy mẫu chia đôi (tự trả tiền xét nghiệm). Vào đất phải hẹn qua seller và listing agent.'],
  en:['Notice, Work Plan','Notify the seller and its agent at least <b>5 business days</b> ahead, with names, addresses, phones, reason, permits and insurance papers. Drilling, sampling or anything beyond Phase I: add a <b>Work Plan</b> with sample locations. Gaps flagged by the seller get fixed within <b>3 business days</b>. Seller may approve the plan, watch, and take split samples (its own lab cost). Access goes through the seller and listing agent.']},
 {n:'¶8',vi:['Làm đúng luật','Buyer tự trả tiền xin mọi permit, làm đúng luật an toàn, tiếng ồn, chất thải, nước, không khí. Buyer làm tràn đổ hay làm ô nhiễm có sẵn nặng thêm thì buyer dọn, trả tiền.'],
  en:['Follow the law','Buyer gets every permit at its cost and follows safety, noise, waste, water and air rules. If the buyer causes a release or worsens existing contamination, the buyer cleans it up and pays.']},
 {n:'¶9',vi:['Bảo hiểm','Giữ suốt License và <b>2 năm</b> sau. Trách nhiệm chung tối thiểu <b>$2,000,000</b> tổng, xe <b>$1,000,000</b> (Seller là additional insured). Workers\' comp + employer\'s liability tối thiểu <b>$1,000,000</b>. Người làm môi trường: E&O gồm ô nhiễm tối thiểu <b>$1,000,000</b>. Mức này không giới hạn trách nhiệm của buyer.'],
  en:['Insurance','Kept through the License plus <b>2 years</b>. General liability at least <b>$2,000,000</b> aggregate, auto <b>$1,000,000</b> (Seller as additional insured). Workers\' comp + employer\'s liability at least <b>$1,000,000</b>. Environmental team: E&O incl. pollution at least <b>$1,000,000</b>. The limits don\'t cap the buyer\'s liability.']},
 {n:'¶10',vi:['Tình trạng đất','Buyer nhận đất như hiện trạng, seller không hứa gì. Có thể có ống ngầm không có dấu. Dò trước khi khoan máy. Che lỗ khi không làm. Làm cẩn thận cho seller vừa ý.'],
  en:['Condition of the land','Buyer takes the land as it is, no promises from seller. There may be unmarked pipes. Locate them before machine drilling. Cover holes when not working. Work carefully, to the seller\'s reasonable satisfaction.']},
 {n:'¶11–12',vi:['Hóa chất độc là gì, không thừa nhận','Danh sách dài: chất bị nhà nước quản lý, dầu và sản phẩm dầu, asbestos, PCB, formaldehyde, rò từ bồn ngầm… Danh sách chỉ là ví dụ. Ký form này không ai thừa nhận có ô nhiễm.'],
  en:['What "Hazardous Materials" means, no admission','A long list: anything regulated, petroleum, asbestos, PCBs, formaldehyde, leaks from underground tanks… The list is examples, not the limit. Signing admits no contamination.']},
 {n:'¶13–14',vi:['Rủi ro, sửa hư','Buyer tự chịu rủi ro người bị thương hay đồ bị hư do mình gây ra, và bỏ quyền kiện seller về chuyện đó. Làm hư hay làm tràn: gọi điện báo seller, xác nhận bằng thư trong <b>2 ngày làm việc</b>, sửa ngay bằng tiền mình.'],
  en:['Risk, repairs','Buyer takes the risk of injury or damage it causes and waives claims against the seller for it. Damage or a release: phone the seller, confirm by letter within <b>2 business days</b>, repair at once at its cost.']},
 {n:'¶15',vi:['Dọn sạch','Xong việc hoặc tới ngày hết License: bịt giếng, lấp lỗ bằng đất sạch nén chặt ngang mặt đất, san lại đất, dọn đồ nghề, xử lý đất khoan và nước thải đúng luật.'],
  en:['Clean site','When done or at the end date: seal wells, fill holes level with clean compacted soil, regrade, remove equipment, and lawfully dispose of cuttings and water.']},
 {n:'¶16',vi:['Mechanics\' lien','Không để thợ của buyer đặt lien lên tài sản. Có lien thì buyer trả hay đặt bond xóa trong <b>20 ngày</b> sau khi seller đòi. Seller nên ghi Notice of Non-Responsibility (form NNR).'],
  en:['Mechanics\' liens','No liens from the buyer\'s contractors. If one is filed, the buyer pays or bonds it off within <b>20 days</b> after the seller\'s demand. Seller may record a Notice of Non-Responsibility (Form NNR).']},
 {n:'¶17',vi:['Bồi thường mở rộng','Bồi thường trong NDA nay gồm cả chuyện vào đất, làm Work, lien, khiếu nại của người làm cho buyer. Nhưng ô nhiễm <b>có sẵn</b> không do buyer gây ra thì không tính, trừ phần Work làm nặng thêm.'],
  en:['Expanded indemnity','The NDA\'s indemnity now covers entry, the Work, liens, and claims by the buyer\'s people. But <b>pre-existing</b> contamination the buyer didn\'t cause is excluded, except what the Work makes worse.']},
 {n:'¶18–19',vi:['Báo cáo, còn hiệu lực','Xong Work hay hết hạn: buyer gửi seller <b>miễn phí</b> mọi báo cáo, dữ liệu, kể cả lời nói. Đó vẫn là thông tin bí mật. Nghĩa vụ của buyer còn hiệu lực sau khi License hết.'],

 {n:{vi:'Chữ ký',en:'Signatures'},vi:['Chữ ký, CML-LEC','Form nhắc in hoa: hậu quả pháp lý lớn, broker không phải luật sư. Đánh dấu nếu kèm CML-LEC. Seller và Buyer ký.'],

function init(){ $('work').value=iso(addDays(today(),14)); $('lend').value=iso(addDays(today(),60)); }

function calc(){
  const d=I18N[lang], role=S.role, p2=S.inv==='p2', lease=S.lease==='yes';
  const work=pd($('work').value), defi=pd($('defi').value), lien=pd($('lien').value), rel=pd($('rel').value), lend=pd($('lend').value);
  const notice=work?addBiz(work,-D.NOTICE_BIZ_DAYS):null;
  let h=H.big(d.k_notice,'<span style="font-size:.72em">'+(notice?fd(notice):'—')+'</span>',fill(d.k_notice_s,{n:D.NOTICE_BIZ_DAYS}));
  if(lease) h+=H.p(d.blocked,'warn');
  h+=H.h3(d.h_papers)+H.tasks('pp',d.papers.concat(p2?[d.paper_plan]:[],lease?[d.paper_lec]:[]));
  h+=H.h3(d.h_ins)+H.lines([[d.ln_cgl,money(D.CGL)],[d.ln_auto,money(D.AUTO)],[d.ln_wc,money(D.WC_EL)],[d.ln_eo,money(D.EO)]]);
  h+=H.note(d.ins_note);
  const cards=[];
  if(defi) cards.push(H.dd(d.dd_fix,addBiz(defi,D.FIX_BIZ_DAYS),d.dd_fix_p));
  if(rel) cards.push(H.dd(d.dd_rel,addBiz(rel,D.RELEASE_BIZ_DAYS),d.dd_rel_p));
  if(lien) cards.push(H.dd(d.dd_lien,addDays(lien,D.LIEN_DAYS),d.dd_lien_p));
  if(lend){ const x=new Date(lend); x.setFullYear(x.getFullYear()+D.INS_TAIL_YEARS); cards.push(H.dd(d.dd_ins,x,d.dd_ins_p)); }
  if(cards.length) h+=H.h3(d.h_dates)+'<div class="dl2">'+cards.join('')+'</div>';
  h+=H.note(d.biz_note+' '+d.days_note);
  if(role==='buyer'){ h+=H.h3(d.h_buyer)+H.tasks('by',d.buyer); h+=H.h3(d.h_seller)+H.ul(d.seller); }
  else { h+=H.h3(d.h_seller)+H.tasks('sl',d.seller); h+=H.h3(d.h_buyer)+H.ul(d.buyer); }
  h+=H.p(d.excl);
  const v={role:d.tx_role[role],inv:d.tx_inv[S.inv],work:fd(work),notice:fd(notice),lease:lease?d.tx_yes:d.tx_no};
  return {html:h,text:fill(d.tx,v),sms:fill(d.sms,v)};
}

const I18N={vi:Object.assign({},COMMON.vi,TX.vi),en:Object.assign({},COMMON.en,TX.en)};
let lang='en'; try{ if(localStorage.getItem('kl_lang')==='vi') lang='vi'; }catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t=k=>{const v=I18N[lang][k]; return v==null?k:v;};
const fill=(s,v)=>String(s).replace(/\{(\w+)\}/g,(m,k)=>v[k]!=null?v[k]:m);
const money=(x,c)=>{const f=c&&Math.round(Math.abs(x)*100)%100!==0; return (x<0?'-':'')+'$'+Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:f?2:0,maximumFractionDigits:f?2:0});};
const num=id=>{const el=$(id); if(!el) return 0; const v=parseFloat(String(el.value).replace(/,/g,'')); return isFinite(v)&&v>0?v:0;};
const pad=n=>String(n).padStart(2,'0');
function pd(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m?new Date(+m[1],+m[2]-1,+m[3]):null;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function addDays(d,n){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x;}
function addMonths(d,n){const x=new Date(d.getFullYear(),d.getMonth()+n,1); const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate(); x.setDate(Math.min(d.getDate(),last)); return x;}
/* Ngày làm việc: bỏ thứ Bảy, Chủ Nhật. Chưa trừ ngày lễ. */
function addBiz(d,n){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); let k=Math.abs(n); const s=n<0?-1:1; while(k>0){x.setDate(x.getDate()+s); const w=x.getDay(); if(w!==0&&w!==6) k--;} return x;}
function fd(d){if(!d) return '—'; const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; const w=t('wd')[d.getDay()];
  return lang==='vi'? w+', '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear() : w+', '+M[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();}
function today(){const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
const H={
 big:(k,v,s)=>'<div class="total"><div class="k">'+k+'</div><div class="v">'+v+(s?' <small>'+s+'</small>':'')+'</div></div>',
 lines:a=>'<div class="lines">'+a.filter(Boolean).map(r=>'<div class="line '+(r[2]||'')+'"><span class="n">'+r[0]+'</span><span class="a">'+r[1]+'</span></div>').join('')+'</div>',
 dd:(ti,d,p)=>'<div class="dd"><div class="hd"><span class="t">'+ti+'</span></div><div class="date">'+fd(d)+'</div>'+(p?'<p>'+p+'</p>':'')+'</div>',
 h3:s=>'<h3 class="sub2">'+s+'</h3>',
 p:(s,c)=>'<p class="ans'+(c?' '+c:'')+'">'+s+'</p>',
 ul:a=>'<ul class="ul">'+a.filter(Boolean).map(x=>'<li>'+x+'</li>').join('')+'</ul>',
 note:s=>'<div class="note">'+s+'</div>',
 tasks:(id,a)=>'<div class="tasks">'+a.filter(Boolean).map((x,i)=>{const k=id+'_'+i, on=!!CK[k];
   return '<label class="task'+(on?' done':'')+'"><input type="checkbox" data-ck="'+k+'"'+(on?' checked':'')+'><span class="tt">'+x+'</span></label>';}).join('')+'</div>'
};
const CK={};
const S={};
document.querySelectorAll('.seg[data-seg]').forEach(g=>{
  const k=g.getAttribute('data-seg'); const p=g.querySelector('button[aria-pressed="true"]')||g.querySelector('button');
  S[k]=p.getAttribute('data-v');
  g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===p)));
  g.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button'); if(!b) return; S[k]=b.getAttribute('data-v');
    g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); render();});
});
document.querySelectorAll('input,select').forEach(el=>{ if(el.closest('#res')) return; el.addEventListener('input',render); el.addEventListener('change',render); });
$('res').addEventListener('change',e=>{const c=e.target; if(!c.getAttribute||!c.getAttribute('data-ck')) return; const k=c.getAttribute('data-ck');
  if(c.checked) CK[k]=1; else delete CK[k]; c.closest('.task').classList.toggle('done',c.checked);});
let openP={};
function renderParas(){
  $('paras').innerHTML=PARAS.map((p,i)=>{const x=p[lang];
    return '<details class="term" data-p="'+i+'"'+(openP[i]?' open':'')+'><summary><span class="al">'+esc(typeof p.n==='object'?p.n[lang]:p.n)+'</span><span class="nm">'+x[0]+'</span></summary><div class="bd">'+x[1]+'</div></details>';}).join('');
  updExp();
}
function updExp(){ const all=PARAS.every((p,i)=>openP[i]); $('expAll').textContent=all?t('exp_none'):t('exp_all'); }
$('paras').addEventListener('toggle',e=>{const el=e.target; if(!el.getAttribute||el.getAttribute('data-p')==null) return; const i=el.getAttribute('data-p'); if(el.open) openP[i]=1; else delete openP[i]; updExp();},true);
$('expAll').onclick=()=>{const all=PARAS.every((p,i)=>openP[i]); openP={}; if(!all) PARAS.forEach((p,i)=>openP[i]=1); renderParas();};
const MA={};
function renderMyths(){
  $('myths').innerHTML=MYTHS.map((m,i)=>{const x=m[lang], a=MA[i];
    let rv=''; if(a!=null){ const right=(a===String(m.a)); rv='<p class="rv"><b class="'+(right?'ok':'no')+'">'+(right?t('m_ok'):t('m_no'))+'</b> '+(m.a?t('m_is_t'):t('m_is_f'))+' '+x[1]+'</p>'; }
    return '<div class="mq"><p class="st">'+x[0]+'</p><div class="bt" role="group"><button type="button" data-m="'+i+'" data-a="true" aria-pressed="'+(a==='true')+'">'+t('m_true')+'</button><button type="button" data-m="'+i+'" data-a="false" aria-pressed="'+(a==='false')+'">'+t('m_false')+'</button></div>'+rv+'</div>';}).join('');
}
$('myths').addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button[data-m]'); if(!b) return; MA[b.getAttribute('data-m')]=b.getAttribute('data-a'); renderMyths();});
function render(){
  const r=calc();
  $('res').innerHTML=r.html;
  const v={code:META.code,form:META.form,slug:META.slug};
  $('emailBtn').href='mailto:ken@kenlamrealty.com?subject='+encodeURIComponent(fill(t('subj'),v))+'&body='+encodeURIComponent(fill(t('mail_hi'),v)+r.text+fill(t('mail_end'),v));
  $('smsBtn').href='sms:4086662825?&body='+encodeURIComponent(fill(t('sms_hi'),v)+(r.sms||''));
}
function applyLang(){
  const d=I18N[lang];
  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.getAttribute('data-i'); if(typeof d[k]==='string') el.innerHTML=d[k];});
  document.querySelectorAll('[data-ph]').forEach(el=>{const k=el.getAttribute('data-ph'); if(typeof d[k]==='string') el.setAttribute('placeholder',d[k]);});
  $('langBtn').textContent=d.lang; document.documentElement.lang=lang;
  renderParas(); renderMyths(); render();
}
$('langBtn').onclick=()=>{lang=lang==='vi'?'en':'vi'; try{localStorage.setItem('kl_lang',lang)}catch(e){} applyLang();};
if(typeof init==='function') init();
applyLang();
</script>
