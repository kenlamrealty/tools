<style>
/* Layout: one column, inputs on top, live result card below, three actions, footer. Phone first. */
:root{
  --bg:#FBF9F4;        /* ivory */
  --panel:#FFFFFF;
  --fg:#2B2925;
  --muted:#7A7468;
  --line:#E6E0D3;
  --brass:#B8955A;     /* soft brass accent */
  --brass-soft:#F3EBDC;
  --warn:#9A5B2E;
  --ok:#4F7A5A;
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1C1A17;--panel:#24211D;--fg:#F1ECE2;--muted:#A69D8E;--line:#3A352E;
  --brass:#D2B07A;--brass-soft:#302A20;--warn:#D99A6A;--ok:#8CBF9A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1A17;--panel:#24211D;--fg:#F1ECE2;--muted:#A69D8E;--line:#3A352E;
  --brass:#D2B07A;--brass-soft:#302A20;--warn:#D99A6A;--ok:#8CBF9A;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:22px}
header{display:grid;gap:6px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:500}
.lang{border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:12px;padding:5px 10px;border-radius:999px;cursor:pointer}
.lang:focus-visible,button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1{font-family:var(--display);font-weight:300;font-size:38px;line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:15px;margin:0;max-width:40ch}

.inputs{display:grid;gap:14px}
.field{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.field label small{font-weight:400}
.ctl{display:flex;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:0 12px}
.ctl:focus-within{border-color:var(--brass)}
.ctl .pre,.ctl .post{color:var(--muted);font-size:15px}
.ctl input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:20px;padding:12px 8px;font-variant-numeric:tabular-nums}
.ctl input::-webkit-outer-spin-button,.ctl input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ctl input[type=number]{-moz-appearance:textfield}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:380px){.row2{grid-template-columns:1fr}}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:15px;padding:11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brass-soft);color:var(--fg);font-weight:500}

.result{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:grid;gap:16px}
.total .k{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.total .v{font-family:var(--display);font-weight:400;font-size:58px;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--fg)}
.total .v small{font-family:var(--body);font-size:16px;color:var(--muted);font-weight:400}
.lines{display:grid;gap:0;border-top:1px solid var(--line)}
.line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.line .n{color:var(--muted);min-width:0}
.line .n b{color:var(--fg);font-weight:500}
.line .a{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.line.pmi .a{color:var(--warn)}
.line.pmi.off{display:none}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.bar .b1{background:var(--brass)}
.bar .b2{background:#A9B7A0}
.bar .b3{background:#CBB7A3}
.bar .b4{background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
.meta{font-size:13px;color:var(--muted);display:grid;gap:4px}
.meta b{color:var(--fg);font-weight:500}
.note{font-size:13px;color:var(--muted);background:var(--brass-soft);border-radius:10px;padding:10px 12px;line-height:1.45}

.actions{display:grid;gap:10px}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;border-radius:10px;padding:14px 16px;font:inherit;font-size:15px;font-weight:500;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#FFFDF8}
.btn.primary:hover{filter:brightness(.96)}
.btn:hover{border-color:var(--brass)}

.form{display:none;background:var(--panel);border:1px solid var(--brass);border-radius:14px;padding:18px;gap:12px}
.form.open{display:grid}
.form h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.form p{margin:0;font-size:14px;color:var(--muted)}
.form .ctl input{font-size:16px}
.form .ok{color:var(--ok);font-weight:500;font-size:14px}
.copyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.copyrow code{background:var(--brass-soft);padding:3px 8px;border-radius:6px;user-select:all;font-family:var(--body)}
.copyrow button{border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;font-size:13px;padding:5px 10px;border-radius:999px;cursor:pointer}

footer{display:grid;gap:8px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
footer a{color:var(--brass);text-decoration:none}
footer a:hover{text-decoration:underline}
footer .who{color:var(--fg)}

.ctl input[type=date]{font-size:17px;min-height:48px}
.fx{font-size:12px;color:var(--muted);font-weight:400}
.status{font-size:15px;border-radius:10px;padding:10px 12px;line-height:1.45}
.status.ok{background:var(--brass-soft)}

.status b{font-weight:500}

.dl h2,.idr h2,.next h2,.tlw h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0}

.task .tt{border:0;background:transparent;color:var(--fg);font:inherit;font-size:15px;line-height:1.4;text-align:left;padding:0;cursor:pointer;min-width:0}

.next ol{margin:0;padding-left:20px;display:grid;gap:10px;font-size:14px;line-height:1.5}

<script id="kl-commas">
/* Ken Lam Realty: ô nhập tiền / sqft tự thêm dấu phẩy (1,200,000). Code cũ vẫn đọc .value ra số thuần. */
(function(){
  var d=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
  function fmt(v){
    var s=String(v==null?'':v).replace(/[^0-9.\-]/g,''),neg=s.charAt(0)==='-';
    s=s.replace(/-/g,'');
    var i=s.indexOf('.'),ip=i<0?s:s.slice(0,i),dp=i<0?'':s.slice(i).replace(/\./g,'');
    if(i>=0)dp='.'+dp;
    ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return (neg?'-':'')+ip+dp;
  }
  function want(el){
    if(el.type!=='number'||el.__klc)return false;
    var c=el.closest&&el.closest('.ctl');if(!c)return false;
    var pre=c.querySelector('.pre'),post=c.querySelector('.post');
    if(pre&&pre.textContent.indexOf('$')>-1)return true;
    if(post&&/^\s*(sqft|sq ?ft)\s*$/i.test(post.textContent))return true;
    return false;
  }
  function conv(el){
    if(!want(el))return;
    el.__klc=1;
    var cur=d.get.call(el),ph=el.getAttribute('placeholder');
    el.type='text';
    if(!el.getAttribute('inputmode'))el.setAttribute('inputmode','numeric');
    Object.defineProperty(el,'value',{configurable:true,
      get:function(){return d.get.call(this).replace(/,/g,'')},
      set:function(v){d.set.call(this,fmt(v))}});
    d.set.call(el,fmt(cur));
    if(ph&&/^[0-9.]{5,}$/.test(ph))el.setAttribute('placeholder',fmt(ph));
    el.addEventListener('input',function(){
      var raw=d.get.call(el),pos=el.selectionStart,n=0,k;
      for(k=0;k<pos;k++)if(/[0-9.]/.test(raw.charAt(k)))n++;
      var out=fmt(raw);
      if(out===raw)return;
      d.set.call(el,out);
      for(k=0,pos=0;k<out.length&&n>0;k++){pos=k+1;if(/[0-9.]/.test(out.charAt(k)))n--;}
      try{el.setSelectionRange(pos,pos)}catch(e){}
    });
  }
  function scan(r){
    if(r.nodeType!==1)return;
    if(r.tagName==='INPUT')conv(r);
    var l=r.querySelectorAll?r.querySelectorAll('input[type=number]'):[];
    for(var i=0;i<l.length;i++)conv(l[i]);
  }
  new MutationObserver(function(m){
    for(var i=0;i<m.length;i++)for(var j=0;j<m[i].addedNodes.length;j++)scan(m[i].addedNodes[j]);
  }).observe(document.documentElement,{childList:true,subtree:true});
  document.addEventListener('DOMContentLoaded',function(){scan(document.body)});
})();
</script>

 through others) took photos, video, audio or other images. A blank describes them; a box lets you attach the description instead.", "mean": "Be specific: type, date, place, who is in them. Writing just \"house photos\" invites arguments later.", "ex": "\"One 60-second tour video + 25 photos taken 11/10/2026 at 1234 Example Lane, San Jose, CA 95100.\""}, {"n": "2A", "t": "Permitted Use", "v": "☐ “any other lawful purpose” — not checked", "say": "The agent may use the images to market the Subject’s property, or to market and promote the agent’s real estate business. An optional box adds \"any other lawful purpose\". Any media, including media not yet invented: internet, social media, TV, radio, MLS, print, billboards, flyers.", "mean": "Even unchecked, it is broad: selling the home and advertising the agent, even after the sale. Checking the box removes nearly all limits.", "ex": "The Example family allows use for the sale and the agent’s own pages only. Box left unchecked."}, {"n": "2B", "t": "Editing", "v": "At the agent’s discretion", "say": "Images may be edited, copied, published, distributed, cropped, enhanced or otherwise altered at the agent’s discretion.", "mean": "You do not approve each edit unless you write that into paragraph 5. New from 1/1/2026 (B&P §10140.8): property photos changed by software or AI (adding or removing furniture, paint, the view) must say so and link to the original. Normal light, color and cropping edits do not count.", "ex": "The agent cuts the 60-second video into a 15-second reel with music. No new approval needed."}, {"n": "3", "t": "Ownership", "v": "Agent owns them · no royalties", "say": "The agent owns the images and anything made from them, and keeps all rights. The Subject is owed no payment or royalties unless this release says otherwise.", "mean": "The images are not the homeowner’s. Want the original file, or payment? Write it into paragraph 5.", "ex": "Hạnh Example wants a copy of the video as a keepsake → add it in paragraph 5."}, {"n": "4A", "t": "Adults (18+) in the images", "v": "Minh Example, Hạnh Example", "say": "List the people in the images who are 18 or older.", "mean": "Every adult who appears should be named and sign. The form has 5 Subject signature lines.", "ex": "Minh Example, Hạnh Example."}, {"n": "4B", "t": "Children under 18", "v": "Na Example (age 8), Subject’s child", "say": "List minors in the images — only those who are the adult Subject’s children, or for whom the Subject is the appointed guardian.", "mean": "You can sign for your own child. A niece, a neighbor’s kid or your child’s friend needs their own parent to sign a separate release.", "ex": "Na Example, age 8, child of Minh & Lan."}, {"n": "4C", "t": "Pets and property", "v": "Lu the dog — belongs to Subject", "say": "Any pets or real or personal property in the images belong to the adult Subject.", "mean": "Signing says \"these are mine.\" A dog you are pet-sitting or art borrowed from a friend should stay out of frame.", "ex": "Lu the dog belongs to the Example family."}, {"n": "5", "t": "Additional Terms", "v": "No clear shots of Na’s face; takedown within 30 days; copy of original", "say": "Blank lines for any extra conditions both sides agree to.", "mean": "This is where you keep control: hide children’s faces, take down after a date, no paid ads, get a copy.", "ex": "\"No clear shots of Na’s face. Remove from social media within 30 days of Subject’s written request.\""}, {"n": "6", "t": "Effect of Release", "v": "Claims released · Subject indemnifies if wrong", "say": "The Subject, for themselves and any minor or pet they act for, releases all claims about use of the images under these terms. The Subject also indemnifies and defends the agent, including reasonable attorney fees, if the Subject materially breaches the release or a third party claims so.", "mean": "The heaviest paragraph. Sign for a child you have no authority over, and if someone sues the agent, you pay.", "ex": "A neighbor’s child appears and Minh signs for her → her parents sue → Minh may owe the agent’s legal fees."}, {"n": "7", "t": "Broker Identity and Rights", "v": "Broker Example Inc. · Lic.# 00000000 (fake)", "say": "If the agent is a salesperson or broker-associate working under another broker, list that firm and license number. Image rights between agent and broker are handled in their own separate written agreement.", "mean": "If the agent changes firms, who keeps the images is between them. Your rights here do not change.", "ex": "Broker Example Inc., Lic.# 00000000."}, {"n": "✍", "t": "Signatures", "v": "2 Subjects + agent · 11/10/2026", "say": "Up to 5 Subjects sign and date. The agent signs with DRE license number, address, email and phone. Signing means you read, understood, received a copy and agree.", "mean": "Ask for your copy after signing and keep it.", "ex": "Minh Example and Hạnh Example sign on 11/10/2026."}], "t_h": "What does your PVR need?", "t_lead": "Pick who is in the images and how they will be used. See how many signatures and what to fill in.", "l_adults": "How many adults (18+) appear in the photos or video?", "u_people": "people", "l_kids": "Any children under 18?", "o_none": "No", "o_kids_own": "My own child", "o_kids_other": "Someone else’s child", "l_pets": "Any pets?", "o_none2": "No", "o_pets_own": "Mine", "o_pets_other": "Someone else’s", "l_use": "What may they be used for?", "o_use_sale": "This sale only", "o_use_std": "Sale + agent marketing", "o_use_any": "Any lawful purpose", "l_inside": "Filmed inside the home, with belongings or family photos", "v_k0": "Result", "v_v0": "Usually no PVR needed", "v_s0": "No people or pets in the images. Listing photos of the home are usually covered by the listing agreement (RLA paragraph 12).", "v_k1": "PVR needed", "v_v1": "{n} signatures", "v_s1": "{s} Subject(s) + the agent. You need {c} PVR form(s) (5 Subject lines each).", "fill_h": "What to fill in", "f_rla": "Empty-home photos: RLA paragraph 12 says the seller lets the broker take and use photos of the home, even after the sale. Want limits? Raise it when you sign the listing.", "f_inside0": "Filming inside: put away family photos, papers and medicine first. Once online, no one controls who sees it.", "f_p1": "<b>Paragraph 1:</b> describe type, date, address and who appears. Example: “60-sec video + 25 photos, 11/10/2026, 1234 Example Lane”.", "f_2a_std": "<b>Paragraph 2A:</b> leave the “any other lawful purpose” box unchecked. Still covers the sale + agent marketing.", "f_2a_any": "<b>Paragraph 2A:</b> check “any other lawful purpose”. Almost no limits left — sure you want that?", "f_4a": "<b>Paragraph 4A:</b> list all {n} adults. Each signs a Subject line.", "f_copies": "<b>More than {l} adults:</b> the form has only {l} Subject lines. Use {c} PVR forms.", "f_4b_own": "<b>Paragraph 4B:</b> list your child’s name and age. A parent or guardian signs for them.", "f_parent": "<b>Parent not in the images:</b> a parent still signs as a Subject to sign for the child.", "f_4b_other": "<b>Someone else’s child:</b> paragraph 4B does not let you sign for them. Their parent signs a separate PVR — or keep the child out of frame.", "f_4c_own": "<b>Paragraph 4C:</b> signing confirms the pets and belongings shown are yours.", "f_4c_other": "<b>Someone else’s pet:</b> paragraph 4C says everything shown belongs to the Subject. Get the owner to sign, or keep the pet out of frame.", "f_5": "<b>Paragraph 5 — suggested terms:</b>", "p5_sale": "Use only to sell 1234 Example Lane; stop using after closing.", "p5_kids": "No clear shots of children’s faces.", "p5_inside": "Blur family photos and personal papers before posting.", "p5_copy": "Agent sends Subject the original files for personal use.", "f_7": "<b>Paragraph 7:</b> the agent fills in the brokerage name and broker license number.", "f_law": "<b>Why the paper matters:</b> Civil Code §3344 bars using a person’s image in advertising without consent; a minor needs a parent’s or guardian’s consent. Violations: at least {m} or actual damages, plus attorney fees.", "yes": "yes", "no": "no", "sum": "PVR: {v}. Adults: {a}. Children: {k}. Pets: {p}. Use: {u}. Filmed inside: {in}.", "mail_subj": "T438 · My PVR result", "myth": "<b>Common mistake:</b> “Once I sign, the photos are mine.” No. Paragraph 3 says the agent owns them. Want the originals? Write it into paragraph 5.", "next": ["Before the shoot, list who will be there — especially children and pets.", "Read paragraphs 2A and 5. Write down any limits you want.", "Sign before filming, not after posting. Keep your copy.", "Not sure who must sign? Ask Ken."]}};
let lang='vi'; try{ if(localStorage.getItem('kl_lang')==='en') lang='en'; }catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(n<0?'−':'')+'$'+Math.round(Math.abs(n)).toLocaleString('en-US');
const num=id=>{const v=parseFloat($(id).value);return isFinite(v)?v:0};
function setSeg(group,val){ document.querySelectorAll('[data-g="'+group+'"] button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===val?'true':'false')); }
function segVal(group){ const b=document.querySelector('[data-g="'+group+'"] button[aria-pressed="true"]'); return b?b.dataset.v:''; }
document.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('.seg[data-g] button'); if(!b) return; setSeg(b.parentElement.dataset.g,b.dataset.v); update(); });
function renderStatic(){
  const d=I18N[lang];
  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.getAttribute('data-i'); if(typeof d[k]==='string') el.innerHTML=d[k];});
  $('chips').innerHTML=d.chips.map(c=>'<span class="chip">'+c[0]+': <b>'+c[1]+'</b></span>').join('');
  $('mockTitle').textContent=d.mock_title;
  $('paras').innerHTML=d.paras.map(p=>'<details class="para"><summary><span class="pn">'+p.n+'</span><span class="pt">'+p.t+'</span><span class="pi" aria-hidden="true">+</span><span class="pv">'+p.v+'</span></summary><div class="pb"><p><b>'+d.k_say+'</b> '+p.say+'</p><p><b>'+d.k_mean+'</b> '+p.mean+'</p><p><b>'+d.k_ex+'</b> '+p.ex+'</p></div></details>').join('');
  $('myth').innerHTML=d.myth;
  $('nextList').innerHTML=d.next.map(x=>'<li>'+x+'</li>').join('');
  $('langBtn').textContent=d.lang; document.documentElement.lang=lang;
  $('klBack').textContent=d.back;
  document.title=d.doc_title;
}
function setContact(summary){
  const d=I18N[lang];
  $('emailBtn').href='mailto:ken@kenlamrealty.com?subject='+encodeURIComponent(d.mail_subj)+'&body='+encodeURIComponent(summary+'\n\n'+d.mail_tail);
  $('smsBtn').href='sms:4086662825?&body='+encodeURIComponent(d.sms_pre+' '+summary.split('\n')[0]);
}

/* Hàm thuần: tính chữ ký + chỗ cần điền. Test bằng Playwright. */
function pvr(i){
  const adults=Math.max(0,Math.floor(i.adults||0));
  const needParentSign = i.kids==='own' && adults===0;           // con mình có trong hình mà cha mẹ không có mặt: cha mẹ vẫn ký là Subject
  const subjects = adults + (needParentSign?1:0);
  const copies = subjects>0 ? Math.ceil(subjects/SUBJECT_LINES) : 0;
  const extraForms = (i.kids==='other'?1:0);                       // cha mẹ của trẻ khác ký tờ riêng
  const anyone = subjects>0 || i.kids!=='none' || i.pets!=='none';
  return {adults,subjects,copies,extraForms,needParentSign,anyone,
          signatures: subjects + (anyone?1:0) + (i.kids==='other'?1:0)};  // + agent; + ít nhất 1 cha mẹ trẻ khác
}
function update(){
  const d=I18N[lang];
  const inp={adults:num('adults'),kids:segVal('kids'),pets:segVal('pets'),use:segVal('use'),inside:$('inside').checked};
  const r=pvr(inp);
  const V=$('verdict');
  let flags=[];
  if(!r.anyone){
    V.className='verdict'; $('vk').textContent=d.v_k0; $('vv').textContent=d.v_v0; $('vs').innerHTML=d.v_s0;
    flags.push(['',d.f_rla]);
    if(inp.inside) flags.push(['',d.f_inside0]);
  } else {
    V.className='verdict'; $('vk').textContent=d.v_k1;
    $('vv').textContent=d.v_v1.replace('{n}',r.signatures);
    $('vs').innerHTML=d.v_s1.replace('{s}',r.subjects).replace('{c}',r.copies);
    flags.push(['',d.f_p1]);
    flags.push(['',inp.use==='any'?d.f_2a_any:d.f_2a_std]);
    if(r.adults>0) flags.push(['',d.f_4a.replace('{n}',r.adults)]);
    if(r.copies>1) flags.push(['w',d.f_copies.replace('{c}',r.copies).replace(/{l}/g,SUBJECT_LINES)]);
    if(inp.kids==='own') flags.push(['',d.f_4b_own]);
    if(r.needParentSign) flags.push(['w',d.f_parent]);
    if(inp.kids==='other') flags.push(['w',d.f_4b_other]);
    if(inp.pets==='own') flags.push(['',d.f_4c_own]);
    if(inp.pets==='other') flags.push(['w',d.f_4c_other]);
    const p5=[];
    if(inp.use==='sale') p5.push(d.p5_sale);
    if(inp.kids!=='none') p5.push(d.p5_kids);
    if(inp.inside) p5.push(d.p5_inside);
    p5.push(d.p5_copy);
    flags.push(['',d.f_5+' '+p5.map(x=>'“'+x+'”').join(' ')]);
    flags.push(['',d.f_7]);
    flags.push(['',d.f_law.replace('{m}',fmt(MIN_DAMAGES))]);
  }
  $('flags').innerHTML=flags.map(f=>'<li class="'+f[0]+'">'+f[1]+'</li>').join('');
  const kidsT={none:d.o_none,own:d.o_kids_own,other:d.o_kids_other}[inp.kids], petsT={none:d.o_none2,own:d.o_pets_own,other:d.o_pets_other}[inp.pets];
  const useT={sale:d.o_use_sale,std:d.o_use_std,any:d.o_use_any}[inp.use];
  const sum=d.sum.replace('{v}',$('vv').textContent).replace('{a}',r.adults).replace('{k}',kidsT).replace('{p}',petsT).replace('{u}',useT).replace('{in}',inp.inside?d.yes:d.no);
  setContact(sum);
  window.__last=r;
}
['adults','inside'].forEach(id=>$(id).addEventListener('input',update));
$('inside').addEventListener('change',update);

function applyLang(){ renderStatic(); update(); }
$('langBtn').onclick=()=>{ lang=lang==='vi'?'en':'vi'; try{localStorage.setItem('kl_lang',lang)}catch(e){} applyLang(); };
setSeg('kids','own'); setSeg('pets','own'); setSeg('use','std'); $('inside').checked=true;
applyLang();
</script>
