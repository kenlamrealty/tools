<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MHDA: Manufactured Home Dealer Addendum · Ken Lam Tools</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap">
<style>

/* Layout: one column, inputs on top, live result card below, three actions, footer. Phone first. */
:root{
  --bg:#FBF9F4;        /* ivory */
  --panel:#FFFFFF;
  --fg:#2B2925;
  --muted:#7A7468;
  --line:#E6E0D3;
  --brass:#B8955A;     /* soft brass accent */
  --brass-soft:#F3EBDC;
  --warn:#9A5B2E;
  --ok:#4F7A5A;
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1C1A17;--panel:#24211D;--fg:#F1ECE2;--muted:#A69D8E;--line:#3A352E;
  --brass:#D2B07A;--brass-soft:#302A20;--warn:#D99A6A;--ok:#8CBF9A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1A17;--panel:#24211D;--fg:#F1ECE2;--muted:#A69D8E;--line:#3A352E;
  --brass:#D2B07A;--brass-soft:#302A20;--warn:#D99A6A;--ok:#8CBF9A;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:22px}
header{display:grid;gap:6px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:500}
.lang{border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:12px;padding:5px 10px;border-radius:999px;cursor:pointer}
.lang:focus-visible,button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1{font-family:var(--display);font-weight:300;font-size:38px;line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:15px;margin:0;max-width:40ch}

.inputs{display:grid;gap:14px}
.field{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.field label small{font-weight:400}
.ctl{display:flex;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:0 12px}
.ctl:focus-within{border-color:var(--brass)}
.ctl .pre,.ctl .post{color:var(--muted);font-size:15px}
.ctl input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:20px;padding:12px 8px;font-variant-numeric:tabular-nums}
.ctl input::-webkit-outer-spin-button,.ctl input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ctl input[type=number]{-moz-appearance:textfield}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:380px){.row2{grid-template-columns:1fr}}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:15px;padding:11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brass-soft);color:var(--fg);font-weight:500}

.result{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:grid;gap:16px}
.total .k{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.total .v{font-family:var(--display);font-weight:400;font-size:58px;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--fg)}
.total .v small{font-family:var(--body);font-size:16px;color:var(--muted);font-weight:400}
.lines{display:grid;gap:0;border-top:1px solid var(--line)}
.line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.line .n{color:var(--muted);min-width:0}
.line .n b{color:var(--fg);font-weight:500}
.line .a{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.line.pmi .a{color:var(--warn)}
.line.pmi.off{display:none}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.bar .b1{background:var(--brass)}
.bar .b2{background:#A9B7A0}
.bar .b3{background:#CBB7A3}
.bar .b4{background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
.meta{font-size:13px;color:var(--muted);display:grid;gap:4px}
.meta b{color:var(--fg);font-weight:500}
.note{font-size:13px;color:var(--muted);background:var(--brass-soft);border-radius:10px;padding:10px 12px;line-height:1.45}
.note.hide{display:none}

.actions{display:grid;gap:10px}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;border-radius:10px;padding:14px 16px;font:inherit;font-size:15px;font-weight:500;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#FFFDF8}
.btn.primary:hover{filter:brightness(.96)}
.btn:hover{border-color:var(--brass)}

.form{display:none;background:var(--panel);border:1px solid var(--brass);border-radius:14px;padding:18px;gap:12px}
.form.open{display:grid}
.form h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.form p{margin:0;font-size:14px;color:var(--muted)}
.form .ctl input{font-size:16px}
.form .ok{color:var(--ok);font-weight:500;font-size:14px}
.copyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.copyrow code{background:var(--brass-soft);padding:3px 8px;border-radius:6px;user-select:all;font-family:var(--body)}
.copyrow button{border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;font-size:13px;padding:5px 10px;border-radius:999px;cursor:pointer}

footer{display:grid;gap:8px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
footer a{color:var(--brass);text-decoration:none}
footer a:hover{text-decoration:underline}
footer .who{color:var(--fg)}
@media (prefers-reduced-motion:no-preference){.total .v{transition:opacity .15s}}

/* ===== Thêm cho T42 / T43 / T44 (không đổi class cũ) ===== */
.ctl select{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:18px;padding:12px 4px;-webkit-appearance:none;appearance:none;cursor:pointer}
.ctl .chev{color:var(--muted);font-size:12px;pointer-events:none}
.ctl input[type=date]{font-size:18px;min-height:48px}
.ctl input[type=text]{font-size:18px}
.hint{font-size:12px;color:var(--muted);margin:0;line-height:1.45}
.hint b{color:var(--fg);font-weight:500}
.total .of{font-size:14px;color:var(--muted);margin-top:6px}
.chip{font-size:12px;line-height:1.3;padding:3px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;flex:none;color:var(--muted)}
.chip.ok{color:var(--ok);border-color:var(--ok)}
.chip.mid{color:var(--brass);border-color:var(--brass)}
.chip.no{color:var(--warn);border-color:var(--warn)}
.grp-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass);margin:6px 0 0;font-weight:500}
.myth{font-size:14px;line-height:1.5;border-left:2px solid var(--brass);padding:2px 0 2px 12px;margin:0}
.myth b{font-weight:500}
.next{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:12px}
.next h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1.15}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:st}
.steps li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;font-size:15px;line-height:1.45;counter-increment:st}
.steps li::before{content:counter(st);font-family:var(--display);font-size:22px;line-height:1;color:var(--brass)}
.steps small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.steps a{color:var(--brass);text-decoration:none}
.dline{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.dline .n{color:var(--muted);min-width:0}
.dline .n b{color:var(--fg);font-weight:500}
.dline .a{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.tips{margin:0;padding-left:18px;font-size:14px;line-height:1.5;display:grid;gap:8px;color:var(--fg)}
.tips li::marker{color:var(--brass)}
.tips small{display:block;color:var(--muted);font-size:13px}
.linkbtn{justify-self:start;border:1px solid var(--line);background:transparent;color:var(--brass);font:inherit;font-size:14px;padding:7px 13px;border-radius:999px;cursor:pointer}
.linkbtn:hover{border-color:var(--brass)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:grid;gap:10px}
.panel h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;line-height:1.15}
.prog{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.prog b{color:var(--fg);font-weight:500}
.gcal{color:var(--brass);text-decoration:none;white-space:nowrap;font-size:13px}
.gcal:hover{text-decoration:underline}
footer .src{line-height:1.6}
.hide{display:none!important}
.result > *,.inputs > *,.wrap > *,.panel > *{min-width:0}

/* ===== Riêng T43: lịch 2 tháng ===== */
.best{display:grid;gap:0;border-top:1px solid var(--line)}
.bd{display:grid;gap:4px;padding:12px 0;border-bottom:1px solid var(--line)}
.bd .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.bd .dt{font-family:var(--display);font-size:28px;line-height:1.1;font-weight:400}
.bd .dt small{font-family:var(--body);font-size:14px;color:var(--muted)}
.bd .d{font-size:13px;color:var(--muted);line-height:1.5}
.bd .d b{color:var(--fg);font-weight:500}
.bd.first{background:var(--brass-soft);margin:0 -10px;padding:12px 10px;border-radius:8px;border-bottom-color:transparent}
.cal-wrap{display:grid;gap:18px}
.mon h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 8px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.grid7 .wd{font-size:11px;color:var(--muted);text-align:center;padding:2px 0;letter-spacing:.04em}
.dc{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 2px 4px;display:grid;justify-items:center;gap:1px;cursor:pointer;font:inherit;color:var(--fg);min-height:58px}
.dc .s{font-size:16px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.dc .l{font-size:10.5px;color:var(--muted);line-height:1.2;font-variant-numeric:tabular-nums}
.dc .c{font-size:10px;color:var(--muted);line-height:1.2}
.dc .m{width:6px;height:6px;border-radius:50%;margin-top:2px;background:transparent}
.dc.good{background:var(--brass-soft);border-color:var(--brass)}
.dc.good .m{background:var(--ok)}
.dc.no .m{background:var(--warn)}
.dc.no .s{color:var(--warn)}
.dc.past{opacity:.4}
.dc.sel{outline:2px solid var(--fg);outline-offset:1px}
.dc.top3 .s{text-decoration:underline;text-decoration-color:var(--brass);text-underline-offset:3px}
.dc.blank{visibility:hidden}
.det{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;font-size:14px;line-height:1.5}
.det .dt{font-family:var(--display);font-size:24px;line-height:1.15}
.det .r{color:var(--muted)}
.det .r b{color:var(--fg);font-weight:500}
.legend .lg-g{background:var(--brass-soft);border:1px solid var(--brass)}
.legend .lg-n{background:var(--warn)}

</style>
<style>

/* ===== Forms T700–T714: khung giải thích form ===== */
.kl-back{font-size:13px;color:var(--muted);text-decoration:none;justify-self:start}
.kl-back:hover{color:var(--brass)}
.kl-vid{width:100%;max-width:360px;margin:0 auto;border-radius:12px;display:block;background:var(--panel);border:1px solid var(--line)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:12px}
.panel h2,.tool h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1.15}
.kid{font-size:16px;line-height:1.6;margin:0}
.kid b{font-weight:600}
.code{display:inline-block;font-size:12px;letter-spacing:.1em;color:var(--brass);font-weight:600}
table.who{width:100%;border-collapse:collapse;font-size:14.5px;line-height:1.45}
table.who th{width:34%;text-align:left;vertical-align:top;color:var(--muted);font-weight:500;padding:9px 10px 9px 0;border-bottom:1px solid var(--line)}
table.who td{vertical-align:top;padding:9px 0;border-bottom:1px solid var(--line)}
table.who tr.no th{color:var(--warn)}
.walk{display:grid;gap:22px}
.wk{display:grid;gap:8px}
.wk .ref{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass);font-weight:600}
.wk h3{font-size:17px;font-weight:600;margin:0;line-height:1.35}
.wk figure{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.wk figure img{display:block;width:100%;height:auto}
.wk p{margin:0;font-size:15px;line-height:1.55}
.wk .ex{font-size:14px;background:var(--brass-soft);border-radius:8px;padding:9px 11px;line-height:1.5}
.legend2{font-size:12.5px;color:var(--muted);margin:0}
.legend2 b{color:#1E3CA0;font-weight:600}
.legend2 i{font-style:normal;border:2px solid #EBB400;padding:0 4px;border-radius:3px}
.tool{background:var(--panel);border:1px solid var(--brass);border-radius:14px;padding:20px;display:grid;gap:14px}
.big{font-family:var(--display);font-size:40px;line-height:1.05;font-variant-numeric:tabular-nums;margin:2px 0 0}
.big small{display:block;font-family:var(--body);font-size:14px;color:var(--muted);margin-top:6px;line-height:1.4}
.badge{display:inline-block;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.no{color:var(--warn);border-color:var(--warn)}
.badge.mid{color:var(--brass);border-color:var(--brass)}
.ck{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.45;cursor:pointer}
.ck input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--brass)}
.ck small{display:block;color:var(--muted);font-size:13px}
.ctl select{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:17px;padding:12px 4px;cursor:pointer}
.ctl input[type=date]{font-size:18px;min-height:48px}
.hint{font-size:12.5px;color:var(--muted);margin:0;line-height:1.45}
.myth{font-size:14.5px;line-height:1.55;border-left:2px solid var(--brass);padding:2px 0 2px 12px;margin:0}
.myth b{font-weight:600}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:st}
.steps li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;font-size:15px;line-height:1.45;counter-increment:st}
.steps li::before{content:counter(st);font-family:var(--display);font-size:22px;line-height:1;color:var(--brass)}
.steps small{display:block;margin-top:3px}
.steps a{color:var(--brass);text-decoration:none}
.vidbox{display:grid;gap:10px}
.vidbox[hidden]{display:none}
footer .src a{word-break:break-word}

</style>

<body>
<div class="wrap">
  <a class="kl-back" id="klBack" href="/">← All tools</a>
  <header>
    <div class="brand">
      <span>Ken Lam Realty · Tools · T700</span>
      <button class="lang" id="langBtn" type="button" aria-label="Switch language">Tiếng Việt</button>
    </div>
    <h1 data-i="title"></h1>
    <p class="sub" data-i="sub"></p>
  </header>

  <section class="panel" aria-label="Simple explanation">
    <h2 data-i="kid_h"></h2>
    <p class="kid" data-i="kid"></p>
  </section>

  <section class="panel" aria-label="Who signs">
    <h2 data-i="who_h"></h2>
    <table class="who"><tbody id="whoT"></tbody></table>
  </section>

  <section class="panel" aria-label="Walk through the form">
    <h2 data-i="walk_h"></h2>
    <p class="legend2" data-i="legend"></p>
    <div class="walk" id="walk"></div>
  </section>


  <section class="tool" aria-label="Checker">
    <h2 data-i="tool_h"></h2>
    <p class="hint" data-i="tool_s"></p>
    <div class="field"><label data-i="q1"></label><div class="seg" role="group" id="g1"></div></div>
    <div class="field"><label data-i="q2"></label><div class="seg" role="group" id="g2"></div></div>
    <div class="field"><label for="g3" data-i="q3"></label><div class="ctl"><select id="g3"></select></div></div>
    <div class="row2">
      <div class="field"><label for="rec"><span data-i="l_rec"></span> <small data-i="l_rec_s"></small></label><div class="ctl"><input id="rec" type="date" value="2026-11-05"></div></div>
      <div class="field"><label for="del"><span data-i="l_del"></span> <small data-i="l_del_s"></small></label><div class="ctl"><input id="del" type="date" value="2026-12-01"></div></div>
    </div>
    <div class="field"><label for="fee"><span data-i="l_fee"></span> <small data-i="l_fee_s"></small></label><div class="ctl"><span class="pre">$</span><input id="fee" type="number" inputmode="decimal" min="0" step="1" value="350"></div></div>
    <div class="result" aria-live="polite">
      <div class="total"><div class="big" id="rBig"></div></div>
      <div class="lines" id="rLines"></div>
      <p class="note" id="r433" hidden></p>
    </div>
    <div>
      <p class="grp-h" data-i="ck_h"></p>
      <div id="cks"></div>
      <p class="hint" id="ckN"></p>
    </div>
  </section>


  <section class="panel" aria-label="Common mistakes">
    <h2 data-i="myth_h"></h2>
    <div id="myths" style="display:grid;gap:12px"></div>
  </section>

  <section class="panel" aria-label="Next steps">
    <h2 data-i="next_h"></h2>
    <ol class="steps" id="nextL"></ol>
  </section>

  <section class="panel vidbox" id="vidBox" hidden aria-label="Video">
    <h2 data-i="vid_h"></h2>
    <video class="kl-vid" id="vid" controls playsinline preload="none" poster="poster.jpg" src="video.mp4"></video>
  </section>

  <section class="actions">
    <a class="btn primary" id="emailBtn" href="mailto:ken@kenlamrealty.com" data-i="b_email"></a>
    <a class="btn" id="smsBtn" href="sms:4086662825" data-i="b_sms"></a>
    <button class="btn" type="button" id="videoBtn" data-i="b_video"></button>
  </section>

<script>
/* ===== T700 · Ken Lam Tools ===== */
const I18N={"en": {"lang": "Tiếng Việt", "back": "← All tools", "wd": ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], "sat": "Saturday", "sun": "Sunday", "legend": "<b>Blue text</b> = example filled in · <i>yellow</i> = the part to read closely. Cropped from the real C.A.R. form for teaching only.", "ft_src": "Sources:", "ft_chk": "(checked 06/11/2026)", "ft_upd": "Updated", "ft_all": "All tools", "b_sms": "Text Ken", "b_video": "Watch the 45-sec video", "vid_h": "45-second video", "doc_title": "MHDA: Buying a Mobile Home Through a Dealer · Ken Lam Tools", "title": "MHDA: Manufactured Home Dealer Addendum", "sub": "The add-on page used only when a mobile home dealer licensed by HCD is on one side of the sale. It spells out the buyer protections in the Health and Safety Code: escrow only, nothing blank, promises in writing, warranty.", "kid_h": "Explained like you're 10", "kid": "When you buy a used bike from a classmate, you just shake hands. When you buy one from a bike <b>shop</b>, the shop has extra rules: give you a receipt, put the price of every part on paper, and give you the warranty card. A mobile home dealer is that shop. The MHDA is the page that says: your money goes to escrow, not to the dealer. Nothing gets signed with blanks. Spoken promises don't count unless written. A new home comes with a 1-year warranty.", "who_h": "Who signs, when to use it, when not to", "who": [["Who signs", "<b>Buyer and seller</b> both sign and initial every page. The dealer or broker fills in the firm section with a DRE or HCD license number."], ["Attached to", "C.A.R. Form <b>MH-PA</b> (Manufactured / Mobile Home Purchase Addendum) and the purchase agreement it goes with."], ["When to use", "A <b>manufactured home dealer licensed by HCD</b> represents the buyer or the seller (new or used home, often in a mobile home park)."], ["Not needed", "A sale between owners with only real estate agents (DRE) and no dealer. Then use MH-PA without MHDA.", 1], ["Watch out", "Any check made out to the dealer instead of escrow. Blank spaces in the contract. A dealer who owns more than 5% of the escrow company.", 1]], "walk_h": "Walk through the form, part by part", "alt": "Cropped image of C.A.R. Form MHDA,", "walk": [["s01.jpg", "Page 1 · Top", "Use this only when a dealer is involved", "The bold line says it all: only when a party is represented by a dealer licensed under the California Health and Safety Code. Then it names the MH-PA it attaches to, the date, the property, buyer and seller.", "Example: MH-PA dated 11/02/2026 · 1234 Example Lane, San Jose, CA 95100 · Buyer: Anh Minh · Seller: a dealer, or Chị Lan through a dealer."], ["s02.jpg", "Page 1 · Paragraphs 1–2", "Every blank filled before you sign. Money amounts written in.", "You get a copy of everything. Do not sign anything with a blank space. The deposit and down payment amounts are agreed and written in before you sign. Warning: if there is a fight, the deposit can sit in escrow until it is settled.", "Example: deposit $5,000, down payment $30,000 on a $150,000 home. Both numbers are written in before Anh Minh signs."], ["s03.jpg", "Page 1 · Paragraphs 3–4", "Towbar, wheels, axles. And spoken promises.", "Check whether the price includes the towbar, wheels, hubs, tires and axles. If not, each one gets its own price. Anything the salesperson said (\"we'll throw in the skirting\") is not binding unless it is on paper.", ""], ["s04.jpg", "Page 1 · Paragraphs 5–6", "Warranty, and where to complain", "A new home must come with a written warranty under Civil Code §1797.3, handed over right after you sign. Problems with sales, delivery or warranty can go to the dealer, then to HCD, or to court.", "Note: the printed HCD address reads \"932 Tech Center Drive\". HCD's own site lists 9342 Tech Center Drive, Suite 500, Sacramento, CA 95826, (800) 952-8356."], ["s05.jpg", "Page 1 · Paragraphs 7–9", "Sale done only when escrow closes. Doc fee. Installer.", "The sale is not complete until escrow closes. If the dealer charges a document preparation fee, the amount is written in, and it is <b>not</b> a government fee. If the dealer certifies an installer, the contractor's name, address and license number go here.", "Example: doc fee $350 is the dealer's own charge. You can ask about it like any other price."], ["s06.jpg", "Page 1 · Paragraph 10 · HSC §18035(a)", "Your money goes to escrow, within 5 working days", "The law is printed in full. Any cash before closing goes into an escrow account. Checks are made out <b>only to the escrow agent</b>. The dealer must deposit it within five working days of receipt, counting the day of receipt.", "Example: the dealer gets Anh Minh's check Thu 11/05/2026. Counting Thu, Fri, Mon, Tue, then skipping Veterans Day (Wed 11/11), it must be in escrow by Thu 11/12/2026."], ["s07.jpg", "Page 2 · HSC §18035(d)", "Used homes: written offer, escrow notifies HCD", "For a used home, the dealer presents your offer in writing, signed by you. Once the seller accepts and escrow gets signed instructions, escrow sends HCD a notice of escrow opening within three working days. If escrow is cancelled, HCD is told too.", ""], ["s08.jpg", "Page 3 · HSC §18035(f)–(h)", "Disputes, escrow length, and who owns the escrow company", "In a dispute, the money marked \"deposit\" stays in escrow until both sides sign, or a court decides. Other funds (not escrow fees) go back to the buyer. Escrow length is set in writing and can be extended in writing. A dealer or seller may not use an escrow company it owns more than 5% of.", ""], ["s09.jpg", "Page 5 · Civil Code §1797.3", "The 1-year warranty and the 10-day grace", "For a new home: free from substantial defects for one year from delivery. You must send written notice of the defect to the dealer, manufacturer or contractor no later than <b>one year and 10 days</b> after delivery. Plumbing, heating, electrical, cooling, fire safety, structure and appliances are covered.", "Example: delivered Tue 12/01/2026. Defects that show up by 12/01/2027 are covered. Mail written notice by Sat 12/11/2027 at the latest. Do not wait for the last day."], ["s10.jpg", "Page 6 · Signatures", "Buyer, seller, and the dealer or broker", "Buyer and seller sign, print names and addresses. Below, each firm writes a DRE license (real estate broker) or an HCD license (dealer). Check that license number on HCD's license search.", ""]], "tool_h": "Do I need the MHDA? + key dates", "tool_s": "Answer three questions. See whether MHDA applies, the last day the dealer must put your deposit in escrow, your warranty notice deadline, and a checklist to tick before you sign.", "q1": "Is a licensed mobile home dealer (HCD) working for the buyer or the seller?", "q2": "New or used home?", "q3": "Where will the home sit?", "o1": [["y", "Yes"], ["n", "No, only real estate agents"], ["u", "Not sure"]], "o2": [["new", "New"], ["used", "Used"]], "o3": [["park", "In a mobile home park"], ["land", "On my own land, HCD title"], ["433a", "On a permanent foundation (433A, real property)"]], "l_rec": "Day the dealer received your money", "l_rec_s": "(check, cashier's check or cash)", "l_del": "Delivery date of the home", "l_del_s": "(new homes: starts the warranty)", "l_fee": "Doc preparation fee", "l_fee_s": "(optional)", "v_y": "Yes. Use MHDA with MH-PA.", "v_y_s": "A licensed dealer is on one side, so the dealer rules in HSC §§18035, 18035.1, 18035.3 and Civil Code §1797.3 apply. Use the checklist below.", "v_n": "No MHDA needed.", "v_n_s": "No dealer, so MHDA does not apply. You still use MH-PA with the purchase agreement, plus HCD title transfer if the home is not real property.", "v_u": "Check the license first.", "v_u_s": "Ask for the dealer's HCD license number and look it up on HCD's license search. A dealer on either side means MHDA applies.", "v_433": "Home on a 433A foundation: it is recorded as real property. Ask escrow which papers apply; a dealer who is also a broker may put the home in the real property purchase contract (HSC §18035.3(d)).", "ln_dep": "Dealer must deposit your money in escrow by", "ln_dep_s": "(5 working days, counting the day received; weekends and bank holidays skipped)", "ln_war": "Defects covered if they show up by", "ln_not": "Written defect notice must reach the dealer by", "ln_not_s": "(1 year + 10 days after delivery, Civil Code §1797.3(b))", "ln_fee": "Doc fee", "ln_fee_v": "{f}. Not a government fee. You can ask about it.", "ln_used": "Used home: escrow notifies HCD within 3 working days after the seller accepts and instructions are signed.", "ck_h": "Before you sign (tick)", "ck_n": "{a} of {b} done", "cks": [["Every blank is filled in, and I have a copy of everything", "MHDA ¶1, HSC §18035.3(a)(4)"], ["My check is made out to the escrow company, not the dealer", "HSC §18035(a)(1)"], ["Deposit and down payment amounts are written on the papers", "MHDA ¶2"], ["Towbar, wheels, hubs, tires, axles: included or priced one by one", "MHDA ¶3"], ["Every spoken promise is written into the documents", "MHDA ¶4"], ["New home: I received the written warranty right after signing", "Civil Code §1797.3"], ["Installer's name, address and license number are filled in", "B&P §7026.2(c)"], ["The escrow company is not owned more than 5% by the dealer or seller", "HSC §18035(h)"], ["I know the sale is complete only when escrow closes", "MHDA ¶7"]], "myth_h": "What people get wrong", "myths": [["\"It is faster to hand the deposit to the dealer.\"", "Never. By law, checks are made payable only to the escrow agent, and the dealer must put any money into escrow within 5 working days."], ["\"The salesperson promised new skirting, that's good enough.\"", "Spoken promises are not binding unless written in the purchase documents. Get it on paper."], ["\"The doc fee is a state fee.\"", "No. The form says it plainly: a dealer documentary fee is not a governmental fee."], ["\"I signed, so the home is mine.\"", "Not yet. The sale is not complete until escrow closes."], ["\"MHDA is for every mobile home sale.\"", "No. Only when a licensed dealer represents a party. An owner-to-owner sale with real estate agents uses MH-PA without MHDA."]], "next_h": "Next steps (mobile home tools)", "next": [["Start here: how a mobile home is different, with all mobile home tools.", "/t145/", "Tool T145 · Mobile home basics"], ["Buying in a park: every step with real dates.", "/t165/", "Tool T165 · Buy in a park checklist"], ["Which loan fits this home.", "/t164/", "Tool T164 · Mobile home loans"], ["What tax the home pays, and tax clearance at escrow.", "/t163/", "Tool T163 · Mobile home tax"], ["Home on a permanent foundation (433A).", "/t174/", "Tool T174 · Foundation 433A"], ["45 mobile home words explained.", "/t176/", "Tool T176 · Mobile home dictionary"], ["Every C.A.R. form in one line.", "/t402/", "Tool T402 · Forms library"]], "b_email": "Email Ken my checklist", "mail_subj": "MHDA checklist (T700)", "mail_intro": "Hi Ken, here is my mobile home dealer checklist from tool T700:", "mail_end": "Sent from tools.kenlamrealty.com/t700. For understanding the form only, not legal advice.", "sms": "Hi Ken, question about buying a mobile home from a dealer (T700):", "ft_dis": "For understanding the form only. Not legal or tax advice. Ask a real estate attorney, HCD or your escrow officer about your own deal."}, "vi": {"lang": "English", "back": "← Tất cả tools", "wd": ["Chủ nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"], "sat": "Thứ Bảy", "sun": "Chủ nhật", "legend": "<b>Chữ xanh</b> = ví dụ điền vào · <i>vàng</i> = chỗ cần đọc kỹ. Cắt từ form C.A.R. thật, chỉ để giải thích.", "ft_src": "Nguồn:", "ft_chk": "(tra ngày 06/11/2026)", "ft_upd": "Cập nhật", "ft_all": "Tất cả tools", "b_sms": "Nhắn Ken", "b_video": "Xem video 45 giây", "vid_h": "Video 45 giây", "doc_title": "MHDA: Mua Mobile Home Qua Dealer · Ken Lam Tools", "title": "MHDA: Phụ lục khi mua bán mobile home qua dealer", "sub": "Trang thêm chỉ dùng khi có dealer mobile home có license HCD đứng một bên. Nó ghi các quyền của buyer theo Health and Safety Code: tiền vào escrow, không ký giấy trống, hứa phải ghi giấy, có bảo hành.", "kid_h": "Giải thích kiểu 10 tuổi", "kid": "Mua xe đạp cũ của bạn cùng lớp thì bắt tay là xong. Mua ở <b>tiệm</b> xe đạp thì tiệm phải theo luật riêng: đưa biên nhận, ghi giá từng món lên giấy, đưa thẻ bảo hành. Dealer mobile home chính là cái tiệm đó. MHDA là trang giấy nói rõ: tiền của bạn vào escrow, không đưa dealer. Không ký giấy còn chỗ trống. Hứa miệng không tính, phải ghi giấy. Nhà mới có bảo hành 1 năm.", "who_h": "Ai ký, khi nào dùng, khi nào không", "who": [["Ai ký", "<b>Buyer và seller</b> cùng ký, ký tắt từng trang. Dealer hay broker điền phần công ty, kèm số license DRE hoặc HCD."], ["Gắn với", "C.A.R. Form <b>MH-PA</b> (phụ lục mua mobile home) và hợp đồng mua đi kèm."], ["Khi nào dùng", "Có <b>dealer mobile home có license HCD</b> đại diện buyer hoặc seller (nhà mới hay cũ, thường ở trong park)."], ["Không cần", "Chủ bán cho người mua, chỉ có agent địa ốc (DRE), không có dealer. Khi đó dùng MH-PA, không cần MHDA.", 1], ["Coi chừng", "Check ghi tên dealer thay vì escrow. Hợp đồng còn chỗ trống. Dealer làm chủ hơn 5% công ty escrow.", 1]], "walk_h": "Đi qua từng phần form", "alt": "Hình cắt từ C.A.R. Form MHDA,", "walk": [["s01.jpg", "Trang 1 · Đầu form", "Chỉ dùng khi có dealer", "Dòng in đậm nói hết: chỉ dùng khi một bên có dealer có license theo Health and Safety Code của California. Sau đó ghi MH-PA mà nó gắn vào, ngày, địa chỉ, buyer, seller.", "Ví dụ: MH-PA ngày 02/11/2026 · 1234 Example Lane, San Jose, CA 95100 · Buyer: Anh Minh · Seller: dealer, hoặc Chị Lan bán qua dealer."], ["s02.jpg", "Trang 1 · Đoạn 1–2", "Điền hết chỗ trống rồi mới ký. Ghi rõ số tiền.", "Bạn được giữ bản sao mọi giấy. Đừng ký giấy còn chỗ trống. Tiền cọc và tiền down phải thỏa thuận và ghi vào giấy trước khi ký. Cảnh báo: có tranh chấp thì tiền cọc có thể bị giữ trong escrow tới khi giải quyết xong.", "Ví dụ: căn $150,000, cọc $5,000, down $30,000. Hai số này ghi rõ trước khi Anh Minh ký."], ["s03.jpg", "Trang 1 · Đoạn 3–4", "Càng kéo, bánh xe, trục. Và lời hứa miệng.", "Coi giá có gồm càng kéo (towbar), bánh, mâm, lốp, trục xe không. Không gồm thì mỗi món phải ghi giá riêng. Người bán nói gì (\"tụi tôi tặng thêm skirting\") cũng không ràng buộc nếu không ghi trên giấy.", ""], ["s04.jpg", "Trang 1 · Đoạn 5–6", "Bảo hành, và khiếu nại ở đâu", "Nhà mới phải có giấy bảo hành theo Civil Code §1797.3, đưa ngay sau khi ký. Có chuyện về cách bán, giao nhà, bảo hành thì báo dealer trước, rồi HCD, hoặc ra tòa.", "Lưu ý: form in địa chỉ HCD là \"932 Tech Center Drive\". Trang chính thức của HCD ghi 9342 Tech Center Drive, Suite 500, Sacramento, CA 95826, (800) 952-8356."], ["s05.jpg", "Trang 1 · Đoạn 7–9", "Close escrow mới xong. Phí làm giấy. Thợ lắp đặt.", "Escrow chưa close thì mua bán chưa xong. Dealer thu phí làm giấy (doc fee) thì phải ghi số tiền, và đó <b>không phải</b> phí nhà nước. Dealer xác nhận thợ lắp đặt thì ghi tên, địa chỉ, số license của contractor.", "Ví dụ: doc fee $350 là tiền dealer tự thu. Mình có quyền hỏi như mọi khoản giá khác."], ["s06.jpg", "Trang 1 · Đoạn 10 · HSC §18035(a)", "Tiền vào escrow trong 5 ngày làm việc", "Luật được in nguyên văn. Mọi khoản tiền trước khi close phải vào tài khoản escrow. Check chỉ ghi tên <b>công ty escrow</b>. Dealer phải bỏ tiền vào escrow trong năm ngày làm việc kể từ khi nhận, tính luôn ngày nhận.", "Ví dụ: dealer nhận check của Anh Minh thứ Năm 05/11/2026. Đếm thứ Năm, thứ Sáu, thứ Hai, thứ Ba, bỏ ngày Veterans Day (thứ Tư 11/11), hạn chót là thứ Năm 12/11/2026."], ["s07.jpg", "Trang 2 · HSC §18035(d)", "Nhà cũ: offer bằng giấy, escrow báo HCD", "Với nhà cũ, dealer đưa offer bằng giấy có chữ ký của bạn. Seller chấp nhận và escrow nhận instructions có chữ ký hai bên thì trong ba ngày làm việc escrow gửi HCD giấy báo mở escrow. Escrow hủy cũng phải báo HCD.", ""], ["s08.jpg", "Trang 3 · HSC §18035(f)–(h)", "Tranh chấp, thời gian escrow, ai làm chủ escrow", "Có tranh chấp thì khoản ghi là \"deposit\" nằm yên trong escrow tới khi hai bên cùng ký, hoặc tòa quyết. Tiền khác (trừ phí escrow) trả lại buyer. Thời gian escrow ghi bằng giấy, gia hạn cũng bằng giấy. Dealer hay seller không được dùng công ty escrow mà mình làm chủ hơn 5%.", ""], ["s09.jpg", "Trang 5 · Civil Code §1797.3", "Bảo hành 1 năm, thêm 10 ngày ân hạn", "Nhà mới: không có lỗi lớn về vật liệu hay tay nghề trong một năm kể từ ngày giao. Bạn phải gửi thư báo lỗi cho dealer, hãng sản xuất hay contractor chậm nhất <b>một năm và 10 ngày</b> sau ngày giao. Bảo hành gồm ống nước, sưởi, điện, máy lạnh, phòng cháy, kết cấu và đồ gia dụng.", "Ví dụ: giao nhà thứ Ba 01/12/2026. Lỗi lộ ra trước 01/12/2027 thì được bảo hành. Thư báo lỗi chậm nhất thứ Bảy 11/12/2027. Đừng chờ tới ngày cuối."], ["s10.jpg", "Trang 6 · Chữ ký", "Buyer, seller, và dealer hoặc broker", "Buyer và seller ký, ghi tên in, địa chỉ. Bên dưới, mỗi công ty ghi license DRE (broker địa ốc) hoặc license HCD (dealer). Tra số license đó trên trang tra cứu license của HCD.", ""]], "tool_h": "Có cần MHDA không? + ngày quan trọng", "tool_s": "Trả lời 3 câu. Biết MHDA có áp dụng không, hạn chót dealer phải bỏ tiền cọc vào escrow, hạn báo lỗi bảo hành, và checklist tick trước khi ký.", "q1": "Có dealer mobile home có license HCD làm cho buyer hay seller không?", "q2": "Nhà mới hay nhà cũ?", "q3": "Nhà đặt ở đâu?", "o1": [["y", "Có"], ["n", "Không, chỉ có agent địa ốc"], ["u", "Không chắc"]], "o2": [["new", "Mới"], ["used", "Cũ"]], "o3": [["park", "Trong mobile home park"], ["land", "Trên đất riêng, title HCD"], ["433a", "Trên móng cố định (433A, thành bất động sản)"]], "l_rec": "Ngày dealer nhận tiền của bạn", "l_rec_s": "(check, cashier's check hay tiền mặt)", "l_del": "Ngày giao nhà", "l_del_s": "(nhà mới: bắt đầu bảo hành)", "l_fee": "Phí làm giấy (doc fee)", "l_fee_s": "(không bắt buộc)", "v_y": "Có. Dùng MHDA kèm MH-PA.", "v_y_s": "Có dealer có license đứng mộ   $('rLines').innerHTML=L.join('');
  const n4=$('r433'); n4.hidden=st.c!=='433a'; n4.textContent=d.v_433;
  RESULT=txt+'\n'+d.q2+' '+(d.o2.find(o=>o[0]===st.b)||['',''])[1]+' · '+(d.o3.find(o=>o[0]===st.c)||['',''])[1]+'\n'+d.ck_h+': '+fmt(d.ck_n,{a,b:n});
  RESULT+=d.cks.map((c,i)=>(i===5&&st.b!=='new')?'':'\n['+(st.ck[i]?'x':' ')+'] '+c[0]).join('');
  setActions();
}

function applyLang(){ renderStatic(); if(typeof toolLang==='function') toolLang(); calc(); }
$('langBtn').onclick=()=>{lang=lang==='vi'?'en':'vi'; try{localStorage.setItem('kl_lang',lang)}catch(e){} applyLang();};
$('videoBtn').onclick=()=>{const b=$('vidBox'); b.hidden=false; b.scrollIntoView({behavior:'smooth',block:'center'}); try{$('vid').play()}catch(e){}};
applyLang();
