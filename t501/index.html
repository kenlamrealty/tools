const FORM = {"code": "T501", "form": "SVLA", "rev": "C.A.R. Form SVLA, Revised 6/26", "title": {"vi": "SVLA: Lời dặn cho người bán đất trống", "en": "SVLA: The advisory for vacant land sellers"}, "one": {"vi": "SVLA là 2 trang dặn người bán đất trống: phải khai gì, giấy gì phải xin trước, thuế bị giữ lại lúc bán, và tiền chi phí ai chịu. Đây là lời dặn, không phải bản khai. Seller ký là đã đọc.", "en": "The SVLA is a 2-page advisory for vacant land sellers: what you must disclose, what papers to get early, tax withholding at closing, and who pays costs. It is advice, not a disclosure. The seller signs to say they read it."}, "eli10": {"vi": "<b>Nói cho dễ hiểu:</b> giống tờ dặn dò trước chuyến đi cắm trại: mang gì, đừng quên gì, gặp gấu thì làm sao. SVLA không hỏi miếng đất có gì. Nó nhắc seller những chuyện phải nói ra và phải chuẩn bị, để khỏi bị buyer kiện sau này.", "en": "<b>In plain words:</b> like the checklist before a camping trip: what to bring, what not to forget, what to do if you meet a bear. The SVLA doesn't ask what the land has. It reminds the seller what to tell the buyer and what to prepare, so there's no lawsuit later."}, "facts": [{"vi": "Seller đọc và ký nhận. Không có ô cho buyer.", "en": "The seller reads and signs. No buyer section."}, {"vi": "Lúc ký listing đất trống (thường nằm trong bộ VLL, xem T502).", "en": "When listing vacant land (usually bundled with the VLL, see T502)."}, {"vi": "2 trang", "en": "2 pages"}, {"vi": "Không luật nào bắt riêng form này. Nó tóm tắt bổn phận khai theo luật và theo hợp đồng VLPA.", "en": "No statute requires this form itself. It sums up disclosure duties under law and the VLPA contract."}], "steps": [{"title": {"vi": "Mục 1: Form này để làm gì", "en": "Section 1: What this advisory is for"}, "short": {"vi": "Mở đầu", "en": "Intro"}, "ref": "Trang 1 · Mục 1", "crop": "s01.jpg", "pins": [{"t": {"vi": "Tên form, bản 6/26", "en": "Form name, 6/26 version"}, "d": {"vi": "Bản mới nhất là Revised 6/26. Xài bản cũ thì thiếu phần mới về người mua là công ty trả cash (mục 4B).", "en": "The current version is Revised 6/26. Older versions may not have the newer all-cash entity buyer note (4B)."}, "x": 49.93, "y": 25.27}, {"t": {"vi": "Bán đất lâu hơn bán nhà", "en": "Land takes longer"}, "d": {"vi": "Form nói thẳng: vài tuần tới nhiều tháng. Đất trống ít người mua hơn nhà, buyer còn phải hỏi city có cho xây không.", "en": "The form says it plainly: a few weeks to many months. Land has fewer buyers, and they must check what the city will allow."}, "x": 7.35, "y": 57.48}, {"t": {"vi": "Có cái bắt buộc, có cái chỉ là lời khuyên", "en": "Some are duties, some are tips"}, "d": {"vi": "Mục 2 và 4 là bổn phận (luật hoặc hợp đồng). Mục 5 là chuyện thực tế nên làm.", "en": "Sections 2 and 4 are duties (law or contract). Section 5 is practical advice."}, "x": 77.61, "y": 73.27}], "example": {"vi": "Anh Tâm có miếng đất trống ở 1234 Example Lane, San Jose. Ký listing xong, agent đưa SVLA. Anh ký nhận là đã đọc. Ký SVLA không có nghĩa anh đã khai gì cho buyer.", "en": "Mr. Tâm owns a vacant lot at 1234 Example Lane, San Jose. After signing the listing, his agent hands him the SVLA. Signing it only means he read it. It isn't a disclosure to the buyer."}, "page": "p01.jpg"}, {"title": {"vi": "Mục 2A: Biết gì quan trọng là phải khai", "en": "Section 2A: Disclose every known material fact"}, "short": {"vi": "Bổn phận khai", "en": "Duty"}, "ref": "Trang 1 · Mục 2A", "crop": "s02.jpg", "pins": [{"box": [32.79, 19.65, 23.31, 21.27], "t": {"vi": "Phải tự khai, bằng giấy", "en": "Disclose in writing, on your own"}, "d": {"vi": "“Affirmatively” nghĩa là tự nói ra, không đợi ai hỏi. Và phải bằng giấy viết.", "en": "“Affirmatively” means you speak up without being asked, and in writing."}, "x": 31.81, "y": 30.28}, {"t": {"vi": "Chuyện “material” là gì", "en": "What “material” means"}, "d": {"vi": "Chuyện làm buyer đổi giá hoặc đổi ý mua. Với đất: lối vào, nước, sewer, đất lở, ai đi ngang qua đất mình.", "en": "Anything that would change the price or the decision. For land: access, water, sewer, slides, people crossing the lot."}, "x": 85.71, "y": 30.28}, {"t": {"vi": "Bán as-is vẫn phải khai", "en": "As-is still means disclose"}, "d": {"vi": "Buyer chịu mua y hiện trạng thì seller vẫn phải khai đủ.", "en": "Even if the buyer takes the land as-is, the seller still discloses everything known."}, "x": 20.48, "y": 59.82}, {"t": {"vi": "Agent không tư vấn luật", "en": "The agent can't give legal advice"}, "d": {"vi": "Không chắc khai sao cho đủ thì hỏi attorney. Agent không được nói “vậy là đủ về mặt luật”.", "en": "Not sure how to disclose? Ask an attorney. The broker can't tell you a disclosure is legally sufficient."}, "x": 69.24, "y": 69.67}], "warn": {"vi": "Đất trống không dùng TDS (TDS chỉ cho nhà có 1–4 căn ở). Nhưng bổn phận khai điều mình biết thì vẫn y nguyên.", "en": "Vacant land doesn't use the TDS (that's for 1–4 dwelling units). The duty to disclose what you know is the same."}, "page": "p01.jpg"}, {"title": {"vi": "Mục 2B(1)–(2): 14 chuyện hợp đồng bắt khai", "en": "Section 2B(1)–(2): The 14 items the contract requires"}, "short": {"vi": "14 chuyện", "en": "14 items"}, "ref": "Trang 1 · Mục 2B", "crop": "s03.jpg", "pins": [{"t": {"vi": "Vùng động đất, lụt, cháy", "en": "Earthquake, flood, fire zones"}, "d": {"vi": "Thường lấy bằng báo cáo NHD. Hợp đồng VLPA ghi “nếu luật bắt”.", "en": "Usually covered by an NHD report. The VLPA says “if required by Law”."}, "x": 13.24, "y": 36.53}, {"box": [14.22, 35.82, 21.77, 19.36], "t": {"vi": "“Actual knowledge”", "en": "“Actual knowledge”"}, "d": {"vi": "Chỉ khai cái mình thật sự biết. Không bắt đi điều tra, nhưng biết mà im là có chuyện.", "en": "You disclose what you actually know. You don't have to investigate, but staying quiet about what you know is the problem."}, "x": 13.24, "y": 45.5}, {"t": {"vi": "(viii) Đất không có lối vào", "en": "(viii) Landlocked"}, "d": {"vi": "Đất không có đường hợp pháp để vô. Chuyện số một làm đất mất giá.", "en": "No legal road access. The number-one value killer for land."}, "x": 74.35, "y": 63.43}, {"t": {"vi": "(ix) Easement, lấn ranh", "en": "(ix) Easements, encroachments"}, "d": {"vi": "Đường điện đi ngang, hàng xóm xài đường của mình, hàng rào lấn qua.", "en": "Power lines crossing, a neighbor using your road, a fence over the line."}, "x": 13.24, "y": 72.39}], "example": {"vi": "Lô 1234 Example Lane có con đường đất hàng xóm phía sau đi ngang 20 năm nay. Không có giấy. Anh Tâm biết chuyện này, phải khai mục (ix) Easements. Giấu là buyer có quyền đòi lại.", "en": "A rear neighbor has driven across the 1234 Example Lane lot for 20 years, with no paperwork. Mr. Tâm knows, so he must disclose it under (ix). Hiding it gives the buyer a claim."}, "page": "p01.jpg"}, {"title": {"vi": "Mục 2B(3)–(6) và 2C: Hợp đồng thuê, Mello-Roos, HOA", "en": "Section 2B(3)–(6) and 2C: Leases, Mello-Roos, HOA"}, "short": {"vi": "Thuê, thuế", "en": "Leases, taxes"}, "ref": "Trang 1 · Mục 2B(3)–2C", "crop": "s04.jpg", "pins": [{"t": {"vi": "Hợp đồng đang có", "en": "Existing agreements"}, "d": {"vi": "Cho thuê đất chăn bò, cột quảng cáo, trụ sóng điện thoại, hợp đồng dọn cỏ… đều phải khai.", "en": "Grazing leases, billboard or cell tower leases, weed-clearing contracts… all must be disclosed."}, "x": 13.24, "y": 11.45}, {"t": {"vi": "Mello-Roos, bond 1915", "en": "Mello-Roos, 1915 bonds"}, "d": {"vi": "Seller phải cố gắng xin giấy báo thuế đặc biệt từ cơ quan địa phương rồi đưa buyer.", "en": "The seller must make a good-faith effort to get the special tax notice from the local agency and give it to the buyer."}, "x": 75.9, "y": 22.47}, {"t": {"vi": "Đất trong HOA", "en": "Land inside an HOA"}, "d": {"vi": "Có HOA thì phải đưa CC&R, báo cáo tài chính. Form khuyên xin sớm, trước cả khi có buyer.", "en": "With an HOA you must provide the CC&Rs and financials. The form says get them early, before you have a buyer."}, "x": 13.24, "y": 38.99}, {"t": {"vi": "Cấm phân biệt", "en": "No discrimination"}, "d": {"vi": "Không được chọn buyer theo chủng tộc, tôn giáo, gốc gác… Đất trống cũng vậy.", "en": "You can't pick or reject buyers by race, religion, national origin… Land included."}, "x": 10.3, "y": 83.1}], "page": "p01.jpg"}, {"title": {"vi": "Mục 3–4: Thuế bị giữ và người mua là công ty", "en": "Sections 3–4: Tax withholding and entity buyers"}, "short": {"vi": "Thuế giữ", "en": "Withholding"}, "ref": "Trang 1 · Mục 3–4", "crop": "s05.jpg", "pins": [{"box": [30.42, 28.33, 19.28, 13.96], "t": {"vi": "Thuế bị giữ lúc bán", "en": "Withholding at closing"}, "d": {"vi": "Escrow giữ lại một phần tiền bán gửi IRS và FTB, trừ khi seller ký giấy mình không phải người nước ngoài và là cư dân California, hoặc có miễn trừ khác.", "en": "Escrow holds back part of the proceeds for the IRS and FTB unless the seller signs an affidavit of non-foreign status and California residency, or another exemption applies."}, "x": 29.44, "y": 35.31}, {"t": {"vi": "Ký affidavit để khỏi bị giữ", "en": "Sign the affidavit"}, "d": {"vi": "Thường là form AS trong escrow. Seller ở nước ngoài thì liên bang (FIRPTA) giữ 15%. California thường giữ 3⅓% giá bán nếu không có miễn trừ.", "en": "Usually C.A.R. Form AS. For a foreign seller, FIRPTA generally withholds 15%. California generally withholds 3⅓% of the price unless exempt."}, "x": 92.1, "y": 41.66}, {"t": {"vi": "Buyer là công ty, trả cash", "en": "All-cash entity buyer"}, "d": {"vi": "Nếu luật liên bang đang có hiệu lực, escrow/title phải báo cho Bộ Tài chính thông tin cả buyer lẫn seller.", "en": "If the federal rule is in force, escrow or title must report buyer and seller information to the U.S. Treasury."}, "x": 10.3, "y": 54.58}, {"t": {"vi": "Áp dụng cả đất định xây nhà", "en": "Covers land meant for homes"}, "d": {"vi": "Đất trống định xây nhà 1–4 căn cũng nằm trong diện báo cáo này.", "en": "Vacant land intended for a 1–4 unit home is included."}, "x": 75.88, "y": 67.36}], "example": {"vi": "Bà Hoa ở Việt Nam bán lô 1234 Example Lane giá $600,000. Không có miễn trừ, escrow có thể giữ khoảng $90,000 (15%) cho IRS. Bà về California ở và có giấy tờ thì tình hình khác. Hỏi CPA trước khi list.", "en": "Mrs. Hoa lives in Vietnam and sells the 1234 Example Lane lot for $600,000. Without an exemption, escrow may hold about $90,000 (15%) for the IRS. Ask a CPA before listing."}, "warn": {"vi": "Tiền bị giữ không phải tiền thuế cuối cùng. Seller khai thuế năm sau có thể lấy lại phần dư. Nhưng tới ngày close là tiền chưa về tay.", "en": "Withholding isn't the final tax. The seller may get the excess back when filing. But on closing day that money doesn't reach you."}, "page": "p01.jpg"}, {"title": {"vi": "Mục 5A: Kiểm tra trước khi bán", "en": "Section 5A: Pre-sale inspections"}, "short": {"vi": "Kiểm tra trước", "en": "Pre-sale"}, "ref": "Trang 2 · Mục 5A", "crop": "s06.jpg", "pins": [{"t": {"vi": "Kiểm tra trước", "en": "Inspect first"}, "d": {"vi": "Biết trước miếng đất có vấn đề gì thì sửa được, hoặc ít nhất định giá đúng.", "en": "Know the problems first, so you can fix them or at least price right."}, "x": 10.29, "y": 25.39}, {"t": {"vi": "Giếng và septic", "en": "Well and septic"}, "d": {"vi": "Đất ngoại ô hay có giếng, septic. Buyer sẽ test nước, test thấm (perc test). Làm trước thì khỏi bị bất ngờ.", "en": "Rural lots often have a well or septic. Buyers will test the water and do a perc test. Do it first, no surprises."}, "x": 28.18, "y": 49.98}, {"box": [67.06, 57.55, 24.01, 17.77], "t": {"vi": "Báo cáo xong là phải khai", "en": "Reports must be disclosed"}, "d": {"vi": "Làm inspection thấy lỗi thì phải đưa buyer, kể cả khi buyer tự làm inspection riêng.", "en": "Problems found must go to the buyer, even if the buyer does their own inspection."}, "x": 66.08, "y": 66.43}], "warn": {"vi": "Đừng nghĩ “không kiểm tra thì khỏi khai”. Biết mà không khai vẫn bị kiện. Không kiểm tra thì chỉ có thêm bất ngờ lúc buyer đi inspection.", "en": "Don't think “no inspection, nothing to disclose”. Hiding what you know still gets you sued. Skipping inspections just means surprises later."}, "page": "p02.jpg"}, {"title": {"vi": "Mục 5B–6: An toàn, chi phí, ký nhận", "en": "Sections 5B–6: Safety, costs, signature"}, "short": {"vi": "Ký nhận", "en": "Sign"}, "ref": "Trang 2 · Mục 5B–6", "crop": "s07.jpg", "pins": [{"t": {"vi": "Đăng hình là lộ đất", "en": "Marketing exposes the land"}, "d": {"vi": "Bảng FOR SALE, hình, video làm người lạ biết đất trống. Đổ rác, cắm trại trái phép là chuyện thật. Seller nên giữ bảo hiểm.", "en": "Signs, photos and videos tell strangers the land is empty. Dumping and squatting happen. Keep insurance."}, "x": 10.29, "y": 9.88}, {"t": {"vi": "Ai trả tiền", "en": "Who pays"}, "d": {"vi": "Chi phí để làm đúng bổn phận với buyer (báo cáo, survey, giấy tờ) là của seller, không phải của broker.", "en": "Costs to meet your duties to the buyer (reports, surveys, documents) are the seller's, not the broker's."}, "x": 10.29, "y": 33.57}, {"t": {"vi": "Mục 6: ghi thêm", "en": "Section 6: other items"}, "d": {"vi": "Chỗ trống ghi lời dặn riêng cho miếng đất này.", "en": "Blank lines for notes specific to this land."}, "x": 7.35, "y": 44.56}, {"box": [5.39, 64.39, 14.46, 10.29], "t": {"vi": "Ký là đã nhận và đã đọc", "en": "Signed = received and read"}, "d": {"vi": "Seller ký xác nhận đã nhận, đã đọc, đã hiểu. Không phải hợp đồng mua bán.", "en": "The seller confirms receiving, reading and understanding it. It isn't a sale contract."}, "x": 4.41, "y": 69.54}], "page": "p02.jpg"}], "tool": {"intro": {"vi": "Đánh dấu những gì đúng với miếng đất của mình. Tool liệt kê <b>chuyện phải khai</b>, <b>giấy nên xin trước khi list</b>, và đếm <b>red flag</b> làm buyer chùn tay.", "en": "Tick what applies to your lot. The tool lists <b>what to disclose</b>, <b>what to get before listing</b>, and counts the <b>red flags</b> that scare buyers."}, "inputs": [{"id": "well", "type": "check", "def": true, "label": {"vi": "Có giếng, septic hoặc bồn propane", "en": "Well, septic or propane tank"}}, {"id": "util", "type": "check", "def": false, "label": {"vi": "Chưa có nước/điện/sewer kéo tới lô", "en": "No water/power/sewer at the lot"}}, {"id": "ease", "type": "check", "def": true, "label": {"vi": "Có easement, đường chung, hoặc hàng xóm đi ngang", "en": "Easement, shared road, or neighbors crossing"}}, {"id": "access", "type": "check", "def": false, "label": {"vi": "Không có đường vào hợp pháp (landlocked)", "en": "No legal access (landlocked)"}}, {"id": "bound", "type": "check", "def": false, "label": {"vi": "Ranh giới không rõ, chưa có survey, hàng rào lấn", "en": "Unclear boundaries, no survey, fence over the line"}}, {"id": "soil", "type": "check", "def": false, "label": {"vi": "Đất đổ (fill), dốc, sụt lở, đất ô nhiễm", "en": "Fill, slope, slides or contaminated soil"}}, {"id": "eco", "type": "check", "def": false, "label": {"vi": "Có suối, wetland, loài được bảo vệ, cây sồi lớn", "en": "Creek, wetland, protected species, big oaks"}}, {"id": "farm", "type": "check", "def": false, "label": {"vi": "Williamson Act, đất nông nghiệp, Right to Farm", "en": "Williamson Act, farm use, Right to Farm"}}, {"id": "zone", "type": "check", "def": false, "label": {"vi": "Zoning chưa rõ cho xây, có vi phạm, hoặc sắp đổi zoning", "en": "Zoning unclear for building, violations, or rezoning"}}, {"id": "tax", "type": "check", "def": false, "label": {"vi": "Có Mello-Roos, bond, hoặc HOA", "en": "Mello-Roos, bonds, or an HOA"}}, {"id": "lease", "type": "check", "def": false, "label": {"vi": "Đang cho thuê (chăn thả, bảng quảng cáo, trụ sóng…)", "en": "Existing lease (grazing, billboard, cell tower…)"}}, {"id": "foreign", "type": "check", "def": false, "label": {"vi": "Seller ở nước ngoài hoặc không phải cư dân California", "en": "Seller is foreign or not a California resident"}}]}, "myths": [{"t": {"vi": "“Đất trống thì không có gì để khai.”", "en": "“Empty land has nothing to disclose.”"}, "d": {"vi": "Đất có chuyện riêng của nó: lối vào, easement, nước, đất lở, loài được bảo vệ, zoning. Kiện tụng về đất thường xoay quanh mấy chuyện này.", "en": "Land has its own issues: access, easements, water, slides, protected species, zoning. Land lawsuits usually come from these."}}, {"t": {"vi": "“Ký SVLA là xong phần khai.”", "en": "“Signing the SVLA covers my disclosures.”"}, "d": {"vi": "SVLA chỉ là lời dặn. Khai thật nằm ở VLQ, NHD, SWPI-Q và giấy viết riêng.", "en": "The SVLA is only advice. Real disclosures go on the VLQ, NHD, SWPI-Q and written statements."}}, {"t": {"vi": "“Bán as-is thì khỏi nói gì.”", "en": "“As-is means I don't have to say anything.”"}, "d": {"vi": "Mục 2A ghi rõ: buyer chịu mua y hiện trạng thì bổn phận khai vẫn còn.", "en": "Section 2A says it plainly: the duty to disclose applies even when the buyer takes it as-is."}}], "next": [{"href": "/t504/", "t": {"vi": "T504 · VLQ: Bảng câu hỏi seller đất trống", "en": "T504 · VLQ: Seller vacant land questionnaire"}, "d": {"vi": "Nơi seller thật sự khai từng câu.", "en": "Where the seller actually answers each question."}}, {"href": "/t502/", "t": {"vi": "T502 · VLL: Hợp đồng listing đất trống", "en": "T502 · VLL: Vacant land listing agreement"}, "d": {"vi": "SVLA nằm trong bộ giấy này.", "en": "The SVLA comes bundled with it."}}, {"href": "/t325/", "t": {"vi": "T325 · Thuế bị giữ lúc bán", "en": "T325 · Tax withheld at sale"}, "d": {"vi": "Tính FIRPTA và tiền California giữ.", "en": "Estimate FIRPTA and California withholding."}}, {"href": "/t28/", "t": {"vi": "T28 · Disclosures người bán là gì", "en": "T28 · Seller disclosures explained"}, "d": {"vi": "Toàn bộ giấy seller phải đưa.", "en": "Every disclosure a seller owes."}}], "sources": [{"t": "Civil Code §1102 (TDS: 1–4 units)", "u": "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=1102"}, {"t": "Rev. & Tax. Code §18662 (CA withholding)", "u": "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=RTC&sectionNum=18662"}, {"t": "IRS: FIRPTA withholding", "u": "https://www.irs.gov/individuals/international-taxpayers/firpta-withholding"}, {"t": "FTB: Real estate withholding", "u": "https://www.ftb.ca.gov/pay/withholding/real-estate-withholding.html"}, {"t": "C.A.R. Form SVLA 6/26", "u": "https://www.car.org/"}]};
FORM.tool.compute=(function (v, H) {
      const vi = H.lang() === 'vi';
      const T = (a, b) => vi ? a : b;
      const M = [
        ['well', 0, T('Khai giếng/septic/propane trên form SWPI-Q (VLPA 11G).', 'Disclose well/septic/propane on C.A.R. Form SWPI-Q (VLPA 11G).'), T('Làm inspection septic, test nước giếng trước khi list (SVLA 5A).', 'Get a septic inspection and well water test before listing (SVLA 5A).')],
        ['util', 0, T('Khai rõ lô chưa có tiện ích nào và cách bao xa (VLQ mục 11).', 'Disclose which utilities are missing and how far away they are (VLQ 11).'), T('Hỏi PG&E, công ty nước, city về chi phí kéo tới <span class="tag">Thực hành</span>.', 'Ask PG&E, the water company and the city about hookup cost <span class="tag">Practice</span>.')],
        ['ease', 0, T('Khai easement, đường chung, ai đang xài đất (SVLA 2B(2) vii, ix).', 'Disclose easements, shared roads, others using the land (SVLA 2B(2) vii, ix).'), T('Đặt preliminary title report sớm để thấy easement đã ghi.', 'Order the preliminary title report early to see recorded easements.')],
        ['access', 1, T('Khai đất không có lối vào hợp pháp (SVLA 2B(2) viii).', 'Disclose that there is no legal access (SVLA 2B(2) viii).'), T('Hỏi attorney/title về xin easement lối đi trước khi list.', 'Ask an attorney/title about securing an access easement before listing.')],
        ['bound', 1, T('Khai tranh chấp ranh giới, lấn ranh (SVLA 2B(2) ix).', 'Disclose boundary disputes and encroachments (SVLA 2B(2) ix).'), T('Thuê land surveyor cắm mốc, làm survey.', 'Hire a land surveyor to stake corners and survey.')],
        ['soil', 1, T('Khai đất fill, sụt lở, ô nhiễm (SVLA 2B(2) vi, x).', 'Disclose fill, slides or contamination (SVLA 2B(2) vi, x).'), T('Cân nhắc báo cáo địa chất (geotech) hoặc Phase I môi trường <span class="tag">Thực hành</span>.', 'Consider a geotechnical report or a Phase I environmental report <span class="tag">Practice</span>.')],
        ['eco', 1, T('Khai loài được bảo vệ, wetland (SVLA 2B(2) v).', 'Disclose protected species and wetlands (SVLA 2B(2) v).'), T('Hỏi county planning: có cần khảo sát sinh học, giấy phép chặt cây không.', 'Ask county planning about biological surveys and tree permits.')],
        ['farm', 0, T('Khai Williamson Act và Right to Farm (SVLA 2B(2) ii, iv).', 'Disclose Williamson Act and Right to Farm (SVLA 2B(2) ii, iv).'), T('Xin bản hợp đồng Williamson Act từ county assessor.', 'Get the Williamson Act contract from the county.')],
        ['zone', 1, T('Khai vấn đề zoning, vi phạm (SVLA 2B(2) xii).', 'Disclose zoning issues and violations (SVLA 2B(2) xii).'), T('Xin city/county planning xác nhận zoning và được xây gì.', 'Get city/county planning to confirm zoning and what can be built.')],
        ['tax', 0, T('Đưa giấy Mello-Roos/bond 1915 và tài liệu HOA (SVLA 2B(4), 2B(5)).', 'Deliver the Mello-Roos/1915 bond notice and HOA documents (SVLA 2B(4), 2B(5)).'), T('Xin tài liệu HOA ngay bây giờ, đừng đợi có buyer.', 'Request HOA documents now, not after you find a buyer.')],
        ['lease', 0, T('Khai mọi hợp đồng thuê, dịch vụ đang có (SVLA 2B(3)).', 'Disclose every existing lease and service contract (SVLA 2B(3)).'), T('Gom bản hợp đồng thuê, ngày hết hạn, có chuyển cho buyer được không.', 'Collect the lease copies, end dates, and whether they transfer.')],
        ['foreign', 0, T('tình trạng cư trú cho escrow (SVLA 4A). Không có miễn trừ thì liên bang giữ 15% (FIRPTA), California thường 3⅓% giá bán.', 'your residency status to escrow (SVLA 4A). Without an exemption, federal FIRPTA withholds 15% and California usually 3⅓% of the price.'), T('Gặp CPA trước khi list để tính tiền bị giữ và xin giảm nếu được.', 'See a CPA before listing to estimate withholding and apply for a reduction if eligible.')]
      ];
      const on = M.filter(m => v[m[0]]);
      const red = on.filter(m => m[1]).length;
      const base = [T('Luôn luôn: khai mọi chuyện quan trọng mình biết, bằng giấy (SVLA 2A).', 'Always: disclose every known material fact in writing (SVLA 2A).'),
        T('Luôn luôn: điền VLQ (T504) và đặt báo cáo NHD.', 'Always: complete the VLQ (T504) and order an NHD report.')];
      if (!on.length) return { big: T('0 red flag', '0 red flags'), sub: T('Chưa đánh dấu gì. Vẫn còn 2 việc lúc nào cũng phải làm:', 'Nothing ticked. Two things still always apply:'), items: base };
      const cut = s => { s = s.replace(/^(Khai|Disclose) /, ''); return s.charAt(0).toUpperCase() + s.slice(1); };
      const items = base.concat(on.map(m => '<b>' + T('Khai', 'Disclose') + ':</b> ' + cut(m[2]) + '<br><b>' + T('Chuẩn bị', 'Prepare') + ':</b> ' + m[3] + (m[1] ? ' <span class="tag">Red flag</span>' : '')));
      const big = red + ' red flag' + (vi ? '' : (red === 1 ? '' : 's')) + ' · ' + on.length + T(' chuyện phải khai', ' items to disclose');
      const sub = red >= 2 ? T('Nhiều red flag: buyer sẽ trả giá thấp hoặc đòi thời gian điều tra dài. Chuẩn bị giấy tờ trước khi list.', 'Several red flags: expect lower offers or longer investigation periods. Prepare papers before listing.')
        : red === 1 ? T('Có 1 red flag. Khai rõ ngay từ đầu, kèm giấy tờ, buyer sẽ đỡ sợ hơn.', 'One red flag. Disclose it up front with documents and buyers worry less.')
        : T('Không có red flag lớn. Vẫn khai đủ từng mục bên dưới.', 'No major red flags. Still disclose each item below.');
      return { big, sub, bad: red >= 2, items };
    });
const UI={
 vi:{eb:"Ken Lam Library · Giải nghĩa Forms",lang:"English",vidH:"Xem 45 giây trước",vidP:"Clip ngắn tóm form này. Không tiếng, có chữ. Xem xong rồi đi từng phần bên dưới.",walkH:"Đi từng phần của form",walkP:"Hình chụp thật từ form (địa chỉ đã đổi thành ví dụ 1234 Example Lane). Chấm đỏ khớp với số giải thích bên dưới.",prev:"← Trước",nxt:"Tiếp →",zoom:"Phóng to trang",hint:"Kéo ngang để coi hết",ex:"Ví dụ với 1234 Example Lane",warn:"Coi chừng",toolH:"Tool: thử với nhà của anh chị",mythH:"Nhiều người hiểu sai",nextH:"Bước tiếp theo",mail:"Email kết quả cho Ken",sms:"Nhắn Ken",vbtn:"Xem video 45 giây",src:"Nguồn",upd:"Cập nhật",allF:"Mọi forms giải nghĩa",allT:"Tất cả tools",disc:"Trang này giải thích cho dễ hiểu, không thay form gốc và không phải tư vấn pháp lý hay thuế. Hình trích từ form để minh họa. Chuyện tranh chấp, đứng tên, thuế: hỏi luật sư hoặc CPA.",step:"Phần",of:"/",keys:{k1:"Ai điền / ký",k2:"Khi nào gặp",k3:"Số trang",k4:"Luật nào bắt"}},
 en:{eb:"Ken Lam Library · Forms explained",lang:"Tiếng Việt",vidH:"Watch the 45-second version first",vidP:"A short clip that sums up this form. No sound, on-screen text in Vietnamese. Then walk through it part by part below.",walkH:"Walk through the form",walkP:"Real images from the form (the address was changed to the example 1234 Example Lane). Red pins match the numbered notes.",prev:"← Back",nxt:"Next →",zoom:"Open full page",hint:"Swipe sideways to see it all",ex:"Example: 1234 Example Lane",warn:"Watch out",toolH:"Tool: try it with your home",mythH:"What people get wrong",nextH:"Next steps",mail:"Email my result to Ken",sms:"Text Ken",vbtn:"Watch the 45-second video",src:"Sources",upd:"Updated",allF:"All forms explained",allT:"All tools",disc:"Plain-language explanation only. It does not replace the actual form and is not legal or tax advice. Form images are shown for illustration. For disputes, title or tax questions, ask an attorney or CPA.",step:"Part",of:"/",keys:{k1:"Who fills / signs",k2:"When you see it",k3:"Pages",k4:"Required by"}}
};
let lang='vi';try{const s=localStorage.getItem('kl_lang');if(s==='en'||s==='vi')lang=s;}catch(e){}
const qs=new URLSearchParams(location.search);if(qs.get('lang')==='en'||qs.get('lang')==='vi')lang=qs.get('lang');
const $=id=>document.getElementById(id);
const L=o=>o==null?'':(typeof o==='string'?o:(o[lang]??o.vi??''));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur=0, last=null;
function fmtMoney(n){return '$'+Math.round(n).toLocaleString('en-US')}
function fmtDate(d){if(!(d instanceof Date)||isNaN(d))return '—';return lang==='vi'?(String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()):d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function parseDate(s){if(!s)return null;const [y,m,dd]=s.split('-').map(Number);return new Date(y,m-1,dd)}
const H={fmtMoney,fmtDate,addDays,parseDate,L:o=>L(o),lang:()=>lang};

function renderStatic(){
  const u=UI[lang];document.documentElement.lang=lang;
  document.title=L(FORM.title)+' · Ken Lam Tools';
  $('eb').textContent=u.eb;$('lang').textContent=u.lang;
  $('code').textContent=FORM.code+' · '+FORM.form+' · '+FORM.rev;
  $('h1').textContent=L(FORM.title);$('one').innerHTML=L(FORM.one);
  $('facts').innerHTML=['k1','k2','k3','k4'].map((k,i)=>'<div><b>'+u.keys[k]+'</b><span>'+L(FORM.facts[i])+'</span></div>').join('');
  $('eli').innerHTML=L(FORM.eli10);
  ['vidH','vidP','walkH','walkP','toolH','mythH','nextH','mail','sms','vbtn','upd','allF','allT','disc'].forEach(k=>$(k).textContent=u[k]);
  $('prev').textContent=u.prev;$('nxt').textContent=u.nxt;
  $('srcL').innerHTML=u.src+': '+FORM.sources.map(s=>'<a href="'+s.u+'" target="_blank" rel="noopener">'+esc(s.t)+'</a>').join(' · ');
  $('myths').innerHTML=FORM.myths.map(m=>'<div class="warn"><b>'+L(m.t)+'</b>'+L(m.d)+'</div>').join('');
  $('next').innerHTML=FORM.next.map(n=>'<li><a href="'+n.href+'"><b>'+L(n.t)+'</b><br><span style="color:var(--muted);font-size:15px">'+L(n.d)+'</span></a></li>').join('');
  $('toolP').innerHTML=L(FORM.tool.intro);
  renderInputs();renderStep();compute();
}
function renderInputs(){
  const vals=readInputs(true);
  $('inputs').innerHTML=FORM.tool.inputs.map(f=>{
    const lab=L(f.label), hint=f.hint?'<small>'+L(f.hint)+'</small>':'';
    if(f.type==='check')return '<label class="chk" style="grid-column:1/-1"><input type="checkbox" id="f_'+f.id+'"'+((vals[f.id]??f.def)?' checked':'')+'><span>'+lab+hint+'</span></label>';
    if(f.type==='select')return '<label class="fld" for="f_'+f.id+'">'+lab+'<select id="f_'+f.id+'">'+f.options.map(o=>'<option value="'+o.v+'"'+(String(vals[f.id]??f.def)===String(o.v)?' selected':'')+'>'+L(o.l)+'</option>').join('')+'</select>'+hint+'</label>';
    const v=vals[f.id]??f.def??'';
    return '<label class="fld" for="f_'+f.id+'">'+lab+'<input id="f_'+f.id+'" type="'+f.type+'"'+(f.type==='number'?' inputmode="decimal"':'')+(f.min!=null?' min="'+f.min+'"':'')+(f.max!=null?' max="'+f.max+'"':'')+(f.step!=null?' step="'+f.step+'"':'')+' value="'+esc(v)+'">'+hint+'</label>';
  }).join('');
  $('inputs').querySelectorAll('input,select').forEach(e=>e.addEventListener('input',compute));
}
function readInputs(soft){
  const o={};FORM.tool.inputs.forEach(f=>{const e=$('f_'+f.id);if(!e){if(!soft)o[f.id]=f.def;return}
    o[f.id]=f.type==='check'?e.checked:(f.type==='number'?(e.value===''?null:Number(e.value)):e.value)});return o;
}
function compute(){
  let r;try{r=FORM.tool.compute(readInputs(false),H)}catch(e){r={big:'—',items:[]};console.error(e)}
  last=r;
  $('res').innerHTML='<div class="big'+(r.bad?' bad':'')+'">'+r.big+'</div>'+(r.sub?'<div class="sub">'+r.sub+'</div>':'')+(r.items&&r.items.length?'<ul>'+r.items.map(i=>'<li>'+i+'</li>').join('')+'</ul>':'');
}
function renderStep(){
  const u=UI[lang],s=FORM.steps[cur];
  $('chips').innerHTML=FORM.steps.map((x,i)=>'<button type="button" class="chip'+(i<cur?' done':'')+'" data-i="'+i+'"'+(i===cur?' aria-current="step"':'')+'>'+(i+1)+'. '+L(x.short||x.title)+'</button>').join('');
  const pins=(s.pins||[]).map((p,i)=>(p.box?'<span class="mark" style="left:'+p.box[0]+'%;top:'+p.box[1]+'%;width:'+p.box[2]+'%;height:'+p.box[3]+'%"></span>':'')+'<span class="pin" style="left:'+p.x+'%;top:'+p.y+'%">'+(i+1)+'</span>').join('');
  $('step').innerHTML='<div class="ref">'+u.step+' '+(cur+1)+' · '+esc(s.ref||'')+'</div><h3>'+L(s.title)+'</h3>'+(s.intro?'<p>'+L(s.intro)+'</p>':'')+
   (s.crop?'<div class="desk"><div class="scroll"><div class="sheet"><img src="'+s.crop+'" alt="'+esc(L(s.title))+'" loading="lazy">'+pins+'</div></div><div class="zoom"><span class="hint">'+u.hint+'</span><button type="button" id="zbtn" data-p="'+s.page+'">'+u.zoom+' ↗</button></div></div>':'')+
   '<ol class="pins">'+(s.pins||[]).map((p,i)=>'<li><span class="n">'+(i+1)+'</span><div><b class="pt">'+L(p.t)+'</b>'+L(p.d)+'</div></li>').join('')+'</ol>'+
   (s.example?'<div class="ex"><b>'+u.ex+'</b>'+L(s.example)+'</div>':'')+
   (s.warn?'<div class="warn"><b>'+u.warn+'</b>'+L(s.warn)+'</div>':'');
  $('cnt').textContent=(cur+1)+u.of+FORM.steps.length;
  $('prev').disabled=cur===0;$('nxt').disabled=cur===FORM.steps.length-1;
  const z=$('zbtn');if(z)z.onclick=()=>{$('lbImg').src=z.dataset.p;$('lb').hidden=false};
}
$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;cur=+b.dataset.i;renderStep()});
$('prev').onclick=()=>{if(cur>0){cur--;renderStep();$('walkH').scrollIntoView({behavior:'smooth'})}};
$('nxt').onclick=()=>{if(cur<FORM.steps.length-1){cur++;renderStep();$('walkH').scrollIntoView({behavior:'smooth'})}};
$('lbX').onclick=()=>{$('lb').hidden=true};
$('lang').onclick=()=>{lang=lang==='vi'?'en':'vi';try{localStorage.setItem('kl_lang',lang)}catch(e){}renderStatic()};
$('mail').onclick=()=>{
  const tmp=document.createElement('div');tmp.innerHTML=(last?last.big+'\n'+(last.sub||'')+'\n'+(last.items||[]).join('\n'):'');
  const vals=readInputs(false);
  const lines=FORM.tool.inputs.map(f=>'- '+L(f.label).replace(/<[^>]+>/g,'')+': '+(f.type==='check'?(vals[f.id]?'✓':'—'):(f.type==='select'?L((f.options.find(o=>String(o.v)===String(vals[f.id]))||{}).l):vals[f.id]))).join('\n');
  const subj=(lang==='vi'?'Hỏi về form ':'Question about form ')+FORM.form+' ('+FORM.code+')';
  const body=(lang==='vi'?'Chào anh Ken,\n\nEm vừa dùng tool '+FORM.code+'. Em nhập:\n':'Hi Ken,\n\nI just used tool '+FORM.code+'. My inputs:\n')+lines+'\n\n'+(lang==='vi'?'Kết quả:\n':'Result:\n')+tmp.textContent+'\n\n'+(lang==='vi'?'Em muốn hỏi thêm: ':'My question: ');
  location.href='mailto:ken@kenlamrealty.com?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
};
$('sms').href='sms:4086662825?&body='+encodeURIComponent('Chào anh Ken, em hỏi về form '+FORM.form+' ('+FORM.code+').');
renderStatic();
</script>
