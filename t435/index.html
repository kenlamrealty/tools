"e0t": "1. Vì sao cần bảo hiểm nhà",
"e0b": "Nhà bị cháy, bị thiên tai hay tai nạn làm hư, bảo hiểm có thể giúp trả tiền sửa hoặc xây lại. Không có bảo hiểm thì chủ nhà tự gánh hết. Mua bằng tiền vay (hoặc refinance) thì lender bắt phải có bảo hiểm. Cháy, lụt, động đất có thể nằm trong policy chính, phải mua thêm (rider), hoặc phải mua policy riêng — hỏi broker bảo hiểm.",
"e1t": "2. Bảo hiểm và hợp đồng mua",
"e1b": "Hợp đồng mua có thể cho bạn quyền hủy trong một số ngày nếu không mua được hoặc không kham nổi bảo hiểm. Quyền này có thể là contingency riêng về bảo hiểm, hoặc nằm chung trong contingency điều tra. Bỏ contingency trước khi biết có bảo hiểm và giá bao nhiêu là làm ngược lời khuyên của broker. Nhà có HOA: lender và bạn cần biết HOA có bảo hiểm đủ cho phần HOA lo không.",
"e2t": "3. Thị trường bảo hiểm California",
"e2b": "Một số hãng ngưng bán policy mới, số khác giới hạn số lượng và khu vực, vì chi phí xây lại tăng và thiên tai nhiều hơn. Nhưng có hơn 50 hãng được phép bán ở California, nên một hãng từ chối chưa phải hết đường. Broker bảo hiểm còn có thể tìm hãng non-admitted (hãng không thuộc nhóm được cấp phép thông thường). Tìm được policy vừa túi tốn thời gian — nên hỏi sớm nhất có thể.",
"e3t": "4. Điều kiện hãng bảo hiểm đặt ra",
"e3b": "Nhiều hãng đòi nhà đạt chuẩn tối thiểu mới bán, hoặc giữ quyền hủy sau khi đã bán nếu chuẩn không được xác nhận. Ví dụ form nêu: cấm dây điện knob and tube, yêu cầu về loại ống nước, tuổi và chất lượng mái hay móng, tay vịn, chỗ dễ vấp té, và defensible space (khoảng trống quanh nhà để chống cháy).",
"e4t": "5. Nguồn trợ giúp",
"e4b": "California Department of Insurance (DOI) có trang về bảo hiểm nhà: 10 mẹo tìm bảo hiểm, danh sách liên lạc các hãng, công cụ Home Insurance Finder, cách liên lạc DOI, và gợi ý nếu không tìm được bảo hiểm. Link: insurance.ca.gov (mục Residential).",
"e5t": "6. Lời khuyên của broker và chỗ ký",
"e5b": "Form khuyên người mua tìm hiểu bảo hiểm sớm và hỏi một chuyên gia bảo hiểm do mình chọn, trước khi bỏ contingency. Form cũng nói thẳng: agent nhà đất không có chuyên môn về bảo hiểm. Người mua ký là đã đọc, hiểu và nhận một bản.",
"ex_story": "Anh Tâm & chị Hoa Nguyễn mua căn 1234 Example Lane, San Jose, CA 95100 của bà Mai Trần, giá ví dụ $1,200,000. Offer được chấp nhận ngày 11/10/2026, contingency 17 ngày (ví dụ) → hạn chót 11/27/2026. Ngay hôm đó Ken đưa form BHIA và dặn gọi bảo hiểm liền. Nhà xây 1958, mái khoảng 22 năm. Inspection thấy dây điện knob and tube trong attic.",
"ex_mh": "Form BHIA (mô phỏng) + sổ theo dõi bảo hiểm",
"ex_end": "Nếu anh chị đợi tới ngày 26 mới gọi bảo hiểm, họ chỉ còn 1 ngày để chọn: bỏ contingency mà chưa biết có bảo hiểm, hay hủy. Gọi sớm, họ có thời gian thương lượng với bà Mai bằng giấy tờ thật trong tay.",

"ken": "Bây giờ tôi dặn khách gọi bảo hiểm ngay ngày offer được nhận. Không đợi inspection. Nhiều người nghĩ vậy là vội. Tôi nghĩ ngược lại: inspection cho bạn biết nhà có gì hư, còn bảo hiểm cho bạn biết có ai chịu bảo vệ căn nhà đó không. Cái sau có khi quan trọng hơn. Và đừng hỏi agent \"chỗ này mua bảo hiểm được không\" — form nói đúng, đó không phải nghề của tụi tôi. Hỏi broker bảo hiểm.",

"sub": "Like buying a car: don't hand over all the money before you know someone will insure it and at what price. The BHIA form reminds buyers to shop for insurance early, before giving up the right to back out.",

"qa_who": "The buyer's agent gives it to the buyer.",
"qa_sign": "Only the buyer signs: read, understood, received a copy.",
"qa_when": "Early in the purchase. The form says shop for insurance as early as possible, before removing the related contingency.",
"qa_req": "A C.A.R. advisory, not a contract. Signing confirms you were advised.",

"qa_rev": "6/24",
"e0t": "1. Why property insurance matters",
"e0b": "If the home is damaged by fire, disaster or accident, insurance may help pay to repair or rebuild. Without it, the owner pays everything. With a loan or refinance, the lender requires a policy. Fire, flood and earthquake may be in the main policy, need a rider, or need a separate policy — ask an insurance broker.",
"e1t": "2. Insurance and the purchase contract",
"e1b": "Your contract may let you cancel within a set time if you can't get or afford insurance. That right may be a specific insurance contingency or part of the investigation contingency. Removing it before you know availability and cost goes against the broker's advice. With an HOA, you and the lender will want to know the HOA is adequately insured for what it covers.",
"e2t": "3. California's insurance market",
"e2b": "Some carriers stopped writing new policies and others limit how many and where, due to rising rebuild costs and more disasters. But over 50 carriers are admitted in California, so one \"no\" isn't the end. A broker may also find a non-admitted carrier. Finding an affordable policy takes time — start as early as possible.",
"e3t": "4. Insurance conditions",
"e3b": "Many carriers require minimum physical standards before issuing, or reserve the right to cancel later if standards aren't confirmed. The form's examples: no knob-and-tube wiring, plumbing material rules, roof or foundation age and quality, handrails, trip hazards and defensible space.",
"e4t": "5. Resources",

let lang='vi'; try{ if(localStorage.getItem('kl_lang')==='en') lang='en'; }catch(e){}
const $=id=>document.getElementById(id);
const fmt=n=>'$'+Math.round(n).toLocaleString('en-US');
const fill=(s,v)=>String(s).replace(/\{(\w+)\}/g,(m,k)=>v[k]??m);
const strip=s=>String(s).replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&nbsp;/g,' ');
let last={sum:'',r:''};
function applyLang(){
  const d=I18N[lang];
  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.getAttribute('data-i'); if(typeof d[k]==='string') el.innerHTML=d[k];});
  $('langBtn').textContent=d.lang; document.documentElement.lang=lang; document.title=d.doc_title;
  calc();
}
function done(){ const d=I18N[lang];
  $('smsBtn').href='sms:4086662825?&body='+encodeURIComponent(fill(d.sms,last)); }
$('langBtn').onclick=()=>{lang=lang==='vi'?'en':'vi'; try{localStorage.setItem('kl_lang',lang)}catch(e){} applyLang();};
$('emailBtn').onclick=()=>{$('form').classList.toggle('open'); if($('form').classList.contains('open')) $('fname').focus();};
$('sendBtn').onclick=()=>{
  const d=I18N[lang], n=$('fname').value.trim()||'—', e=$('femail').value.trim()||'—', ph=$('fphone').value.trim()||'—';
  const v=Object.assign({},last,{n,e,ph});
  /* LEAD: email tới ken@kenlamrealty.com (FUB email parsing). */
  const body=fill(d.mail_head,v)+'\n\n'+last.sum+'\n\n'+d.mail_foot;
  const href='mailto:ken@kenlamrealty.com?subject='+encodeURIComponent(fill(d.subj,v))+'&body='+encodeURIComponent(body);
  window.__lastMailto=href;
  const a=document.createElement('a'); a.href=href; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove();
  $('sent').hidden=false;
};
$('copyBtn').onclick=async()=>{ try{ await navigator.clipboard.writeText('4086662825'); $('copyBtn').textContent='✓'; }catch(e){ const r=document.createRange(); r.selectNodeContents($('copyBtn').previousElementSibling); const s=getSelection(); s.removeAllRanges(); s.addRange(r);} };


let fire=0, roof=0;
const ymdStr=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
(function(){ $('acc').value=ymdStr(new Date()); $('days').value=CFG.DEF_DAYS; })();
function conds(){ return [...document.querySelectorAll('#condBox input:checked')].map(x=>x.value); }
function model(i){
  let s=CFG.W.fire[i.fire]+CFG.W.roof[i.roof];
  i.cond.forEach(k=>s+=CFG.W[k]||0);
  const lv=s<=CFG.LV[0]?0:s<=CFG.LV[1]?1:s<=CFG.LV[2]?2:3;
  let dl=null,q=null;
  if(i.acc&&i.days>0){ dl=new Date(i.acc+'T12:00:00'); dl.setDate(dl.getDate()+i.days);
    q=new Date(dl); q.setDate(q.getDate()-Math.min(CFG.QUOTE_BUFFER,Math.max(0,i.days-1))); }
  const st=['call','doi'];
  if(i.fire===2) st.push('fire'); if(i.fire===1) st.push('fireu');
  if(i.roof===2) st.push('roof'); if(i.cond.includes('fdn')) st.push('fdn');
  ['knob','pipe','safe','hoa'].forEach(k=>{ if(i.cond.includes(k)) st.push(k); });
  st.push('keep','after');
  return {score:s,lv,dl,q,st};
}
function calc(){
  const d=I18N[lang], i={acc:$('acc').value, days:parseInt($('days').value,10)||0, fire, roof, cond:conds()};
  const m=model(i), loc=lang==='vi'?'vi-VN':'en-US', nice=x=>x.toLocaleDateString(loc,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
  let left='—';
  if(m.dl){ $('oDl').textContent=m.dl.toLocaleDateString(loc,{month:'short',day:'numeric',year:'numeric'});
    const t=new Date(); t.setHours(12,0,0,0); const n=Math.round((m.dl-t)/864e5);
    left=n<0?d.past:(n===0?d.today:fill(d.dleft,{d:n})); $('oQuote').textContent=m.q.toLocaleDateString(loc,{month:'short',day:'numeric'});
    const ymd=x=>ymdStr(x).replace(/-/g,''); const e=new Date(m.dl); e.setDate(e.getDate()+1);
    $('gcalLink').href='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(d.gcal_t)+'&dates='+ymd(m.dl)+'/'+ymd(e)+'&details='+encodeURIComponent('https://tools.kenlamrealty.com/t435/');
    $('gcalLink').textContent=d.gcal; $('gcalLink').classList.remove('hide');
  } else { $('oDl').textContent='—'; $('oQuote').textContent='—'; $('gcalLink').classList.add('hide'); left=d.nodate; }
  $('oLeft').textContent=left;
  const lvEl=$('oLv'); lvEl.textContent=d.LV[m.lv]; lvEl.className='lvl l'+m.lv;
  $('oMeter').innerHTML=[0,1,2,3].map(k=>'<i class="'+(k<=m.lv?'on l'+m.lv:'')+'"></i>').join('');
  $('oNote').textContent=d.NT[m.lv];
  $('stepList').innerHTML=m.st.map(k=>'<li>'+d.S[k]+'</li>').join('');
  const fx=[d.l_fire+' '+[d.f0,d.f1,d.f2][fire], d.l_roof+' '+[d.ro0,d.ro1,d.ro2][roof]].concat(i.cond.map(k=>strip(d['c_'+k])));
  const dls=m.dl?nice(m.dl):'—';
  last={dl:dls,lv:d.LV[m.lv],r:dls};
  last.sum=fill(d.S0,{a:i.acc||'—',dy:i.days,dl:dls,lf:left,q:m.q?nice(m.q):'—',lv:d.LV[m.lv],fx:fx.join('; '),st:m.st.map((k,n)=>(n+1)+'. '+strip(d.S[k])).join('\n')});
  done();
}
function seg(id,cb){ $(id).addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return;
  $(id).querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false')); cb(+b.dataset.v); calc();}); }
seg('fireSeg',v=>fire=v); seg('roofSeg',v=>roof=v);
['acc','days'].forEach(id=>$(id).addEventListener('input',calc));
$('condBox').addEventListener('change',calc);
window.__model=model;

applyLang();
</script>
