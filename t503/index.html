<script>
const FORM = {"code": "T503", "form": "VLPA", "rev": "C.A.R. Form VLPA, Revised 6/26", "title": {"vi": "VLPA: Hợp đồng mua đất trống", "en": "VLPA: The vacant land purchase agreement"}, "one": {"vi": "VLPA là hợp đồng mua <b>đất trống</b> của C.A.R., 17 trang. Nó ghi giá, tiền cọc, ngày close, và mặc định 17 ngày cho mọi contingency, trong đó có việc tự đi tìm hiểu zoning, đất, điện nước.", "en": "The VLPA is C.A.R.'s 17-page contract for buying <b>vacant land</b>. It sets the price, deposit, closing date, and a default 17 days for every contingency, including your own checks on zoning, soil and utilities."}, "eli10": {"vi": "<b>Nói cho dễ hiểu:</b> mua đất trống giống mua một miếng ruộng chưa có nhà. Không có nhà để coi hư chỗ nào, nên câu hỏi là: miếng đất này có <b>được</b> xây không, có đường vô không, có điện nước không, đất có lún không. VLPA cho mình 17 ngày để tìm ra hết, rồi mới quyết định mua hay rút.", "en": "<b>In plain words:</b> buying vacant land is like buying an empty field. There is no house to inspect, so the questions are: are you <b>allowed</b> to build, is there a road in, is there power and water, will the ground hold. The VLPA gives you 17 days to find out, then you decide to keep going or cancel."}, "facts": [{"vi": "Buyer và agent viết offer. Seller ký nhận (40) hoặc counter.", "en": "Buyer and agent write the offer. Seller accepts (40) or counters."}, {"vi": "Khi mua lô đất trống, đất nông trại, đất để xây.", "en": "When buying a vacant lot, farm land, or land to build on."}, {"vi": "17 trang (file 25 trang: kèm AD, FHDA, BHIA, WFA, BVLIA)", "en": "17 pages (the 25-page file adds AD, FHDA, BHIA, WFA, BVLIA)"}, {"vi": "Hợp đồng C.A.R. · Civil Code §1671 (liquidated damages), §1057.3 (giải cọc)", "en": "C.A.R. contract · Civil Code §1671 (liquidated damages), §1057.3 (deposit release)"}], "steps": [{"title": {"vi": "Mục 1: Ai mua, miếng đất nào", "en": "Paragraph 1: Who is buying, which parcel"}, "short": {"vi": "Offer", "en": "Offer"}, "ref": "VLPA trang 1 · Mục 1", "crop": "s01.jpg", "pins": [{"t": {"vi": "Tên người mua", "en": "Buyer's name"}, "d": {"vi": "Mua bằng tên cá nhân, corporation, LLC hay trust. Mua bằng LLC thì phải có giấy chứng minh quyền ký trong 3 ngày (mục 31, 3N(4)).", "en": "Individual, corporation, LLC or trust. Buying in an LLC? Proof of signing authority is due in 3 days (paragraph 31, 3N(4))."}, "x": 10.29, "y": 21.88}, {"box": [11.27, 47.87, 15.09, 15.49], "t": {"vi": "APN: số thửa đất", "en": "APN: the parcel number"}, "d": {"vi": "Đất trống nhiều khi <b>không có địa chỉ</b>. APN là thứ xác định đúng miếng đất. Ghi sai APN là mua lộn lô.", "en": "Vacant land often has <b>no street address</b>. The APN identifies the parcel. A wrong APN means the wrong lot."}, "x": 10.29, "y": 55.62}, {"t": {"vi": "Địa chỉ bưu điện ≠ thành phố", "en": "Mailing city ≠ jurisdiction"}, "d": {"vi": "Địa chỉ ghi “San Jose” nhưng đất có thể nằm ở vùng county quản lý (unincorporated). Zoning và permit lúc đó là của County, không phải City.", "en": "A “San Jose” mailing address can sit in unincorporated county land. Then zoning and permits come from the County, not the City."}, "x": 16.97, "y": 71.19}], "example": {"vi": "Anh Tâm mua lô đất ở 1234 Example Lane, San Jose. Lô này chưa có số nhà chính thức. Agent ghi APN lấy từ tax bill và bản đồ assessor, rồi đối chiếu với preliminary title report.", "en": "Mr. Tam buys a lot at 1234 Example Lane, San Jose, which has no official house number yet. The agent writes the APN from the tax bill and assessor map, then checks it against the preliminary title report."}, "page": "p03.jpg"}, {"title": {"vi": "Mục 3A–3D: Giá, ngày close, hạn offer, tiền cọc", "en": "3A–3D: Price, close, offer expiration, deposit"}, "short": {"vi": "Giá & cọc", "en": "Price"}, "ref": "VLPA trang 1 · Mục 3A–3D", "crop": "s02.jpg", "pins": [{"t": {"vi": "3A · Giá mua", "en": "3A · Purchase price"}, "d": {"vi": "Có ô “All Cash”. Đất trống ít ngân hàng cho vay, nhiều người mua cash hoặc seller financing (form SFA).", "en": "There is an “All Cash” box. Few lenders finance raw land, so many buyers pay cash or use seller financing (SFA)."}, "x": 19.07, "y": 34.03}, {"box": [20.05, 36.36, 15.54, 11.02], "t": {"vi": "3B · Close: form để trống", "en": "3B · Close: left blank"}, "d": {"vi": "Khác các mục khác, ngày close <b>không có số mặc định</b>. Phải ghi số ngày hoặc ngày cụ thể.", "en": "Unlike other terms, closing has <b>no default</b>. You must write a number of days or a date."}, "x": 19.07, "y": 41.87}, {"t": {"vi": "3C · Offer hết hạn", "en": "3C · Offer expires"}, "d": {"vi": "Mặc định: 3 ngày lịch sau khi buyer ký, 5 PM. Seller ký và giao lại trước giờ đó thì mới thành hợp đồng (39A).", "en": "Default: 3 calendar days after the buyer signs, at 5 PM. The seller must sign and deliver by then (39A)."}, "x": 43.65, "y": 54.15}, {"box": [20.05, 65.91, 14.91, 11.02], "t": {"vi": "3D(1) · Tiền cọc", "en": "3D(1) · Deposit"}, "d": {"vi": "Giao thẳng cho escrow trong <b>3 business days</b> (ngày làm việc, không phải ngày lịch), mặc định bằng wire.", "en": "Goes directly to escrow within <b>3 business days</b> (not calendar days), by wire unless stated."}, "x": 19.07, "y": 71.42}], "example": {"vi": "Lô đất 1234 Example Lane giá $650,000, cọc 3% = $19,500. Offer được nhận thứ Hai 02/03/2026. Cọc phải vào escrow trước hết thứ Năm 05/03.", "en": "The 1234 Example Lane lot: $650,000, 3% deposit = $19,500. Accepted Monday 03/02/2026. The deposit is due in escrow by the end of Thursday 03/05."}, "warn": {"vi": "Con số % cạnh tiền cọc chỉ để tính cho tiện, form ghi rõ nó <b>không phải điều khoản</b>. Số $ mới là số tính.", "en": "The % next to the deposit is for convenience only; the form says it is <b>not a contract term</b>. The $ amount controls."}, "page": "p03.jpg"}, {"title": {"vi": "Mục 3L: Các contingency và số ngày", "en": "3L: The contingencies and their days"}, "short": {"vi": "Contingency", "en": "Contingencies"}, "ref": "VLPA trang 2 · Mục 3L", es"}, "ref": "VLPA trang 7 · Mục 11H–11K", "crop": "s05.jpg", "pins": [{"t": {"vi": "Điều seller biết", "en": "What the seller knows"}, "d": {"vi": "Seller khai trong 7 ngày (3N(1)) những gì <b>thật sự biết</b>: kiện tụng, Williamson Act, hạn chế trong deed…", "en": "Within 7 days (3N(1)) the seller discloses what they <b>actually know</b>: lawsuits, Williamson Act, deed restrictions…"}, "x": 60.72, "y": 6.11}, {"box": [14.21, 43.16, 11.21, 6.16], "t": {"vi": "(8) · Đất không có đường vô", "en": "(8) · Landlocked"}, "d": {"vi": "Không có lối vào hợp pháp hay thực tế. Đất landlocked rất khó xây và khó bán lại.", "en": "No legal or physical access. Landlocked land is hard to build on and hard to resell."}, "x": 13.23, "y": 46.24}, {"t": {"vi": "(10)–(11) · Đất đắp, đất lún", "en": "(10)–(11) · Fill and soil"}, "d": {"vi": "Đất đắp, mỏ cũ, sạt, ngập, thoát nước kém. Đất đồi quanh San Jose hay gặp.", "en": "Fill, old mines, sliding, flooding, drainage. Common in the hills around San Jose."}, "x": 13.23, "y": 51.25}, {"t": {"vi": "(13) · Zoning", "en": "(13) · Zoning"}, "d": {"vi": "Vi phạm zoning, setback, dùng sai mục đích. Seller chỉ khai cái họ biết. Mình vẫn phải tự hỏi Planning.", "en": "Zoning or setback violations. The seller only discloses what they know. Still ask Planning yourself."}, "x": 13.23, "y": 58.77}], "example": {"vi": "Seller lô 1234 Example Lane khai: phía sau từng đắp đất năm 2010, có giấy grading permit. Anh Tâm đưa giấy đó cho geotechnical engineer coi trong 17 ngày.", "en": "The 1234 Example Lane seller discloses fill placed in 2010 with a grading permit. Mr. Tam gives it to a geotechnical engineer within the 17 days."}, "warn": {"vi": "Đất trống không dùng TDS. Seller dùng form <b>VLQ</b> (11K), cũng giao trong 7 ngày.", "en": "Vacant land doesn't use a TDS. The seller completes the <b>VLQ</b> (11K), also due in 7 days."}, "page": "p09.jpg"}, {"title": {"vi": "Mục 15G–15K: Buyer tự đi tìm hiểu", "en": "15G–15K: The buyer's own investigation"}, ate “feasibility” contingency. It all lives in L(5) Investigation, 17 days. Order slow items (soils, Phase I, survey) on day one."}, "page": "p11.jpg"}, {"title": {"vi": "Mục 32I: Cách đếm ngày", "en": "32I: How days are counted"}, "short": {"vi": "Đếm ngày", "en": "Counting"}, "ref": "VLPA trang 14 · Mục 32I–J", "crop": "s07.jpg", "pins": [{"t": {"vi": "Ngày nhận = ngày 0", "en": "Acceptance day = Day 0"}, "d": {"vi": "Nhận offer lúc nào trong ngày cũng vậy, ngày đó là ngày 0. Hôm sau là ngày 1.", "en": "Whatever time it's accepted, that date is Day 0. The next date is Day 1."}, "x": 20.87, "y": 28.82}, {"box": [73.06, 43.53, 13.79, 12.93], "t": {"vi": "Rơi vào cuối tuần, lễ", "en": "Weekend or holiday"}, "d": {"vi": "Hạn rơi vào thứ Bảy, Chủ Nhật, ngày lễ thì được làm tới hết ngày làm việc kế tiếp, 11:59 PM.", "en": "A deadline on a Saturday, Sunday or legal holiday moves to the next working day, 11:59 PM."}, "x": 72.08, "y": 50.0}, {"t": {"vi": "Close khi Recorder đóng cửa", "en": "COE when the Recorder is closed"}, "d": {"vi": "Ngày close mà Recorder, lender hay escrow nghỉ thì dời sang ngày cả ba mở cửa.", "en": "If the Recorder, lender or escrow is closed on COE, it moves to the next day all are open."}, "x": 10.29, "y": 81.77}, {"t": {"vi": "Cọc tính ngày làm việc", "en": "Deposit uses business days"}, "d": {"vi": "Mọi thứ đếm ngày lịch, <b>trừ tiền cọc</b>: 3 business days.", "en": "Everything is calendar days <b>except the deposit</b>: 3 business days."}, "x": 47.22, "y": 87.06}], "example": {"vi": "Offer được nhận thứ Sáu 06/11/2026. Ngày 1 là thứ Bảy 07/11. Cọc 3 business days: 09, 10, (11/11 Veterans Day nghỉ), 12/11 → hạn thứ Năm 12/11.", "en": "Accepted Friday 11/06/2026. Day 1 is Saturday 11/07. Deposit, 3 business days: 11/09, 11/10, (11/11 Veterans Day off), 11/12 → due Thursday 11/12."}, "page": "p16.jpg"}, {"title": {"vi": "Mục 36–38: Mất cọc, mediation, arbitration", "en": "36–38: Losing the deposit, mediation, arbitration"}, "short": {"vi": "Tranh chấp", "en": "Disputes"}, "ref": "VLPA trang 15 · Mục 36–38", "crop": "s08.jpg", "pins": [{"box": [8.33, 10.4, 20.41, 7.86], "t": {"vi": "36 · Liquidated damages", "en": "36 · Liquidated damages"}, "d": {"vi": "Hai bên cùng ký tắt thì buyer bỏ ngang (lỗi buyer) seller giữ <b>số cọc đã đóng</b>. Không ký tắt thì seller phải đi kiện chứng minh thiệt hại.", "en": "If both initial, a buyer who defaults loses <b>the deposit actually paid</b>. Without initials, the seller must sue and prove damages."}, "x": 7.35, "y": 14.33}, {"t": {"vi": "Tăng cọc = ký lại", "en": "Bigger deposit = sign again"}, "d": {"vi": "Cọc tăng thêm sau này phải ký form DID riêng thì mới tính vào liquidated damages.", "en": "An increased deposit needs a separate DID form to count as liquidated damages."}, "x": 26.44, "y": 20.91}, {"t": {"vi": "37 · Hòa giải trước", "en": "37 · Mediate first"}, "d": {"vi": "Bắt buộc dù không ký tắt arbitration. Ai đi kiện mà không hòa giải trước thì mất quyền đòi tiền luật sư.", "en": "Applies even without the arbitration initials. Sue without mediating first and you lose attorney fees."}, "x": 7.35, "y": 39.75}, {"t": {"vi": "38 · Arbitration", "en": "38 · Arbitration"}, "d": {"vi": "Chỉ áp dụng khi cả hai ký tắt. Ký là bỏ quyền ra tòa, bỏ bồi thẩm đoàn.", "en": "Only if both initial. Initialing gives up court and a jury trial."}, "x": 69.39, "y": 92.75}], "warn": {"vi": "Hợp đồng nhà ở 1–4 căn (RPA) giới hạn tiền giữ ở 3% giá nếu buyer định ở. VLPA ghi “số cọc đã đóng”, không có câu 3% đó. Cọc lớn thì hỏi luật sư trước khi ký tắt.", "en": "The 1–4 unit RPA caps the kept deposit at 3% for owner-occupants. The VLPA says “the deposit actually paid” with no 3% line. Large deposit? Ask an attorney before initialing."}, "page": "p17.jpg"}], "tool": {"intro": {"vi": "Nhập ngày offer được nhận. Tool đếm <b>đúng số ngày in sẵn trong VLPA</b> (khi ô “or ___” để trống), dời hạn rơi vào cuối tuần, ngày lễ, và tính tiền cọc.", "en": "Enter the acceptance date. The tool coun
