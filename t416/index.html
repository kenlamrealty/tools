<script id="kl-commas">
/* Ken Lam Realty: ô nhập tiền / sqft tự thêm dấu phẩy (1,200,000). Code cũ vẫn đọc .value ra số thuần. */
(function(){
  var d=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
  function fmt(v){
    var s=String(v==null?'':v).replace(/[^0-9.\-]/g,''),neg=s.charAt(0)==='-';
    s=s.replace(/-/g,'');
    var i=s.indexOf('.'),ip=i<0?s:s.slice(0,i),dp=i<0?'':s.slice(i).replace(/\./g,'');
    if(i>=0)dp='.'+dp;
    ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return (neg?'-':'')+ip+dp;
  }
  function want(el){
    if(el.type!=='number'||el.__klc)return false;
    var c=el.closest&&el.closest('.ctl');if(!c)return false;
    var pre=c.querySelector('.pre'),post=c.querySelector('.post');
    if(pre&&pre.textContent.indexOf('$')>-1)return true;
    if(post&&/^\s*(sqft|sq ?ft)\s*$/i.test(post.textContent))return true;
    return false;
  }
  function conv(el){
    if(!want(el))return;
    el.__klc=1;
    var cur=d.get.call(el),ph=el.getAttribute('placeholder');
    el.type='text';
    if(!el.getAttribute('inputmode'))el.setAttribute('inputmode','numeric');
    Object.defineProperty(el,'value',{configurable:true,
      get:function(){return d.get.call(this).replace(/,/g,'')},
      set:function(v){d.set.call(this,fmt(v))}});
    d.set.call(el,fmt(cur));
    if(ph&&/^[0-9.]{5,}$/.test(ph))el.setAttribute('placeholder',fmt(ph));
    el.addEventListener('input',function(){
      var raw=d.get.call(el),pos=el.selectionStart,n=0,k;
      for(k=0;k<pos;k++)if(/[0-9.]/.test(raw.charAt(k)))n++;
      var out=fmt(raw);
      if(out===raw)return;
      d.set.call(el,out);
      for(k=0,pos=0;k<out.length&&n>0;k++){pos=k+1;if(/[0-9.]/.test(out.charAt(k)))n--;}
      try{el.setSelectionRange(pos,pos)}catch(e){}
    });
  }
  function scan(r){
    if(r.nodeType!==1)return;
    if(r.tagName==='INPUT')conv(r);
    var l=r.querySelectorAll?r.querySelectorAll('input[type=number]'):[];
    for(var i=0;i<l.length;i++)conv(l[i]);
  }
  new MutationObserver(function(m){
    for(var i=0;i<m.length;i++)for(var j=0;j<m[i].addedNodes.length;j++)scan(m[i].addedNodes[j]);
  }).observe(document.documentElement,{childList:true,subtree:true});
  document.addEventListener('DOMContentLoaded',function(){scan(document.body)});
})();
</script>

function birnCalc(i){
  const o={notice:addDays(i.app,LAW.noticeDays),icr:null,cr:null,bad:!!(i.rep&&i.rep<i.app)};
  const hasIcr=i.type!=='credit', hasCr=i.type!=='icr';
  if(i.rep){ if(hasIcr&&i.box) o.icr=addBiz(i.rep,LAW.icrCopyBizDays); if(hasCr&&i.paid) o.cr=addDays(i.rep,LAW.creditCopyDays); }
  o.hasIcr=hasIcr; o.hasCr=hasCr; return o;
}
const CHK=[false,false,false,false,false];
function calc(){
  const type=$('rtype').value, paid=$('paid').value==='y', box=$('box').value==='y';
  const app=D($('dApp').value)||D('2026-11-10'), rep=D($('dRep').value);
  const r=birnCalc({type,paid,box,app,rep});
  const L=[];
  L.push([t('n_notice'),fill(t('v_notice'),{d:fdate(r.notice)})]);
  if(r.hasIcr) L.push([t('n_icr'),box?(rep?fill(t('v_icr'),{d:fdate(r.icr)}):t('v_needrep')):t('v_no')]);
  if(r.hasCr) L.push([t('n_cr'),paid?(rep?fill(t('v_cr'),{d:fdate(r.cr)}):t('v_needrep')):t('v_no')]);
  $('lines').innerHTML=L.map(x=>'<div class="line"><span class="n"><b>'+x[0]+'</b></span><span class="a w">'+x[1]+'</span></div>').join('');
  const copies=[r.icr,r.cr].filter(Boolean).sort((a,b)=>a-b);
  if(copies.length){$('bigK').textContent=t('k_copy');$('big').textContent=fdate(copies[0]);}
  else {$('bigK').textContent=t('k_notice');$('big').textContent=fdate(r.notice);}
  const b=$('badge'); const ent=(r.hasIcr&&box)||(r.hasCr&&paid); b.textContent=t(ent?'b_ok':'b_none'); b.className='badge '+(ent?'good':'');
  const R=['r_see','r_phone','r_help']; if(r.hasCr) R.push('r_cr'); R.push('r_dispute');
  $('rights').innerHTML=R.map(k=>'<li>'+t(k)+'</li>').join('');
  const n=[]; if(r.bad) n.push(t('x_bad')); if(r.icr) n.push(t('x_biz')); n.push(t('x_soft')); $('xNote').innerHTML=n.join('<br>');
  $('chk').innerHTML=['c1','c2','c3','c4','c5'].map((k,i)=>'<label><input type="checkbox" data-c="'+i+'"'+(CHK[i]?' checked':'')+'><span>'+t(k)+'</span></label>').join('');
  $('chk').querySelectorAll('input').forEach(el=>el.onchange=()=>{CHK[+el.dataset.c]=el.checked;run();});
  const k=CHK.filter(Boolean).length, cb=$('chkBadge');
  cb.textContent=k===5?fill(t('chk_ok'),{k,n:5}):fill(t('chk_miss'),{m:5-k}); cb.className='badge '+(k===5?'good':'bad');
  const o={ty:t('o_'+type),da:fdate(app),dr:rep?fdate(rep):'—',dn:fdate(r.notice),di:r.icr?fdate(r.icr):'—',dc:r.cr?fdate(r.cr):'—',ck:k+'/5'};
  OUT.txt=fill(t('out'),o); OUT.sms=fill(t('sms'),o);
}

const I18N={vi:Object.assign({},IC.vi,IP.vi),en:Object.assign({},IC.en,IP.en)};
let lang='vi';
try{ if(localStorage.getItem('kl_lang')==='en') lang='en'; }catch(e){}
const $=id=>document.getElementById(id);
const t=k=>I18N[lang][k];
const fill=(s,o)=>String(s).replace(/\{(\w+)\}/g,(m,k)=>o[k]??m);
const num=id=>{const v=parseFloat($(id).value);return isFinite(v)?v:0};
function D(s){if(!s)return null;const p=String(s).split('-').map(Number);if(p.length!==3||!p[0]||!p[1]||!p[2])return null;return new Date(Date.UTC(p[0],p[1]-1,p[2]));}
function addDays(d,n){return new Date(d.getTime()+n*864e5);}
function addBiz(d,n){let x=d;while(n>0){x=addDays(x,1);const w=x.getUTCDay();if(w!==0&&w!==6)n--;}return x;}
function fdate(d){if(!d)return '—';const y=d.getUTCFullYear(),m=String(d.getUTCMonth()+1).padStart(2,'0'),dd=String(d.getUTCDate()).padStart(2,'0');return lang==='vi'?dd+'/'+m+'/'+y:m+'/'+dd+'/'+y;}
const money=n=>'$'+(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
let OUT={txt:'',sms:''};
function renderStatic(){
  $('eli').innerHTML=t('eli').map(p=>'<p>'+p+'</p>').join('');
  $('mock').innerHTML=MOCK.map(p=>{const n=typeof p.n==='string'?t('para')+' '+p.n:p.n[lang];
    return '<details class="para"><summary><span class="pn">'+n+'</span><span class="pv">'+p.v[lang]+'</span><span class="pt">'+t('what')+'</span></summary><div class="pw">'+p.w[lang]+'</div></details>';}).join('');
  $('myths').innerHTML=t('myths').map(m=>'<p class="myth">'+m+'</p>').join('');
  $('op').innerHTML=t('op').map(p=>'<p>'+p+'</p>').join('');
  $('next').innerHTML=NEXT.map(x=>'<a href="'+x.href+'"><span>'+x.code+'</span>'+x[lang]+'</a>').join('');
}
function run(){ calc(); $('smsBtn').href='sms:4086662825?&body='+encodeURIComponent(OUT.sms); }
function applyLang(){
  const d=I18N[lang];
  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.getAttribute('data-i'); if(typeof d[k]==='string') el.innerHTML=d[k];});
  $('langBtn').textContent=d.lang; $('klBack').textContent=d.back; document.documentElement.lang=lang;
  renderStatic(); run();
}
$('langBtn').onclick=()=>{lang=lang==='vi'?'en':'vi'; try{localStorage.setItem('kl_lang',lang)}catch(e){} applyLang();};
$('emailBtn').onclick=()=>{$('form').classList.toggle('open'); if($('form').classList.contains('open')) $('fname').focus();};
$('sendBtn').onclick=()=>{
  const o={n:$('fname').value.trim()||'—',e:$('femail').value.trim()||'—',ph:$('fphone').value.trim()||'—'};
  /* LEAD → FUB: email tới ken@kenlamrealty.com (Lead Email Parsing), như t55. */
  const href='mailto:ken@kenlamrealty.com?subject='+encodeURIComponent(fill(t('subj'),o))+'&body='+encodeURIComponent(fill(t('mail'),o)+OUT.txt+'\n\n'+t('sent_from'));
  const a=document.createElement('a'); a.href=href; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove();
  $('sent').hidden=false;
};
$('copyBtn').onclick=async()=>{ try{ await navigator.clipboard.writeText('4086662825'); $('copyBtn').textContent='✓'; }catch(e){ const r=document.createRange(); r.selectNodeContents($('copyBtn').previousElementSibling); const s=getSelection(); s.removeAllRanges(); s.addRange(r);} };
document.querySelectorAll('#tool input,#tool select').forEach(el=>{el.addEventListener('input',run);el.addEventListener('change',run);});
applyLang();

</script>
