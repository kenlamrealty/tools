function addD(t,n){ const r=new Date(t.getTime()); r.setUTCDate(r.getUTCDate()+n); return r; }
function diffD(a,b){ return Math.round((b-a)/86400000); }
function fd(t){ if(!t) return '—'; const d=D(); const w=d.wd[t.getUTCDay()];
  const dd=String(t.getUTCDate()).padStart(2,'0'), mm=String(t.getUTCMonth()+1).padStart(2,'0'), yy=t.getUTCFullYear();
  return lang==='vi' ? w+', '+dd+'/'+mm+'/'+yy : w+', '+d.mon[t.getUTCMonth()]+' '+t.getUTCDate()+', '+yy; }

  ['no','gave','not'].forEach((v,i)=>$('n'+i).setAttribute('aria-pressed',st.relist===v)); $('npb').disabled=$('npbNone').checked; }
function calc(){ const d=D(); seg();
  const end=pd($('end').value), days=parseInt($('days').value,10), npb=$('npbNone').checked?null:pd($('npb').value), sale=pd($('sale').value);
  if(!end||isNaN(days)||days<0){ $('res').innerHTML='<p class="verdict mid">'+d.v_unk+'</p>'; SUMMARY=d.v_unk; setActions(); return; }
  const prot=addD(end,days), due=addD(end,LAW.LIST_DUE_OFFSET_DAYS);
  const onTime=!!npb && npb<=due;
  const reasons=[]; let owe=true;
  reasons.push(onTime?['good',fmt(d.r_ontime,{d:fd(npb)})]:['bad',d.r_late]); if(!onTime) owe=false;
  let pos='—';
  if(sale){ const n=diffD(end,sale);
    if(n<=0){ reasons.push(['bad',d.r_during]); owe=false; pos=d.before_end; }
    else if(n<=days){ reasons.push(['good',d.r_inwin]); pos=fmt(d.in_days,{n:n,t:days}); }
    else { reasons.push(['bad',d.r_outwin]); owe=false; pos=fmt(d.out_days,{n:n-days}); } }
  else owe=false;
  if(st.q==='none'){ reasons.push(['bad',d.r_nq]); owe=false; } else reasons.push(['good',fmt(d.r_q,{w:st.q==='shown'?d.q_shown:d.q_offer})]);
  reasons.push(st.onlist?['good',d.r_list]:['bad',d.r_nolist]); if(!st.onlist) owe=false;
  let h='<p class="verdict '+(owe?'no':'ok')+'">'+(owe?d.v_owe:d.v_no)+'</p>';
  h+='<div class="bigs"><div class="big"><div class="k">'+d.k_prot+'</div><div class="v">'+fd(prot)+'</div></div>'+
     '<div class="big"><div class="k">'+d.k_npbdue+'</div><div class="v">'+fd(due)+'</div></div></div>';
  if(sale) h+='<div class="dline"><span class="n">'+d.k_left+'</span><span class="a">'+pos+'</span></div>';
  h+='<ul class="tips">'+reasons.map(r=>'<li class="'+r[0]+'">'+r[1]+'</li>').join('')+'</ul>';
  if(owe&&st.relist==='not') h+='<p class="warnp">'+d.two_risk+'</p>';
  if(owe&&st.relist==='gave') h+='<p class="ex">'+d.two_ok+'</p>';
  if(sale){ const n=diffD(end,sale); if(Math.abs(n-days)<=7&&n>0) h+='<p class="hint">'+d.ask+'</p>'; }
  $('res').innerHTML=h;
  SUMMARY=(owe?d.v_owe:d.v_no)+'\n'+d.k_prot+': '+fd(prot)+' ('+days+')\n'+d.k_npbdue+': '+fd(due)+'\n'+d.l_npb+': '+(npb?fd(npb):d.l_npb_none)+'\n'+d.l_sale+': '+(sale?fd(sale):'—');
  setActions();
}
$('end').value='2026-10-31'; $('days').value='90'; $('npb').value='2026-10-31'; $('sale').value='2026-12-15';
['end','days','npb','sale'].forEach(id=>$(id).addEventListener('input',calc)); $('npbNone').onchange=calc;
$('qS').onclick=()=>{st.q='shown';calc();}; $('qO').onclick=()=>{st.q='offer';calc();}; $('qN').onclick=()=>{st.q='none';calc();};
$('lY').onclick=()=>{st.onlist=true;calc();}; $('lN').onclick=()=>{st.onlist=false;calc();};
['no','gave','not'].forEach((v,i)=>$('n'+i).onclick=()=>{st.relist=v;calc();});

applyLang();
</script>
