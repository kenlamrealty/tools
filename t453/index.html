  --warn:#9A5B2E;
  --ok:#4F7A5A;

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1C1A17;--panel:#24211D;--fg:#F1ECE2;--muted:#A69D8E;--line:#3A352E;
  --brass:#D2B07A;--brass-soft:#302A20;--warn:#D99A6A;--ok:#8CBF9A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1A17;--panel:#24211D;--fg:#F1ECE2;--muted:#A69D8E;--line:#3A352E;
  --brass:#D2B07A;--brass-soft:#302A20;--warn:#D99A6A;--ok:#8CBF9A;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;

.wrap{max-width:560px;margin:0 auto;display:grid;gap:22px}
header{display:grid;gap:6px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:500}
.lang{border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:12px;padding:5px 10px;border-radius:999px;cursor:pointer}
.lang:focus-visible,button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.sub{color:var(--muted);font-size:15px;margin:0;max-width:40ch}

.inputs{display:grid;gap:14px}
.field{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--muted)}

.ctl{display:flex;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:0 12px}

<script id="kl-commas">
/* Ken Lam Realty: ô nhập tiền / sqft tự thêm dấu phẩy (1,200,000). Code cũ vẫn đọc .value ra số thuần. */
(function(){
  var d=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
  function fmt(v){
    var s=String(v==null?'':v).replace(/[^0-9.\-]/g,''),neg=s.charAt(0)==='-';
    s=s.replace(/-/g,'');
    var i=s.indexOf('.'),ip=i<0?s:s.slice(0,i),dp=i<0?'':s.slice(i).replace(/\./g,'');
    if(i>=0)dp='.'+dp;
    ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return (neg?'-':'')+ip+dp;
  }
  function want(el){
    if(el.type!=='number'||el.__klc)return false;
    var c=el.closest&&el.closest('.ctl');if(!c)return false;
    var pre=c.querySelector('.pre'),post=c.querySelector('.post');
    if(pre&&pre.textContent.indexOf('$')>-1)return true;
    if(post&&/^\s*(sqft|sq ?ft)\s*$/i.test(post.textContent))return true;
    return false;
  }
  function conv(el){
    if(!want(el))return;
    el.__klc=1;
    var cur=d.get.call(el),ph=el.getAttribute('placeholder');
    el.type='text';
    if(!el.getAttribute('inputmode'))el.setAttribute('inputmode','numeric');
    Object.defineProperty(el,'value',{configurable:true,
      get:function(){return d.get.call(this).replace(/,/g,'')},
      set:function(v){d.set.call(this,fmt(v))}});
    d.set.call(el,fmt(cur));
    if(ph&&/^[0-9.]{5,}$/.test(ph))el.setAttribute('placeholder',fmt(ph));
    el.addEventListener('input',function(){
      var raw=d.get.call(el),pos=el.selectionStart,n=0,k;
      for(k=0;k<pos;k++)if(/[0-9.]/.test(raw.charAt(k)))n++;
      var out=fmt(raw);
      if(out===raw)return;
      d.set.call(el,out);
      for(k=0,pos=0;k<out.length&&n>0;k++){pos=k+1;if(/[0-9.]/.test(out.charAt(k)))n--;}
      try{el.setSelectionRange(pos,pos)}catch(e){}
    });
  }
  function scan(r){
    if(r.nodeType!==1)return;
    if(r.tagName==='INPUT')conv(r);
    var l=r.querySelectorAll?r.querySelectorAll('input[type=number]'):[];
    for(var i=0;i<l.length;i++)conv(l[i]);
  }
  new MutationObserver(function(m){
    for(var i=0;i<m.length;i++)for(var j=0;j<m[i].addedNodes.length;j++)scan(m[i].addedNodes[j]);
  }).observe(document.documentElement,{childList:true,subtree:true});
  document.addEventListener('DOMContentLoaded',function(){scan(document.body)});
})();
</script>

 m1:'<b>"HUD đã kiểm tra nhà rồi."</b> Không. Form ghi rõ HUD không biết gì về radon, mốc ngoài những gì đã đăng. Nhà HUD thường bỏ trống lâu, ống nước, mái hư mà không ai hay. Test đi, tiền test rẻ hơn tiền sửa nhiều.',
 m2:'<b>"Mốc hiện ra sau này thì kiện HUD."</b> Không được. Ký RGM là đã miễn trừ cho HUD và M&M contractor mọi khiếu nại về radon, mốc, cả sau này. Hỏi luật sư thì hỏi trước khi ký.',
 m3:'<b>"Bay Area không có radon."</b> Mức radon khác nhau từng căn, từng khu. Nhà bên cạnh thấp không có nghĩa nhà mình thấp. Chỉ có test mới biết. EPA: từ 4 pCi/L là nên sửa.',
 nx1:'Mốc, radon, môi trường trong mua bán thường: đọc SBSA ¶A2, ¶A6 ở <a href="/t454/">T454</a>.',
 nx2:'Thời hạn inspection và bỏ contingency trong hợp đồng mua: <a href="/t401/">T401 (RPA)</a> và lịch escrow <a href="/t60/">T60</a>.',
 nx3:'Người bán khai gì về nước, mốc: <a href="/t455/">T455 (SPQ)</a>.',
 nx4:'Cho thuê nhà có mốc? Coi phần disclosures trong lease ở <a href="/t490/">T490 (RLMM)</a>. Mọi forms: <a href="/t402/">T402</a>.',

},en:{
 title:'RGM — Radon gas and mold notice (HUD homes)',
 sub:'A one-page HUD release buyers sign when buying a HUD home. Learn who you are releasing, and where your radon result stands.',
 s_what:'HUD\'s notice and release about radon gas and mold. The C.A.R. reproduction of HUD Form 9548-E, 1 page.',
 s_when:'Only when buying a HUD-owned home (an FHA-loan home HUD took back and resells). Ordinary resales do not use this form.',
 s_who:'The purchaser(s). Up to two purchaser signatures at the bottom.',
 s_after:'You take the home AS IS. Any radon or mold is yours to fix, including health effects. You can no longer bring radon or mold claims against HUD or its M&M contractor.',
 c1_r:'Top of page',c1_t:'A HUD form, for HUD homes only',c1_alt:'RGM top: buyer name, Property Case #, address',
 c1_p:'The header says it: U.S. Department of Housing and Urban Development. It is HUD\'s form, reprinted by C.A.R. Fill in the buyer\'s name, the HUD Property Case #, and the address.',
 c1_e:'Mr. A (buyer) buys the HUD home at 1234 Example Lane, San Jose, CA 95100. The HUD case number goes in the second box, the address in the third.',
 c2_r:'Paragraphs 1–2',c2_t:'Radon and mold can cause serious illness. Sold AS IS',c2_alt:'RGM bold notice and AS IS paragraph',
 c2_p:'All caps: radon gas and some molds can cause serious health problems. Next: the home is sold "AS IS", with no promises about condition. HUD and its M&M contractor (the company HUD hires to manage and market it) say they know nothing about radon or mold beyond what they posted online.',
 c2_e:'The HUD listing says nothing about radon. That does not mean there is none. It means HUD doesn\'t know.',
 c3_r:'Paragraph 3',c3_t:'What radon is, what mold is',c3_alt:'RGM definitions of radon and mold',
 c3_p:'Radon: an invisible, odorless radioactive gas. Mold: visible fungus growth, including growth you only see after removing a wall or lifting carpet.',
 c3_e:'You can\'t smell or see it → the only way to know about radon is a test. Mold under the bedroom carpet still counts as mold.',
 c4_r:'Paragraphs 4–5',c4_t:'Don\'t rely on HUD. Test before closing',c4_alt:'RGM no-reliance paragraph and test-before-closing advice',
 c4_p:'The buyer promises not to rely on what HUD said, or didn\'t say. Real estate agents generally aren\'t qualified to advise on radon or mold. In caps, underlined: hire qualified professionals to test for radon and mold BEFORE CLOSING. Last line: the buyer alone pays for any remediation and damages, including health effects.',
 c4_e:'Mr. A orders a radon test and a mold check during the inspection period. Result: 5.2 pCi/L, above EPA\'s 4. Mr. A pays for a mitigation system himself, or decides before closing.',
 c5_r:'Paragraph 6',c5_t:'The release: no radon or mold claims against HUD',c5_alt:'RGM release, indemnify, hold harmless paragraph',
 c5_p:'In exchange for the sale, the buyer releases, indemnifies and holds harmless HUD and the M&M contractor from radon and mold claims, now and in the future.',
 c5_e:'Two years later Mr. A finds mold inside the kitchen wall. Under this form, he can\'t claim against HUD or the M&M contractor.',
 c6_r:'Paragraph 7 · signatures',c6_t:'You had the chance to ask a lawyer. Signing ends it',c6_alt:'RGM last paragraph and signature lines',
 c6_p:'The buyer confirms they had the chance to have an attorney review it, and read and understood it. These promises are why HUD agrees to sell. Date, sign, print name.',
 c6_e:'Mr. A wants a lawyer to look → do it before signing. Afterwards, the form already says he had the chance.',
 tl_title:'Where does my radon result stand?',tl_sub:'Enter the pCi/L from your test report (leave blank if not tested yet). The tool compares it with EPA\'s levels and lists next steps. Nothing is saved or sent.',
 l_rad:'Radon result',l_yr:'Year built',l_hud:'Is it a HUD home?',h_yes:'Yes, HUD home',h_no:'No, regular sale',
 l_base:'Basement or crawlspace?',l_mold:'Visible mold or water stains?',yes:'Yes',no:'No',unk:'Not sure',
 r_total:'Radon',r_todo:'What to do',
 lv_hi:'<b>Fix it.</b> At or above EPA\'s action level of 4 pCi/L.',
 lv_mid:'<b>Consider fixing.</b> EPA suggests considering it at 2–4 pCi/L.',
 lv_lo:'<b>Low.</b> Under 2 pCi/L. EPA says no level is completely safe.',
 lv_none:'<b>No result yet.</b> Radon has no color or smell. Only a test tells.',
 ln_bq:'<b>In Bq/m³</b><small>1 pCi/L = 37 Bq/m³</small>',ln_epa:'<b>EPA action level</b><small>fix at or above</small>',ln_x:'<b>Compared with 4</b>',
 t_test:'Order a radon test during the inspection period, before closing. It is usually done on the lowest lived-in level.',
 t_pro:'Hire a radon mitigation professional. Get a price before removing contingencies.',
 t_retest:'Retest after the system is installed to confirm the level dropped.',
 t_consider:'Ask a professional whether a system makes sense. Retest to confirm.',
 t_lo:'Keep the report. Retest after major work (foundation, basement).',
 t_base:'Basement/crawlspace: soil gas gets in more easily. Test on the lowest lived-in level.',
 t_moldY:'Visible mold: hire an environmental hygienist to test and find the water source before closing (SBSA ¶A6).',
 t_moldU:'A general inspection usually doesn\'t test for mold or look behind walls (SBSA ¶A5). Order a separate test to be sure.',
 t_lead:'Built before 1978: lead paint is possible. Read the lead disclosure; contractors need EPA RRP certification (SBSA ¶D3).',
 rel_hud:'<b>RGM applies.</b> By signing you take the home AS IS, pay for any radon/mold work and health effects yourself, and release HUD + the M&M contractor from all radon and mold claims, now and later.',
 rel_no:'<b>Regular sales don\'t use RGM.</b> The seller still must disclose what they know (TDS, SPQ). You have inspection rights during the RPA contingency period. Mold and radon are covered in SBSA ¶A2, ¶A6.',
 fine:'EPA figures: action level 4 pCi/L, consider 2–4. For understanding only; not a substitute for a radon professional or an attorney.',
 m1:'<b>"HUD already inspected the house."</b> No. The form says HUD knows nothing about radon or mold beyond what it posted. HUD homes often sit empty, with leaks nobody sees. Test it; a test costs far less than a repair.',
 m2:'<b>"If mold shows up later, I\'ll sue HUD."</b> You can\'t. Signing RGM releases HUD and the M&M contractor from radon and mold claims, including future ones. Ask a lawyer before you sign, not after.',
 m3:'<b>"There\'s no radon in the Bay Area."</b> Levels vary home to home. A low neighbor doesn\'t mean a low house. Only a test tells. EPA: fix at 4 pCi/L or above.',
 nx1:'Mold, radon and environmental hazards in ordinary sales: SBSA ¶A2, ¶A6 in <a href="/t454/">T454</a>.',
 nx2:'Inspection deadlines and contingency removal in the purchase contract: <a href="/t401/">T401 (RPA)</a> and the escrow calendar <a href="/t60/">T60</a>.',
 nx3:'What sellers disclose about water and mold: <a href="/t455/">T455 (SPQ)</a>.',
 nx4:'Renting out a home with mold? See the lease disclosures in <a href="/t490/">T490 (RLMM)</a>. All forms: <a href="/t402/">T402</a>.',
 sms:'Hi Ken, I used the RGM tool (T453) on tools.kenlamrealty.com: {s}. I have a question.',
 subj:'Radon and mold (RGM) — {n}',

let hud='yes', base='no', mold='unk';
const HUD=[['hYes','yes'],['hNo','no']], BASE=[['bNo','no'],['bYes','yes']], MOLD=[['mNo','no'],['mYes','yes'],['mUnk','unk']];
const line=(n,a,cls)=>'<div class="line'+(cls?' '+cls:'')+'"><span class="n">'+n+'</span><span class="a">'+a+'</span></div>';
const strip=s=>s.replace(/<small>/g,' (').replace(/<\/small>/g,')').replace(/<[^>]+>/g,'');
function level(v){ if(v===null) return 'none'; if(v>=EPA_ACTION) return 'hi'; if(v>=EPA_CONSIDER) return 'mid'; return 'lo'; }
const f1=n=>(Math.round(n*10)/10).toLocaleString('en-US');

function calc(d){
  const s=$('rad').value.trim(), v=(s===''||isNaN(+s))?null:Math.max(0,+s), yr=+$('yr').value||0, lv=level(v);
  $('big').textContent=v===null?'—':f1(v); $('bigU').textContent=v===null?'':'pCi/L';
  $('lvl').className='lvl '+(lv==='none'?'mid':lv); $('lvl').innerHTML=d['lv_'+lv];
  let h=''; if(v!==null){ h=line(d.ln_bq,Math.round(v*BQ_PER_PCI).toLocaleString('en-US')+' Bq/m³')+line(d.ln_epa,EPA_ACTION+' pCi/L')+line(d.ln_x,(v>=EPA_ACTION?'+':'')+f1(v-EPA_ACTION)+' pCi/L',v>=EPA_ACTION?'warnl':''); }
  $('lines').innerHTML=h;
  const todo=[];
  if(lv==='none') todo.push(d.t_test); if(lv==='hi') todo.push(d.t_pro,d.t_retest); if(lv==='mid') todo.push(d.t_consider); if(lv==='lo') todo.push(d.t_lo);
  if(base==='yes') todo.push(d.t_base);
  if(mold==='yes') todo.push(d.t_moldY); if(mold==='unk') todo.push(d.t_moldU);
  if(yr>0&&yr<LEAD_YEAR) todo.push(d.t_lead);
  $('todo').innerHTML=todo.map(t=>'<li>'+t+'</li>').join('');
  $('rel').className='status '+(hud==='yes'?'warn':'ok'); $('rel').innerHTML=hud==='yes'?d.rel_hud:d.rel_no;
  const L=[strip(d.r_total)+': '+(v===null?'—':f1(v)+' pCi/L'), strip(d['lv_'+lv]), strip(d.l_yr)+': '+(yr||'—'), strip(d.l_hud)+' '+strip(hud==='yes'?d.h_yes:d.h_no), strip(d.l_base)+' '+strip(d[base]), strip(d.l_mold)+' '+strip(d[mold]), '', strip(d.r_todo)+':'].concat(todo.map((t,i)=>(i+1)+'. '+strip(t)));
  return {lines:L.join('\n'), short:'radon '+(v===null?'—':f1(v)+' pCi/L')+', '+(lang==='vi'?'năm xây ':'built ')+(yr||'—')+', '+strip(hud==='yes'?d.h_yes:d.h_no)};
}
function init(){
  ['rad','yr'].forEach(id=>{ $(id).addEventListener('input',run); $(id).addEventListener('change',run); });
  HUD.forEach(([id,v])=>$(id).onclick=()=>{hud=v;seg(HUD,hud);run();});
  BASE.forEach(([id,v])=>$(id).onclick=()=>{base=v;seg(BASE,base);run();});
  MOLD.forEach(([id,v])=>$(id).onclick=()=>{mold=v;seg(MOLD,mold);run();});
}

/* ---- khung chung (giống T227) ---- */
const I18N={vi:Object.assign({},COMMON.vi,T.vi),en:Object.assign({},COMMON.en,T.en)};
let lang='vi'; try{ if(localStorage.getItem('kl_lang')==='en') lang='en'; }catch(e){}
let LAST={lines:'',short:''};
function run(){ const d=I18N[lang]; try{ LAST=calc(d)||LAST; }catch(e){ console.error(e); }
  $('smsBtn').href='sms:4086662825?&body='+encodeURIComponent(d.sms.replace('{s}',LAST.short)); }
function applyLang(){
  const d=I18N[lang];
  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.getAttribute('data-i'); if(typeof d[k]==='string') el.innerHTML=d[k];});
  document.querySelectorAll('[data-a]').forEach(el=>{const k=el.getAttribute('data-a'); if(typeof d[k]==='string') el.setAttribute('alt',d[k]);});
  $('langBtn').textContent=d.lang; document.documentElement.lang=lang; run();
}
$('langBtn').onclick=()=>{lang=lang==='vi'?'en':'vi'; try{localStorage.setItem('kl_lang',lang)}catch(e){} applyLang();};
$('emailBtn').onclick=()=>{$('form').classList.toggle('open'); if($('form').classList.contains('open')) $('fname').focus();};
$('sendBtn').onclick=()=>{
  const d=I18N[lang], n=$('fname').value.trim()||'—', e=$('femail').value.trim()||'—', ph=$('fphone').value.trim()||'—';
  const fill=s=>s.replace('{n}',n).replace('{e}',e).replace('{ph}',ph).replace('{lines}',LAST.lines);
  /* LEAD → FUB: email tới ken@kenlamrealty.com (FUB Lead Email Parsing), giống T227. */
  const href='mailto:ken@kenlamrealty.com?subject='+encodeURIComponent(fill(d.subj))+'&body='+encodeURIComponent(fill(d.body));
  const a=document.createElement('a'); a.href=href; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove();
  $('sent').hidden=false;
};
$('copyBtn').onclick=async()=>{ try{ await navigator.clipboard.writeText('4086662825'); $('copyBtn').textContent='✓'; }catch(e){ const r=document.createRange(); r.selectNodeContents($('copyBtn').previousElementSibling); const s=getSelection(); s.removeAllRanges(); s.addRange(r);} };
init();
applyLang();
</script>
