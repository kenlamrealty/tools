<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phản đề nghị của người bán (SCO) · Ken Lam Tools</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap">
<style>

/* Layout: one column, inputs on top, live result card below, three actions, footer. Phone first. */
:root{
  --bg:#FBF9F4;        /* ivory */
  --panel:#FFFFFF;
  --fg:#2B2925;
  --muted:#7A7468;
  --line:#E6E0D3;
  --brass:#B8955A;     /* soft brass accent */
  --brass-soft:#F3EBDC;
  --warn:#9A5B2E;
  --ok:#4F7A5A;
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1C1A17;--panel:#24211D;--fg:#F1ECE2;--muted:#A69D8E;--line:#3A352E;
  --brass:#D2B07A;--brass-soft:#302A20;--warn:#D99A6A;--ok:#8CBF9A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1A17;--panel:#24211D;--fg:#F1ECE2;--muted:#A69D8E;--line:#3A352E;
  --brass:#D2B07A;--brass-soft:#302A20;--warn:#D99A6A;--ok:#8CBF9A;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:22px}
header{display:grid;gap:6px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:500}
.lang{border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:12px;padding:5px 10px;border-radius:999px;cursor:pointer}
.lang:focus-visible,button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1{font-family:var(--display);font-weight:300;font-size:38px;line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:15px;margin:0;max-width:40ch}

.inputs{display:grid;gap:14px}
.field{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.field label small{font-weight:400}
.ctl{display:flex;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:0 12px}
.ctl:focus-within{border-color:var(--brass)}
.ctl .pre,.ctl .post{color:var(--muted);font-size:15px}
.ctl input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:20px;padding:12px 8px;font-variant-numeric:tabular-nums}
.ctl input::-webkit-outer-spin-button,.ctl input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ctl input[type=number]{-moz-appearance:textfield}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:380px){.row2{grid-template-columns:1fr}}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:15px;padding:11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brass-soft);color:var(--fg);font-weight:500}

.result{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:grid;gap:16px}
.total .k{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.total .v{font-family:var(--display);font-weight:400;font-size:58px;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--fg)}
.total .v small{font-family:var(--body);font-size:16px;color:var(--muted);font-weight:400}
@media (max-width:420px){.total .v{font-size:min(58px,13vw)}}
.lines{display:grid;gap:0;border-top:1px solid var(--line)}
.line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.line .n{color:var(--muted);min-width:0}
.line .n b{color:var(--fg);font-weight:500}
.line .a{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.line.pmi .a{color:var(--warn)}
.line.pmi.off{display:none}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.bar .b1{background:var(--brass)}
.bar .b2{background:#A9B7A0}
.bar .b3{background:#CBB7A3}
.bar .b4{background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
.meta{font-size:13px;color:var(--muted);display:grid;gap:4px}
.meta b{color:var(--fg);font-weight:500}
.note{font-size:13px;color:var(--muted);background:var(--brass-soft);border-radius:10px;padding:10px 12px;line-height:1.45}
.note.hide{display:none}

.actions{display:grid;gap:10px}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;border-radius:10px;padding:14px 16px;font:inherit;font-size:15px;font-weight:500;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#FFFDF8}
.btn.primary:hover{filter:brightness(.96)}
.btn:hover{border-color:var(--brass)}

.form{display:none;background:var(--panel);border:1px solid var(--brass);border-radius:14px;padding:18px;gap:12px}
.form.open{display:grid}
.form h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.form p{margin:0;font-size:14px;color:var(--muted)}
.form .ctl input{font-size:16px}
.form .ok{color:var(--ok);font-weight:500;font-size:14px}
.copyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.copyrow code{background:var(--brass-soft);padding:3px 8px;border-radius:6px;user-select:all;font-family:var(--body)}
.copyrow button{border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;font-size:13px;padding:5px 10px;border-radius:999px;cursor:pointer}

footer{display:grid;gap:8px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
footer a{color:var(--brass);text-decoration:none}
footer a:hover{text-decoration:underline}
footer .who{color:var(--fg)}
@media (prefers-reduced-motion:no-preference){.total .v{transition:opacity .15s}}
/* ---- T27 thêm (không đổi class cũ) ---- */
.ctl input[type=date]{font-size:17px;min-height:48px}
.fx{font-size:12px;color:var(--muted);font-weight:400}
.status{font-size:15px;border-radius:10px;padding:10px 12px;line-height:1.45}
.status.ok{background:var(--brass-soft)}
.status.warn{border:1px solid var(--warn)}
.status b{font-weight:500}
.status.warn b{color:var(--warn)}
.line .n small{display:block;font-size:12px;margin-top:2px}
.line.sum .n b,.line.sum .a{color:var(--fg);font-weight:600}
.line.dim{opacity:.6}
.line.warnl .a{color:var(--warn)}
.dl{display:grid;gap:10px}
.dl h2,.idr h2,.next h2,.tlw h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.dd{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:6px;min-width:0}
.dd .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.dd .t{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.dd .left{font-size:13px;color:var(--muted);white-space:nowrap}
.dd .date{font-family:var(--display);font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}
.dd p{margin:0;font-size:14px;color:var(--muted)}
.dd p b{color:var(--warn);font-weight:500}
.gcal{justify-self:start;font-size:12px;color:var(--brass);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap;background:var(--panel)}
.gcal:hover{border-color:var(--brass)}
.idr{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:grid;gap:10px}
.idr .r{display:grid;gap:2px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.idr .r b{color:var(--fg);font-weight:500;font-size:15px}
.tlw{display:grid;gap:12px}
.tlw .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tlw .cnt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.phase{display:grid;border-top:1px solid var(--line);padding-top:14px}
.ph-h{display:flex;justify-content:space-between;align-items:center;gap:6px 12px;flex-wrap:wrap;margin-bottom:2px}
.ph-h h3{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.15;margin:0}
.ph-n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.task{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:11px 0;border-bottom:1px solid var(--line)}
.task input{width:20px;height:20px;accent-color:var(--brass);margin:1px 0 0;cursor:pointer}
.task .tt{border:0;background:transparent;color:var(--fg);font:inherit;font-size:15px;line-height:1.4;text-align:left;padding:0;cursor:pointer;min-width:0}
.task.done .tt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.task .why{grid-column:2;font-size:13px;color:var(--muted);line-height:1.5}
.task .why[hidden]{display:none}
.myth{font-size:14px;line-height:1.5;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin:0}
.myth b{color:var(--warn);font-weight:500}
.myth a,.next a,.idr a{color:var(--brass)}
.next{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:10px}
.next ol{margin:0;padding-left:20px;display:grid;gap:10px;font-size:14px;line-height:1.5}
.reset{justify-self:start;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:0}
footer .src{line-height:1.6}
footer .src a{word-break:break-word}

/* ---- T222 thêm ---- */
.chart{display:grid;gap:12px}
.chart h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.cb{display:grid;gap:5px;min-width:0}
.cb .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px}
.cb .hd b{font-weight:500;min-width:0}
.cb .hd span{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.cb .tr{height:14px;border-radius:999px;background:var(--line);overflow:hidden}
.cb .tr i{display:block;height:100%;border-radius:999px;background:var(--brass);transition:width .2s}
.cb.p1 .tr i{background:#CBB7A3}.cb.p3 .tr i{background:var(--ok)}.cb.p4 .tr i{background:#A9B7A0}
.cb small{font-size:12px;color:var(--muted);line-height:1.4}
.cb.best .hd span{color:var(--ok)}
.ctl input[type=number].sm{font-size:20px}

/* ---- Nhóm giải nghĩa form C.A.R. (T415–T428) ---- */
:root{--ink:#2C4A7C;--paper:#FFFEFA}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--ink:#9DB6E3;--paper:#26231F}}
:root[data-theme="dark"]{--ink:#9DB6E3;--paper:#26231F}
.wrap{max-width:640px}
.code{font-size:13px;color:var(--muted);margin:0}
.code b{color:var(--fg);font-weight:500}
.ver{display:inline-block;justify-self:start;font-size:12px;color:var(--warn);background:var(--brass-soft);border-radius:999px;padding:3px 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:grid;gap:10px;min-width:0}
.card h2,.tool h2{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.15;margin:0}
.card p{margin:0;font-size:15px;line-height:1.55}
.card p.eg{font-size:14px;color:var(--muted);border-left:3px solid var(--brass);padding-left:12px}
.vidbox{display:grid;gap:10px;justify-items:start}
.vidbox h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(43,41,37,.08);padding:18px 14px 10px;display:grid;gap:0;min-width:0}
.paper .ph{text-align:center;border-bottom:3px double var(--line);padding-bottom:10px;margin-bottom:4px;display:grid;gap:2px}
.paper .ph b{font-family:var(--display);font-weight:500;font-size:21px;line-height:1.15;letter-spacing:.02em}
.paper .ph small{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.paper .ph i{font-style:normal;font-size:11px;color:var(--warn)}
.pt{border-bottom:1px dashed var(--line)}
.pt:last-child{border-bottom:0}
.pt>button{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:start;border:0;background:transparent;color:var(--fg);font:inherit;text-align:left;padding:12px 4px;cursor:pointer;border-radius:8px}
.pt>button:hover{background:var(--brass-soft)}
.pt .no{font-size:12px;font-weight:600;color:var(--brass);border:1px solid var(--brass);border-radius:6px;padding:1px 6px;margin-top:2px;white-space:nowrap}
.pt .lb{display:grid;gap:3px;min-width:0}
.pt .lb b{font-weight:500;font-size:15px;line-height:1.35}
.pt .lb span{font-size:14px;color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:2px;overflow-wrap:anywhere;font-style:italic}
.pt .cv{color:var(--muted);font-size:18px;line-height:1;transition:transform .15s;margin-top:2px}
.pt.open .cv{transform:rotate(90deg)}
.px{display:none;gap:10px;padding:2px 6px 14px 6px}
.pt.open .px{display:grid}
.px div{font-size:14px;line-height:1.55;min-width:0}
.px div b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:2px}
.px .ex2{background:var(--brass-soft);border-radius:10px;padding:10px 12px}
.px .cf{border:1px solid var(--warn);border-radius:10px;padding:10px 12px}
.px .cf b{color:var(--warn)}
.rest{font-size:13px;color:var(--muted);margin:8px 0 0;line-height:1.5}
.tapall{justify-self:start;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer}
.tool{display:grid;gap:14px}
.tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45;overflow-wrap:anywhere}
.tbl td:first-child{font-weight:500}
.myths{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.myths li{font-size:14px;line-height:1.55;border-top:1px solid var(--line);padding-top:12px}
.myths li:first-child{border-top:0;padding-top:0}
.myths li b{color:var(--warn);font-weight:500}
.next ul{margin:0;padding-left:20px;display:grid;gap:10px;font-size:14px;line-height:1.5}
.cmp{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:0;border-top:1px solid var(--line);font-size:14px}
.cmp>div{padding:9px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.cmp .h{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.cmp .ch{color:var(--warn);font-weight:600}
.cmp .k{color:var(--muted)}
.cmp small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.big2{font-family:var(--display);font-weight:400;font-size:40px;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:4px}
@media (max-width:420px){.big2{font-size:32px}}
.est{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--warn);border:1px solid var(--warn);border-radius:999px;padding:1px 8px;vertical-align:3px;margin-left:6px}
.doclist{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px;line-height:1.5}
.doclist small{color:var(--muted)}
footer .disc{line-height:1.55}
.ctl{min-width:0}
.ctl input{width:100%}

<script id="kl-commas">
/* Ken Lam Realty: ô nhập tiền / sqft tự thêm dấu phẩy (1,200,000). Code cũ vẫn đọc .value ra số thuần. */
(function(){
  var d=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
  function fmt(v){
    var s=String(v==null?'':v).replace(/[^0-9.\-]/g,''),neg=s.charAt(0)==='-';
    s=s.replace(/-/g,'');
    var i=s.indexOf('.'),ip=i<0?s:s.slice(0,i),dp=i<0?'':s.slice(i).replace(/\./g,'');
    if(i>=0)dp='.'+dp;
    ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return (neg?'-':'')+ip+dp;
  }
  function want(el){
    if(el.type!=='number'||el.__klc)return false;
    var c=el.closest&&el.closest('.ctl');if(!c)return false;
    var pre=c.querySelector('.pre'),post=c.querySelector('.post');
    if(pre&&pre.textContent.indexOf('$')>-1)return true;
    if(post&&/^\s*(sqft|sq ?ft)\s*$/i.test(post.textContent))return true;
    return false;
  }
  function conv(el){
    if(!want(el))return;
    el.__klc=1;
    var cur=d.get.call(el),ph=el.getAttribute('placeholder');
    el.type='text';
    if(!el.getAttribute('inputmode'))el.setAttribute('inputmode','numeric');
    Object.defineProperty(el,'value',{configurable:true,
      get:function(){return d.get.call(this).replace(/,/g,'')},
      set:function(v){d.set.call(this,fmt(v))}});
    d.set.call(el,fmt(cur));
    if(ph&&/^[0-9.]{5,}$/.test(ph))el.setAttribute('placeholder',fmt(ph));
    el.addEventListener('input',function(){
      var raw=d.get.call(el),pos=el.selectionStart,n=0,k;
      for(k=0;k<pos;k++)if(/[0-9.]/.test(raw.charAt(k)))n++;
      var out=fmt(raw);
      if(out===raw)return;
      d.set.call(el,out);
      for(k=0,pos=0;k<out.length&&n>0;k++){pos=k+1;if(/[0-9.]/.test(out.charAt(k)))n--;}
      try{el.setSelectionRange(pos,pos)}catch(e){}
    });
  }
  function scan(r){
    if(r.nodeType!==1)return;
    if(r.tagName==='INPUT')conv(r);
    var l=r.querySelectorAll?r.querySelectorAll('input[type=number]'):[];
    for(var i=0;i<l.length;i++)conv(l[i]);

 hàng nói \"$12 thì bán, trả lời trước 5 giờ chiều nha.\" SCO chính là câu đó, viết ra giấy.", "p0_n": "Đầu form", "p0_t": "Counter số mấy, trả lời giấy nào, nhà nào", "p0_v": "SCO No. 1 · trả lời Purchase Agreement ngày 03/11/2026 · 1234 Example Lane", "p0_s": "Ghi đây là counter số mấy, trả lời cho giấy nào (offer gốc hay counter của bên mua), ngày của giấy đó, địa chỉ nhà, tên bên mua và bên bán. Ngay dưới tên form có một dòng: không được dùng form này làm multiple counter offer.", "p0_e": "SCO số 1, trả lời offer của Anh Minh & Chị Lan Nguyễn ngày 03/11/2026 cho căn 1234 Example Lane, San Jose, CA 95100. Seller: Cô Hạnh Trần.", "p0_w": "Có 3 offer và muốn counter cả 3 cùng lúc thì không dùng SCO. Phải dùng form multiple counter riêng (SMCO). Gửi SCO cho 3 người, cả 3 cùng ký, seller có thể dính hơn một hợp đồng.", "p1_n": "Đoạn 1A", "p1_t": "Liquidated damages và arbitration", "p1_v": "Bên mua đã ký tắt · Cô Hạnh ký tắt nốt", "p1_s": "Hai đoạn Liquidated Damages và Arbitration trong offer chỉ có hiệu lực khi tất cả các bên đều ký tắt. Thiếu một người là đoạn đó bị loại khỏi hợp đồng, trừ khi các bên ký tắt trong offer hoặc trong một addendum như LDAA. Có ô để gắn LDAA.", "p1_e": "Anh Minh và Chị Lan đã ký tắt ô Liquidated Damages trong offer. Cô Hạnh ký tắt luôn, hoặc gắn LDAA, thì đoạn đó mới tính.", "p1_w": "Đây là chỗ hay sót nhất. Thiếu một chữ ký tắt thì sau này nếu bên mua bỏ ngang, chuyện tiền cọc giải quyết khác hẳn.", "p2_n": "Đoạn 1B", "p2_t": "Down payment, loan, tiền cọc, credit", "p2_v": "Giá lên → down và loan đổi theo · cọc $39,000 giữ nguyên", "p2_s": "Nếu counter đổi giá, down payment và loan tự đổi theo đúng tỉ lệ trong offer gốc. Nhưng số tiền cọc (lần đầu và lần tăng) và seller credit thì giữ nguyên số đô, trừ khi hai bên ghi khác.", "p2_e": "Offer $1,300,000, down 20% = $260,000. Counter $1,350,000 → down thành $270,000, loan $1,080,000. Cọc vẫn $39,000.", "p2_w": "Seller muốn cọc cao hơn hoặc bỏ credit thì phải ghi rõ ở 1D. Không ghi là không đổi.", "p3_n": "Đoạn 1C", "p3_t": "Appraisal contingency khi có appraisal gap", "p3_v": "Gap $25,000 → contingency ở $1,325,000", "p3_s": "Nếu offer gốc tính appraisal contingency bằng appraisal gap (bên mua chịu bù một khoản nếu appraise thấp), thì lấy giá cuối trừ đúng số đô của gap đó ra mức appraisal contingency.", "p3_e": "Gap $25,000. Giá cuối $1,350,000 → appraisal contingency ở $1,325,000. Appraise từ $1,325,000 trở lên thì bên mua không dùng appraisal contingency để hủy được.", "p3_w": "Giá lên thì mức gap không lên theo, nhưng số tiền bên mua phải tự bù khi appraise thấp thì lên thật.", "p4_n": "Đoạn 1D", "p4_t": "Điều khoản khác — chỗ seller ghi thay đổi", "p4_v": "Giá $1,350,000 · close 21 ngày · gỡ contingency 10 ngày", "p4_s": "Mấy dòng trống để seller ghi những gì muốn đổi: giá, ngày close, số ngày contingency, ở lại sau close… Những gì không ghi thì giữ y như offer.", "p4_e": "Cô Hạnh ghi: giá $1,350,000; close 21 ngày sau Acceptance; gỡ hết contingency trong 10 ngày.", "p4_w": "Ghi mơ hồ kiểu \"close sớm\" hay \"as-is\" không kèm chi tiết là tự mua tranh cãi. Ghi số ngày, số tiền, số đoạn của RPA.", "p5_n": "Đoạn 1E", "p5_t": "Addendum gắn kèm", "p5_v": "☑ SIP — Cô Hạnh ở lại 14 ngày sau close", "p5_s": "Danh sách các addendum có thể gắn: ADM, BUO (back-up offer), SIP (seller ở lại tới 29 ngày), SPRP, TOPA (nhà có người thuê), RLAS (ở lại từ 30 ngày trở lên), SXA (seller làm exchange). Addendum chỉ tính khi cả hai bên ký và giao.", "p5_e": "Cô Hạnh cần ở lại 2 tuần sau close để chờ nhà mới → gắn SIP. Nếu cần 5 tuần thì phải dùng RLAS.", "p5_w": "Gắn addendum mà bên kia không ký và giao addendum đó thì việc chấp nhận counter không có giá trị.", "p6_n": "Đoạn 2A", "p6_t": "Counter hết hạn khi nào", "p6_v": "5:00 PM, ngày thứ 3 sau khi seller ký", "p6_s": "Counter tự hết hạn (cọc trả lại, nếu có) nếu tới 5:00 PM ngày thứ 3 sau ngày seller ký ở đoạn 4 — hoặc ngày giờ ghi riêng — mà bên mua chưa ký đoạn 5 và chưa giao bản đã ký cho seller hoặc agent của seller.", "p6_e": "Cô Hạnh ký thứ Sáu 06/11/2026 → hạn 5:00 PM thứ Hai 09/11/2026.", "p6_w": "\"Day\" là ngày lịch, tính cả thứ Bảy, Chủ Nhật. Ký thôi chưa đủ — phải giao tới tay bên kia trước hạn.", "p7_n": "Đoạn 2B–2C", "p7_t": "Seller rút counter, hoặc bán cho người khác", "p7_v": "Trước khi bên mua chấp nhận: seller vẫn rút được", "p7_s": "Counter cũng chết nếu seller báo rút trước khi bên mua chấp nhận (có thể dùng form WOO), hoặc seller chấp nhận một offer khác trước.", "p7_e": "Thứ Bảy có offer $1,380,000 tới. Agent của Cô Hạnh gửi WOO rút counter cho Anh Minh, rồi mới ký offer mới.", "p8_n": "Đoạn 3", "p8_t": "Seller vẫn được bán cho người khác", "p8_v": "Nhà vẫn mở cửa cho người khác xem", "p8_s": "Trong lúc chờ, seller vẫn được rao bán và nhận offer khác. Form khuyên seller rút counter này trước khi chấp nhận offer khác.", "p8_e": "Cuối tuần Cô Hạnh vẫn mở open house dù đã counter Anh Minh.", "p8_w": "Bên mua đừng nghĩ \"đã có counter là nhà giữ cho mình\". Chưa ký và giao thì chưa giữ gì cả.", "p9_n": "Đoạn 4", "p9_t": "Seller ký counter", "p9_v": "Cô Hạnh Trần · 06/11/2026", "p9_s": "Seller ký đưa counter. Từ lúc này offer hay counter trước đó không ký nhận được nữa. Counter vẫn hợp lệ dù offer trước đã hết hạn. Điều khoản của giấy trước vẫn nằm trong counter, trừ chỗ ghi khác.", "p9_e": "Offer của Anh Minh hết hạn 5 PM hôm qua. Hôm nay Cô Hạnh vẫn counter được, counter vẫn hợp lệ.", "p9_w": "Có 2 seller trên title thì cả 2 ký. Hạn 2A tính từ chữ ký sau cùng.", "p10_n": "Đoạn 5", "p10_t": "Bên mua chấp nhận", "p10_v": "Anh Minh & Chị Lan ký · CN 08/11/2026", "p10_s": "Bên mua ký là đồng ý counter. Có một ô \"subject to attached Buyer Counter Offer\" — tick ô đó nghĩa là chưa đồng ý, mà là counter ngược lại.", "p10_e": "Anh Minh và Chị Lan ký Chủ Nhật lúc 7 giờ tối, agent gửi ngay cho agent của Cô Hạnh → thành hợp đồng. Các hạn escrow bắt đầu tính từ đây.", "p10_w": "Tick ô Buyer Counter Offer là mở lại đàm phán. Seller lại tự do nhận offer khác.", "p11_n": "Đoạn 6", "p11_t": "Bên mua ký trễ", "p11_v": "Chỉ khi seller đồng ý ký lại", "p11_s": "Bên mua ký sau hạn 2A thì chỉ ràng buộc nếu seller đồng ý: ký đoạn 6 và giao lại trước 5:00 PM ngày thứ 3 sau ngày bên mua ký. Mọi hạn trong hợp đồng tính từ lúc giao Late Acceptance.", "p11_e": "Anh Minh ký thứ Ba 10/11 (trễ 1 ngày). Cô Hạnh vẫn muốn bán → ký đoạn 6, giao lại trước 5:00 PM thứ Sáu 13/11.", "ph_title": "Seller Counter Offer No. 1", "s0a": "Seller (đoạn 4)", "s0b": "Khi đưa counter ra", "s0c": "Counter sống tới 5:00 PM ngày thứ 3 sau chữ ký sau cùng của seller, hoặc ngày giờ ghi riêng (2A)", "s1a": "Buyer (đoạn 5)", "s1b": "Khi đồng ý counter", "s1c": "Ký và giao bản đã ký cho seller hoặc agent của seller trước hạn 2A", "s2a": "Tất cả các bên (ký tắt, 1A)", "s2b": "Nếu muốn giữ Liquidated Damages / Arbitration", "s2c": "Trong offer hoặc addendum (LDAA)", "s3a": "Seller (đoạn 6)", "s3b": "Chỉ khi bên mua ký trễ", "s3c": "Trước 5:00 PM ngày thứ 3 sau ngày bên mua ký đoạn 5", "m0": "<b>\"Seller counter rồi là coi như chốt.\"</b> Không. Chừng nào bên mua chưa ký và giao lại, seller vẫn rút được và vẫn bán cho người khác được (2B, 2C, đoạn 3). Ký xong để đó tới sáng mai mới gửi là đang đánh bạc với căn nhà.", "m1": "<b>\"Không chịu counter thì quay lại ký offer cũ.\"</b> Hết được. Đoạn 4 nói rõ: counter ra là offer hay counter trước đó không ký nhận được nữa. Muốn quay lại điều khoản cũ thì phải counter lại, ghi đúng điều khoản cũ.", "m2": "<b>\"Giá lên thì tiền cọc cũng lên theo.\"</b> Ngược lại. Đoạn 1B giữ nguyên số đô của tiền cọc và seller credit. Chỉ down payment và loan đổi theo tỉ lệ. Seller muốn cọc lớn hơn thì ghi ở 1D — nhiều listing agent quên dòng này.", "nx0": "Đọc offer gốc (RPA) từng bước: <a href=\"/t401/\">T401</a>.", "nx1": "Counter được ký và giao → tính lịch escrow từ ngày Acceptance: <a href=\"/t60/\">T60</a>.", "nx2": "Bên mua ký thay trust, LLC hay giấy ủy quyền? Xem RCSD-B: <a href=\"/t415/\">T415</a>.", "nx3": "Tất cả form đã giải nghĩa: <a href=\"/t402/\">T402</a>.", "h_tool": "So offer gốc với counter", "tool_sub": "Nhập offer và counter. Tool tính down và loan theo đoạn 1B, appraisal contingency theo 1C, hạn trả lời theo 2A.", "l_op": "Giá trong offer gốc", "l_cp": "Giá seller counter", "l_dep": "Tiền cọc (deposit) trong offer", "l_dp": "Tiền down trong offer", "l_gap": "Appraisal gap trong offer", "l_gap_s": "(không có thì để 0)", "l_oc": "Close escrow — offer", "l_cc": "Close escrow — counter", "l_ok": "Contingency — offer", "l_ck": "Contingency — counter", "u_days": "ngày", "l_sd": "Ngày seller ký counter", "l_sd_s": "(đoạn 4, chữ ký sau cùng)", "bigK": "Hạn bên mua ký và giao lại (đoạn 2A)", "exp_fmt": "{t} · {d}", "st_same": "<b>Giá không đổi.</b> Down payment, loan và tiền cọc giữ như offer gốc. Chỉ những gì ghi trong 1D là thay đổi.", "st_diff": "<b>Giá đổi {s} ({p}%).</b> Theo đoạn 1B, down payment đổi theo cùng tỉ lệ, bên mua cần thêm <b>{dd}</b> tiền down. Tiền cọc vẫn {dep} — giờ chỉ còn {dpc}% giá mới. Muốn cọc khác thì phải ghi rõ ở 1D.", "c_item": "Mục", "c_o": "Offer gốc", "c_c": "Counter", "r_price": "Giá mua", "r_dep": "Tiền cọc", "r_down": "Down payment", "r_loan": "Loan", "r_app": "Appraisal contingency ở mức", "r_coe": "Close escrow", "r_con": "Gỡ contingency", "n_days": "{n} ngày", "same": "(giữ nguyên, 1B)", "n_multi": "<b>Seller có 2–3 offer muốn counter cùng lúc?</b> SCO ghi rõ ngay dưới tên form: không dùng làm multiple counter offer. Trường hợp đó dùng form multiple counter riêng (C.A.R. SMCO).", "n_wd": "<b>Chưa ký và giao lại thì chưa có gì.</b> Trước lúc đó seller vẫn rút counter được (2B) hoặc nhận offer khác (2C, đoạn 3). Hạn tính theo ngày lịch, kể cả thứ Bảy, Chủ Nhật.", "sms": "Chào Ken, tôi xem tool T426 (counter offer SCO): offer {o}, counter {c}, close {cc} ngày, contingency {ck} ngày. Hạn trả lời {x}. Cho tôi hỏi thêm.", "subj": "Counter offer SCO — {nm}", "body": "Tên: {nm}\nEmail: {em}\nPhone: {ph}\n\nGiá offer gốc: {o}\nGiá counter: {c}\nDown payment mới (1B): {dn}\nLoan mới: {ln}\nTiền cọc (giữ nguyên): {dep}\nAppraisal contingency ở mức (1C): {app}\nClose escrow: {oc} → {cc} ngày\nContingency: {ok} → {ck} ngày\nHạn bên mua ký và giao lại (2A): {x}\n\nChỉ để hiểu form, không phải tư vấn pháp lý.\nGửi từ tool T426 tools.kenlamrealty.com"}, "en": {"b_email": "Email me the result", "b_sms": "Ask Ken", "b_video": "Watch the 45-sec video", "f_name": "Name", "f_phone": "Phone (optional)", "f_send": "Send", "f_ok": "Email opened. Hit Send and you're done. If it didn't open, copy the number below and text Ken.", "f_or": "Or text:", "f_copy": "Copy", "f_title": "Email this result to yourself", "f_sub": "Ken will reply and send the list of papers to get ready. No spam.", "ft_src": "Sources", "ft_upd": "Updated", "ft_all": "All tools", "lang": "Tiếng Việt", "nx_title": "Next steps", "ex": "The numbers shown are an example. Change them to yours.", "yes": "Yes", "no": "No", "h_what": "What this form is", "h_vid": "45-second video", "h_parts": "Walk through the form, part by part", "h_sign": "Who signs, when, and deadlines", "h_myth": "What people get wrong", "tap": "Tap any part to see what it means.", "tapall": "Open / close all", "k_say": "What it says", "k_ex": "Example: 1234 Example Lane", "k_cf": "Watch out", "mock": "Redrawn illustration — not the real form", "th_who": "Who signs", "th_when": "When", "th_due": "Deadline", "disc": "This page only helps you understand the form. It does not replace the original form and is not legal or tax advice. Before you sign, read the full form and ask your agent or an attorney.", "vid_note": "Silent video with on-screen text. Made for phones.", "wd": ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"], "mo": ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"], "h1": "SCO — Seller Counter Offer", "enorig": "Original name: <b>Seller Counter Offer</b>", "verline": "Form version: C.A.R. Form SCO, Revised 6/26", "sub": "Read the seller's counter paragraph by paragraph, compare it with the offer, and know the exact deadline.", "what": "The SCO is how a seller answers an offer: \"I agree, but change these points.\" It is used when the seller gets an offer (or a buyer counter) and is not ready to sign it as is. Everything in the offer stays the same except what the SCO changes — and it comes with a deadline.", "what_eg": "Like at the market: you offer $10, the seller says \"$12 and it's yours — tell me by 5 PM.\" The SCO is that sentence, on paper.", "p0_n": "Top", "p0_t": "Counter number, which offer, which home", "p0_v": "SCO No. 1 · to the Purchase Agreement dated 11/03/2026 · 1234 Example Lane", "p0_s": "States the counter number, which document it answers (the original offer or a buyer counter), that document's date, the address, and the buyer and seller names. Right under the title: this form may not be used as a multiple counter offer.", "p0_e": "SCO No. 1, answering the offer from Anh Minh & Chị Lan Nguyễn dated 11/03/2026 on 1234 Example Lane, San Jose, CA 95100. Seller: Cô Hạnh Trần.", "p0_w": "Three offers and you want to counter all three at once? Not with the SCO. Use the multiple counter form (SMCO). Send an SCO to three buyers, all three sign, and the seller may be bound to more than one contract.", "p1_n": "¶ 1A", "p1_t": "Liquidated damages and arbitration", "p1_v": "Buyers initialed · Cô Hạnh initials too", "p1_s": "The Liquidated Damages and Arbitration paragraphs of the offer only bind if every party initials them. If anyone does not, that paragraph drops out of the deal unless all parties initial it in the offer or in an addendum such as LDAA. There is a box to attach LDAA.", "p1_e": "Anh Minh and Chị Lan initialed Liquidated Damages in the offer. It only counts once Cô Hạnh initials it too, or an LDAA is attached.", "p1_w": "The most commonly missed spot. One missing initial and, if the buyer walks away later, the deposit fight plays out very differently.", "p2_n": "¶ 1B", gned ¶ 5", "m0": "<b>\"Once the seller counters, it's basically done.\"</b> No. Until the buyer signs and delivers, the seller can still withdraw or sell to someone else (2B, 2C, ¶ 3). Signing tonight and sending it tomorrow morning is gambling with the house.", "m1": "<b>\"If the counter doesn't work, we'll just go back and sign the old offer.\"</b> You can't. Paragraph 4 says once a counter is made, earlier offers and counters can no longer be accepted. To go back, someone has to counter again with the old terms.", "m2": "<b>\"If the price goes up, the deposit goes up too.\"</b> The opposite. Paragraph 1B keeps the deposit and seller credits at the same dollar amount. Only the down payment and loan move. A seller who wants a larger deposit must write it in 1D — plenty of listing agents forget.", "nx0": "Read the original offer (RPA) step by step: <a href=\"/t401/\">T401</a>.", "nx1": "Counter signed and delivered → build the escrow calendar from Acceptance: <a href=\"/t60/\">T60</a>.", "nx2": "Buyer signing for a trust, LLC or power of attorney? See RCSD-B: <a href=\"/t415/\">T415</a>.", "nx3": "All explained forms: <a href=\"/t402/\">T402</a>.", "h_tool": "Compare the offer with the counter", "tool_sub": "Enter the offer and the counter. The tool applies paragraph 1B (down and loan), 1C (appraisal contingency) and 2A (deadline).", "l_op": "Price in the original offer", "l_cp": "Seller counter price", "l_dep": "Deposit in the offer", "l_dp": "Down payment in the offer", "l_gap": "Appraisal gap in the offer", "l_gap_s": "(0 if none)", "l_oc": "Close of escrow — offer", "l_cc": "Close of escrow — counter", "l_ok": "Contingencies — offer", "l_ck": "Contingencies — counter", "u_days": "days", "l_sd": "Date the seller signs the counter", "l_sd_s": "(paragraph 4, last signature)", "bigK": "Buyer must sign and deliver by (paragraph 2A)", "exp_fmt": "{t} · {d}", "st_same": "<b>Price unchanged.</b> Down payment, loan and deposit stay as in the offer. Only what is written i function addDays(iso,n){ if(!iso) return null; const [y,m,d]=iso.split('-').map(Number); if(!y||!m||!d) return null; return new Date(y,m-1,d+n); }
function dLong(dt){ if(!dt) return '—'; const d=I18N[lang];
  return lang==='vi' ? d.wd[dt.getDay()]+', '+dt.getDate()+' tháng '+(dt.getMonth()+1)+', '+dt.getFullYear()
                     : d.wd[dt.getDay()]+', '+d.mo[dt.getMonth()]+' '+dt.getDate()+', '+dt.getFullYear(); }
function counter(i){
  const op=Math.max(0,i.op), cp=Math.max(0,i.cp), dp=Math.min(100,Math.max(0,i.dp))/100;
  const oDown=op*dp, cDown=cp*dp;
  return {op,cp,diff:cp-op,pct:op>0?(cp-op)/op*100:0,
    oDown,cDown,oLoan:op-oDown,cLoan:cp-cDown,
    dep:i.dep, oDepPct:op>0?i.dep/op*100:0, cDepPct:cp>0?i.dep/cp*100:0,
    gap:Math.max(0,i.gap), oApp:Math.max(0,op-i.gap), cApp:Math.max(0,cp-i.gap),
    exp:addDays(i.sd,SCO.EXPIRE_DAYS)};
}
function calc(){

  const oc=num('oCoe'), cc=num('cCoe'), ok=num('oCon'), ck=num('cCon');

  const sg=r.diff>0?'+':r.diff<0?'−':'';
  let st;
  if(r.diff===0) st=d.st_same;
  else st=T(d.st_diff,{s:sg+fmt(Math.abs(r.diff)).replace('−',''),p:(r.pct>0?'+':'')+r.pct.toFixed(1),dd:fmt(r.cDown-r.oDown),dep:fmt(r.dep),dpc:r.cDepPct.toFixed(2)});
  $('status').innerHTML=st;
  const row=(k,a,b,ch)=>`<div class="k">${k}</div><div>${a}</div><div class="${ch?'ch':''}">${b}</div>`;
  const dd=n=>T(d.n_days,{n});
  let h=`<div class="h">${d.c_item}</div><div class="h">${d.c_o}</div><div class="h">${d.c_c}</div>`;
  h+=row(d.r_price,fmt(r.op),fmt(r.cp),r.diff!==0);
  h+=row(d.r_dep,fmt(r.dep),fmt(r.dep)+' <small>'+d.same+'</small>',false);
  h+=row(d.r_down,fmt(r.oDown),fmt(r.cDown),r.cDown!==r.oDown);
  h+=row(d.r_loan,fmt(r.oLoan),fmt(r.cLoan),r.cLoan!==r.oLoan);
  if(r.gap>0) h+=row(d.r_app,fmt(r.oApp),fmt(r.cApp),r.cApp!==r.oApp);
  h+=row(d.r_coe,dd(oc),dd(cc),oc!==cc);
  h+=row(d.r_con,dd(ok),dd(ck),ok!==ck);
  $('cmp').innerHTML=h;
  last={o:fmt(r.op),c:fmt(r.cp),dn:fmt(r.cDown),ln:fmt(r.cLoan),dep:fmt(r.dep),app:r.gap>0?fmt(r.cApp):'—',oc,cc,ok,ck,x:expS};
  $('smsBtn').href='sms:4086662825?&body='+encodeURIComponent(T(d.sms,last));
  klSend();
}
