<script>
const FORM = {"code": "T533", "form": "WCMD", "rev": "C.A.R. Form WCMD, Revised 6/24", "title": {"vi": "WCMD: Vòi tiết kiệm nước và báo khí CO", "en": "WCMD: Water-saving fixtures and CO alarms"}, "one": {"vi": "WCMD là 1 trang C.A.R. báo cho buyer và seller hai luật: nhà xây trước 1994 phải có toilet, vòi sen, vòi nước tiết kiệm nước; nhà có gas, lò sưởi hay garage dính liền phải có báo khí CO. Hai bên ký là đã đọc, không phải seller hứa đã làm xong.", "en": "The WCMD is a 1-page C.A.R. advisory on two laws: homes built before 1994 need water-saving toilets, showerheads and faucets; homes with gas, a fireplace or an attached garage need carbon monoxide (CO) alarms. Signing means you read it, not that the seller says it's all done."}, "eli10": {"vi": "<b>Nói cho dễ hiểu:</b> toilet đời cũ xả một lần tốn cả xô nước, gần 4 gallon. Luật nói: nhà cũ phải đổi sang loại xả 1.6 gallon trở xuống. Còn khí CO thì không màu, không mùi, phát ra từ lò gas, lò sưởi, xe nổ máy trong garage. Cái báo CO giống “cái mũi” kêu giùm mình lúc ngủ.", "en": "<b>In plain words:</b> an old toilet can use almost a bucket of water per flush, close to 4 gallons. The law says older homes must switch to 1.6 gallons or less. CO gas has no color and no smell; it comes from gas furnaces, fireplaces and a car running in the garage. A CO alarm is a “nose” that wakes you up."}, "facts": [{"vi": "Seller và buyer cùng ký nhận. Agent đưa form.", "en": "Seller and buyer both sign to acknowledge. The agent provides it."}, {"vi": "Trong bộ disclosure, cùng lúc với TDS.", "en": "In the disclosure package, together with the TDS."}, {"vi": "1 trang", "en": "1 page"}, {"vi": "Civ §1101.1–1101.9 · H&S §13260–13263, §17926–17926.2", "en": "Civ §1101.1–1101.9 · H&S §13260–13263, §17926–17926.2"}], "steps": [{"title": {"vi": "Mục 1A(1): Nhà nào phải có vòi tiết kiệm nước", "en": "1A(1): Which homes need water-saving fixtures"}, "short": {"vi": "Ai phải làm", "en": "Who must"}, "ref": "p.1 · §1A(1)", "crop": "s01.jpg", "pins": [{"box": [31.7, 60.29, 24.37, 12.65], "t": {"vi": "Mốc 1/1/1994", "en": "The 1/1/1994 cutoff"}, "d": {"vi": "Nhà xây <b>trước hoặc đúng</b> ngày 1/1/1994 thì luật này áp dụng. Nhà xây sau ngày đó đã theo code mới từ đầu.", "en": "Homes built <b>on or before</b> 1/1/1994 are covered. Homes built after were built to newer code from the start."}, "x": 30.72, "y": 66.62}, {"t": {"vi": "Sửa có permit", "en": "Permitted remodels"}, "d": {"vi": "Nhà single family: sửa gì có permit thì thành phố đòi vòi đạt chuẩn mới ký final. Mốc 10% diện tích là cho multifamily, commercial.", "en": "Single-family: any permitted alteration needs compliant fixtures for final sign-off. The 10% floor-area trigger is for multifamily and commercial."}, "x": 32.62, "y": 82.16}, {"t": {"vi": "Sửa trên $150,000", "en": "Work over $150,000"}, "d": {"vi": "Multifamily, commercial: remodel trên $150,000 hoặc phòng có permit là phải thay.", "en": "Multifamily and commercial: work over $150,000, or any permitted room, triggers it."}, "x": 52.57, "y": 82.16}], "example": {"vi": "1234 Example Lane xây năm 1962. Luật áp dụng. Anh Tâm mua nhà, sau đó xin permit làm lại phòng tắm: inspector sẽ đòi toilet, vòi sen đạt chuẩn mới cho ký.", "en": "1234 Example Lane was built in 1962, so it is covered. When Tam later pulls a permit for the bathroom, the inspector will require compliant fixtures."}, "page": "p01.jpg"}, {"title": {"vi": "Mục 1A(2): Trường hợp được miễn", "en": "1A(2): Exceptions"}, "short": {"vi": "Miễn", "en": "Exceptions"}, "ref": "p.1 · §1A(2)", "crop": "s02.jpg", "pins": [{"t": {"vi": "Nhà di tích", "en": "Historic sites"}, "d": {"vi": "Nhà đăng ký di tích lịch sử được miễn.", "en": "Registered historical sites are exempt."}, "x": 46.81, "y": 27.5}, {"t": {"vi": "Thợ ống nước xác nhận không làm được", "en": "Plumber says not feasible"}, "d": {"vi": "Phải có <b>thợ có license</b> ký giấy là đường ống quá cũ, không lắp được. Mình tự nói thì không tính.", "en": "A <b>licensed plumber</b> must certify it can't be done. Your own opinion doesn't count."}, "x": 19.9, "y": 50.0}, {"t": {"vi": "Sắp đập bỏ", "en": "Slated for demolition"}, "d": {"vi": "Nhà sắp đập được miễn 1 năm. Nhà cắt nước vĩnh viễn cũng miễn.", "en": "A one-year pass for buildings to be demolished. Water permanently shut off is also exempt."}, "x": 39.48, "y": 61.25}], "warn": {"vi": "Có thành phố có luật riêng từ trước 2009 thì theo luật thành phố. Hỏi building department nơi căn nhà.", "en": "A city with its own retrofit rule from before 2009 follows its own rule. Ask the local building department."}, "page": "p01.jpg"}, {"title": {"vi": "Mục 1B: Không bắt thay lúc bán, nhưng phải khai", "en": "1B: Not required at sale, but must be disclosed"}, "short": {"vi": "Phải khai", "en": "Disclose"}, "ref": "p.1 · §1B", "crop": "s03.jpg", "pins": [{"box": [11.44, 28.13, 17.24, 30.99], "t": {"vi": "Không phải điều kiện bán", "en": "Not a point-of-sale rule"}, "d": {"vi": "State <b>không</b> bắt thay vòi trước khi close. Nhưng luật đã bắt chủ nhà single family thay xong từ 1/1/2017. Nhà còn đồ cũ là chủ nhà đang trễ hạn.", "en": "The state doesn't make replacement a closing condition. But single-family owners were already required to replace them by 1/1/2017. Old fixtures mean the owner is overdue."}, "x": 10.46, "y": 43.62}, {"t": {"vi": "Nhà ở từ 2017", "en": "Houses since 2017"}, "d": {"vi": "Từ 2017, seller nhà single family phải nói cho buyer biết luật này và nhà còn vòi nào chưa đạt.", "en": "Since 2017, single-family sellers must tell the buyer about this law and whether any fixture is noncompliant."}, "x": 48.43, "y": 43.62}, {"t": {"vi": "Còn vòi nào chưa đạt?", "en": "Any noncompliant fixtures?"}, "d": {"vi": "Seller khai trên TDS trang 2 (ghi chú cuối mục B). WCMD chỉ là bản giải thích luật.", "en": "The seller answers this on the TDS (note at the end of section B, page 2). The WCMD explains the law."}, "x": 38.59, "y": 69.0}], "page": "p01.jpg"}, {"title": {"vi": "Mục 1C: Bao nhiêu là “chưa đạt”", "en": "1C: What counts as noncompliant"}, "short": {"vi": "Con số", "en": "Limits"}, "ref": "p.1 · §1C", "crop": "s04.jpg", "pins": [{"box": [18.55, 22.44, 8.14, 24.72], "t": {"vi": "Toilet > 1.6 gpf", "en": "Toilet > 1.6 gpf"}, "d": {"vi": "Số gpf in ở trong nắp bồn hoặc sau bồn cầu, gần chỗ bản lề. Toilet trước 1994 thường 3.5 hoặc 5 gpf.", "en": "The gpf is stamped inside the tank or behind the seat hinge. Pre-1994 toilets are often 3.5 or 5 gpf."}, "x": 17.57, "y": 34.8}, {"box": [52.34, 32.56, 8.0, 24.72], "t": {"vi": "Vòi sen > 2.5 gpm", "en": "Showerhead > 2.5 gpm"}, "d": {"vi": "Số gpm in nhỏ trên mặt vòi sen. Không thấy số thì hứng nước 10 giây vào xô rồi nhân 6.", "en": "The gpm is printed on the showerhead. No label? Fill a bucket for 10 seconds and multiply by 6."}, "x": 51.36, "y": 44.92}, {"box": [18.52, 42.68, 8.13, 24.72], "t": {"vi": "Vòi nước trong nhà > 2.2 gpm", "en": "Indoor faucet > 2.2 gpm"}, "d": {"vi": "Vòi bếp, vòi lavabo. Nhiều khi chỉ cần thay cái đầu lọc (aerator) vài đồng là đạt.", "en": "Kitchen and bathroom faucets. Often a cheap aerator swap fixes it."}, "x": 17.54, "y": 55.03}, {"t": {"vi": "Hỏi giá trước khi bỏ contingency", "en": "Price it before removing contingency"}, "d": {"vi": "Buyer nên hỏi thợ giá thay <b>trước</b> khi bỏ investigation contingency. Bỏ rồi thì hết đường đòi.", "en": "Get a price <b>before</b> you remove the investigation contingency. After that, you lose leverage."}, "x": 42.03, "y": 75.27}], "example": {"vi": "Inspector ở 1234 Example Lane ghi: 2 toilet 3.5 gpf, vòi sen 2.0 gpm, vòi bếp 2.2 gpm. Vậy chỉ 2 toilet chưa đạt. Vòi bếp đúng 2.2 là còn đạt, vì luật nói “hơn 2.2”.", "en": "The inspector at 1234 Example Lane notes: two toilets at 3.5 gpf, shower 2.0 gpm, kitchen faucet 2.2 gpm. Only the two toilets fail. Exactly 2.2 still passes, because the law says “more than 2.2”."}, "warn": {"vi": "Đây là mức tối thiểu cho nhà cũ theo §1101.3. Đồ mới bán ở California bây giờ còn tiết kiệm hơn e CO"}, "ref": "p.1 · §2B", "crop": "s06.jpg", "pins": [{"t": {"vi": "Luật CO không bắt khai", "en": "No CO disclosure law"}, "d": {"vi": "Luật H&S chỉ bắt gắn, không bắt khai riêng.", "en": "The Health and Safety Code requires installing, not a separate disclosure."}, "x": 67.05, "y": 30.94}, {"box": [47.38, 53.5, 8.23, 30.99], "t": {"vi": "Nhưng TDS có ô CO", "en": "But the TDS has a CO box"}, "d": {"vi": "Seller phải làm TDS thì đánh dấu ô “Carbon Monoxide Device(s)” ở mục II-A trang 1 TDS. Xem T530.", "en": "A seller who owes a TDS ticks “Carbon Monoxide Device(s)” in section II-A of the TDS. See T530."}, "x": 46.4, "y": 69.0}], "page": "p01.jpg"}, {"title": {"vi": "Mục 2C: Gắn ở đâu, không gắn thì sao", "en": "2C: Where to install, and what if you don't"}, "short": {"vi": "Vị trí", "en": "Placement"}, "ref": "p.1 · §2C", "crop": "s07.jpg", "pins": [{"box": [41.35, 15.97, 21.03, 17.6], "t": {"vi": "Ngoài mỗi khu phòng ngủ", "en": "Outside each sleeping area"}, "d": {"vi": "Gắn ở hành lang trước cửa các phòng ngủ. 3 phòng chung 1 hành lang = 1 cái. Phòng ngủ ở đầu kia nhà = thêm 1 cái.", "en": "In the hallway outside the bedrooms. Three bedrooms on one hall = one alarm. A bedroom at the other end of the house = one more."}, "x": 40.37, "y": 24.77}, {"box": [65.52, 15.97, 26.25, 17.6], "t": {"vi": "Mỗi tầng", "en": "Every level"}, "d": {"vi": "Nhà 2 tầng thì tầng nào cũng có, kể cả basement. Tool bên dưới đếm giùm.", "en": "Every level of a multi-story home, basement included. The tool below counts them."}, "x": 64.54, "y": 24.77}, {"t": {"vi": "Không mất hợp đồng, nhưng bị kiện được", "en": "Sale stands, but liability"}, "d": {"vi": "Seller không gắn thì việc mua bán vẫn có hiệu lực. Buyer chỉ đòi được thiệt hại thực tế, tối đa $100 (chưa tính phí tòa và luật sư). Thành phố phạt tới $200 sau 30 ngày báo sửa.", "en": "The sale stands. The buyer's only remedy is actual damages up to $100 (not counting court costs and attorney fees). Cities can fine up to $200 after r", "type": "number", "def": 1962, "min": 1850, "max": 2030, "label": {"vi": "Năm xây", "en": "Year built"}}, {"id": "fuel", "type": "check", "def": true, "label": {"vi": "Nhà có gas (lò sưởi, bếp, bình nước nóng), fireplace, hoặc garage dính liền nhà", "en": "Has gas (furnace, range, water heater), a fireplace, or an attached garage"}}, {"id": "levels", "type": "number", "def": 2, "min": 1, "max": 5, "label": {"vi": "Số tầng (tính cả basement)", "en": "Levels (incl. basement)"}}, {"id": "areas", "type": "number", "def": 1, "min": 0, "max": 6, "label": {"vi": "Số khu phòng ngủ riêng (hành lang)", "en": "Separate sleeping areas (hallways)"}, "hint": {"vi": "Các phòng ngủ chung 1 hành lang = 1 khu.", "en": "Bedrooms sharing one hallway = 1 area."}}, {"id": "toilet", "type": "number", "def": 3.5, "min": 0, "step": 0.01, "label": {"vi": "Toilet tốn nhiều nhất (gpf)", "en": "Worst toilet (gpf)"}}, {"id": "shower", "type": "number", "def": 2, "min": 0, "step": 0.1, "label": {"vi": "Vòi sen mạnh nhất (gpm)", "en": "Highest showerhead (gpm)"}}, {"id": "faucet", "type": "number", "def": 2.2, "min": 0, "step": 0.1, "label": {"vi": "Vòi nước trong nhà mạnh nhất (gpm)", "en": "Highest indoor faucet (gpm)"}}]}, "myths": [{"t": {"vi": "“Bán nhà là phải thay hết toilet cũ.”", "en": "“You must replace old toilets to sell.”"}, "d": {"vi": "Không phải điều kiện để close. Chỉ bắt khai. Nhưng chủ nhà lẽ ra đã phải thay từ 2017, nên buyer có cớ đòi bớt tiền.", "en": "It isn't a closing condition, only a disclosure. But owners were due to replace them by 2017, which gives buyers room to ask for a credit."}}, {"t": {"vi": "“Nhà toàn điện thì khỏi báo CO.”", "en": "“All-electric homes never need CO alarms.”"}, "d": {"vi": "Garage dính liền nhà là đủ để bắt buộc. Fireplace củi cũng vậy.", "en": "An attached garage alone triggers the rule. So does a wood fireplace."}}, {"t": {"vi": "“Ký WCMD là seller bảo đảm nhà đạt chuẩn.”", "en": "“Signing the WCMD means the seller guarantees compliance.”"}, "d": {"vi": "WCMD chỉ là giấy báo luật. Muốn biết thật thì đọc TDS và báo cáo inspection.", "en": "The WCMD only explains the law. The TDS and the inspection report tell you the facts."}}], "next": [{"href": "/t530/", "t": {"vi": "T530 · TDS: bản khai tình trạng nhà", "en": "T530 · TDS: seller's condition disclosure"}, "d": {"vi": "Chỗ seller khai vòi chưa đạt và có báo CO hay không.", "en": "Where the seller discloses noncompliant fixtures and CO alarms."}}, {"href": "/t536/", "t": {"vi": "T536 · WHSD: bình nước nóng & báo khói", "en": "T536 · WHSD: water heater & smoke alarms"}, "d": {"vi": "Đếm báo khói cần bao nhiêu cái.", "en": "Count how many smoke alarms you need."}}, {"href": "/t535/", "t": {"vi": "T535 · WHS: dây buộc bình nước nóng", "en": "T535 · WHS: water heater strapping"}, "d": {"vi": "Bình nước nóng đã buộc đúng chưa.", "en": "Is the water heater strapped correctly?"}}, {"href": "/t28/", "t": {"vi": "T28 · Disclosures người bán là gì", "en": "T28 · Seller disclosures explained"}, "d": {"vi": "Trọn bộ giấy seller phải đưa.", "en": "The full seller disclosure package."}}], "sources": [{"t": "Civil Code §1101.3", "u": "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=1101.3"}, {"t": "Civil Code §1101.4", "u": "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=1101.4"}, {"t": "H&S Code §17926", "u": "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=HSC&sectionNum=17926"}, {"t": "H&S Code §13262", "u": "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=HSC&sectionNum=13262"}, {"t": "C.A.R. Form WCMD 6/24", "u": "https://www.car.org/"}]};
FORM.tool.compute=(function (v, H) {
      const vi = H.lang() === 'vi';
      const items = [];
      const y = v.year;
      // CO alarms: outside each sleeping area + every level that has no sleeping area
      const lv = Math.max(1, Math.round(v.levels || 1)), ar = Math.max(0, Math.round(v.areas || 0));
      const co = v.fuel ? ar + Math.max(0, lv - ar) : 0;
      // Fixtures (Civ §1101.3 limits; applies to homes built on or before 1/1/1994)
      const bad = [];
      if (v.toilet != null && v.toilet > 1.6) bad.push(vi ? "Toilet " + v.toilet + " gpf (giới hạn 1.6)" : "Toilet " + v.toilet + " gpf (limit 1.6)");
      if (v.shower != null && v.shower > 2.5) bad.push(vi ? "Vòi sen " + v.shower + " gpm (giới hạn 2.5)" : "Showerhead " + v.shower + " gpm (limit 2.5)");
      if (v.faucet != null && v.faucet > 2.2) bad.push(vi ? "Vòi nước " + v.faucet + " gpm (giới hạn 2.2)" : "Faucet " + v.faucet + " gpm (limit 2.2)");
      const covered = y != null && y <= 1994;
      let fx;
      if (!covered) {
        fx = vi ? "Vòi: nhà xây sau 1/1/1994, luật §1101.4 không áp" : "Fixtures: built after 1/1/1994, §1101.4 doesn't apply";
        if (bad.length) items.push(vi ? "Vẫn thấy vòi vượt mức: " + bad.join(", ") + ". Có thể ai đó đã thay đồ cũ vào. Không vi phạm luật bán nhà, nhưng tốn nước." : "Still over the limit: " + bad.join(", ") + ". Someone may have swapped in old fixtures. Not a sale-law issue, just wasteful.");
      } else if (bad.length) {
        fx = vi ? bad.length + " loại vòi chưa đạt" : bad.length + " fixture type(s) noncompliant";
        bad.forEach(b => items.push((vi ? "Chưa đạt: " : "Noncompliant: ") + b));
        items.push(vi ? "Seller phải khai trên TDS. Không bắt thay trước khi close, trừ khi thành phố có luật riêng." : "The seller must disclose it on the TDS. Replacement isn't required before closing unless the city requires it.");
        items.push(vi ? "Buyer: hỏi giá thay <b>trước</b> khi bỏ investigation contingency. " + (v.toilet > 1.6 ? "<span class=\"tag\">Ước tính</span> toilet mới khoảng vài trăm đô mỗi cái kể cả công." : "<span class=\"tag\">Ước tính</span> vòi sen, đầu vòi (aerator) thường rẻ, tự thay được.") : "Buyer: price the work <b>before</b> removing the investigation contingency. " + (v.toilet > 1.6 ? "<span class=\"tag\">Estimate</span> a new toilet runs a few hundred dollars each, installed." : "<span class=\"tag\">Estimate</span> showerheads and aerators are cheap and DIY-friendly."));
      } else {
        fx = vi ? "Vòi: đạt cả 3" : "Fixtures: all 3 pass";
        if (y === 1994) items.push(vi ? "Nhà xây năm 1994: xem ngày permit. Đúng hoặc trước 1/1/1994 mới thuộc luật." : "Built in 1994: check the permit date. Only on or before 1/1/1994 is covered.");
      }
      let cot;
      if (!v.fuel) {
        cot = vi ? "Báo CO: không bắt buộc" : "CO alarms: not required";
        items.push(vi ? "Không gas, không fireplace, không garage dính nhà thì luật CO không áp. Kiểm lại: bình nước nóng, bếp, máy sấy có chạy gas không?" : "No gas, fireplace or attached garage means the CO law doesn't apply. Double-check the water heater, range and dryer for gas.");
      } else {
        cot = vi ? "Cần ít nhất " + co + " báo CO" : "At least " + co + " CO alarm" + (co === 1 ? "" : "s");
        items.push(vi ? ar + " cái ngoài " + ar + " khu phòng ngủ" + (lv > ar ? " + " + (lv - ar) + " cái cho tầng không có phòng ngủ" : "") + "." : ar + " outside " + ar + " sleeping area(s)" + (lv > ar ? " + " + (lv - ar) + " for level(s) with no sleeping area" : "") + ".");
        if (ar === 0) items.push(vi ? "Không có khu phòng ngủ? Ít nhất mỗi tầng 1 cái." : "No sleeping area entered? Still one per level.");
        items.push(vi ? "Loại combo khói + CO gắn hành lang làm được 2 việc 1 lúc. Xem T536 để đếm báo khói." : "A combo smoke/CO alarm in the hallway covers both. See T536 to count smoke alarms.");
        items.push(vi ? "<span class=\"tag\">Lưu ý</span> Đây là mức tối thiểu state. Thành phố, hãng sản xuất, hay permit remodel có thể đòi thêm." : "<span class=\"tag\">Note</span> State minimum. The city, the manufacturer or a remodel permit can require more.");
      }
      return { big: fx + " · " + cot, sub: covered ? (vi ? "Nhà xây " + y + ": thuộc luật vòi tiết kiệm nước (Civ §1101.4)." : "Built " + y + ": covered by the water-fixture law (Civ §1101.4).") : (y == null ? (vi ? "Nhập năm xây." : "Enter the year built.") : (vi ? "Nhà xây " + y + "." : "Built " + y + ".")), items: items, bad: covered && bad.length > 0 };
    });
const UI={
 vi:{eb:"Ken Lam Library · Giải nghĩa Forms",lang:"English",vidH:"Xem 45 giây trước",vidP:"Clip ngắn tóm form này. Không tiếng, có chữ. Xem xong rồi đi từng phần bên dưới.",walkH:"Đi từng phần của form",walkP:"Hình chụp thật từ form (địa chỉ đã đổi thành ví dụ 1234 Example Lane). Chấm đỏ khớp với số giải thích bên dưới.",prev:"← Trước",nxt:"Tiếp →",zoom:"Phóng to trang",hint:"Kéo ngang để coi hết",ex:"Ví dụ với 1234 Example Lane",warn:"Coi chừng",toolH:"Tool: thử với nhà của anh chị",mythH:"Nhiều người hiểu sai",nextH:"Bước tiếp theo",mail:"Email kết quả cho Ken",sms:"Nhắn Ken",vbtn:"Xem video 45 giây",src:"Nguồn",upd:"Cập nhật",allF:"Mọi forms giải nghĩa",allT:"Tất cả tools",disc:"Trang này giải thích cho dễ hiểu, không thay form gốc và không phải tư vấn pháp lý hay thuế. Hình trích từ form để minh họa. Chuyện tranh chấp, đứng tên, thuế: hỏi luật sư hoặc CPA.",step:"Phần",of:"/",keys:{k1:"Ai điền / ký",k2:"Khi nào gặp",k3:"Số trang",k4:"Luật nào bắt"}},
 en:{eb:"Ken Lam Library · Forms explained",lang:"Tiếng Việt",vidH:"Watch the 45-second version first",vidP:"A short clip that sums up this form. No sound, on-screen text in Vietnamese. Then walk through it part by part below.",walkH:"Walk through the form",walkP:"Real images from the form (the address was changed to the example 1234 Example Lane). Red pins match the numbered notes.",prev:"← Back",nxt:"Next →",zoom:"Open full page",hint:"Swipe sideways to see it all",ex:"Example: 1234 Example Lane",warn:"Watch out",toolH:"Tool: try it with your home",mythH:"What people get wrong",nextH:"Next steps",mail:"Email my result to Ken",sms:"Text Ken",vbtn:"Watch the 45-second video",src:"Sources",upd:"Updated",allF:"All forms explained",allT:"All tools",disc:"Plain-language explanation only. It does not replace the actual form and is not legal or tax advice. Form images are shown for illustration. For disputes, title or tax questions, ask an attorney or CPA.",step:"Part",of:"/",keys:{k1:"Who fills / signs",k2:"When you see it",k3:"Pages",k4:"Required by"}}
};
let lang='vi';try{const s=localStorage.getItem('kl_lang');if(s==='en'||s==='vi')lang=s;}catch(e){}
const qs=new URLSearchParams(location.search);if(qs.get('lang')==='en'||qs.get('lang')==='vi')lang=qs.get('lang');
const $=id=>document.getElementById(id);
const L=o=>o==null?'':(typeof o==='string'?o:(o[lang]??o.vi??''));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur=0, last=null;
function fmtMoney(n){return '$'+Math.round(n).toLocaleString('en-US')}
function fmtDate(d){if(!(d instanceof Date)||isNaN(d))return '—';return lang==='vi'?(String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()):d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function parseDate(s){if(!s)return null;const [y,m,dd]=s.split('-').map(Number);return new Date(y,m-1,dd)}
const H={fmtMoney,fmtDate,addDays,parseDate,L:o=>L(o),lang:()=>lang};

function renderStatic(){
  const u=UI[lang];document.documentElement.lang=lang;
  document.title=L(FORM.title)+' · Ken Lam Tools';
  $('eb').textContent=u.eb;$('lang').textContent=u.lang;
  $('code').textContent=FORM.code+' · '+FORM.form+' · '+FORM.rev;
  $('h1').textContent=L(FORM.title);$('one').innerHTML=L(FORM.one);
  $('facts').innerHTML=['k1','k2','k3','k4'].map((k,i)=>'<div><b>'+u.keys[k]+'</b><span>'+L(FORM.facts[i])+'</span></div>').join('');
  $('eli').innerHTML=L(FORM.eli10);
  ['vidH','vidP','walkH','walkP','toolH','mythH','nextH','mail','sms','vbtn','upd','allF','allT','disc'].forEach(k=>$(k).textContent=u[k]);
  $('prev').textContent=u.prev;$('nxt').textContent=u.nxt;
  $('srcL').innerHTML=u.src+': '+FORM.sources.map(s=>'<a href="'+s.u+'" target="_blank" rel="noopener">'+esc(s.t)+'</a>').join(' · ');
  $('myths').innerHTML=FORM.myths.map(m=>'<div class="warn"><b>'+L(m.t)+'</b>'+L(m.d)+'</div>').join('');
  $('next').innerHTML=FORM.next.map(n=>'<li><a href="'+n.href+'"><b>'+L(n.t)+'</b><br><span style="color:var(--muted);font-size:15px">'+L(n.d)+'</span></a></li>').join('');
  $('toolP').innerHTML=L(FORM.tool.intro);
  renderInputs();renderStep();compute();
}
function renderInputs(){
  const vals=readInputs(true);
  $('inputs').innerHTML=FORM.tool.inputs.map(f=>{
    const lab=L(f.label), hint=f.hint?'<small>'+L(f.hint)+'</small>':'';
    if(f.type==='check')return '<label class="chk" style="grid-column:1/-1"><input type="checkbox" id="f_'+f.id+'"'+((vals[f.id]??f.def)?' checked':'')+'><span>'+lab+hint+'</span></label>';
    if(f.type==='select')return '<label class="fld" for="f_'+f.id+'">'+lab+'<select id="f_'+f.id+'">'+f.options.map(o=>'<option value="'+o.v+'"'+(String(vals[f.id]??f.def)===String(o.v)?' selected':'')+'>'+L(o.l)+'</option>').join('')+'</select>'+hint+'</label>';
    const v=vals[f.id]??f.def??'';
    return '<label class="fld" for="f_'+f.id+'">'+lab+'<input id="f_'+f.id+'" type="'+f.type+'"'+(f.type==='number'?' inputmode="decimal"':'')+(f.min!=null?' min="'+f.min+'"':'')+(f.max!=null?' max="'+f.max+'"':'')+(f.step!=null?' step="'+f.step+'"':'')+' value="'+esc(v)+'">'+hint+'</label>';
  }).join('');
  $('inputs').querySelectorAll('input,select').forEach(e=>e.addEventListener('input',compute));
}
function readInputs(soft){
  const o={};FORM.tool.inputs.forEach(f=>{const e=$('f_'+f.id);if(!e){if(!soft)o[f.id]=f.def;return}
    o[f.id]=f.type==='check'?e.checked:(f.type==='number'?(e.value===''?null:Number(e.value)):e.value)});return o;
}
function compute(){
  let r;try{r=FORM.tool.compute(readInputs(false),H)}catch(e){r={big:'—',items:[]};console.error(e)}
  last=r;
  $('res').innerHTML='<div class="big'+(r.bad?' bad':'')+'">'+r.big+'</div>'+(r.sub?'<div class="sub">'+r.sub+'</div>':'')+(r.items&&r.items.length?'<ul>'+r.items.map(i=>'<li>'+i+'</li>').join('')+'</ul>':'');
}
function renderStep(){
  const u=UI[lang],s=FORM.steps[cur];
  $('chips').innerHTML=FORM.steps.map((x,i)=>'<button type="button" class="chip'+(i<cur?' done':'')+'" data-i="'+i+'"'+(i===cur?' aria-current="step"':'')+'>'+(i+1)+'. '+L(x.short||x.title)+'</button>').join('');
  const pins=(s.pins||[]).map((p,i)=>(p.box?'<span class="mark" style="left:'+p.box[0]+'%;top:'+p.box[1]+'%;width:'+p.box[2]+'%;height:'+p.box[3]+'%"></span>':'')+'<span class="pin" style="left:'+p.x+'%;top:'+p.y+'%">'+(i+1)+'</span>').join('');
  $('step').innerHTML='<div class="ref">'+u.step+' '+(cur+1)+' · '+esc(s.ref||'')+'</div><h3>'+L(s.title)+'</h3>'+(s.intro?'<p>'+L(s.intro)+'</p>':'')+
   (s.crop?'<div class="desk"><div class="scroll"><div class="sheet"><img src="'+s.crop+'" alt="'+esc(L(s.title))+'" loading="lazy">'+pins+'</div></div><div class="zoom"><span class="hint">'+u.hint+'</span><button type="button" id="zbtn" data-p="'+s.page+'">'+u.zoom+' ↗</button></div></div>':'')+
   '<ol class="pins">'+(s.pins||[]).map((p,i)=>'<li><span class="n">'+(i+1)+'</span><div><b class="pt">'+L(p.t)+'</b>'+L(p.d)+'</div></li>').join('')+'</ol>'+
   (s.example?'<div class="ex"><b>'+u.ex+'</b>'+L(s.example)+'</div>':'')+
   (s.warn?'<div class="warn"><b>'+u.warn+'</b>'+L(s.warn)+'</div>':'');
  $('cnt').textContent=(cur+1)+u.of+FORM.steps.length;
  $('prev').disabled=cur===0;$('nxt').disabled=cur===FORM.steps.length-1;
  const z=$('zbtn');if(z)z.onclick=()=>{$('lbImg').src=z.dataset.p;$('lb').hidden=false};
}
$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;cur=+b.dataset.i;renderStep()});
$('prev').onclick=()=>{if(cur>0){cur--;renderStep();$('walkH').scrollIntoView({behavior:'smooth'})}};
$('nxt').onclick=()=>{if(cur<FORM.steps.length-1){cur++;renderStep();$('walkH').scrollIntoView({behavior:'smooth'})}};
$('lbX').onclick=()=>{$('lb').hidden=true};
$('lang').onclick=()=>{lang=lang==='vi'?'en':'vi';try{localStorage.setItem('kl_lang',lang)}catch(e){}renderStatic()};
$('mail').onclick=()=>{
  const tmp=document.createElement('div');tmp.innerHTML=(last?last.big+'\n'+(last.sub||'')+'\n'+(last.items||[]).join('\n'):'');
  const vals=readInputs(false);
  const lines=FORM.tool.inputs.map(f=>'- '+L(f.label).replace(/<[^>]+>/g,'')+': '+(f.type==='check'?(vals[f.id]?'✓':'—'):(f.type==='select'?L((f.options.find(o=>String(o.v)===String(vals[f.id]))||{}).l):vals[f.id]))).join('\n');
  const subj=(lang==='vi'?'Hỏi về form ':'Question about form ')+FORM.form+' ('+FORM.code+')';
  const body=(lang==='vi'?'Chào anh Ken,\n\nEm vừa dùng tool '+FORM.code+'. Em nhập:\n':'Hi Ken,\n\nI just used tool '+FORM.code+'. My inputs:\n')+lines+'\n\n'+(lang==='vi'?'Kết quả:\n':'Result:\n')+tmp.textContent+'\n\n'+(lang==='vi'?'Em muốn hỏi thêm: ':'My question: ');
  location.href='mailto:ken@kenlamrealty.com?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
};
$('sms').href='sms:4086662825?&body='+encodeURIComponent('Chào anh Ken, em hỏi về form '+FORM.form+' ('+FORM.code+').');
renderStatic();
</script>
