const FORM = {"code": "T506", "form": "WFDA", "rev": "C.A.R. Form WFDA, Revised 12/25", "title": {"vi": "WFDA: Lời khuyên khi mua/thuê ở vùng cháy rừng", "en": "WFDA: Advisory for buying or renting near a wildfire area"}, "one": {"vi": "WFDA là 2 trang C.A.R. đưa cho buyer hoặc người thuê khi căn nhà, miếng đất nằm trong hay gần vùng từng cháy rừng. Nó liệt kê những thứ phải tự đi kiểm: bảo hiểm, dọn xà bần, đất và không khí, permit xây lại, điện nước, luật defensible space.", "en": "The WFDA is a 2-page C.A.R. advisory for buyers or tenants when a home or lot is in or near a wildfire area. It lists what you must check yourself: insurance, debris removal, soil and air, rebuild permits, utilities, defensible space rules."}, "eli10": {"vi": "<b>Nói cho dễ hiểu:</b> giống mua chiếc xe ở vùng vừa bị lụt. Xe nhìn có thể ổn, nhưng phải hỏi: hãng bảo hiểm còn chịu bán không, đường sá có đang sửa không, giấy tờ có đổi luật không. WFDA là tờ giấy nhắc mình hỏi đủ những câu đó trước khi mua nhà gần chỗ từng cháy.", "en": "<b>In plain words:</b> like buying a car in a town that just flooded. The car may look fine, but you ask: will anyone insure it, are the roads torn up, did the rules change. The WFDA is the note that reminds you to ask those questions before buying near a burn area."}, "facts": [{"vi": "Agent đưa. Buyer hoặc người thuê (Tenant) ký nhận. Seller không ký.", "en": "The agent provides it. Buyer or tenant signs to acknowledge. Seller doesn't sign."}, {"vi": "Nhà, đất trong hoặc gần vùng từng cháy rừng; đính kèm offer (RPA/VLPA mục 4C).", "en": "Homes or land in or near a wildfire area; attached to the offer (RPA/VLPA paragraph 4C)."}, {"vi": "2 trang", "en": "2 pages"}, {"vi": "Form C.A.R. (không luật nào bắt riêng form này). Mục 5 nói về Civil Code §1102.19, Gov Code §51182.", "en": "C.A.R. form (no statute requires this form itself). Paragraph 5 covers Civil Code §1102.19, Gov Code §51182."}], "steps": [{"title": {"vi": "Mục 1: Vì sao có form này", "en": "Paragraph 1: Why this form exists"}, "short": {"vi": "Mở đầu", "en": "Intro"}, "ref": "Trang 1 · Mục 1", "crop": "s01.jpg", "pins": [{"t": {"vi": "Trong hoặc quanh vùng cháy", "en": "In or around a fire area"}, "d": {"vi": "Không cần nhà bị cháy. Nằm gần vùng cháy là đủ để dùng form này.", "en": "The home doesn't have to have burned. Being near a fire area is enough."}, "x": 35.58, "y": 16.43}, {"t": {"vi": "Hậu quả còn kéo dài", "en": "The aftermath lasts"}, "d": {"vi": "Dọn dẹp, xây lại hạ tầng, sức khỏe: nhiều chuyện còn chưa giải quyết xong sau khi lửa tắt.", "en": "Cleanup, rebuilding infrastructure, health issues: much is unresolved after the fire is out."}, "x": 7.03, "y": 55.7}, {"t": {"vi": "Khói bay xa", "en": "Smoke travels"}, "d": {"vi": "Khói và bụi từ đám cháy xa cũng ảnh hưởng. Mùa cháy 2020, trời San Jose cam đỏ cả ngày.", "en": "Smoke and particles from distant fires matter too. In the 2020 fire season the San Jose sky turned orange."}, "x": 40.45, "y": 77.1}, {"box": [42.86, 76.39, 22.38, 15.74], "t": {"vi": "Cả California", "en": "All of California"}, "d": {"vi": "Form nói thẳng: cháy có thể xảy ra ở chỗ trước giờ chưa cháy.", "en": "The form says it plainly: fires can hit places that never burned before."}, "x": 41.88, "y": 84.26}], "example": {"vi": "Bà Hoa thuê căn 1234 Example Lane, San Jose, gần đồi phía đông. Khu đồi gần đó từng cháy. Agent đưa WFDA kèm hợp đồng thuê để bà ký nhận.", "en": "Mrs. Hoa rents 1234 Example Lane, San Jose, near the east foothills, which burned before. The agent includes a WFDA with the lease for her to sign."}, "page": "p01.jpg"}, {"title": {"vi": "Mục 2A–2E: Bảo hiểm, xà bần, đất, không khí", "en": "2A–2E: Insurance, debris, soil, air"}, "short": {"vi": "Mối lo 1", "en": "Concerns 1"}, "ref": "Trang 1 · Mục 2A–2E", "crop": "s02.jpg", "pins": [{"box": [11.27, 38.04, 16.82, 16.41], "t": {"vi": "2A · Bảo hiểm", "en": "2A · Insurance"}, "d": {"vi": "Claim cũ, có mua được bảo hiểm không, giá bao nhiêu. Hỏi <b>càng sớm càng FORM.tool.compute=(function (v, H) {
      const vi = H.lang() === 'vi';
      const a = (href, t) => '<a href="' + href + '" target="_blank" rel="noopener">' + t + '</a>';
      const T = (x, y) => vi ? x : y;
      const items = [];
      const insLink = a("https://www.insurance.ca.gov/01-consumers/140-catastrophes/WildfireResources.cfm", T("Sở Bảo hiểm CA", "CA Dept. of Insurance"));
      if (v.ins === 'denied') items.push(T("<b>2A, 3E · Bảo hiểm</b> — bị từ chối: hỏi thêm broker khác, CA FAIR Plan kèm bảo hiểm bổ sung (DIC). Gọi " + insLink + " 1-800-927-4357. <b>Chưa có bảo hiểm thì đừng gỡ insurance contingency.</b>", "<b>2A, 3E · Insurance</b> — denied: try other brokers, the CA FAIR Plan plus a DIC policy. Call " + insLink + " 1-800-927-4357. <b>Do not remove the insurance contingency without coverage.</b>"));
      else if (v.ins === 'none') items.push(T("<b>3A · Bảo hiểm</b> — xin báo giá bảo hiểm cháy <b>ngay tuần đầu escrow</b>, trước hạn gỡ contingency. " + insLink, "<b>3A · Insurance</b> — get a fire insurance quote <b>in the first week of escrow</b>, before the contingency deadline. " + insLink));
      else items.push(T("<b>3E · Bảo hiểm</b> — có báo giá rồi: kiểm phí có làm hỏng tỷ lệ vay (DTI) không, và hỏi claim cũ của căn nhà (2A).", "<b>3E · Insurance</b> — you have a quote: check the premium doesn't break your loan ratio (DTI), and ask about past claims (2A)."));
      items.push(T("<b>3F · Coi chừng</b> — gỡ insurance contingency rồi mà không mua được bảo hiểm cháy, không close được, là có thể vi phạm hợp đồng.", "<b>3F · Careful</b> — removing the insurance contingency and then failing to get fire insurance can put you in breach."));
      if (v.area !== 'no') {
        items.push(T("<b>2E · Không khí, đất</b> — hỏi chuyện khói, tro, đất nhiễm sau cháy; cân nhắc thử đất, thử không khí trong nhà.", "<b>2E · Air and soil</b> — ask about smoke, ash and soil after the fire; consider soil and indoor air testing."));
        items.push(T("<b>3C, 2J · Công trường</b> — khu vực có thể sửa đường, kẹt xe, ồn, bụi, cúp điện nước nhiều năm.", "<b>3C, 2J · Construction</b> — expect road work, traffic, noise, dust and utility outages for a long time."));
      }
      if (v.dmg === 'damaged') items.push(T("<b>2C, 2E · Nhà hư một phần</b> — thuê inspector có kinh nghiệm khói/cháy: mái, lỗ thông hơi, ống gió HVAC, mùi khói trong tường; hỏi claim bảo hiểm đã trả gì, sửa có permit chưa.", "<b>2C, 2E · Partly damaged</b> — hire an inspector experienced with smoke/fire: roof, vents, HVAC ducts, smoke in walls; ask what the claim paid and whether repairs were permitted."));
      if (v.dmg === 'destroyed' || v.rebuild) {
        items.push(T("<b>2B · Dọn lô</b> — xà bần đã dọn xong chưa, có giấy xác nhận chưa, có phân tích chất độc (tro, amiăng, kim loại) chưa. " + a("https://wildfirerecovery.caloes.ca.gov/", "Cal OES"), "<b>2B · Lot clearing</b> — has debris removal been finished and certified, and were toxic materials (ash, asbestos, metals) tested? " + a("https://wildfirerecovery.caloes.ca.gov/", "Cal OES")));
        items.push(T("<b>2D, 2F · Permit xây lại</b> — hỏi City/County: thời gian, phí, luật mới (3D: luật có thể đổi giữa chừng). Xin bid giá xây bằng giấy.", "<b>2D, 2F · Rebuild permits</b> — ask the City/County about timelines, fees and new rules (3D: rules may change mid-process). Get written construction bids."));
        items.push(T("<b>2G, 2H · Điện, gas, nước, septic</b> — hỏi PG&E và water district khi nào nối lại, nước uống được chưa, septic có phải thiết kế lại không.", "<b>2G, 2H · Utilities</b> — ask PG&E and the water district when service returns, whether water is potable, and whether septic must be redesigned."));

        items.push(T("<b>4F · Xây chống cháy</b> — " + a("https://aiacalifornia.org/what-you-can-do-right-now/hardening-for-wildfire-resilience/", "AIA: Hardening for Wildfire Resilience"), "<b>4F · Build fire-resistant</b> — " + a("https://aiacalifornia.org/what-you-can-do-right-now/hardening-for-wildfire-resilience/", "AIA: Hardening for Wildfire Resilience")));
      }
      if (v.zone === 'vh') items.push(T("<b>5A, 5C · Vùng High/Very High</b> — xin seller form FHDS và báo cáo defensible space nếu có. Nhận làm defensible space sau close thì phải làm thật, không là bị phạt, bảo hiểm tăng hoặc hủy. " + a("https://www.readyforwildfire.org/", "CAL FIRE Ready for Wildfire"), "<b>5A, 5C · High/Very High zone</b> — ask the seller for form FHDS and any defensible space report. If you agree to do defensible space after close, do it, or face fines and higher or cancelled insurance. " + a("https://www.readyforwildfire.org/", "CAL FIRE Ready for Wildfire")));
      else if (v.zone === 'unknown') items.push(T("<b>5B · Chưa biết zone</b> — coi NHD report (dòng Fire Hazard Severity Zone) hoặc tra bản đồ " + a("https://osfm.fire.ca.gov/what-we-do/community-wildfire-preparedness-and-mitigation/fire-hazard-severity-zones", "CAL FIRE FHSZ") + ". Kết quả quyết định mục 5 có áp dụng không.", "<b>5B · Zone unknown</b> — check the NHD report (Fire Hazard Severity Zone line) or the " + a("https://osfm.fire.ca.gov/what-we-do/community-wildfire-preparedness-and-mitigation/fire-hazard-severity-zones", "CAL FIRE FHSZ map") + ". It decides whether paragraph 5 applies."));
      else items.push(T("<b>5D · Ngoài vùng</b> — luật fire hardening/defensible space thường không bắt. Gần đồi, cỏ khô thì vẫn hỏi seller có báo cáo gì không.", "<b>5D · Outside the zones</b> — the fire hardening/defensible space laws usually don't apply. Near hills or dry grass, still ask for any reports."));
      items.push(T("<b>3B, 4G · Tự kiểm</b> — mục đích dùng của mình (xây ADU, cho thuê…) hỏi City/County. Agent không phải chuyên gia (mục 6).", "<b>3B, 4G · Your own checks</b> — ask the City/County about your intended use (ADU, rental…). Agents aren't experts (paragraph 6)."));
      const n = items.length;
      let big, sub, bad = false;
      if (v.ins === 'denied') { big = T("Chưa có bảo hiểm: giữ contingency", "No insurance yet: keep the contingency"); bad = true; }
      else if (v.dmg === 'destroyed') big = T("Lô đất sau cháy: " + n + " việc phải kiểm", "Burned lot: " + n + " things to check");
      else if (v.area === 'no' && v.zone !== 'vh') big = T("Rủi ro thấp: " + n + " việc nên kiểm", "Lower risk: " + n + " things to check");
      else big = T(n + " việc WFDA nhắc phải kiểm", n + " things the WFDA says to check");
      sub = T("Theo đúng mục 2–5 của WFDA. Việc đầu tiên luôn là bảo hiểm cháy.", "Mapped to WFDA paragraphs 2–5. Fire insurance always comes first.");
      return { big, sub, items, bad };

const UI={
 vi:{eb:"Ken Lam Library · Giải nghĩa Forms",lang:"English",vidH:"Xem 45 giây trước",vidP:"Clip ngắn tóm form này. Không tiếng, có chữ. Xem xong rồi đi từng phần bên dưới.",walkH:"Đi từng phần của form",walkP:"Hình chụp thật từ form (địa chỉ đã đổi thành ví dụ 1234 Example Lane). Chấm đỏ khớp với số giải thích bên dưới.",prev:"← Trước",nxt:"Tiếp →",zoom:"Phóng to trang",hint:"Kéo ngang để coi hết",ex:"Ví dụ với 1234 Example Lane",warn:"Coi chừng",toolH:"Tool: thử với nhà của anh chị",mythH:"Nhiều người hiểu sai",nextH:"Bước tiếp theo",mail:"Email kết quả cho Ken",sms:"Nhắn Ken",vbtn:"Xem video 45 giây",src:"Nguồn",upd:"Cập nhật",allF:"Mọi forms giải nghĩa",allT:"Tất cả tools",disc:"Trang này giải thích cho dễ hiểu, không thay form gốc và không phải tư vấn pháp lý hay thuế. Hình trích từ form để minh họa. Chuyện tranh chấp, đứng tên, thuế: hỏi luật sư hoặc CPA.",step:"Phần",of:"/",keys:{k1:"Ai điền / ký",k2:"Khi nào gặp",k3:"Số trang",k4:"Luật nào bắt"}},
 en:{eb:"Ken Lam Library · Forms explained",lang:"Tiếng Việt",vidH:"Watch the 45-second version first",vidP:"A short clip that sums up this form. No sound, on-screen text in Vietnamese. Then walk through it part by part below.",walkH:"Walk through the form",walkP:"Real images from the form (the address was changed to the example 1234 Example Lane). Red pins match the numbered notes.",prev:"← Back",nxt:"Next →",zoom:"Open full page",hint:"Swipe sideways to see it all",ex:"Example: 1234 Example Lane",warn:"Watch out",toolH:"Tool: try it with your home",mythH:"What people get wrong",nextH:"Next steps",mail:"Email my result to Ken",sms:"Text Ken",vbtn:"Watch the 45-second video",src:"Sources",upd:"Updated",allF:"All forms explained",allT:"All tools",disc:"Plain-language explanation only. It does not replace the actual form and is not legal or tax advice. Form images are shown for illustration. For disputes, title or tax questions, ask an attorney or CPA.",step:"Part",of:"/",keys:{k1:"Who fills / signs",k2:"When you see it",k3:"Pages",k4:"Required by"}}

let lang='vi';try{const s=localStorage.getItem('kl_lang');if(s==='en'||s==='vi')lang=s;}catch(e){}
const qs=new URLSearchParams(location.search);if(qs.get('lang')==='en'||qs.get('lang')==='vi')lang=qs.get('lang');
const $=id=>document.getElementById(id);
const L=o=>o==null?'':(typeof o==='string'?o:(o[lang]??o.vi??''));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur=0, last=null;
function fmtMoney(n){return '$'+Math.round(n).toLocaleString('en-US')}
function fmtDate(d){if(!(d instanceof Date)||isNaN(d))return '—';return lang==='vi'?(String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()):d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function parseDate(s){if(!s)return null;const [y,m,dd]=s.split('-').map(Number);return new Date(y,m-1,dd)}
const H={fmtMoney,fmtDate,addDays,parseDate,L:o=>L(o),lang:()=>lang};

function renderStatic(){
  const u=UI[lang];document.documentElement.lang=lang;
  document.title=L(FORM.title)+' · Ken Lam Tools';
  $('eb').textContent=u.eb;$('lang').textContent=u.lang;
  $('code').textContent=FORM.code+' · '+FORM.form+' · '+FORM.rev;
  $('h1').textContent=L(FORM.title);$('one').innerHTML=L(FORM.one);
  $('facts').innerHTML=['k1','k2','k3','k4'].map((k,i)=>'<div><b>'+u.keys[k]+'</b><span>'+L(FORM.facts[i])+'</span></div>').join('');
  $('eli').innerHTML=L(FORM.eli10);
  ['vidH','vidP','walkH','walkP','toolH','mythH','nextH','mail','sms','vbtn','upd','allF','allT','disc'].forEach(k=>$(k).textContent=u[k]);
  $('prev').textContent=u.prev;$('nxt').textContent=u.nxt;
  $('srcL').innerHTML=u.src+': '+FORM.sources.map(s=>'<a href="'+s.u+'" target="_blank" rel="noopener">'+esc(s.t)+'</a>').join(' · ');
  $('myths').innerHTML=FORM.myths.map(m=>'<div class="warn"><b>'+L(m.t)+'</b>'+L(m.d)+'</div>').join('');
  $('next').innerHTML=FORM.next.map(n=>'<li><a href="'+n.href+'"><b>'+L(n.t)+'</b><br><span style="color:var(--muted);font-size:15px">'+L(n.d)+'</span></a></li>').join('');
  $('toolP').innerHTML=L(FORM.tool.intro);
  renderInputs();renderStep();compute();
}
function renderInputs(){
  const vals=readInputs(true);
  $('inputs').innerHTML=FORM.tool.inputs.map(f=>{
    const lab=L(f.label), hint=f.hint?'<small>'+L(f.hint)+'</small>':'';
    if(f.type==='check')return '<label class="chk" style="grid-column:1/-1"><input type="checkbox" id="f_'+f.id+'"'+((vals[f.id]??f.def)?' checked':'')+'><span>'+lab+hint+'</span></label>';
    if(f.type==='select')return '<label class="fld" for="f_'+f.id+'">'+lab+'<select id="f_'+f.id+'">'+f.options.map(o=>'<option value="'+o.v+'"'+(String(vals[f.id]??f.def)===String(o.v)?' selected':'')+'>'+L(o.l)+'</option>').join('')+'</select>'+hint+'</label>';
    const v=vals[f.id]??f.def??'';
    return '<label class="fld" for="f_'+f.id+'">'+lab+'<input id="f_'+f.id+'" type="'+f.type+'"'+(f.type==='number'?' inputmode="decimal"':'')+(f.min!=null?' min="'+f.min+'"':'')+(f.max!=null?' max="'+f.max+'"':'')+(f.step!=null?' step="'+f.step+'"':'')+' value="'+esc(v)+'">'+hint+'</label>';
  }).join('');
  $('inputs').querySelectorAll('input,select').forEach(e=>e.addEventListener('input',compute));
}
function readInputs(soft){
  const o={};FORM.tool.inputs.forEach(f=>{const e=$('f_'+f.id);if(!e){if(!soft)o[f.id]=f.def;return}
    o[f.id]=f.type==='check'?e.checked:(f.type==='number'?(e.value===''?null:Number(e.value)):e.value)});return o;
}
function compute(){
  let r;try{r=FORM.tool.compute(readInputs(false),H)}catch(e){r={big:'—',items:[]};console.error(e)}
  last=r;
  $('res').innerHTML='<div class="big'+(r.bad?' bad':'')+'">'+r.big+'</div>'+(r.sub?'<div class="sub">'+r.sub+'</div>':'')+(r.items&&r.items.length?'<ul>'+r.items.map(i=>'<li>'+i+'</li>').join('')+'</ul>':'');
}
function renderStep(){
  const u=UI[lang],s=FORM.steps[cur];
  $('chips').innerHTML=FORM.steps.map((x,i)=>'<button type="button" class="chip'+(i<cur?' done':'')+'" data-i="'+i+'"'+(i===cur?' aria-current="step"':'')+'>'+(i+1)+'. '+L(x.short||x.title)+'</button>').join('');
  const pins=(s.pins||[]).map((p,i)=>(p.box?'<span class="mark" style="left:'+p.box[0]+'%;top:'+p.box[1]+'%;width:'+p.box[2]+'%;height:'+p.box[3]+'%"></span>':'')+'<span class="pin" style="left:'+p.x+'%;top:'+p.y+'%">'+(i+1)+'</span>').join('');
  $('step').innerHTML='<div class="ref">'+u.step+' '+(cur+1)+' · '+esc(s.ref||'')+'</div><h3>'+L(s.title)+'</h3>'+(s.intro?'<p>'+L(s.intro)+'</p>':'')+
   (s.crop?'<div class="desk"><div class="scroll"><div class="sheet"><img src="'+s.crop+'" alt="'+esc(L(s.title))+'" loading="lazy">'+pins+'</div></div><div class="zoom"><span class="hint">'+u.hint+'</span><button type="button" id="zbtn" data-p="'+s.page+'">'+u.zoom+' ↗</button></div></div>':'')+
   '<ol class="pins">'+(s.pins||[]).map((p,i)=>'<li><span class="n">'+(i+1)+'</span><div><b class="pt">'+L(p.t)+'</b>'+L(p.d)+'</div></li>').join('')+'</ol>'+
   (s.example?'<div class="ex"><b>'+u.ex+'</b>'+L(s.example)+'</div>':'')+
   (s.warn?'<div class="warn"><b>'+u.warn+'</b>'+L(s.warn)+'</div>':'');
  $('cnt').textContent=(cur+1)+u.of+FORM.steps.length;
  $('prev').disabled=cur===0;$('nxt').disabled=cur===FORM.steps.length-1;
  const z=$('zbtn');if(z)z.onclick=()=>{$('lbImg').src=z.dataset.p;$('lb').hidden=false};
}
$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;cur=+b.dataset.i;renderStep()});
$('prev').onclick=()=>{if(cur>0){cur--;renderStep();$('walkH').scrollIntoView({behavior:'smooth'})}};
$('nxt').onclick=()=>{if(cur<FORM.steps.length-1){cur++;renderStep();$('walkH').scrollIntoView({behavior:'smooth'})}};
$('lbX').onclick=()=>{$('lb').hidden=true};
$('lang').onclick=()=>{lang=lang==='vi'?'en':'vi';try{localStorage.setItem('kl_lang',lang)}catch(e){}renderStatic()};
$('mail').onclick=()=>{
  const tmp=document.createElement('div');tmp.innerHTML=(last?last.big+'\n'+(last.sub||'')+'\n'+(last.items||[]).join('\n'):'');
  const vals=readInputs(false);
  const lines=FORM.tool.inputs.map(f=>'- '+L(f.label).replace(/<[^>]+>/g,'')+': '+(f.type==='check'?(vals[f.id]?'✓':'—'):(f.type==='select'?L((f.options.find(o=>String(o.v)===String(vals[f.id]))||{}).l):vals[f.id]))).join('\n');
  const subj=(lang==='vi'?'Hỏi về form ':'Question about form ')+FORM.form+' ('+FORM.code+')';
  const body=(lang==='vi'?'Chào anh Ken,\n\nEm vừa dùng tool '+FORM.code+'. Em nhập:\n':'Hi Ken,\n\nI just used tool '+FORM.code+'. My inputs:\n')+lines+'\n\n'+(lang==='vi'?'Kết quả:\n':'Result:\n')+tmp.textContent+'\n\n'+(lang==='vi'?'Em muốn hỏi thêm: ':'My question: ');
  location.href='mailto:ken@kenlamrealty.com?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
};
$('sms').href='sms:4086662825?&body='+encodeURIComponent('Chào anh Ken, em hỏi về form '+FORM.form+' ('+FORM.code+').');
renderStatic();
