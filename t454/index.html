<style>
/* Layout: one column, inputs on top, live result card below, three actions, footer. Phone first. */
:root{
  --bg:#FBF9F4;        /* ivory */
  --panel:#FFFFFF;
  --fg:#2B2925;
  --muted:#7A7468;
  --line:#E6E0D3;
  --brass:#B8955A;     /* soft brass accent */
  --brass-soft:#F3EBDC;
  --warn:#9A5B2E;
  --ok:#4F7A5A;
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1C1A17;--panel:#24211D;--fg:#F1ECE2;--muted:#A69D8E;--line:#3A352E;
  --brass:#D2B07A;--brass-soft:#302A20;--warn:#D99A6A;--ok:#8CBF9A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1A17;--panel:#24211D;--fg:#F1ECE2;--muted:#A69D8E;--line:#3A352E;
  --brass:#D2B07A;--brass-soft:#302A20;--warn:#D99A6A;--ok:#8CBF9A;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:22px}
header{display:grid;gap:6px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:500}
.lang{border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:12px;padding:5px 10px;border-radius:999px;cursor:pointer}
.lang:focus-visible,button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1{font-family:var(--display);font-weight:300;font-size:38px;line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:15px;margin:0;max-width:40ch}

.inputs{display:grid;gap:14px}
.field{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.field label small{font-weight:400}
.ctl{display:flex;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:0 12px}
.ctl:focus-within{border-color:var(--brass)}
.ctl .pre,.ctl .post{color:var(--muted);font-size:15px}
.ctl input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:20px;padding:12px 8px;font-variant-numeric:tabular-nums}
.ctl input::-webkit-outer-spin-button,.ctl input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ctl input[type=number]{-moz-appearance:textfield}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:380px){.row2{grid-template-columns:1fr}}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:15px;padding:11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brass-soft);color:var(--fg);font-weight:500}

.result{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:grid;gap:16px}
.total .k{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.total .v{font-family:var(--display);font-weight:400;font-size:58px;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--fg)}
.total .v small{font-family:var(--body);font-size:16px;color:var(--muted);font-weight:400}
.lines{display:grid;gap:0;border-top:1px solid var(--line)}
.line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.line .n{color:var(--muted);min-width:0}
.line .n b{color:var(--fg);font-weight:500}
.line .a{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.line.pmi .a{color:var(--warn)}
.line.pmi.off{display:none}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.bar .b1{background:var(--brass)}
.bar .b2{background:#A9B7A0}
.bar .b3{background:#CBB7A3}
.bar .b4{background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
.meta{font-size:13px;color:var(--muted);display:grid;gap:4px}
.meta b{color:var(--fg);font-weight:500}
.note{font-size:13px;color:var(--muted);background:var(--brass-soft);border-radius:10px;padding:10px 12px;line-height:1.45}

.actions{display:grid;gap:10px}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;border-radius:10px;padding:14px 16px;font:inherit;font-size:15px;font-weight:500;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#FFFDF8}

.form{display:none;background:var(--panel);border:1px solid var(--brass);border-radius:14px;padding:18px;gap:12px}
.form.open{display:grid}
.form h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.form p{margin:0;font-size:14px;color:var(--muted)}
.form .ctl input{font-size:16px}
.form .ok{color:var(--ok);font-weight:500;font-size:14px}
.copyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.copyrow code{background:var(--brass-soft);padding:3px 8px;border-radius:6px;user-select:all;font-family:var(--body)}
.copyrow button{border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;font-size:13px;padding:5px 10px;border-radius:999px;cursor:pointer}

footer{display:grid;gap:8px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
footer a{color:var(--brass);text-decoration:none}
footer a:hover{text-decoration:underline}
footer .who{color:var(--fg)}
@media (prefers-reduced-motion:no-preference){.total .v{transition:opacity .15s}}
/* ---- T27 thêm (không đổi class cũ) ---- */
.ctl input[type=date]{font-size:17px;min-height:48px}
.fx{font-size:12px;color:var(--muted);font-weight:400}
.status{font-size:15px;border-radius:10px;padding:10px 12px;line-height:1.45}
.status.ok{background:var(--brass-soft)}
.status.warn{border:1px solid var(--warn)}
.status b{font-weight:500}

.line .n small{display:block;font-size:12px;margin-top:2px}
.line.sum .n b,.line.sum .a{color:var(--fg);font-weight:600}
.line.dim{opacity:.6}
.line.warnl .a{color:var(--warn)}
.dl{display:grid;gap:10px}
.dl h2,.idr h2,.next h2,.tlw h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.dd{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:6px;min-width:0}
.dd .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.dd .t{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.dd .left{font-size:13px;color:var(--muted);white-space:nowrap}
.dd .date{font-family:var(--display);font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}
.dd p{margin:0;font-size:14px;color:var(--muted)}
.dd p b{color:var(--warn);font-weight:500}
.gcal{justify-self:start;font-size:12px;color:var(--brass);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap;background:var(--panel)}

.idr{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:grid;gap:10px}
.idr .r{display:grid;gap:2px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.idr .r b{color:var(--fg);font-weight:500;font-size:15px}
.tlw{display:grid;gap:12px}
.tlw .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tlw .cnt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.phase{display:grid;border-top:1px solid var(--line);padding-top:14px}
.ph-h{display:flex;justify-content:space-between;align-items:center;gap:6px 12px;flex-wrap:wrap;margin-bottom:2px}
.ph-h h3{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.15;margin:0}
.ph-n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.task{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:11px 0;border-bottom:1px solid var(--line)}
.task input{width:20px;height:20px;accent-color:var(--brass);margin:1px 0 0;cursor:pointer}
.task .tt{border:0;background:transparent;color:var(--fg);font:inherit;font-size:15px;line-height:1.4;text-align:left;padding:0;cursor:pointer;min-width:0}
.task.done .tt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.task .why{grid-column:2;font-size:13px;color:var(--muted);line-height:1.5}
.task .why[hidden]{display:none}
.myth{font-size:14px;line-height:1.5;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin:0}
.myth b{color:var(--warn);font-weight:500}
.myth a,.next a,.idr a{color:var(--brass)}
.next{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:10px}
.next ol{margin:0;padding-left:20px;display:grid;gap:10px;font-size:14px;line-height:1.5}
.reset{justify-self:start;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:0}
footer .src{line-height:1.6}
footer .src a{word-break:break-word}
/* ---- T227 thêm (không đổi class cũ) ---- */
.task .dt{grid-column:2;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;color:var(--muted)}
.task .dt b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}

.next-k{font-size:14px;color:var(--muted)}

.icsrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.icsrow .btn{padding:10px 14px;font-size:14px}

<script id="kl-commas">
/* Ken Lam Realty: ô nhập tiền / sqft tự thêm dấu phẩy (1,200,000). Code cũ vẫn đọc .value ra số thuần. */
(function(){
  var d=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
  function fmt(v){
    var s=String(v==null?'':v).replace(/[^0-9.\-]/g,''),neg=s.charAt(0)==='-';
    s=s.replace(/-/g,'');
    var i=s.indexOf('.'),ip=i<0?s:s.slice(0,i),dp=i<0?'':s.slice(i).replace(/\./g,'');
    if(i>=0)dp='.'+dp;
    ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return (neg?'-':'')+ip+dp;
  }
  function want(el){
    if(el.type!=='number'||el.__klc)return false;
    var c=el.closest&&el.closest('.ctl');if(!c)return false;
    var pre=c.querySelector('.pre'),post=c.querySelector('.post');
    if(pre&&pre.textContent.indexOf('$')>-1)return true;
    if(post&&/^\s*(sqft|sq ?ft)\s*$/i.test(post.textContent))return true;
    return false;
  }
  function conv(el){
    if(!want(el))return;
    el.__klc=1;
    var cur=d.get.call(el),ph=el.getAttribute('placeholder');
    el.type='text';
    if(!el.getAttribute('inputmode'))el.setAttribute('inputmode','numeric');
    Object.defineProperty(el,'value',{configurable:true,
      get:function(){return d.get.call(this).replace(/,/g,'')},
      set:function(v){d.set.call(this,fmt(v))}});
    d.set.call(el,fmt(cur));
    if(ph&&/^[0-9.]{5,}$/.test(ph))el.setAttribute('placeholder',fmt(ph));
    el.addEventListener('input',function(){
      var raw=d.get.call(el),pos=el.selectionStart,n=0,k;
      for(k=0;k<pos;k++)if(/[0-9.]/.test(raw.charAt(k)))n++;
      var out=fmt(raw);
      if(out===raw)return;
      d.set.call(el,out);
      for(k=0,pos=0;k<out.length&&n>0;k++){pos=k+1;if(/[0-9.]/.test(out.charAt(k)))n--;}
      try{el.setSelectionRange(pos,pos)}catch(e){}
    });
  }
  function scan(r){
    if(r.nodeType!==1)return;
    if(r.tagName==='INPUT')conv(r);
    var l=r.querySelectorAll?r.querySelectorAll('input[type=number]'):[];
    for(var i=0;i<l.length;i++)conv(l[i]);
  }
  new MutationObserver(function(m){
    for(var i=0;i<m.length;i++)for(var j=0;j<m[i].addedNodes.length;j++)scan(m[i].addedNodes[j]);
  }).observe(document.documentElement,{childList:true,subtree:true});
  document.addEventListener('DOMContentLoaded',function(){scan(document.body)});
})();
</script>

 st:'<b>{c} mục</b> luôn nên đọc ({r}). <b>{x} mục</b> thêm theo đặc điểm căn nhà. Đọc cả 15 trang vẫn là tốt nhất.',
 core:'luôn đọc',page:'trang',clr:'Bỏ chọn hết',
 g_front:'Trang 1',g_A:'A · Tình trạng vật lý',g_B:'B · Sử dụng và sở hữu',g_C:'C · Xung quanh',g_D:'D · Luật bắt buộc',g_E:'E · Hợp đồng, escrow',g_F:'F · Chuyện khác',
 front_buyer:['Quyền và trách nhiệm người mua','Người bán, agent không bảo đảm tình trạng nhà. Tự thuê chuyên gia, đọc hết báo cáo. Hủy ngoài thời hạn contingency là có thể mất cọc.'],
 front_seller:['Trách nhiệm người bán','Phải khai điều mình biết có ảnh hưởng giá trị nhà, mở nhà và giữ điện nước cho inspection. SBSA không thay TDS.'],
 A2:['Chất độc hại môi trường','Mốc, sơn chì, asbestos, radon, formaldehyde. Nhà lớn, cũ, xây trước 1935 hay có bồn chứa dầu chôn dưới đất; có nơi bắt kiểm tra hoặc dọn.'],
 A4:['Động đất, địa chất','Nhà xây trước 1960: thường người bán phải đưa booklet "Homeowner\'s Guide to Earthquake Safety". Condo: hỏi HOA tiền sửa, gia cố động đất.'],
 A5:['Inspection','Inspection thường không test mốc, mối, sơn chì, radon, không nhìn sau tường, không coi ống nối cống. Bỏ inspection là đi ngược lời khuyên.'],
 A6:['Nấm mốc','Mốc có thể nằm khuất, người bán cũng không biết. Inspection thường, kể cả pest, hay không thấy. Muốn chắc thì thuê environmental hygienist.'],
 A7:['Thú nuôi','Mùi nước tiểu có thể nằm im lâu rồi trở lại khi trời nóng ẩm; giặt thảm chưa chắc hết. Bọ chét có thể còn lại.'],
 A8:['Septic','Nhà có thể xài septic dù hàng xóm nối cống. Không ai bảo đảm hệ thống. Thuê chuyên gia, hỏi báo cáo có gồm leach field không.'],
 A10:['Diện tích, ranh đất','Số trên MLS, assessor thường là ước lượng. Hàng rào chưa chắc là ranh. Chỉ appraiser hoặc land surveyor xác nhận được.'],
 A11:['Nước thấm','Khó thấy, sửa rất tốn: mục gỗ, mốc, hư kết cấu. Không thấy không có nghĩa là không có.'],
 A12:['Giếng, hệ thống nước','Test cả chất lượng và lượng nước; có thể có vi khuẩn, kim loại như chromium. Nên test bơm giếng kéo dài.'],
 A13:['Mối mọt','Báo cáo pest chia Section 1 (đang có) và Section 2 (dễ bị). Thuê công ty pest có đăng ký.'],
 A14:['Cháy rừng, defensible space','Vùng high / very high fire severity: ảnh hưởng bảo hiểm và xây lại. Tra bản đồ Cal Fire theo địa chỉ.'],
 A15:['Preliminary title report','Prelim không bảo đảm title, nhưng ghi easement, giới hạn HOA (kể cả số, cân nặng thú nuôi). Đọc cả các link trong đó.'],
 B1:['ADU','Kiểm tra permit và luật cho ADU, ảnh hưởng việc cho thuê và xây thêm sau này.'],
 B2:['Permit, zoning, code','Phần nới, sửa có thể không permit, không đúng code hiện nay. Có khi luật không cho xây lại nếu bị hư.'],
 B3:['Dự định sử dụng sau này','Người bán, agent không hứa bạn được sửa, đổi gì sau khi close. Hỏi thành phố và thầu của bạn.'],
 B4:['California FAIR Plan','Nhà đồi, rừng, biển: có khi chỉ mua được bảo hiểm FAIR Plan, đắt hơn, bảo vệ ít hơn. Hỏi agent bảo hiểm sớm, trong thời gian contingency.'],
 B5:['Sửa, thay, remodel sau này','Thay hay sửa lớn có thể kéo theo luật, code mới, tốn hơn dự tính.'],
 B6:['Máy lạnh, máy nước nóng','Thay máy lạnh phải test ống gió, rò quá 15% phải sửa. Gas R-22 ngưng sản xuất từ 1/1/2020. Máy nước nóng mới thường to hơn, có khi không vừa chỗ cũ.'],
 B7:['Nhà lịch sử, hạn chế kiến trúc','Có thể bị giới hạn sửa, chặt cây, xây thêm.'],
 B8:['Bảo hiểm, title insurance','Claim cũ (người bán khai 5 năm) có thể làm khó mua bảo hiểm. Condo: coi bảo hiểm HOA bảo vệ tới đâu. Có title policy loại trừ rủi ro sau foreclosure.'],
 B9:['Đất thuê (land lease)','Không sở hữu đất. Quyền ở có ngày hết, tiền thuê đất có thể tăng, có khi khó mua title insurance.'],
 B10:['Cần sa, meth lab','Trồng cần sa có thể gây mốc, sửa điện không permit. Meth lab: nguy hiểm sức khỏe, bị cấm ở cho tới khi dọn sạch.'],
 B12:['Rent control, đuổi người thuê','Tiểu bang và thành phố giới hạn tăng giá, số người ở, quyền chấm dứt hợp đồng thuê.'],
 B13:['Retrofit khi bán','Smoke và CO detector, dây đai máy nước nóng. Thành phố có thể đòi thêm (toilet ít nước, van gas…).'],
 B14:['Cho thuê ngắn hạn','Thành phố, HOA có thể cấm cho thuê ngắn hạn (thường 30 ngày trở xuống).'],
 B16:['Hồ bơi, an toàn','Luật đòi rào, báo động, nắp… khác nhau từng thành phố. Hồ, spa mới phải có ít nhất 2 trong 7 biện pháp chống chết đuối; inspector phải ghi biện pháp đang có.'],
 B17:['Thiếu nước','Có thể bị giới hạn nước, giá tăng theo bậc. Giếng cạn có khi phải mua nước chở tới.'],
 B18:['Mello-Roos, bond 1915','Thuế đặc biệt trên bill thuế. Hỏi ai trả, có chia lúc close không, trước khi bỏ contingency. Đường dây điện chôn ngầm có thể thêm thuế.'],
 C1:['Sân golf','Banh bay, tiếng máy cắt cỏ sáng sớm, thuốc xịt, nước tưới tạt sang.'],
 C2:['Khu xóm, nhu cầu riêng','Trường, an ninh, internet, sân bay, tháp điện thoại, đường sắt cao tốc… tự tìm hiểu theo nhu cầu nhà mình.'],
 C3:['Tiếng ồn','Máy bay, freeway, trường, chó sủa. Ghé nhà nhiều giờ khác nhau, cả ban đêm.'],
 C4:['Trường học','Ở gần chưa chắc được học trường gần nhất. Ranh giới trường có thể đổi. Hỏi school district.'],
 C5:['Ống ga, đường ống ngầm','Đường ống ga, nhiên liệu chạy ngầm khắp California. Ở gần không có nghĩa là nguy hiểm, nhưng nên hỏi chuyên gia.'],
 D1:['Người chết trong nhà','Chết hơn 3 năm trước: người bán không bắt buộc khai. HIV/AIDS: không bao giờ phải khai. Hỏi thẳng bằng giấy thì người bán không được nói dối.'],
 D3:['Sơn chì, luật RRP','Nhà trước 1978: thợ sửa, sơn phải có chứng chỉ nếu đụng hơn 6 sqft trong phòng hoặc 20 sqft bên ngoài.'],
 D4:['Vùng nguy cơ cháy','Nằm trong vùng State Fire Responsibility hoặc Very High Fire Hazard: người bán phải khai; có thể có phí phòng cháy.'],
 D5:['FIRPTA, thuế giữ lại','Người bán non-resident alien: giữ 15% giá gửi IRS (10% nếu mua để ở và ≤ $1,000,000). California giữ 3⅓% trừ khi người bán ký miễn.'],
 D6:['Vùng lũ','Vùng lũ FEMA: vay ngân hàng liên bang thường bắt mua bảo hiểm lũ. Ngoài vùng vẫn có thể ngập.'],
 D7:['Megan\'s Law','Tự tra meganslaw.ca.gov. Người bán, agent không bắt buộc tra giùm.'],
 D8:['Thuế bổ sung (supplemental)','Đổi chủ là định giá lại. 1–2 bill thuế bổ sung KHÔNG gửi cho lender, không trả qua impound. Tự trả.'],
 D9:['Bản đồ có thể đổi','Vùng động đất, cháy, lũ có thể được vẽ lại: nhà đang ngoài vùng có thể bị đưa vô.'],
 D10:['Điện hóa, cấm gas','Một số nơi cấm đồ gas trong nhà mới; có thể cấm thay đồ gas sau này.'],
 E2:['Liquidated damages','Nhà 1–4 căn, người mua ở 1 căn: phần cọc bị giữ tối đa 3% giá. Escrow thường cần cả 2 ký hoặc phán quyết mới giao tiền.'],
 E6:['Home warranty','Không bao hết. Hồ bơi, spa, máy lạnh có thể phải mua thêm. Đọc kỹ policy.'],
 E7:['Mua all-cash bằng LLC (GTO)','Title phải báo người thật đứng sau LLC. Form ghi Santa Clara County, ngưỡng $300,000. Hỏi escrow quy định hiện hành.'],
 E8:['Offer không bí mật','Người bán, listing agent có thể kể giá, điều kiện offer cho người khác, trừ khi mọi bên ký NDA.'],
 E9:['Lừa wire tiền','Hacker giả email escrow, đổi số tài khoản. Gọi số escrow đã biết để xác nhận trước khi wire.'],
 F1:['Phí chuyển nhượng tư','Có khu thu phí khi bán, tính theo % giá, có khi kéo dài mãi.'],
 F3:['HOA, CC&Rs, trạm sạc EV','Luật lệ, phí tháng, special assessment, quỹ dự trữ, bảo hiểm HOA, kiện tụng. Không trả HOA là bị lien.'],
 F5:['Quảng cáo, mạng xã hội','Đồ staging không đi theo nhà. MLS, flyer không phải hợp đồng. Hình có thể được chỉnh. Hình trên mạng ở lại lâu.'],
 F6:['Vay PACE','PACE là lien trên bill thuế nhà, ưu tiên cao. Có thể làm khó vay mua.'],
 F8:['Solar, net metering','Coi solar mua đứt hay thuê. Thuê thì có UCC-1, người mua phải được công ty duyệt để nhận lease. Net metering có thể đổi khi đổi chủ.'],
 F10:['Ban công, cầu thang gỗ','Tòa 3 căn trở lên phải kiểm tra ban công, cầu thang gỗ. Condo: HOA lo, có thể ảnh hưởng phí và việc vay.'],
 y_tank:'Nhà trước 1935',y_quake:'Nhà trước 1960',y_lead:'Nhà trước 1978',
 m1:'<b>"Ký SBSA là chấp nhận hết mọi thứ trong đó."</b> Không. Ký chỉ là xác nhận đã nhận và đọc. Không đổi giá, không bỏ quyền. Điều khoản thật nằm trong RPA (¶4C). Nhưng ký rồi mà không đọc thì sau này khó nói "không ai nói tôi biết".',
 m2:'<b>"Agent đã kiểm tra mấy thứ này rồi."</b> Không. Gần như đoạn nào cũng kết bằng câu "Brokers do not have expertise in this area". Agent giỏi là agent chỉ bạn đi đúng chuyên gia, không phải agent nói "nhà này ok".',
 m3:'<b>"FAIR Plan là bảo hiểm dự phòng, bao hết."</b> Thường không. FAIR Plan chủ yếu bảo hiểm cháy, có giới hạn. Nhiều người phải mua thêm policy DIC cho phần còn lại. Hỏi agent bảo hiểm trước khi bỏ contingency, không phải tuần close.',
 nx1:'Đọc hợp đồng mua từng bước, ngày contingency: <a href="/t401/">T401 (RPA)</a> và lịch escrow <a href="/t60/">T60</a>.',
 nx2:'Người bán khai gì: <a href="/t455/">T455 (SPQ)</a> và <a href="/t28/">T28 (disclosures)</a>.',
 nx3:'Xin bộ disclosures của căn nhà: <a href="/t151/">T151</a>.',
 nx4:'Radon, mốc nhà HUD: <a href="/t453/">T453</a>. Mọi forms: <a href="/t402/">T402</a>.',

},en:{
 title:'SBSA — Statewide Buyer and Seller Advisory',
 sub:'15 C.A.R. pages handed out in nearly every California home sale. No need to memorize it. Pick your home\'s features and the tool points to exactly what to read.',
 s_what:'C.A.R.\'s advisory, SBSA Rev 6/26: 15 pages, 69 paragraphs in groups A–F, plus G for local addenda.',
 s_when:'Nearly every California home sale, usually alongside the RPA and the disclosure package.',
 s_who:'Buyer and seller sign on page 15, confirming they received and read all 15 pages.',
 s_after:'Nothing is bought or sold by it. It is not a contract term and waives no rights (RPA ¶4C). But later it is hard to say "nobody told me".',
 c1_r:'Page 1 · Buyer rights and duties',c1_t:'Buyers: investigate yourself, don\'t lean on others',c1_alt:'SBSA page 1: buyer rights and duties',
 c1_p:'Seller and brokers don\'t guarantee the condition. Inspect personally and hire professionals, even if reports already exist. You may ask for repairs, but the seller doesn\'t have to. Cancel within the time periods and you\'re fine; cancel outside them and your deposit may be at risk. In caps: not investigating is acting against the brokers\' advice.',
 c1_e:'Mr. A (buyer) is buying 1234 Example Lane, San Jose, CA 95100 for $1,250,000. Ms. B (seller) hands over last year\'s inspection. Mr. A still hires his own inspector.',
 c2_r:'Page 1 · Seller, Broker',c2_t:'Sellers must disclose. Agents only look',c2_alt:'SBSA page 1: seller and broker duties',
 c2_p:'Sellers must disclose known material facts, make the home available and keep utilities on for inspections. SBSA is not a substitute for the TDS. Brokers aren\'t experts in everything. For 1–4 units they do a visual inspection of accessible areas and disclose what they see; many defects can\'t be seen.',
 c2_e:'Ms. B knows the roof leaked in 2022 and was fixed. She still discloses it. An agent seeing no water stains doesn\'t mean the roof never leaked.',
 c3_r:'Page 2 · Table of contents',c3_t:'Contents: 7 groups, A to G',c3_alt:'SBSA page 2: table of contents and the 7 groups',
 c3_p:'A: physical condition. B: use and ownership. C: off-site and neighborhood. D: legal requirements. E: contract and escrow. F: other factors. G: local addenda. Rev 6/26 renumbered everything and lists paragraph numbers in the contents.',
 c3_e:'Mr. A wants to read about pools → the contents point to B16, page 8. The tool below does this for you.',
 c4_r:'¶A5 · page 3',c4_t:'What a general inspection does NOT cover',c4_alt:'SBSA paragraph A5: Inspections',
 c4_p:'Inspectors generally don\'t look behind walls or under carpet, and don\'t take equipment apart. A general inspection typically doesn\'t test for mold, wood-destroying pests, lead paint, radon, asbestos, soil, roof life, or the sewer connection. Roofs, pools, wells, septic and chimneys may need specialists. Waiving inspection goes against brokers\' advice.',
 c4_e:'Built in 1972: Mr. A orders a general inspection plus a pest report (¶A13) and a sewer camera. Three reports, all read before removing contingencies.',
 c5_r:'¶D5 · page 10',c5_t:'Foreign seller: tax withholding',c5_alt:'SBSA paragraph D5: FIRPTA and California withholding',
 c5_p:'If the seller is a non-resident alien, the buyer must withhold 15% of the price for the IRS unless an exemption applies. Only 10% if the buyer will live there and the price is $1,000,000 or less. Exempt at $300,000 or less with a buyer occupancy affidavit. California withholds 3⅓% unless the seller certifies an exemption (principal residence, $100,000 or less, or others).',
 c5_e:'If Ms. B were a non-resident alien with no exemption: $1,250,000 × 15% = $187,500 withheld for the IRS (over $1M, so no 10% rate). Escrow handles it, but the buyer is responsible.',
 c6_r:'¶E7–E9 · page 12',c6_t:'LLC cash buys, offers aren\'t secret, wire fraud',c6_alt:'SBSA paragraphs E7, E8, E9',
 c6_p:'E7: all-cash purchases through an LLC require title to identify the real people behind it; the form lists Santa Clara County with a $300,000 threshold. E8: the seller may share your offer with others unless everyone signs an NDA. E9: hackers fake escrow emails and change account numbers. Be extremely careful before wiring.',
 c6_e:'Mr. A gets an email: "escrow changed accounts, wire the $37,500 deposit here." He calls the escrow number from the original paperwork, not the one in the email. The email was fake.',
 c7_r:'¶G · page 15',c7_t:'Signing: received and read all 15 pages',c7_alt:'SBSA page 15: local addenda and signatures',
 c7_p:'Section G checks any local addenda. Signing confirms you received all 15 pages and read and understood them. It doesn\'t change price, dates, or waive any contract right.',
 c7_e:'Mr. A and Ms. B sign the SBSA with the disclosures. The $1,250,000 price and the 17-day contingencies in the RPA stay exactly the same.',
 tl_title:'Which paragraphs matter for my home?',tl_sub:'Pick your home\'s features. The tool filters the SBSA paragraphs (¶) worth reading closely, with page numbers. Nothing is saved or sent.',
 l_role:'I am the',r_buyer:'Buyer',r_seller:'Seller',l_yr:'Year built',l_feat:'The home has',l_feat_s:'(pick as many as apply)',
 f_pool:'Pool / spa',f_hoa:'HOA / condo / townhouse',f_solar:'Solar',f_well:'Well / septic',f_fire:'Hills, brush, fire zone',f_flood:'Creek, flood zone',
 f_adu:'ADU / garage conversion / addition',f_rent:'Tenants / buying to rent',f_foreign:'Seller lives abroad',f_llc:'All-cash buy through an LLC',
 f_hvac:'Old AC, water heater / gas appliances',f_noise:'Near freeway, airport, rail',f_school:'Schools matter',f_pets:'Prior owner had pets',
 f_remodel:'Planning a big remodel or addition',f_mello:'Newer tract / Mello-Roos',f_death:'Worried about a death in the home',f_land:'Leased land / mobile home park',
 f_grow:'Possible past cannabis grow',f_golf:'Near a golf course',f_claims:'Past insurance claims',f_size:'Square footage, lot lines matter',
 r_total:'Paragraphs to read closely',of:'/ {t} in A–F',
 st:'<b>{c}</b> are always worth reading ({r}). <b>{x}</b> more based on your home. Reading all 15 pages is still best.',
 core:'always',page:'page',clr:'Clear all',
 g_front:'Page 1',g_A:'A · Physical condition',g_B:'B · Use and ownership',g_C:'C · Neighborhood',g_D:'D · Legal requirements',g_E:'E · Contract, escrow',g_F:'F · Other factors',
 front_buyer:['Buyer rights and duties','Seller and agents don\'t guarantee condition. Hire your own pros, read every report. Cancel outside contingency periods and your deposit may be at risk.'],
 front_seller:['Seller duties','Disclose known facts that affect value, make the home available and keep utilities on for inspections. SBSA doesn\'t replace the TDS.'],
 A2:['Environmental hazards','Mold, lead paint, asbestos, radon, formaldehyde. Larger, older homes built before 1935 may have buried fuel tanks; some cities require inspection or removal.'],
 A4:['Earthquakes, geology','Built before 1960: the seller usually must provide the "Homeowner\'s Guide to Earthquake Safety". Condos: ask the HOA about quake repair or retrofit costs.'],
 A5:['Inspections','A general inspection typically doesn\'t test for mold, pests, lead, radon, doesn\'t look behind walls or at the sewer connection. Waiving it goes against advice.'],
 A6:['Mold','Mold can be hidden, even from the seller, and often isn\'t found by general or pest inspections. To be sure, hire an environmental hygienist.'],
 A7:['Pets and animals','Urine odor can lie dormant and return with heat and humidity; new carpet may not fix it. Fleas can remain.'],
 A8:['Septic systems','A home can be on septic even if neighbors are on sewer. Nobody warrants the system. Hire a pro and ask if the report covers leach lines.'],
 A10:['Square footage, lot lines','MLS and assessor numbers are often approximations. Fences may not mark the line. Only an appraiser or land surveyor can confirm.'],
 A11:['Water intrusion','Hard to detect, expensive to fix: rot, mold, structural damage. Not seeing it doesn\'t mean it isn\'t there.'],
 A12:['Wells, water systems','Test both quality and quantity; water may contain bacteria or metals like chromium. An extended well output test is recommended.'],
 A13:['Wood-destroying pests','Pest reports have Section 1 (active) and Section 2 (conditions likely to lead to it). Use a registered pest company.'],
 A14:['Wildfire, defensible space','High or very high fire severity zones affect insurance and rebuilding. Check the Cal Fire map by address.'],
 A15:['Preliminary title report','Not a title guarantee, but it lists easements and HOA restrictions (even pet number and weight). Read the linked documents too.'],
 B1:['ADUs','Verify permits and rules for the ADU and how they affect renting and future building.'],
 B2:['Permits, zoning, code','Additions or remodels may lack permits or fall short of current code. Some structures can\'t be rebuilt if destroyed.'],
 B3:['Your future use','Neither seller nor agent promises what you can change after closing. Ask the city and your own contractor.'],
 B4:['California FAIR Plan','Hillside, brush or coastal homes may only qualify for the FAIR Plan: costlier, more limited. Talk to an insurance agent early, during contingencies.'],
 B5:['Future repairs and remodels','Big repairs or replacements can trigger newer codes and cost more than expected.'],
 B6:['HVAC and water heaters','Replacing AC requires duct testing; leaks over 15% must be fixed. R-22 production ended 1/1/2020. New water heaters are often bigger and may not fit.'],
 B7:['Historic and design restrictions','Limits on remodeling, tree removal, building.'],
 B8:['Insurance, title insurance','Past claims (sellers disclose 5 years) can make insurance harder. Condos: check what the HOA policy covers. Some title policies exclude post-foreclosure risk.'],
 B9:['Land lease','You don\'t own the land. The right to occupy ends someday, ground rent can rise, title insurance may be harder.'],
 B10:['Cannabis, meth labs','Grows can cause mold and unpermitted electrical work. Meth labs are a serious health risk and can\'t be occupied until cleaned.'],
 B12:['Rent and eviction control','State and city rules limit rent, occupancy and ending tenancies.'],
 B13:['Point-of-sale retrofits','Smoke and CO detectors, water-heater strapping. Cities may require more (low-flow fixtures, gas shut-off valves…).'],
 B14:['Short-term rentals','Cities and HOAs may ban short-term rentals (usually 30 days or less).'],
 B16:['Pools and safety','Barrier, alarm, cover rules vary by city. New pools and spas need at least 2 of 7 drowning-prevention features; inspectors must note which are present.'],
 B17:['Water shortages','Usage limits and tiered pricing. A dry well may mean trucked-in water.'],
 B18:['Mello-Roos, 1915 bonds','Special taxes on the tax bill. Settle who pays and whether it is prorated before removing contingencies. Utility undergrounding can add assessments.'],
 C1:['Golf courses','Stray balls, early-morning mowers, chemicals, sprinkler overspray.'],
 C2:['Neighborhood, personal needs','Schools, crime, internet, airports, cell towers, high-speed rail… check what matters to your family.'],
 C3:['Noise','Aircraft, freeways, schools, dogs. Visit at different times, including night.'],
 C4:['Schools','Living nearby doesn\'t guarantee the nearest school. Boundaries change. Ask the district.'],
 C5:['Underground pipelines','Gas and fuel lines run all over California. Proximity alone doesn\'t mean danger; ask an expert.'],
 D1:['Death on the property','Deaths more than 3 years before the offer need not be disclosed; HIV/AIDS never. A seller can\'t lie to a direct written question.'],
 D3:['Lead paint RRP rule','Pre-1978 homes: contractors must be certified when disturbing more than 6 sq ft inside a room or 20 sq ft outside.'],
 D4:['Fire hazard zones','In a State Responsibility Area or Very High Fire Hazard Zone, sellers must disclose it; a fire prevention fee may apply.'],
 D5:['FIRPTA, withholding','Non-resident alien seller: withhold 15% for the IRS (10% if buyer will live there and ≤ $1,000,000). California withholds 3⅓% unless the seller certifies an exemption.'],
 D6:['Flood zones','In a FEMA flood zone, federally regulated loans usually require flood insurance. Homes outside zones can still flood.'],
 D7:['Megan\'s Law','Check meganslaw.ca.gov yourself. Seller and agents aren\'t required to.'],
 D8:['Supplemental tax bills','A sale triggers reassessment. One or two supplemental bills are NOT sent to your lender or paid from impounds. You pay them.'],
 D9:['Zone maps change','Earthquake, fire and flood maps get redrawn; a home outside a zone today may be in one later.'],
 D10:['Electrification','Some cities ban gas appliances in new construction; future bans on replacing gas appliances are possible.'],
 E2:['Liquidated damages','1–4 units, buyer will live in one: the deposit kept is capped at 3% of price. Escrow usually needs both signatures or a ruling to release it.'],
 E6:['Home warranty','Doesn\'t cover everything. Pool, spa, AC coverage may cost extra. Read the policy.'],
 E7:['All-cash LLC buys (GTO)','Title must identify the real people behind the LLC. The form lists Santa Clara County, $300,000 threshold. Ask escrow what is in effect now.'],
 E8:['Offers aren\'t confidential','The seller or listing agent may share your offer\'s terms unless everyone signs an NDA.'],
 E9:['Wire fraud','Hackers fake escrow emails and switch account numbers. Call a known escrow number to verify before wiring.'],
 F1:['Private transfer fees','Some areas charge a fee on resale, often a % of price, sometimes forever.'],
 F3:['HOAs, CC&Rs, EV charging','Rules, dues, special assessments, reserves, HOA insurance, litigation. Unpaid HOA dues can become a lien.'],
 F5:['Marketing, social media','Staging furniture isn\'t included. MLS and flyers aren\'t the contract. Photos may be enhanced and stay online.'],
 F6:['PACE loans','A PACE lien sits on the property tax bill with super priority and may complicate financing.'],
 F8:['Solar, net metering','Find out if solar is owned or leased. Leases come with a UCC-1, and the buyer must be approved to assume it. Net metering terms may change with a new owner.'],
 F10:['Wood balconies and stairs','Buildings with 3+ units need inspections of wood balconies and stairs. For condos the HOA handles it, which can affect dues and loans.'],
 y_tank:'Built before 1935',y_quake:'Built before 1960',y_lead:'Built before 1978',
 m1:'<b>"Signing the SBSA means I accept everything in it."</b> No. Signing only confirms you received and read it. It changes no price and waives no rights; the real terms are in the RPA (¶4C). But sign without reading and it\'s hard to say later "nobody told me".',
 m2:'<b>"The agent already checked all this."</b> No. Nearly every paragraph ends with "Brokers do not have expertise in this area." A good agent sends you to the right expert; a careless one says "the house is fine".',
 m3:'<b>"The FAIR Plan is a backup that covers everything."</b> Usually not. It is mainly limited fire coverage, and many owners add a separate DIC policy. Talk to an insurance agent before removing contingencies, not in closing week.',

}};

let role='buyer', on={};
const ROLE=[['rBuyer','buyer'],['rSeller','seller']];
const ORDER=k=>{ if(k==='front') return -1; const g='ABCDEF'.indexOf(k[0]); return g*100+(+k.slice(1)); };
/* Lọc: trả về {core:[...], extra:[...], why:{code:[lý do]}} — tách riêng để test */
function pick(role,yr,on){
  const core=CORE[role].slice(), extra=new Set(), why={};
  const add=(c,r)=>{ if(core.indexOf(c)>-1) return; extra.add(c); (why[c]=why[c]||[]).push(r); };
  if(yr>0&&yr<Y_TANK) add('A2','y_tank'); if(yr>0&&yr<Y_QUAKE) add('A4','y_quake'); if(yr>0&&yr<Y_LEAD) add('D3','y_lead');
  FEAT.forEach(([f,cs])=>{ if(on[f]) cs.forEach(c=>add(c,'f_'+f)); });
  return {core, extra:[...extra].sort((a,b)=>ORDER(a)-ORDER(b)), why};
}
function calc(d){
  const yr=+$('yr').value||0, r=pick(role,yr,on);
  document.querySelectorAll('#chips .chip').forEach(b=>b.setAttribute('aria-pressed',on[b.dataset.f]?'true':'false'));
  const n=r.core.length+r.extra.length;
  $('big').textContent=n; $('bigU').textContent=d.of.replace('{t}',TOTAL_PARAS);
  $('st').innerHTML=d.st.replace('{c}',r.core.length).replace('{x}',r.extra.length).replace('{r}',lang==='vi'?(role==='buyer'?'người mua':'người bán'):(role==='buyer'?'buyer':'seller'));
  const all=r.core.map(c=>({c,core:1})).concat(r.extra.map(c=>({c}))).sort((a,b)=>ORDER(a.c)-ORDER(b.c));
  let h='', g='', L=[];
  all.forEach(it=>{
    const grp=it.c==='front'?'front':it.c[0];
    if(grp!==g){ g=grp; h+='<div class="grp">'+d['g_'+grp]+'</div><div class="items">'; }
    const key=it.c==='front'?'front_'+role:it.c, [t,w]=d[key];
    const tag=it.core?d.core:(r.why[it.c]||[]).map(k=>d[k]).join(' · ');
    h+='<div class="it'+(it.core?' core':'')+'"><span class="p">'+(it.c==='front'?'1':it.c)+'</span><span class="h">'+esc(t)+'<small>'+d.page+' '+PG[it.c==='front'?'front':it.c]+' · '+esc(tag)+'</small></span><span class="w">'+esc(w)+'</span></div>';
    L.push((it.c==='front'?d.g_front:'¶'+it.c)+' ('+d.page+' '+PG[it.c==='front'?'front':it.c]+') '+t+' — '+tag);
  });
  h=h.replace(/<div class="grp">/g,(m,i)=>i?'</div>'+m:m)+(h?'</div>':'');
  $('list').innerHTML=h;
  const feats=FEAT.filter(([f])=>on[f]).map(([f])=>d['f_'+f]);
  return {lines:[(lang==='vi'?'Vai trò: ':'Role: ')+(role==='buyer'?d.r_buyer:d.r_seller), d.l_yr+': '+(yr||'—'), d.l_feat+': '+(feats.join(', ')||'—'), '', d.r_total+': '+n].concat(L).join('\n'),
    short:(role==='buyer'?d.r_buyer:d.r_seller)+', '+(lang==='vi'?'năm xây ':'built ')+(yr||'—')+', '+n+(lang==='vi'?' mục: ':' paragraphs: ')+all.map(x=>x.c==='front'?'p1':x.c).join(' ')};
}
function init(){
  $('chips').innerHTML=FEAT.map(([f])=>'<button type="button" class="chip" data-f="'+f+'" data-i="f_'+f+'" aria-pressed="false"></button>').join('');
  $('chips').addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; on[b.dataset.f]=!on[b.dataset.f]; run(); });
  $('yr').addEventListener('input',run); $('yr').addEventListener('change',run);
  ROLE.forEach(([id,v])=>$(id).onclick=()=>{role=v;seg(ROLE,role);run();});
  $('clr').onclick=()=>{ on={}; run(); };
}

const I18N={vi:Object.assign({},COMMON.vi,T.vi),en:Object.assign({},COMMON.en,T.en)};
let lang='vi'; try{ if(localStorage.getItem('kl_lang')==='en') lang='en'; }catch(e){}
let LAST={lines:'',short:''};
function run(){ const d=I18N[lang]; try{ LAST=calc(d)||LAST; }catch(e){ console.error(e); }
  $('smsBtn').href='sms:4086662825?&body='+encodeURIComponent(d.sms.replace('{s}',LAST.short)); }
function applyLang(){
  const d=I18N[lang];
  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.getAttribute('data-i'); if(typeof d[k]==='string') el.innerHTML=d[k];});
  document.querySelectorAll('[data-a]').forEach(el=>{const k=el.getAttribute('data-a'); if(typeof d[k]==='string') el.setAttribute('alt',d[k]);});
  $('langBtn').textContent=d.lang; document.documentElement.lang=lang; run();
}
$('langBtn').onclick=()=>{lang=lang==='vi'?'en':'vi'; try{localStorage.setItem('kl_lang',lang)}catch(e){} applyLang();};
$('emailBtn').onclick=()=>{$('form').classList.toggle('open'); if($('form').classList.contains('open')) $('fname').focus();};
$('sendBtn').onclick=()=>{
  const d=I18N[lang], n=$('fname').value.trim()||'—', e=$('femail').value.trim()||'—', ph=$('fphone').value.trim()||'—';
  const fill=s=>s.replace('{n}',n).replace('{e}',e).replace('{ph}',ph).replace('{lines}',LAST.lines);
  /* LEAD → FUB: email tới ken@kenlamrealty.com (FUB Lead Email Parsing), giống T227. */
  const href='mailto:ken@kenlamrealty.com?subject='+encodeURIComponent(fill(d.subj))+'&body='+encodeURIComponent(fill(d.body));
  const a=document.createElement('a'); a.href=href; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove();
  $('sent').hidden=false;
};
$('copyBtn').onclick=async()=>{ try{ await navigator.clipboard.writeText('4086662825'); $('copyBtn').textContent='✓'; }catch(e){ const r=document.createRange(); r.selectNodeContents($('copyBtn').previousElementSibling); const s=getSelection(); s.removeAllRanges(); s.addRange(r);} };
init();
applyLang();
