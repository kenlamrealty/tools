<style>
/* Layout: one column, inputs on top, live result card below, three actions, footer. Phone first. */
:root{
  --bg:#FBF9F4;        /* ivory */
  --panel:#FFFFFF;
  --fg:#2B2925;
  --muted:#7A7468;
  --line:#E6E0D3;
  --brass:#B8955A;     /* soft brass accent */
  --brass-soft:#F3EBDC;
  --warn:#9A5B2E;
  --ok:#4F7A5A;
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1C1A17;--panel:#24211D;--fg:#F1ECE2;--muted:#A69D8E;--line:#3A352E;
  --brass:#D2B07A;--brass-soft:#302A20;--warn:#D99A6A;--ok:#8CBF9A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1A17;--panel:#24211D;--fg:#F1ECE2;--muted:#A69D8E;--line:#3A352E;
  --brass:#D2B07A;--brass-soft:#302A20;--warn:#D99A6A;--ok:#8CBF9A;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:22px}
header{display:grid;gap:6px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:500}
.lang{border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:12px;padding:5px 10px;border-radius:999px;cursor:pointer}
.lang:focus-visible,button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1{font-family:var(--display);font-weight:300;font-size:38px;line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:15px;margin:0;max-width:40ch}

.inputs{display:grid;gap:14px}
.field{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.field label small{font-weight:400}
.ctl{display:flex;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:0 12px}
.ctl:focus-within{border-color:var(--brass)}
.ctl .pre,.ctl .post{color:var(--muted);font-size:15px}
.ctl input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:20px;padding:12px 8px;font-variant-numeric:tabular-nums}
.ctl input::-webkit-outer-spin-button,.ctl input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ctl input[type=number]{-moz-appearance:textfield}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:380px){.row2{grid-template-columns:1fr}}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:15px;padding:11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brass-soft);color:var(--fg);font-weight:500}

.result{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:grid;gap:16px}
.total .k{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.total .v{font-family:var(--display);font-weight:400;font-size:58px;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--fg)}
.total .v small{font-family:var(--body);font-size:16px;color:var(--muted);font-weight:400}
.lines{display:grid;gap:0;border-top:1px solid var(--line)}
.line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.line .n{color:var(--muted);min-width:0}
.line .n b{color:var(--fg);font-weight:500}
.line .a{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.line.pmi .a{color:var(--warn)}
.line.pmi.off{display:none}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.bar .b1{background:var(--brass)}
.bar .b2{background:#A9B7A0}
.bar .b3{background:#CBB7A3}
.bar .b4{background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
.meta{font-size:13px;color:var(--muted);display:grid;gap:4px}
.meta b{color:var(--fg);font-weight:500}
.note{font-size:13px;color:var(--muted);background:var(--brass-soft);border-radius:10px;padding:10px 12px;line-height:1.45}
.note.hide{display:none}

.actions{display:grid;gap:10px}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;border-radius:10px;padding:14px 16px;font:inherit;font-size:15px;font-weight:500;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#FFFDF8}
.btn.primary:hover{filter:brightness(.96)}
.btn:hover{border-color:var(--brass)}

.form{display:none;background:var(--panel);border:1px solid var(--brass);border-radius:14px;padding:18px;gap:12px}
.form.open{display:grid}
.form h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.form p{margin:0;font-size:14px;color:var(--muted)}
.form .ctl input{font-size:16px}
.form .ok{color:var(--ok);font-weight:500;font-size:14px}
.copyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.copyrow code{background:var(--brass-soft);padding:3px 8px;border-radius:6px;user-select:all;font-family:var(--body)}
.copyrow button{border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;font-size:13px;padding:5px 10px;border-radius:999px;cursor:pointer}

footer{display:grid;gap:8px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
footer a{color:var(--brass);text-decoration:none}
footer a:hover{text-decoration:underline}
footer .who{color:var(--fg)}
@media (prefers-reduced-motion:no-preference){.total .v{transition:opacity .15s}}
/* ---- T27 thêm (không đổi class cũ) ---- */
.ctl input[type=date]{font-size:17px;min-height:48px}
.fx{font-size:12px;color:var(--muted);font-weight:400}
.status{font-size:15px;border-radius:10px;padding:10px 12px;line-height:1.45}
.status.ok{background:var(--brass-soft)}
.status.warn{border:1px solid var(--warn)}
.status b{font-weight:500}
.status.warn b{color:var(--warn)}
.line .n small{display:block;font-size:12px;margin-top:2px}
.line.sum .n b,.line.sum .a{color:var(--fg);font-weight:600}
.line.dim{opacity:.6}
.line.warnl .a{color:var(--warn)}
.dl{display:grid;gap:10px}
.dl h2,.idr h2,.next h2,.tlw h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.dd{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:6px;min-width:0}
.dd .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.dd .t{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.dd .left{font-size:13px;color:var(--muted);white-space:nowrap}
.dd .date{font-family:var(--display);font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}
.dd p{margin:0;font-size:14px;color:var(--muted)}
.dd p b{color:var(--warn);font-weight:500}
.gcal{justify-self:start;font-size:12px;color:var(--brass);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap;background:var(--panel)}
.gcal:hover{border-color:var(--brass)}
.idr{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:grid;gap:10px}
.idr .r{display:grid;gap:2px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.idr .r b{color:var(--fg);font-weight:500;font-size:15px}
.tlw{display:grid;gap:12px}
.tlw .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tlw .cnt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.phase{display:grid;border-top:1px solid var(--line);padding-top:14px}
.ph-h{display:flex;justify-content:space-between;align-items:center;gap:6px 12px;flex-wrap:wrap;margin-bottom:2px}
.ph-h h3{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.15;margin:0}
.ph-n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.task{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:11px 0;border-bottom:1px solid var(--line)}
.task input{width:20px;height:20px;accent-color:var(--brass);margin:1px 0 0;cursor:pointer}
.task .tt{border:0;background:transparent;color:var(--fg);font:inherit;font-size:15px;line-height:1.4;text-align:left;padding:0;cursor:pointer;min-width:0}
.task.done .tt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.task .why{grid-column:2;font-size:13px;color:var(--muted);line-height:1.5}
.task .why[hidden]{display:none}
.myth{font-size:14px;line-height:1.5;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin:0}
.myth b{color:var(--warn);font-weight:500}
.myth a,.next a,.idr a{color:var(--brass)}
.next{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:10px}
.next ol{margin:0;padding-left:20px;display:grid;gap:10px;font-size:14px;line-height:1.5}
.reset{justify-self:start;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:0}
footer .src{line-height:1.6}
footer .src a{word-break:break-word}
/* ---- T229 thêm (không đổi class cũ) ---- */
.ctl input[type=search]{font-size:18px}
.ctl input[type=search]::-webkit-search-cancel-button{cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);font:inherit;font-size:13px;padding:7px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brass-soft);color:var(--fg);border-color:var(--brass);font-weight:500}
.terms{display:grid;gap:10px}
.term{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-width:0;scroll-margin-top:16px}
.term[open]{border-color:var(--brass)}
.term.flash{box-shadow:0 0 0 3px var(--brass-soft)}
.term summary{list-style:none;cursor:pointer;padding:14px 18px;display:grid;gap:2px}
.term summary::-webkit-details-marker{display:none}
.term summary .nm{font-family:var(--display);font-size:23px;line-height:1.15;font-weight:500;color:var(--fg)}
.term summary .al{font-size:12px;color:var(--muted)}
.term summary .sh{font-size:14px;color:var(--muted);line-height:1.45}
.term .bd{padding:0 18px 16px;display:grid;gap:10px;font-size:15px;line-height:1.55}
.term .bd p{margin:0}
.term .bd .lb{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass);font-weight:500;margin-bottom:2px}
.term .bd .ex{background:var(--brass-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.term .bd .my b{color:var(--warn);font-weight:500}
.term .bd .ot{font-size:13px;color:var(--muted)}
.term .bd .ft{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;color:var(--muted)}

.expall{justify-self:start;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:0}
</style>

<script id="kl-commas">
/* Ken Lam Realty: ô nhập tiền / sqft tự thêm dấu phẩy (1,200,000). Code cũ vẫn đọc .value ra số thuần. */
(function(){
  var d=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
  function fmt(v){
    var s=String(v==null?'':v).replace(/[^0-9.\-]/g,''),neg=s.charAt(0)==='-';
    s=s.replace(/-/g,'');
    var i=s.indexOf('.'),ip=i<0?s:s.slice(0,i),dp=i<0?'':s.slice(i).replace(/\./g,'');
    if(i>=0)dp='.'+dp;
    ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return (neg?'-':'')+ip+dp;
  }
  function want(el){
    if(el.type!=='number'||el.__klc)return false;
    var c=el.closest&&el.closest('.ctl');if(!c)return false;
    var pre=c.querySelector('.pre'),post=c.querySelector('.post');
    if(pre&&pre.textContent.indexOf('$')>-1)return true;
    if(post&&/^\s*(sqft|sq ?ft)\s*$/i.test(post.textContent))return true;
    return false;
  }
  function conv(el){
    if(!want(el))return;
    el.__klc=1;
    var cur=d.get.call(el),ph=el.getAttribute('placeholder');
    el.type='text';
    if(!el.getAttribute('inputmode'))el.setAttribute('inputmode','numeric');
    Object.defineProperty(el,'value',{configurable:true,
      get:function(){return d.get.call(this).replace(/,/g,'')},
      set:function(v){d.set.call(this,fmt(v))}});
    d.set.call(el,fmt(cur));
    if(ph&&/^[0-9.]{5,}$/.test(ph))el.setAttribute('placeholder',fmt(ph));
    el.addEventListener('input',function(){
      var raw=d.get.call(el),pos=el.selectionStart,n=0,k;
      for(k=0;k<pos;k++)if(/[0-9.]/.test(raw.charAt(k)))n++;
      var out=fmt(raw);
      if(out===raw)return;
      d.set.call(el,out);
      for(k=0,pos=0;k<out.length&&n>0;k++){pos=k+1;if(/[0-9.]/.test(out.charAt(k)))n--;}
      try{el.setSelectionRange(pos,pos)}catch(e){}
    });
  }
  function scan(r){
    if(r.nodeType!==1)return;
    if(r.tagName==='INPUT')conv(r);
    var l=r.querySelectorAll?r.querySelectorAll('input[type=number]'):[];
    for(var i=0;i<l.length;i++)conv(l[i]);
  }
  new MutationObserver(function(m){
    for(var i=0;i<m.length;i++)for(var j=0;j<m[i].addedNodes.length;j++)scan(m[i].addedNodes[j]);
  }).observe(document.documentElement,{childList:true,subtree:true});
  document.addEventListener('DOMContentLoaded',function(){scan(document.body)});
})();
</script>

const PARAS=[
 {n:'¶1',vi:['Mặt bằng','Ghi địa chỉ, phần thuê, và <b>phần trăm diện tích</b> của bạn trong cả tòa nhà. Con số % này về sau dùng để chia chi phí chung ở ¶15.'],
  en:['The space','The address, what you rent, and your <b>percent of the building\'s rentable square feet</b>. That % is used later to split shared costs in ¶15.']},
 {n:'¶2',vi:['Thời hạn','Chọn A hoặc B. <b>A (có hạn)</b>: có ngày hết. Ở lố mà chủ đồng ý thì thành thuê từng tháng, giá bằng tháng trước. <b>B (từng tháng)</b>: bên nào cũng báo nghỉ bằng văn bản trước <b>30 ngày</b>. C: điều kiện gia hạn (nếu có).'],
  en:['Term','Pick A or B. <b>A (fixed)</b>: has an end date. Staying past it with the landlord\'s OK turns into month-to-month at the last month\'s rent. <b>B (month-to-month)</b>: either side ends it with <b>30 days\'</b> written notice. C: renewal terms, if any.']},
 {n:'¶3',vi:['Tiền thuê căn bản (Base Rent)','Chọn 1 trong 5 kiểu: giá cố định; giá cố định 12 tháng rồi <b>tăng theo CPI</b> mỗi năm (không bao giờ giảm); giá bậc thang theo từng giai đoạn; theo bảng đính kèm; hoặc kiểu khác. Trả trước <b>ngày 1</b> mỗi tháng, trễ từ ngày hôm sau. Không bắt đầu ngày 1 thì tháng đầu chia theo kỳ <b>30 ngày</b>.'],
  en:['Base Rent','Pick 1 of 5: flat rent; flat for 12 months then <b>CPI increases</b> each year (never goes down); stepped rent by period; an attached schedule; or other. Paid in advance on <b>the 1st</b>, late the next day. Start on any other day and the first month is prorated on a <b>30-day</b> basis.']},
 {n:'¶4',vi:['"Rent" là gì','"Rent" là mọi khoản tiền người thuê nợ chủ theo hợp đồng, trừ tiền cọc. Ghi trả cho ai, ở đâu. Khoản ngoài Base Rent trả trong <b>30 ngày</b> sau khi được bill.'],
  en:['What "Rent" means','"Rent" is every dollar the tenant owes under the lease except the deposit. It says who to pay and where. Anything beyond Base Rent is due within <b>30 days</b> after you are billed.']},
 {n:'¶5',vi:['Vào sớm','Ghi ngày được vào sớm. Trong lúc đó không trả Base Rent; còn các khoản khác thì tùy ô đánh dấu. Mọi điều khác của hợp đồng vẫn áp dụng.'],
  en:['Early possession','The date you may move in early. No Base Rent during that time; other charges depend on the box checked. Every other term still applies.']},
 {n:'¶6',vi:['Tiền cọc','Ghi số tiền cọc. Nếu đánh dấu, tăng giá thuê thì cọc tăng cùng tỷ lệ. Chủ dùng cọc để bù tiền thiếu, sửa hư hỏng (trừ hao mòn bình thường), dọn sạch. <b>Không được dùng cọc thay tiền tháng cuối.</b> Bị trừ giữa chừng thì bù lại trong <b>5 ngày</b>. Dọn ra: chủ trả bảng kê + phần còn lại trong <b>30 ngày</b>, hoặc <b>14 ngày</b> nếu chỉ trừ tiền thuê. Cọc không có lãi, trừ khi luật địa phương bắt.'],
  en:['Security deposit','The deposit amount. If checked, the deposit goes up in the same proportion as rent. The landlord may use it for unpaid sums, damage beyond normal wear, and cleaning. <b>It is not your last month\'s rent.</b> Used mid-lease, you refill it within <b>5 days</b>. After move-out: itemized list + refund within <b>30 days</b>, or <b>14 days</b> if only unpaid rent was taken. No interest unless a local law requires it.']},
 {n:'¶7',vi:['Qualified Commercial Tenant (QCT)','Tiệm rất nhỏ (tối đa 5 người kể cả chủ, khó vay vốn), nhà hàng dưới 10 nhân viên, hội thiện nguyện dưới 20, đã gửi chủ giấy tự khai trong 12 tháng qua. Được thêm: bản dịch hợp đồng nếu thương lượng bằng tiếng Việt (và vài thứ tiếng khác); báo nghỉ <b>60 ngày</b> nếu ở từ 1 năm thuê từng tháng; tăng giá hơn <b>10%</b> phải báo trước <b>90 ngày</b>; xin giấy tờ chi phí thì chủ đưa trong <b>30 ngày</b>, chi phí trong <b>18 tháng</b> trước hoặc <b>12 tháng</b> tới.'],
  en:['Qualified Commercial Tenant (QCT)','A tiny business (5 or fewer people incl. owner, little access to capital), a restaurant under 10 employees, or a nonprofit under 20, that gave a written self-attestation in the last 12 months. Extra rights: a translated lease if negotiated mainly in Vietnamese (and some other languages); <b>60 days\'</b> notice if 1+ year on month-to-month; rent up more than <b>10%</b> needs <b>90 days\'</b> notice; cost papers within <b>30 days</b> of asking, costs from the last <b>18 months</b> or next <b>12</b>.']},
 {n:'¶8',vi:['Tiền phải trả','Bảng ghi tiền thuê, cọc, khoản khác: tổng, đã trả, còn thiếu, ngày đến hạn.'],
  en:['Payments','A table of rent, deposit and other items: total, received, balance, due date.']},
 {n:'¶9–10',vi:['Chỗ đậu xe và kho','Số chỗ đậu (có giữ chỗ hay không), có tính trong tiền thuê không, nếu không thì bao nhiêu một tháng. Chỉ đậu xe chạy được; cấm trailer, thuyền, xe tải lớn, xe rỉ dầu, sửa xe, đậu qua đêm. Kho: chỉ để đồ của mình, cấm đồ dễ cháy, nguy hiểm.'],
  en:['Parking and storage','How many spaces (reserved or not), included in rent or how much extra. Running vehicles only; no trailers, boats, big trucks, leaking cars, repairs, or overnight parking. Storage: your own things only, nothing flammable or dangerous.']},
 {n:'¶11',vi:['Trả trễ, check bị trả','Tiền không tới tay chủ trong <b>5 ngày lịch</b> sau hạn: trả phí trễ (số tiền để trống, hai bên điền), cộng lãi <b>10%/năm</b> trên số tiền trễ. Check bị trả: <b>$25</b>. Chủ nhận phí trễ không có nghĩa là bỏ qua vi phạm, cũng không dời ngày đến hạn.'],
  en:['Late rent, bounced checks','Not received within <b>5 calendar days</b> after the due date: a late charge (amount left blank for you to fill in) plus <b>10% a year</b> interest on the late amount. Bounced check: <b>$25</b>. Taking a late fee doesn\'t forgive the default or move the due date.']},
 {n:'¶12–13',vi:['Tình trạng mặt bằng, zoning','Người thuê xác nhận mặt bằng sạch và chạy được, trừ những món ghi ra. Chủ <b>không hứa</b> mặt bằng hợp với việc kinh doanh của bạn. Bạn tự tìm hiểu luật, zoning.'],
  en:['Condition, zoning','Tenant confirms the space is clean and working, except listed items. The landlord <b>makes no promise</b> the space suits your use. You check the laws and zoning yourself.']},
 {n:'¶14–15',vi:['Chi phí vận hành (CAM)','Người thuê trả tiện ích tính riêng cho mình. Thêm nữa, trả <b>phần chia</b> chi phí vận hành của cả tòa (bảo trì khu chung, tiện ích chung, bảo hiểm, thuế nhà) theo tỷ lệ diện tích. Đánh dấu ¶15B thì bỏ phần này.'],
  en:['Operating costs (CAM)','Tenant pays utilities billed to it. On top, it pays its <b>share</b> of the building\'s operating costs (common area upkeep, shared utilities, insurance, property tax) by square footage. Check ¶15B to switch this off.']},
 {n:'¶16–17',vi:['Mục đích sử dụng, nội quy','Chỉ dùng đúng việc ghi trong hợp đồng. Đổi việc phải có chủ đồng ý bằng văn bản. Làm bảo hiểm của chủ tăng thì bạn trả phần tăng. Giữ nội quy, không làm phiền hàng xóm, không làm chuyện phạm pháp.'],
  en:['Use, rules','Use the space only for the stated purpose. A new use needs written consent. If your use raises the landlord\'s insurance, you pay the increase. Follow the rules, don\'t bother neighbors, nothing illegal.']},
 {n:'¶18',vi:['Ai sửa cái gì','Mặc định: <b>người thuê</b> bảo trì chuyên nghiệp sưởi, máy lạnh, điện, ống nước (A) và kính, cửa (B). <b>Chủ</b> lo mái, móng, tường ngoài, khu chung (C). Mỗi ô có thể đảo lại. Người thuê không làm thì chủ làm rồi tính tiền (D). E: những món đánh dấu thì người thuê còn phải <b>thay mới</b> khi hư hẳn.'],
  en:['Who fixes what','Default: the <b>tenant</b> professionally maintains heating, A/C, electrical, plumbing (A) and glass, windows, doors (B). The <b>landlord</b> keeps up the roof, foundation, outside walls, common areas (C). Each can be flipped by a box. Tenant doesn\'t do it, landlord does and bills (D). E: for checked items, the tenant must also <b>replace</b> them when they can\'t be repaired.']},
 {n:'¶19–20',vi:['Sửa đổi mặt bằng','Sửa, gắn máy móc, bảng hiệu: cần chủ đồng ý bằng văn bản, chủ không được từ chối vô lý. Làm có permit, báo trước để chủ dán Notice of Non-Responsibility. Sửa theo luật bắt vì cách bạn dùng: bạn trả. Sửa theo luật vì lý do khác: chủ trả.'],
  en:['Alterations','Changes, trade fixtures, signs: written consent, not unreasonably withheld. Use permits, give advance notice so the landlord can post a Notice of Non-Responsibility. Law-required changes caused by your use: yours. Other law-required changes: the landlord\'s.']},
 {n:'¶21–22',vi:['Vào mặt bằng, bảng hiệu','Chủ được vào kiểm tra, sửa, dẫn người mua, người thuê, ngân hàng tới coi khi báo trước <b>24 giờ</b> (miệng hay giấy). Khẩn cấp: vào liền. FOR SALE treo lúc nào cũng được; FOR LEASE trong <b>90 ngày</b> cuối.'],
  en:['Entry, signs','Landlord may enter to inspect, repair or show buyers, tenants, lenders with <b>24 hours\'</b> notice (oral or written). Emergencies: any time. FOR SALE sign any time; FOR LEASE in the last <b>90 days</b>.']},
 {n:'¶23',vi:['Cho thuê lại, chuyển hợp đồng','Không được cho thuê lại hay chuyển hợp đồng khi chưa có chủ đồng ý bằng văn bản (không từ chối vô lý). Làm lén thì vô hiệu và chủ có quyền chấm dứt hợp đồng. Người mới phải nộp đơn, ký giấy riêng. Người thuê cũ <b>vẫn chịu trách nhiệm</b>.'],
  en:['Sublet, assignment','No subleasing or assigning without written consent (not unreasonably withheld). Doing it anyway is void and lets the landlord end the lease. The new party applies and signs a separate agreement. The original tenant <b>stays on the hook</b>.']},
 {n:'¶24',vi:['Giao mặt bằng trễ','Chủ giao trễ thì ngày bắt đầu dời theo, nhưng <b>ngày hết hạn không đổi</b>. Trễ quá <b>60 ngày</b> lịch: người thuê được hủy bằng văn bản, lấy lại hết tiền thuê và cọc.'],
  en:['Late handover','If the landlord can\'t deliver, the start date moves, but the <b>end date stays</b>. More than <b>60 calendar days</b> late: the tenant may cancel in writing and get all rent and deposit back.']},
 {n:'¶25',vi:['Khi dọn ra','Trả hết chìa, dọn sạch người và đồ, trả chỗ đậu và kho, giao lại như lúc nhận (¶12), lau dọn, để lại địa chỉ mới. Đồ gắn vào mặt bằng thành của chủ, nhưng chủ có thể bắt tháo cái bạn gắn thêm.'],
  en:['Moving out','Return all keys, leave it empty, free the parking and storage, hand it back as received (¶12), clean, leave a forwarding address. Improvements become the landlord\'s, but you can be told to remove ones you added.']},
 {n:'¶26',vi:['Vi phạm, nghỉ ngang','Bỏ ngang hay vi phạm: người thuê chịu tiền thuê mất, hoa hồng cho thuê lại, quảng cáo, sơn sửa. Chủ còn đòi được tiền thuê còn lại của hợp đồng, trừ phần người thuê chứng minh là chủ đã có thể tránh. Chủ cũng có thể giữ hợp đồng và đòi tiền từng tháng.'],
  en:['Breach, leaving early','Breach or walk away: tenant owes lost rent, re-leasing commissions, advertising, painting. The landlord can also recover rent for the rest of the term, minus what the tenant proves could have been avoided. Or keep the lease alive and collect rent as it comes due.']},
 {n:'¶27',vi:['Cháy, động đất, hư hại','Không do lỗi người thuê: chủ được chọn sửa. Sửa xong trong <b>90 ngày</b> thì hợp đồng tiếp tục. Không sửa kịp hay không sửa: bên nào cũng được hủy. Tiền thuê giảm từ ngày hư (chia theo kỳ 30 ngày). Do người thuê gây ra: chủ có <b>30 ngày</b> để coi như người thuê hủy, và đòi bồi thường.'],
  en:['Fire, quake, damage','Not the tenant\'s fault: the landlord may repair. Done within <b>90 days</b>, the lease continues. Not in time or not at all: either side may cancel. Rent is reduced from the day of damage (30-day basis). Caused by the tenant: the landlord has <b>30 days</b> to treat the lease as ended by the tenant, and may sue for damages.']},
 {n:'¶28–29',vi:['Hóa chất độc, nhà nước trưng thu','Không được giữ, dùng, xả hóa chất độc, trừ thứ cần cho việc kinh doanh bình thường và làm đúng luật. Gây ô nhiễm thì tự trả tiền dọn. Nhà nước lấy đất: bên nào cũng được hủy; tiền đền bù thuộc chủ, trừ phần dành cho chi phí dời và máy móc của người thuê.'],
  en:['Hazardous materials, condemnation','No hazardous materials except what your normal business needs, used by law. You pay to clean up contamination you cause. Government takes the property: either side may cancel; the award goes to the landlord except money for the tenant\'s relocation and trade fixtures.']},
 {n:'¶30',vi:['Bảo hiểm','Bảo hiểm của chủ <b>không</b> che đồ của người thuê. Người thuê mua bảo hiểm tài sản riêng và bảo hiểm trách nhiệm (số tiền để trống), ghi chủ là additional insured. Chủ mua bảo hiểm trách nhiệm cho mình. Khuyên người thuê mua thêm bảo hiểm gián đoạn kinh doanh. Hai bên bỏ quyền subrogation với nhau cho thiệt hại có bảo hiểm.'],
  en:['Insurance','The landlord\'s policy does <b>not</b> cover your stuff. Tenant carries its own property and liability insurance (amount left blank), naming the landlord as additional insured. Landlord carries its own liability. Tenant is advised to get business interruption cover. Both waive subrogation for insured losses.']},
 {n:'¶31',vi:['Estoppel certificate','Chủ (thường khi bán hay vay) đưa giấy xác nhận tình trạng hợp đồng. Người thuê ký trả trong <b>3 ngày</b>. Không trả thì coi như giấy đó đúng, và có thể bị coi là vi phạm nặng. Có thể phải đưa báo cáo tài chính (giữ kín) cho người mua hay ngân hàng.'],
  en:['Estoppel certificate','The landlord (often when selling or refinancing) sends a statement about the lease. Tenant signs and returns it within <b>3 days</b>. If not, it is treated as true and may be a material breach. Tenant may also have to give confidential financials to a buyer or lender.']},
 {n:'¶32–33',vi:['Chủ bán, nợ vay','Chủ bán thì chủ mới thay chỗ. Chủ cũ hết trách nhiệm cọc chỉ khi đã trả cọc cho bạn hoặc chuyển cọc cho chủ mới. Hợp đồng đứng sau các khoản vay trên tòa nhà, nhưng nếu bạn không vi phạm thì vẫn được ở yên.'],
  en:['Landlord sells, loans','A new owner steps in. The old landlord is off the hook for the deposit only if it was returned to you or passed to the new owner. The lease sits behind loans on the property, but if you are not in default you keep your space.']},
 {n:'¶34',vi:['Lý lịch tín dụng','Người thuê cam đoan đơn và giấy tờ tài chính là thật. Chủ được kéo credit lúc nộp đơn và trong thời gian thuê. Credit xấu trước khi vào, hoặc khai gian bất cứ lúc nào: chủ được hủy.'],
  en:['Credit','Tenant swears its application and financials are true. Landlord may pull credit at application and during the lease. Bad credit before move-in, or a false application at any time: the landlord may cancel.']},
 {n:'¶35',vi:['CASp (tiếp cận cho người khuyết tật)','Chủ khai mặt bằng đã hay chưa có CASp kiểm tra. Có báo cáo: nhận trước <b>48 giờ</b> thì không được hủy vì báo cáo; nhận trong vòng 48 giờ thì có <b>72 giờ</b> sau khi ký để hủy; chưa nhận thì chủ giao trong <b>7 ngày</b>, người thuê có thêm <b>3 ngày</b> để hủy. D: ghi ai trả tiền sửa cho đúng chuẩn.'],
  en:['CASp (disability access)','Landlord says whether a CASp has inspected. With a report: received <b>48+ hours</b> before signing, no right to cancel over it; received within 48 hours, <b>72 hours</b> after signing to cancel; not received, landlord delivers within <b>7 days</b> and tenant has <b>3 more days</b> to cancel. D: who pays for access fixes.']},
 {n:'¶36–37',vi:['Hòa giải, trọng tài','Có tranh chấp: <b>hòa giải trước</b>, phí chia đều. Kiện thẳng hay từ chối hòa giải thì mất quyền đòi phí luật sư. Trọng tài chỉ áp dụng khi <b>cả hai ký tắt</b>; trọng tài là thẩm phán về hưu hay luật sư có ít nhất <b>5 năm</b> kinh nghiệm địa ốc. Một số việc (đuổi nhà, mechanic\'s lien, small claims…) không đi hòa giải hay trọng tài.'],
  en:['Mediation, arbitration','Dispute: <b>mediate first</b>, fees split equally. Sue first or refuse mediation and you lose the right to attorney fees. Arbitration applies only if <b>both initial</b>; the arbitrator is a retired judge or a lawyer with at least <b>5 years</b> of real estate law. Some matters (evictions, mechanic\'s liens, small claims…) are excluded.']},
 {n:'¶38–41',vi:['Nhiều người thuê, thông báo, bồi thường','Nhiều người cùng thuê: <b>mỗi người chịu toàn bộ</b>. Thông báo gửi bằng thư, email hay courier tới địa chỉ ở phần chữ ký. Bỏ qua một lần vi phạm không có nghĩa bỏ qua lần sau. Người thuê bồi thường và bảo vệ chủ cho mọi khiếu nại từ việc mình dùng mặt bằng.'],
  en:['Multiple tenants, notice, indemnity','More than one tenant: <b>each is liable for all of it</b>. Notices go by mail, email or courier to the contact in the signature section. Letting one breach slide doesn\'t waive the next. Tenant defends and holds the landlord harmless for claims from its use.']},
 {n:'¶42–44',vi:['Điều khoản thêm, phí luật sư, toàn bộ hợp đồng','Chỗ ghi điều kiện riêng, kèm phụ lục (vd Option Agreement). Kiện nhau thì bên thắng được trả phí luật sư (trừ trường hợp ¶36). "Time is of the essence": ngày giờ là quan trọng. Lời hứa miệng trước đó không tính.'],
  en:['Other terms, attorney fees, entire contract','Space for special terms and attachments (e.g. Option Agreement). Winner of a lawsuit gets attorney fees (except under ¶36). "Time is of the essence." Earlier oral promises don\'t count.']},
 {n:'¶45–47',vi:['Hoa hồng broker, đại diện','A: hoa hồng theo giấy riêng (TRBC, LCA, CLA, LL). B: nếu đánh dấu, chủ trả broker bên thuê theo % tổng tiền thuê hay số cố định, khi người thuê dọn vào (hoặc bị chủ cản không cho vào). C: có thể trừ hoa hồng từ tiền dọn vào. ¶47: xác nhận ai đại diện ai. Lease trên <b>1 năm</b>: đưa form AD. Broker không bảo đảm tình trạng, không kiểm zoning, không tư vấn luật hay thuế.'],
  en:['Broker pay, agency','A: commission per separate agreements (TRBC, LCA, CLA, LL). B: if checked, owner pays the tenant\'s broker a % of total rent or a flat sum, once the tenant takes possession (or the landlord blocks it). C: commissions can come out of move-in funds. ¶47: who represents whom. Lease over <b>1 year</b>: give Form AD. Brokers don\'t guarantee condition, check zoning, or give legal or tax advice.']},
 {n:'¶48–50',vi:['Người ký thay, bảo lãnh, chữ ký','Ký thay công ty, trust, LLC: ký với tư cách đại diện, phải đưa giấy chứng minh quyền khi được hỏi. Có thể có <b>người bảo lãnh</b> (Guarantee): cam kết trả tiền thuê và phí luật sư nếu người thuê không trả, chủ không cần đòi người thuê trước. Rồi người thuê ký (¶49), chủ ký (¶50).'],
  en:['Authorized signers, guarantee, signatures','Signing for a company, trust or LLC: you sign as its representative and show proof of authority if asked. There may be a <b>Guarantee</b>: someone promises to pay rent and legal fees if the tenant doesn\'t, and the landlord need not chase the tenant first. Then tenant signs (¶49), landlord signs (¶50).']}
];

const MYTHS=[
 {a:false,vi:['Giống thuê nhà ở, chủ phải trả lãi tiền cọc thuê thương mại.','¶6C: cọc không có lãi, trừ khi luật địa phương bắt.'],
  en:['Like a home rental, the landlord must pay interest on a commercial deposit.','¶6C: no interest unless a local ordinance requires it.']},
 {a:false,vi:['Tháng cuối khỏi trả, cứ để chủ trừ vào tiền cọc.','¶6B ghi rõ: cọc không được dùng thay tiền thuê tháng cuối.'],
  en:['Skip the last month\'s rent and let the landlord keep the deposit.','¶6B says it plainly: the deposit is not a substitute for last month\'s rent.']},
 {a:true,vi:['Theo form CL, máy lạnh và ống nước mặc định là người thuê lo.','¶18A: người thuê bảo trì chuyên nghiệp sưởi, máy lạnh, điện, ống nước, trừ khi ô "Landlord" được đánh dấu.'],
  en:['Under Form CL, the tenant looks after the A/C and plumbing by default.','¶18A: the tenant professionally maintains heating, A/C, electrical and plumbing unless the "Landlord" box is checked.']}
];

function init(){
  const s=today(); $('start').value=iso(new Date(s.getFullYear(),s.getMonth()+1,1));
  $('end').value=iso(addDays(addMonths(pd($('start').value),36),-1));
}

function calc(){
  const d=I18N[lang], role=S.role, term=S.term, qct=S.qct==='yes';
  $('fEnd').style.display=term==='lease'?'':'none';
  const st=pd($('start').value), en=pd($('end').value), out=pd($('out').value);
  const rent=num('rent'), dep=num('dep'), share=Math.min(num('share'),100), opex=num('opex'), late=num('late'), dl=Math.floor(num('dlate'));
  /* ¶3C: tháng đầu chia theo kỳ 30 ngày */
  let days=30, first=rent;
  if(st && st.getDate()!==D.DUE_DAY){ const dim=new Date(st.getFullYear(),st.getMonth()+1,0).getDate(); days=Math.min(D.PRORATE_BASIS,dim-st.getDate()+1); first=rent/D.PRORATE_BASIS*days; }
  const cam=share/100*opex, month=rent+cam, movein=first+dep;
  let h='<div class="big2">'+H.big(d.r_movein,money(movein))+H.big(d.r_month,money(month))+'</div>';
  h+=H.lines([
    [days<30||(st&&st.getDate()!==1)?fill(d.ln_first,{rent:money(rent),d:days}):d.ln_firstfull,money(first,true)],
    [d.ln_dep,money(dep)],
    [d.ln_base,money(rent)],
    [fill(d.ln_cam,{p:+share.toFixed(2),o:money(opex)}),money(cam,true)],
    [d.ln_tot,money(month,true),'sum']]);
  h+=H.note(d.first_note+' '+d.cam_note);
  /* ¶11 */
  h+=H.h3(d.h_late);
  if(dl<=D.LATE_GRACE_DAYS) h+=H.p(fill(d.late_ok,{g:D.LATE_GRACE_DAYS}));
  else { const intr=rent*D.LATE_INTEREST*dl/365;
    h+=H.p(fill(d.late_bad,{n:dl,g:D.LATE_GRACE_DAYS}),'warn');
    h+=H.lines([[d.ln_latefee,money(late,true)],[fill(d.ln_int,{n:dl,rent:money(rent)}),money(intr,true)],[d.ln_late_tot,money(late+intr,true),'sum warnl']]); }
  h+=H.note(d.late_blank+' '+d.late_nsf);
  /* Mốc ngày */
  h+=H.h3(d.h_dates)+'<div class="dl2">';
  if(st){ const nd=st.getDate()===1?st:new Date(st.getFullYear(),st.getMonth()+1,1);
    h+=H.dd(d.dd_due,nd,d.dd_due_p);
    h+=H.dd(d.dd_poss,addDays(st,D.POSSESSION_DAYS),d.dd_poss_p); }
  if(term==='lease'&&en) h+=H.dd(d.dd_sign,addDays(en,-D.FOR_LEASE_DAYS),d.dd_sign_p);
  if(term==='mtm'){ h+=H.dd(d.dd_mtm,addDays(today(),D.MTM_NOTICE),d.dd_mtm_p);
    if(qct) h+=H.dd(d.dd_mtm_q,addDays(today(),D.QCT_MTM_NOTICE),d.dd_mtm_q_p); }
  if(out) h+=H.dd(d.dd_dep,addDays(out,D.DEP_RETURN_DAYS),fill(d.dd_dep_p,{d14:fd(addDays(out,D.DEP_RENT_ONLY_DAYS))}));
  h+='</div>';
  if(!out) h+=H.p(d.dd_dep_none);
  if(term==='lease'&&st&&en&&en>addMonths(st,12*D.AD_TERM_YEARS)) h+=H.note(d.ad_note);
  h+=H.note(d.days_note);
  /* Quyền / việc */
  const duty=role==='tenant'?d.t_duty:d.l_duty, right=role==='tenant'?d.t_right:d.l_right;
  h+=H.h3(d.h_you)+H.tasks('duty_'+role,duty);
  h+=H.h3(d.h_right)+H.ul(right);
  h+=H.h3(d.h_qct)+(qct?H.ul(d.qct_yes):H.p(d.qct_no));
  h+=H.h3(d.h_check)+H.tasks('ck',d.ck);
  const v={role:d.tx_role[role],term:d.tx_term[term],start:fd(st),rent:money(rent),dep:money(dep),first:money(first,true),movein:money(movein,true),cam:money(cam,true),month:money(month,true),poss:st?fd(addDays(st,D.POSSESSION_DAYS)):'—'};
  return {html:h,text:fill(d.tx,v),sms:fill(d.sms,v)};
}

const I18N={vi:Object.assign({},COMMON.vi,TX.vi),en:Object.assign({},COMMON.en,TX.en)};
let lang='en'; try{ if(localStorage.getItem('kl_lang')==='vi') lang='vi'; }catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t=k=>{const v=I18N[lang][k]; return v==null?k:v;};
const fill=(s,v)=>String(s).replace(/\{(\w+)\}/g,(m,k)=>v[k]!=null?v[k]:m);
const money=(x,c)=>{const f=c&&Math.round(Math.abs(x)*100)%100!==0; return (x<0?'-':'')+'$'+Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:f?2:0,maximumFractionDigits:f?2:0});};
const num=id=>{const el=$(id); if(!el) return 0; const v=parseFloat(String(el.value).replace(/,/g,'')); return isFinite(v)&&v>0?v:0;};
const pad=n=>String(n).padStart(2,'0');
function pd(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m?new Date(+m[1],+m[2]-1,+m[3]):null;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function addDays(d,n){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x;}
function addMonths(d,n){const x=new Date(d.getFullYear(),d.getMonth()+n,1); const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate(); x.setDate(Math.min(d.getDate(),last)); return x;}
/* Ngày làm việc: bỏ thứ Bảy, Chủ Nhật. Chưa trừ ngày lễ. */
function addBiz(d,n){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); let k=Math.abs(n); const s=n<0?-1:1; while(k>0){x.setDate(x.getDate()+s); const w=x.getDay(); if(w!==0&&w!==6) k--;} return x;}
function fd(d){if(!d) return '—'; const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; const w=t('wd')[d.getDay()];
  return lang==='vi'? w+', '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear() : w+', '+M[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();}
function today(){const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
const H={
 big:(k,v,s)=>'<div class="total"><div class="k">'+k+'</div><div class="v">'+v+(s?' <small>'+s+'</small>':'')+'</div></div>',
 lines:a=>'<div class="lines">'+a.filter(Boolean).map(r=>'<div class="line '+(r[2]||'')+'"><span class="n">'+r[0]+'</span><span class="a">'+r[1]+'</span></div>').join('')+'</div>',
 dd:(ti,d,p)=>'<div class="dd"><div class="hd"><span class="t">'+ti+'</span></div><div class="date">'+fd(d)+'</div>'+(p?'<p>'+p+'</p>':'')+'</div>',
 h3:s=>'<h3 class="sub2">'+s+'</h3>',
 p:(s,c)=>'<p class="ans'+(c?' '+c:'')+'">'+s+'</p>',
 ul:a=>'<ul class="ul">'+a.filter(Boolean).map(x=>'<li>'+x+'</li>').join('')+'</ul>',
 note:s=>'<div class="note">'+s+'</div>',
 tasks:(id,a)=>'<div class="tasks">'+a.filter(Boolean).map((x,i)=>{const k=id+'_'+i, on=!!CK[k];
   return '<label class="task'+(on?' done':'')+'"><input type="checkbox" data-ck="'+k+'"'+(on?' checked':'')+'><span class="tt">'+x+'</span></label>';}).join('')+'</div>'
};
const CK={};
const S={};
document.querySelectorAll('.seg[data-seg]').forEach(g=>{
  const k=g.getAttribute('data-seg'); const p=g.querySelector('button[aria-pressed="true"]')||g.querySelector('button');
  S[k]=p.getAttribute('data-v');
  g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===p)));
  g.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button'); if(!b) return; S[k]=b.getAttribute('data-v');
    g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); render();});
});
document.querySelectorAll('input,select').forEach(el=>{ if(el.closest('#res')) return; el.addEventListener('input',render); el.addEventListener('change',render); });
$('res').addEventListener('change',e=>{const c=e.target; if(!c.getAttribute||!c.getAttribute('data-ck')) return; const k=c.getAttribute('data-ck');
  if(c.checked) CK[k]=1; else delete CK[k]; c.closest('.task').classList.toggle('done',c.checked);});
let openP={};
function renderParas(){
  $('paras').innerHTML=PARAS.map((p,i)=>{const x=p[lang];
    return '<details class="term" data-p="'+i+'"'+(openP[i]?' open':'')+'><summary><span class="al">'+esc(typeof p.n==='object'?p.n[lang]:p.n)+'</span><span class="nm">'+x[0]+'</span></summary><div class="bd">'+x[1]+'</div></details>';}).join('');
  updExp();
}
function updExp(){ const all=PARAS.every((p,i)=>openP[i]); $('expAll').textContent=all?t('exp_none'):t('exp_all'); }
$('paras').addEventListener('toggle',e=>{const el=e.target; if(!el.getAttribute||el.getAttribute('data-p')==null) return; const i=el.getAttribute('data-p'); if(el.open) openP[i]=1; else delete openP[i]; updExp();},true);
$('expAll').onclick=()=>{const all=PARAS.every((p,i)=>openP[i]); openP={}; if(!all) PARAS.forEach((p,i)=>openP[i]=1); renderParas();};
const MA={};
function renderMyths(){
  $('myths').innerHTML=MYTHS.map((m,i)=>{const x=m[lang], a=MA[i];
    let rv=''; if(a!=null){ const right=(a===String(m.a)); rv='<p class="rv"><b class="'+(right?'ok':'no')+'">'+(right?t('m_ok'):t('m_no'))+'</b> '+(m.a?t('m_is_t'):t('m_is_f'))+' '+x[1]+'</p>'; }
    return '<div class="mq"><p class="st">'+x[0]+'</p><div class="bt" role="group"><button type="button" data-m="'+i+'" data-a="true" aria-pressed="'+(a==='true')+'">'+t('m_true')+'</button><button type="button" data-m="'+i+'" data-a="false" aria-pressed="'+(a==='false')+'">'+t('m_false')+'</button></div>'+rv+'</div>';}).join('');
}
$('myths').addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button[data-m]'); if(!b) return; MA[b.getAttribute('data-m')]=b.getAttribute('data-a'); renderMyths();});
function render(){
  const r=calc();
  $('res').innerHTML=r.html;
  const v={code:META.code,form:META.form,slug:META.slug};
  $('emailBtn').href='mailto:ken@kenlamrealty.com?subject='+encodeURIComponent(fill(t('subj'),v))+'&body='+encodeURIComponent(fill(t('mail_hi'),v)+r.text+fill(t('mail_end'),v));
  $('smsBtn').href='sms:4086662825?&body='+encodeURIComponent(fill(t('sms_hi'),v)+(r.sms||''));
}
function applyLang(){
  const d=I18N[lang];
  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.getAttribute('data-i'); if(typeof d[k]==='string') el.innerHTML=d[k];});
  document.querySelectorAll('[data-ph]').forEach(el=>{const k=el.getAttribute('data-ph'); if(typeof d[k]==='string') el.setAttribute('placeholder',d[k]);});
  $('langBtn').textContent=d.lang; document.documentElement.lang=lang;
  renderParas(); renderMyths(); render();
}
$('langBtn').onclick=()=>{lang=lang==='vi'?'en':'vi'; try{localStorage.setItem('kl_lang',lang)}catch(e){} applyLang();};
if(typeof init==='function') init();
applyLang();
</script>

<script>
(function(){var a=document.getElementById('klBack'),b=document.getElementById('langBtn');if(!a)return;
try{if(/[?&]embed=1/.test(location.search))a.style.display='none';}catch(e){}
function u(){var en=b&&b.textContent.trim()==='Tiếng Việt';a.textContent=en?'← All tools':'← Tất cả công cụ';}
u();if(b)b.addEventListener('click',function(){setTimeout(u,0)});})();
</script>
