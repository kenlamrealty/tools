"title": "Wire fraud advisory (WFA)",
"sub": "Like a stranger copying your mom's voice on the phone: \"give the money to this man.\" Scammers fake an escrow email, swap the account number, and get you to wire your deposit to them. The WFA form shows how to stop that.",

"ft_car": "Form WFA belongs to the California Association of REALTORS®. This page only explains it. It does not replace the form or legal advice.",
"ft_est": "General information, not legal or banking advice. No tool can prove an email is real — always confirm by calling a number you got at the start. If you suspect fraud, call your bank right away.",

"e0t": "Intro: convenient, and risky",
"e0b": "Doing business online is convenient but opens the door to hackers, and real estate is a target. Wiring money is handy, but needs extreme caution.",
"e1t": "How the scam works",
"e1b": "Per the form: fake emails look real. Hackers intercept transfer instructions, get account details and change some data to redirect the money. Some even supply fake phone numbers — the victim calls to \"confirm\" and unknowingly authorizes the transfer.",
"e2t": "Rule 1: get numbers at the start",
"e2b": "Get phone and account numbers only from the escrow officer (or property manager, housing provider) at the start of the deal.",
"e3t": "Rule 2: never wire before calling",
"e3b": "The form puts this in capitals: never wire before calling to confirm. Use only a number you were given earlier — never a different phone or account number from an email.",
"e4t": "Rule 3: confirm out loud",
"e4b": "Confirm by voice that the instructions are real. Check the routing number, account number and other codes before sending.",
"e5t": "Rule 4: no personal info by email or text",
"e5b": "Give personal information in person or by phone directly to the escrow officer, property manager or housing provider.",
"e6t": "Rule 5: secure your email and device",
"e6b": "Use strong passwords, secure WiFi, and avoid free services.",
"e7t": "If something looks suspicious",
"e7b": "Tell your bank, the other party and escrow (or housing provider, property manager) right away. The form lists FBI (fbi.gov), the FBI's IC3 (ic3.gov) or 310-477-6565, the National White Collar Crime Center, and On Guard Online.",
"e8t": "Note: there are alternatives",
"e8b": "The form notes alternatives such as cashier's checks. \"Housing Provider\" includes a landlord or rental owner.",
"e9t": "Signatures",
"e9b": "Buyer/Tenant and Seller/Housing Provider sign that they received, read and understand it.",
"ex_story": "Anh Tâm & chị Hoa Nguyễn are buying 1234 Example Lane, San Jose, CA 95100 from Bà Mai Trần. Escrow opens 11/10/2026; the opening letter lists the escrow officer's phone. Ken gives them the WFA that day. Two days later, chị Hoa gets an email \"from escrow\": the account changed, wire the 3% deposit ($36,000, example) to the new one, call this number with questions. She doesn't call that number. She calls Ken, then escrow at the number on the letter.",
"ex_mh": "WFA form (mock) + wire confirmation log",
"ex_end": "Escrow confirms the email was fake. Chị Hoa tells her bank and escrow as the form advises, then wires the deposit to the right account after reading back every digit. It takes 20 minutes. Had she followed the email, $36,000 could have landed in a stranger's account.",

"my0": "<b>\"I called the number in the email to confirm.\"</b> The form says scammers supply fake numbers. Only call a number from the start of the deal.",
"my1": "<b>\"It came from the real escrow address, so it's safe.\"</b> The form says hackers intercept real emails and change the data. Real-looking email can still be fake.",
"my2": "<b>\"You have to wire to buy a home.\"</b> The form notes alternatives such as a cashier's check.",
"ken": "My own rule: any email that changes the account number is fake until escrow confirms on the old number. No exceptions. Even if it's signed Ken Lam. Sounds strict, but a deposit is often a decade of savings. Twenty minutes on the phone is cheap.",
"ns0": "Not sure whom the agent works for? <a href=\"/t440/\">T440 — AD form</a>.",
"ns1": "Deposit sent? Next, insurance: <a href=\"/t443/\">T443 — BHIA</a>.",
"ns2": "Changed your mind before acceptance? <a href=\"/t440/\">T440 — Withdrawing an offer (WOO)</a>.",
"ns3": "See every form: <a href=\"/t402/\">T402 — All explained forms</a>."
}
};

let lang='vi'; try{ if(localStorage.getItem('kl_lang')==='en') lang='en'; }catch(e){}
const $=id=>document.getElementById(id);
const fmt=n=>'$'+Math.round(n).toLocaleString('en-US');
const fill=(s,v)=>String(s).replace(/\{(\w+)\}/g,(m,k)=>v[k]??m);
const strip=s=>String(s).replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&nbsp;/g,' ');
let last={sum:'',r:''};
function applyLang(){
  const d=I18N[lang];
  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.getAttribute('data-i'); if(typeof d[k]==='string') el.innerHTML=d[k];});
  $('langBtn').textContent=d.lang; document.documentElement.lang=lang; document.title=d.doc_title;
  calc();
}
function done(){ const d=I18N[lang];
  $('smsBtn').href='sms:4086662825?&body='+encodeURIComponent(fill(d.sms,last)); }
$('langBtn').onclick=()=>{lang=lang==='vi'?'en':'vi'; try{localStorage.setItem('kl_lang',lang)}catch(e){} applyLang();};
$('emailBtn').onclick=()=>{$('form').classList.toggle('open'); if($('form').classList.contains('open')) $('fname').focus();};
$('sendBtn').onclick=()=>{
  const d=I18N[lang], n=$('fname').value.trim()||'—', e=$('femail').value.trim()||'—', ph=$('fphone').value.trim()||'—';
  const v=Object.assign({},last,{n,e,ph});
  /* LEAD: email tới ken@kenlamrealty.com (FUB email parsing). */
  const body=fill(d.mail_head,v)+'\n\n'+last.sum+'\n\n'+d.mail_foot;
  const href='mailto:ken@kenlamrealty.com?subject='+encodeURIComponent(fill(d.subj,v))+'&body='+encodeURIComponent(body);
  window.__lastMailto=href;
  const a=document.createElement('a'); a.href=href; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove();
  $('sent').hidden=false;
};
$('copyBtn').onclick=async()=>{ try{ await navigator.clipboard.writeText('4086662825'); $('copyBtn').textContent='✓'; }catch(e){ const r=document.createRange(); r.selectNodeContents($('copyBtn').previousElementSibling); const s=getSelection(); s.removeAllRanges(); s.addRange(r);} };


let sos=false;
(function(){ const el=$('amt');
  el.addEventListener('input',()=>{ const raw=el.value.replace(/[^0-9]/g,''); el.value=raw?Number(raw).toLocaleString('en-US'):''; calc(); }); })();
function sigs(){ return [...document.querySelectorAll('#sigBox input:checked')].map(x=>x.value); }
function model(g){
  let s=0; g.forEach(k=>s+=CFG.W[k]||0);
  let lv=s===0?0:s<=CFG.LV[1]?1:s<=CFG.LV[2]?2:3;
  if(g.some(k=>CFG.STOP.includes(k))) lv=Math.max(lv,3);
  const d=['call','read'];
  if(lv>=2) d.unshift('stop');
  if(lv>=1) d.push('tell','ken');
  if(g.includes('personal')) d.push('pii');
  d.push('cash','sec');
  return {s,lv,d};
}
function calc(){
  const d=I18N[lang], g=sigs(), m=model(g), amt=parseFloat($('amt').value.replace(/,/g,''))||0;
  const el=$('oLv'); el.textContent=d.LV[m.lv]; el.className='lvl l'+m.lv;
  $('oMeter').innerHTML=[0,1,2,3].map(k=>'<i class="'+(k<=m.lv&&m.lv>0?'on l'+m.lv:(k===0&&m.lv===0?'on l0':''))+'"></i>').join('');
  $('oCnt').textContent=g.length; $('oAmt').textContent=amt?fmt(amt):'—';
  $('oNote').textContent=d.NT[m.lv];
  $('doList').innerHTML=m.d.map(k=>'<li>'+d.D[k]+'</li>').join('');
  $('sosList').innerHTML=d.SOS.map(x=>'<li>'+x+'</li>').join('');
  $('sosBox').classList.toggle('hide',!sos); $('sosBtn').setAttribute('aria-expanded',sos);
  last={lv:d.LV[m.lv],r:d.LV[m.lv]};
  last.sum=fill(d.S0,{a:amt?fmt(amt):'—',lv:d.LV[m.lv],c:g.length,g:g.length?g.map(k=>'- '+strip(d['g_'+k])).join('\n'):'-',
    d:m.d.map((k,n)=>(n+1)+'. '+d.D[k]).join('\n')})+(sos?'\n\n'+d.sos_h.toUpperCase()+':\n'+d.SOS.map((x,n)=>(n+1)+'. '+x).join('\n'):'');
  done();
}
$('sigBox').addEventListener('change',calc);
$('sosBtn').onclick=()=>{ sos=!sos; calc(); if(sos) $('sosBox').scrollIntoView({block:'nearest'}); };
window.__model=model;

applyLang();
</script>
</body>
</html>
