  const pins=(s.pins||[]).map((p,i)=>(p.box?'<span class="mark" style="left:'+p.box[0]+'%;top:'+p.box[1]+'%;width:'+p.box[2]+'%;height:'+p.box[3]+'%"></span>':'')+'<span class="pin" style="left:'+p.x+'%;top:'+p.y+'%">'+(i+1)+'</span>').join('');
  $('step').innerHTML='<div class="ref">'+u.step+' '+(cur+1)+' · '+esc(s.ref||'')+'</div><h3>'+L(s.title)+'</h3>'+(s.intro?'<p>'+L(s.intro)+'</p>':'')+
   (s.crop?'<div class="desk"><div class="scroll"><div class="sheet"><img src="'+s.crop+'" alt="'+esc(L(s.title))+'" loading="lazy">'+pins+'</div></div><div class="zoom"><span class="hint">'+u.hint+'</span><button type="button" id="zbtn" data-p="'+s.page+'">'+u.zoom+' ↗</button></div></div>':'')+
   '<ol class="pins">'+(s.pins||[]).map((p,i)=>'<li><span class="n">'+(i+1)+'</span><div><b class="pt">'+L(p.t)+'</b>'+L(p.d)+'</div></li>').join('')+'</ol>'+
   (s.example?'<div class="ex"><b>'+u.ex+'</b>'+L(s.example)+'</div>':'')+
   (s.warn?'<div class="warn"><b>'+u.warn+'</b>'+L(s.warn)+'</div>':'');
  $('cnt').textContent=(cur+1)+u.of+FORM.steps.length;
  $('prev').disabled=cur===0;$('nxt').disabled=cur===FORM.steps.length-1;
  const z=$('zbtn');if(z)z.onclick=()=>{$('lbImg').src=z.dataset.p;$('lb').hidden=false};
}
$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;cur=+b.dataset.i;renderStep()});
$('prev').onclick=()=>{if(cur>0){cur--;renderStep();$('walkH').scrollIntoView({behavior:'smooth'})}};
$('nxt').onclick=()=>{if(cur<FORM.steps.length-1){cur++;renderStep();$('walkH').scrollIntoView({behavior:'smooth'})}};
$('lbX').onclick=()=>{$('lb').hidden=true};
$('lang').onclick=()=>{lang=lang==='vi'?'en':'vi';try{localStorage.setItem('kl_lang',lang)}catch(e){}renderStatic()};
$('mail').onclick=()=>{
  const tmp=document.createElement('div');tmp.innerHTML=(last?last.big+'\n'+(last.sub||'')+'\n'+(last.items||[]).join('\n'):'');
  const vals=readInputs(false);
  const lines=FORM.tool.inputs.map(f=>'- '+L(f.label).replace(/<[^>]+>/g,'')+': '+(f.type==='check'?(vals[f.id]?'✓':'—'):(f.type==='select'?L((f.options.find(o=>String(o.v)===String(vals[f.id]))||{}).l):vals[f.id]))).join('\n');
  const subj=(lang==='vi'?'Hỏi về form ':'Question about form ')+FORM.form+' ('+FORM.code+')';
  const body=(lang==='vi'?'Chào anh Ken,\n\nEm vừa dùng tool '+FORM.code+'. Em nhập:\n':'Hi Ken,\n\nI just used tool '+FORM.code+'. My inputs:\n')+lines+'\n\n'+(lang==='vi'?'Kết quả:\n':'Result:\n')+tmp.textContent+'\n\n'+(lang==='vi'?'Em muốn hỏi thêm: ':'My question: ');
  location.href='mailto:ken@kenlamrealty.com?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
};
$('sms').href='sms:4086662825?&body='+encodeURIComponent('Chào anh Ken, em hỏi về form '+FORM.form+' ('+FORM.code+').');
renderStatic();
</script>
</body>
</html>
