 myths:'<li><b>“Ở 30 ngày vẫn dùng SIP được.”</b> Không. SIP cho 29 ngày trở xuống. Từ 30 ngày trở lên dùng RLAS (RPA ¶3M(2)).</li><li><b>“Seller dọn ra sớm thì được trả lại tiền.”</b> Không. Tiền ở mỗi ngày là non-refundable (SIP ¶2A). Chỉ tiền giữ chỗ là được trả lại khi giao nhà đúng hẹn, đúng tình trạng (¶3C).</li><li><b>“Nhà của buyer rồi, buyer vô lúc nào cũng được.”</b> Không. Phải báo trước 24 giờ, trừ khi khẩn cấp (¶5). Buyer cũng không được dọn đồ vào khi seller chưa đồng ý bằng giấy.</li>',
 n1:'T401 · Đọc hợp đồng RPA (đoạn 3M: ngày giao nhà)', n2:'T60 · Lịch escrow theo RPA', n3:'T53 · Luật thuê nhà CA & San Jose', n4:'T21 · Bán xong cầm về bao nhiêu'
},
en:{
 title:'SIP · Seller stays after closing · Ken Lam Tools',
 eyebrow:'Ken Lam · Real estate forms · T602',
 h1:'SIP · Seller stays after closing',
 lede:'The form that lets the seller stay in the home up to 29 days after closing, paying the buyer a daily fee.',
 what_h:'What is this form?',
 what_b:'<p>SIP is an addendum to the RPA purchase agreement. The home is already recorded in the buyer’s name, but the seller asks to stay a few more days. The seller pays the buyer a fee for each day.</p><p>The form says it is for 29 days or less. For 30 days or more, use a different form, RLAS, which works like a lease.</p><p>Buyer and seller both sign, usually with the offer or a counter offer, before closing.</p>',
 like_h:'In plain words',
 like_b:'You sell your car to a friend but borrow it back for a week to drive the kids to school until your new car arrives. The car is already theirs. You pay a daily fee, keep it clean, and hand back the keys on the agreed day.',
 meta:'<div><b>Who signs</b>Buyer and seller</div><div><b>When</b>With the offer or counter, before closing</div><div><b>Pages</b>2 pages</div><div><b>Version</b>Revised 12/24</div>',
 walk_h:'Walk through the form',
 calc_h:'Your situation',
 calc_s:'Change a number and the result updates right away. Nothing is saved or sent.',
 l_coe:'Closing date (COE)', l_days:'Days the seller stays', l_mode:'Fee is based on', o_day:'A daily amount', o_piti:'Buyer’s monthly payment (PITI)', l_amt:'Amount ($)', l_amt_s:'per day, or per month if PITI', l_dep:'Delivery of Possession fee ($)',
 r_big:'Seller must hand over the home by', r_hour:'6:00 PM', r_daily:'Daily fee', r_total:'Total fee (non-refundable)', r_dep:'Possession deposit (held by escrow)', r_hold:'Escrow takes from seller’s proceeds', r_ret:'Buyer returns the deposit by', r_ret_s:'if the home is delivered on time and in the agreed condition',
 piti_note:'From PITI: {piti} × 12 ÷ 365 = {daily}/day <span class="est">ESTIMATE</span>. The form sets no formula; the parties agree on it.',
 w_zero:'<b>No extra days</b>No SIP needed. The seller hands over the home at closing (RPA ¶3M(1)).',
 w_ok:'<b>Right form</b>{n} days is within the 29-day limit of the SIP.',
 w_rlas:'<b>30 days or more: use RLAS, not SIP</b>RPA ¶3M(2) and the SIP’s own note. The longer the stay, the more it can look like a tenancy. Talk to a landlord-tenant attorney before signing.',
 w_wkd:'<b>Hand-over day is a weekend/holiday</b>The SIP counts “calendar days,” so the date does not move by itself. To be sure, write the exact date and time in paragraph 1.',
 w_lend_hi:'<b>Watch the buyer’s loan</b>Owner-occupant loans usually require the buyer to move in within 60 days of closing. {n} days is past that. Ask the lender before signing <span class="est">ESTIMATE</span>.',
 w_lend_mid:'<b>Ask the lender first</b>Owner-occupant loans usually require move-in within 60 days, and many lenders cap rent-backs. At {n} days, check with the lender <span class="est">ESTIMATE</span>.',
 w_lend_lo:'If the buyer has an owner-occupant loan, ask the lender whether it limits rent-back days <span class="est">ESTIMATE</span>.',
 subj:'T602 SIP — seller stays {n} days after closing',
 body:'Hi Ken,\n\nI used the SIP tool. My numbers:\n- Closing date: {coe}\n- Seller stays: {n} days\n- Hand over by: {out}, 6 PM\n- Daily fee: {daily}\n- Total fee: {total}\n- Possession deposit: {dep}\n- Escrow takes from proceeds: {hold}\n\nI have a question.',
 sms:'Hi Ken, I used the SIP tool: closing {coe}, seller stays {n} days, out by {out} 6PM, fee {total}. I have a question.',
 myths:'<li><b>“A 30-day stay can still use the SIP.”</b> No. The SIP is for 29 days or less. At 30 days or more, use RLAS (RPA ¶3M(2)).</li><li><b>“If the seller leaves early, they get money back.”</b> No. The daily fee is non-refundable (SIP ¶2A). Only the possession deposit comes back, if the home is delivered on time and in the agreed condition (¶3C).</li><li><b>“It’s the buyer’s house now, so the buyer can walk in anytime.”</b> No. The buyer gives 24 hours’ notice except in an emergency (¶5), and cannot move belongings in without the seller’s written OK.</li>',
 n1:'T401 · Read the RPA (¶3M: possession)', n2:'T60 · Escrow timeline under the RPA', n3:'T53 · CA & San Jose rental law', n4:'T21 · Seller net sheet'
}};

  pins:{vi:[['Phụ lục của hợp đồng','SIP không đứng một mình. Nó gắn vào Purchase Agreement (RPA) hoặc một counter offer. Ghi ngày của hợp đồng đó.'],

            ['Trả trễ, check bị trả về','Khoản nào trả ngoài escrow mà trễ quá 5 ngày thì có tiền phạt trễ (số tiền hai bên điền). Check không đủ tiền (NSF): $25.']],

function onLang(d){}
function CALC(d){
  const coe=pd($('iCoe').value)||new Date(2026,11,15);
  const n=Math.max(0,Math.round(num('iDays',7)));
  const mode=$('iMode').value, amt=Math.max(0,num('iAmt',6500)), dep=Math.max(0,num('iDep',0));
  const daily=mode==='piti'?Math.round(amt*12/C.DAYS_PER_YEAR*100)/100:amt;
  const total=Math.round(daily*n*100)/100, hold=total+dep;
  const out=addD(coe,n), ret=cal(out,C.DEP_RETURN_DAYS);
  let h='<div class="bigk">'+d.r_big+'</div><div class="big">'+fd(out)+' · '+d.r_hour+'</div>';
  h+='<div class="tbl"><table>'+
     '<tr><td>'+d.r_daily+'</td><td class="d">'+money(daily,true)+'</td></tr>'+
     '<tr><td>'+d.r_total+'</td><td class="d">'+money(total,true)+'</td></tr>'+
     '<tr><td>'+d.r_dep+'</td><td class="d">'+money(dep)+'</td></tr>'+
     '<tr><td><b>'+d.r_hold+'</b></td><td class="d">'+money(hold,true)+'</td></tr>'+
     (dep>0&&n>0?'<tr><td>'+d.r_ret+'<span class="roll" style="color:var(--muted)">'+d.r_ret_s+'</span></td><td class="d">'+fd(ret.d)+(ret.r?'<span class="roll">'+COMMON[lang].rolled+'</span>':'')+'</td></tr>':'')+
     '</table></div>';
  if(mode==='piti')h+='<p class="muted">'+fill(d.piti_note,{piti:money(amt),daily:money(daily,true)})+'</p>';
  if(n===0)h+='<div class="life">'+d.w_zero+'</div>';
  else if(n>C.MAX_SIP_DAYS)h+='<div class="bad">'+d.w_rlas+'</div>';
  else h+='<div class="life">'+fill(d.w_ok,{n:n})+'</div>';
  if(n>0&&offDay(out))h+='<div class="warn">'+d.w_wkd+'</div>';
  if(n>C.LENDER_MOVEIN_DAYS)h+='<div class="bad">'+fill(d.w_lend_hi,{n:n})+'</div>';
  else if(n>C.MAX_SIP_DAYS)h+='<div class="warn">'+fill(d.w_lend_mid,{n:n})+'</div>';
  else if(n>0)h+='<p class="muted">'+d.w_lend_lo+'</p>';
  const o={coe:fds(coe),n:n,out:fds(out),daily:money(daily,true),total:money(total,true),dep:money(dep),hold:money(hold,true)};
  return {html:h,subj:fill(d.subj,o),body:fill(d.body,o),sms:fill(d.sms,o)};
}

let lang='en';
try{ if(localStorage.getItem('kl_lang')==='vi') lang='vi'; }catch(e){}
const $=id=>document.getElementById(id);
const D=()=>Object.assign({},COMMON[lang],I18N[lang]);
const pad=n=>String(n).padStart(2,'0');
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pd(s){const a=String(s||'').split('-');return a.length===3&&+a[0]>1900?new Date(+a[0],+a[1]-1,+a[2]):null}
function addD(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function offDay(d){const w=d.getDay();return w===0||w===6||C.HOLIDAYS.indexOf(iso(d))>=0}
/* "Days" = calendar days; a performance day on Sat/Sun/holiday rolls to next business day (RPA ¶25I, Civ. Code §11) */
function cal(d,n){const raw=addD(d,n);let x=raw,r=false;while(offDay(x)){x=addD(x,1);r=true}return {d:x,r:r,raw:raw}}
function biz(d,n){let x=new Date(d),k=0;while(k<n){x=addD(x,1);if(!offDay(x))k++}return {d:x,r:false,raw:x}}
function fd(d){if(!d)return '—';const L=COMMON[lang];return lang==='vi'?L.days[d.getDay()]+', '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear():d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}
function fds(d){return lang==='vi'?pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear():pad(d.getMonth()+1)+'/'+pad(d.getDate())+'/'+d.getFullYear()}
function money(n,c){const v=Math.abs(n);return (n<0?'−':'')+'$'+v.toLocaleString('en-US',{minimumFractionDigits:c?2:0,maximumFractionDigits:c?2:0})}
function num(id,def){const v=parseFloat(String($(id).value).replace(/[,$\s]/g,''));return isNaN(v)?def:v}
function V(x){return '<span class="v">'+x+'</span>'}
function DL(o){return V(fd(o.d))+(o.r?'<span class="roll">'+COMMON[lang].rolled+'</span>':'')}
function fill(s,o){return s.replace(/\{(\w+)\}/g,(m,k)=>o[k]!=null?o[k]:m)}
function strip(h){const t=document.createElement('div');t.innerHTML=h;return t.textContent.replace(/[ \t]+/g,' ').trim()}

let cur=0;
function chips(){const c=$('chips');c.innerHTML='';STEPS.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.className='chip'+(i<cur?' done':'');b.textContent=(i+1)+'. '+s.chip[lang];if(i===cur)b.setAttribute('aria-current','step');b.onclick=()=>go(i,true);c.appendChild(b)})}
function renderStep(){
  const d=D(),s=STEPS[cur];
  let h='<div class="ref">'+s.ref[lang]+'</div><h3>'+s.q[lang]+'</h3>'+
   '<figure class="desk" style="margin:12px 0 6px"><div class="scroll"><img src="'+s.img+'" width="1164" alt="'+d.alt+' '+s.ref[lang]+' · '+C.CODE+'" loading="eager"></div><div class="zoom"><span class="legend"><span class="hint">'+d.drag+'</span>'+d.legend+'</span><button type="button" data-z="'+s.img+'">'+d.zoom+'</button></div></figure>'+
   '<div class="says">'+d.says+'</div><ol class="pins">'+s.pins[lang].map((q,i)=>'<li><span class="n">'+(i+1)+'</span><div><span class="pt">'+q[0]+'</span>'+q[1]+'</div></li>').join('')+'</ol>'+
   '<div class="life"><b>'+d.exh+'</b>'+s.ex[lang]+'</div>'+(s.warn?'<div class="warn"><b>'+d.warnh+'</b>'+s.warn[lang]+'</div>':'');
  $('step').innerHTML=h;
  $('count').textContent=(cur+1)+' / '+STEPS.length;
  $('prev').disabled=cur===0;
  $('next').textContent=cur===STEPS.length-1?d.again:d.next;
  chips();
  const a=$('chips').querySelector('[aria-current]');if(a){const c=$('chips');c.scrollLeft=a.offsetLeft-c.clientWidth/2+a.clientWidth/2}
}
function go(i,scroll){cur=(i+STEPS.length)%STEPS.length;renderStep();if(scroll){const t=$('walk_h');window.scrollTo({top:t.getBoundingClientRect().top+window.scrollY-8,behavior:'smooth'})}}
function runCalc(){
  const d=D(),r=CALC(d);
  $('res').innerHTML=r.html;
  $('mailBtn').href='mailto:ken@kenlamrealty.com?subject='+encodeURIComponent(r.subj)+'&body='+encodeURIComponent(r.body+'\n\n— '+C.CODE+' · tools.kenlamrealty.com/'+C.SLUG+'/');
  $('smsBtn').href='sms:4086662825?&body='+encodeURIComponent(r.sms);
}
function applyLang(){
  const d=D();
  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.getAttribute('data-i');if(typeof d[k]==='string')el.innerHTML=d[k]});
  $('langBtn').textContent=d.lang;document.documentElement.lang=lang;$('klBack').textContent=d.back;document.title=d.title;
  $('lbX').textContent=d.close;
  if(typeof onLang==='function')onLang(d);
  renderStep();runCalc();
}
$('prev').onclick=()=>go(cur-1,true);
$('next').onclick=()=>go(cur+1,true);
$('langBtn').onclick=()=>{lang=lang==='vi'?'en':'vi';try{localStorage.setItem('kl_lang',lang)}catch(e){}applyLang()};
document.querySelectorAll('#calc input,#calc select').forEach(el=>{el.addEventListener('input',runCalc);el.addEventListener('change',runCalc)});
document.addEventListener('click',e=>{const z=e.target.closest('[data-z]');if(z){$('lbImg').src=z.getAttribute('data-z');$('lb').hidden=false}});
$('lbX').onclick=()=>{$('lb').hidden=true};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('lb').hidden=true});
if(typeof initTool==='function')initTool();
applyLang();
