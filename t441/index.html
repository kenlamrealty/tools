<style>
/* Layout: one column, inputs on top, live result card below, three actions, footer. Phone first. */
:root{
  --bg:#FBF9F4;        /* ivory */
  --panel:#FFFFFF;
  --fg:#2B2925;
  --muted:#7A7468;
  --line:#E6E0D3;
  --brass:#B8955A;     /* soft brass accent */
  --brass-soft:#F3EBDC;
  --warn:#9A5B2E;
  --ok:#4F7A5A;
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1C1A17;--panel:#24211D;--fg:#F1ECE2;--muted:#A69D8E;--line:#3A352E;
  --brass:#D2B07A;--brass-soft:#302A20;--warn:#D99A6A;--ok:#8CBF9A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1A17;--panel:#24211D;--fg:#F1ECE2;--muted:#A69D8E;--line:#3A352E;
  --brass:#D2B07A;--brass-soft:#302A20;--warn:#D99A6A;--ok:#8CBF9A;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:22px}
header{display:grid;gap:6px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:500}
.lang{border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:12px;padding:5px 10px;border-radius:999px;cursor:pointer}
.lang:focus-visible,button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1{font-family:var(--display);font-weight:300;font-size:38px;line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:15px;margin:0;max-width:40ch}

.inputs{display:grid;gap:14px}
.field{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.field label small{font-weight:400}
.ctl{display:flex;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:0 12px}
.ctl:focus-within{border-color:var(--brass)}
.ctl .pre,.ctl .post{color:var(--muted);font-size:15px}
.ctl input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:20px;padding:12px 8px;font-variant-numeric:tabular-nums}
.ctl input::-webkit-outer-spin-button,.ctl input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ctl input[type=number]{-moz-appearance:textfield}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:380px){.row2{grid-template-columns:1fr}}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:15px;padding:11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brass-soft);color:var(--fg);font-weight:500}

.result{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:grid;gap:16px}
.total .k{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.total .v{font-family:var(--display);font-weight:400;font-size:58px;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--fg)}
.total .v small{font-family:var(--body);font-size:16px;color:var(--muted);font-weight:400}
.lines{display:grid;gap:0;border-top:1px solid var(--line)}
.line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.line .n{color:var(--muted);min-width:0}
.line .n b{color:var(--fg);font-weight:500}
.line .a{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.line.pmi .a{color:var(--warn)}
.line.pmi.off{display:none}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.bar .b1{background:var(--brass)}
.bar .b2{background:#A9B7A0}
.bar .b3{background:#CBB7A3}
.bar .b4{background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
.meta{font-size:13px;color:var(--muted);display:grid;gap:4px}
.meta b{color:var(--fg);font-weight:500}
.note{font-size:13px;color:var(--muted);background:var(--brass-soft);border-radius:10px;padding:10px 12px;line-height:1.45}
.note.hide{display:none}

.actions{display:grid;gap:10px}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;border-radius:10px;padding:14px 16px;font:inherit;font-size:15px;font-weight:500;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#FFFDF8}
.btn.primary:hover{filter:brightness(.96)}
.btn:hover{border-color:var(--brass)}

.form{display:none;background:var(--panel);border:1px solid var(--brass);border-radius:14px;padding:18px;gap:12px}
.form.open{display:grid}
.form h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.form p{margin:0;font-size:14px;color:var(--muted)}
.form .ctl input{font-size:16px}
.form .ok{color:var(--ok);font-weight:500;font-size:14px}
.copyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.copyrow code{background:var(--brass-soft);padding:3px 8px;border-radius:6px;user-select:all;font-family:var(--body)}
.copyrow button{border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;font-size:13px;padding:5px 10px;border-radius:999px;cursor:pointer}

footer{display:grid;gap:8px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
footer a{color:var(--brass);text-decoration:none}
footer a:hover{text-decoration:underline}
footer .who{color:var(--fg)}
@media (prefers-reduced-motion:no-preference){.total .v{transition:opacity .15s}}

.ctl input[type=date]{font-size:17px;min-height:48px}
.fx{font-size:12px;color:var(--muted);font-weight:400}
.status{font-size:15px;border-radius:10px;padding:10px 12px;line-height:1.45}
.status.ok{background:var(--brass-soft)}
.status.warn{border:1px solid var(--warn)}

.dl h2,.idr h2,.next h2,.tlw h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.dd{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:6px;min-width:0}
.dd .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.dd .t{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.dd .left{font-size:13px;color:var(--muted);white-space:nowrap}
.dd .date{font-family:var(--display);font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}

.task .tt{border:0;background:transparent;color:var(--fg);font:inherit;font-size:15px;line-height:1.4;text-align:left;padding:0;cursor:pointer;min-width:0}

.myth a,.next a,.idr a{color:var(--brass)}

.next ol{margin:0;padding-left:20px;display:grid;gap:10px;font-size:14px;line-height:1.5}

<script id="kl-commas">
/* Ken Lam Realty: ô nhập tiền / sqft tự thêm dấu phẩy (1,200,000). Code cũ vẫn đọc .value ra số thuần. */
(function(){
  var d=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
  function fmt(v){
    var s=String(v==null?'':v).replace(/[^0-9.\-]/g,''),neg=s.charAt(0)==='-';
    s=s.replace(/-/g,'');
    var i=s.indexOf('.'),ip=i<0?s:s.slice(0,i),dp=i<0?'':s.slice(i).replace(/\./g,'');
    if(i>=0)dp='.'+dp;
    ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return (neg?'-':'')+ip+dp;
  }
  function want(el){
    if(el.type!=='number'||el.__klc)return false;
    var c=el.closest&&el.closest('.ctl');if(!c)return false;
    var pre=c.querySelector('.pre'),post=c.querySelector('.post');
    if(pre&&pre.textContent.indexOf('$')>-1)return true;
    if(post&&/^\s*(sqft|sq ?ft)\s*$/i.test(post.textContent))return true;
    return false;
  }
  function conv(el){
    if(!want(el))return;
    el.__klc=1;
    var cur=d.get.call(el),ph=el.getAttribute('placeholder');
    el.type='text';
    if(!el.getAttribute('inputmode'))el.setAttribute('inputmode','numeric');
    Object.defineProperty(el,'value',{configurable:true,
      get:function(){return d.get.call(this).replace(/,/g,'')},
      set:function(v){d.set.call(this,fmt(v))}});
    d.set.call(el,fmt(cur));
    if(ph&&/^[0-9.]{5,}$/.test(ph))el.setAttribute('placeholder',fmt(ph));
    el.addEventListener('input',function(){
      var raw=d.get.call(el),pos=el.selectionStart,n=0,k;
      for(k=0;k<pos;k++)if(/[0-9.]/.test(raw.charAt(k)))n++;
      var out=fmt(raw);
      if(out===raw)return;
      d.set.call(el,out);
      for(k=0,pos=0;k<out.length&&n>0;k++){pos=k+1;if(/[0-9.]/.test(out.charAt(k)))n--;}
      try{el.setSelectionRange(pos,pos)}catch(e){}
    });
  }
  function scan(r){
    if(r.nodeType!==1)return;
    if(r.tagName==='INPUT')conv(r);
    var l=r.querySelectorAll?r.querySelectorAll('input[type=number]'):[];
    for(var i=0;i<l.length;i++)conv(l[i]);
  }
  new MutationObserver(function(m){
    for(var i=0;i<m.length;i++)for(var j=0;j<m[i].addedNodes.length;j++)scan(m[i].addedNodes[j]);
  }).observe(document.documentElement,{childList:true,subtree:true});
  document.addEventListener('DOMContentLoaded',function(){scan(document.body)});
})();
</script>

ước khi close.", "f_occ": "<b>Người ở / thú vật khác giấy:</b> xin danh sách đúng. Ảnh hưởng tới bảo hiểm và luật thuê.", "f_ok": "Không thấy chỗ lệch. Vẫn đọc hết đoạn 25–30 trên TEC thật.", "sum": "So TEC: {n} chỗ lệch. Tiền thuê hợp đồng {rl} / TEC {rt}. Cọc {dl} / {dt}. Hết hạn {el} / {et}.", "mail_subj": "T441 · Kết quả so TEC", "myth": "<b>Nhiều người hiểu sai:</b> “Có hợp đồng thuê rồi, cần gì TEC.” Hợp đồng là chuyện cũ người bán kể. TEC là chuyện hôm nay người đang ở kể: tăng giá, giảm giá, hứa miệng, nợ tiền.", "next": ["Người mua: ghi trong offer là cần TEC từ mỗi người thuê, trước hạn bỏ contingency.", "Người bán: xin TEC sớm. Không có luật đặt hạn — hạn nằm trong hợp đồng thuê. Hợp đồng là RLMM 6/26 thì người thuê có 3 ngày (đoạn 34).", "Đặt hợp đồng và TEC cạnh nhau, so từng dòng bằng tool này.", "Chỗ nào lệch: hỏi người bán bằng giấy trước khi bỏ contingency."]}, "en": {"mock_t": "Sample form", "mock_lead": "Tap each paragraph to see what it says, what it means, and an example.", "mock_tag": "Sample only — not the real form", "k_say": "What it says:", "k_mean": "What it means:", "k_ex": "Example:", "nx_title": "Next steps", "v_t": "45-second video", "b_email": "Email my result to Ken", "b_sms": "Text Ken a question", "b_video": "Watch the 45-sec video", "b_all": "All forms", "ft_src": "Sources", "ft_upd": "Updated", "ft_all": "All forms", "ft_tools": "All tools", "ft_disc": "General information, not legal advice. Ask a lawyer about your own situation. Ken Lam is a broker, not a lawyer. C.A.R. forms are copyrighted; this page explains them in our own words.", "lang": "Tiếng Việt", "back": "← All tools", "mail_tail": "Sent from tools.kenlamrealty.com. General information, not legal advice.", "sms_pre": "Hi Ken, I just used a tool on tools.kenlamrealty.com:", "doc_title": "T441 · Form TEC: tenant estoppel certificate, explained", "eyebrow": "Forms explained · C.A.R. Form TEC", "title": "Tenant estoppel certificate (TEC)", "sub": "Before buying a tenant-occupied home, ask the tenant directly: what rent, what deposit, until when, any side deals. They write it down and sign.", "chips": [["Who signs", "Tenant · owner acknowledges"], ["When", "Selling or refinancing a rental"], ["Pages", "2"], ["Revision", "6/26"]], "mock_title": "Tenant Estoppel Certificate", "paras": [{"n": "—", "t": "Tenant · Premises", "v": "Thu Example · 1234 Example Lane, San Jose, CA 95100", "say": "Tenant name and premises address. \"Housing Provider\" includes landlord. The tenant makes the statements below.", "mean": "These are the tenant’s statements, not the owner’s.", "ex": "Thu Example, 1234 Example Lane."}, {"n": "1", "t": "Copy of rental agreement attached?", "v": "☑ Yes", "say": "Tenant says whether a copy of the lease is attached.", "mean": "Attached makes word-by-word comparison easy. If not, ask the owner.", "ex": "Yes, the lease signed 03/01/2025."}, {"n": "2", "t": "Date of the agreement", "v": "03/01/2025", "say": "The date of the rental agreement.", "mean": "Compare with the copy the seller gave you.", "ex": "03/01/2025."}, {"n": "3", "t": "Current owner / manager", "v": "Minh & Lan Example", "say": "Name of the current owner, or authorized broker, agent or property manager (the \"Housing Provider\").", "mean": "Who the tenant believes their landlord is.", "ex": "Minh & Lan Example."}, {"n": "4", "t": "Other occupants · ages of minors", "v": "Tam Example · one child, age 6", "say": "Other adult tenants and occupants, and ages of all minors.", "mean": "How many people really live there.", "ex": "Tam Example; one child, age 6."}, {"n": "5", "t": "Monthly base rent", "v": "$3,000", "say": "Current monthly base rent.", "mean": "The most important number. A mismatch with the lease is a red flag.", "ex": "$3,000 — the lease says $3,200."}, {"n": "5A", "t": "Date of last increase", "v": "03/01/2026", "say": "When rent last went up.", "mean": "Tells you when the next increase could come.", "ex": "03/01/2026."}, {"n": "5B", "t": "Amount of increase · prior rent", "v": "$100 · $3,100", "say": "How much it went up and the rent before.", "mean": "Lets you compute the percentage increase.", "ex": "$100; prior rent $3,100."}, {"n": "6", "t": "Paid in full, EXCEPT…", "v": "Paid in full", "say": "Current rent is paid in full except what is written here.", "mean": "Is any rent owed?", "ex": "Paid in full."}, {"n": "7", "t": "Security deposit", "v": "$3,200", "say": "The security deposit amount.", "mean": "On a sale, the owner must transfer the deposit to the buyer (and notify the tenant) or return it. The buyer is jointly liable for it (Civil Code §1950.5), so the number must be right.", "ex": "$3,200."}, {"n": "8", "t": "Other deposits", "v": "$0", "say": "Any other deposits.", "mean": "Key deposits, pet deposits…", "ex": "$0."}, {"n": "9", "t": "Expiration of current term", "v": "02/28/2027", "say": "When the current lease term ends.", "mean": "If a buyer wants to move in, this is the date that matters.", "ex": "02/28/2027."}, {"n": "10", "t": "Parking spaces", "v": "1 space in garage", "say": "Number and location of parking spaces.", "mean": "A common fight in multi-unit buildings.", "ex": "1 space in the garage."}, {"n": "11", "t": "Storage spaces", "v": "None", "say": "Number and location of storage spaces.", "mean": "Avoids \"that storage room is mine.\"", "ex": "None."}, {"n": "12", "t": "Animals", "v": "☑ Pet: 1 cat", "say": "Service animal / emotional support animal / pet, with a description.", "mean": "Service and emotional support animals have their own rules, unlike pets.", "ex": "One cat."}, {"n": "13–18", "t": "Who pays water, electricity, gas, trash, sewer, gardening", "v": "Water, trash, sewer, garden: owner · Electric, gas: tenant", "say": "Each service is checked Tenant or Housing Provider.", "mean": "A wrong entry leaves the buyer with surprise bills.", "ex": "Water, trash, sewer, gardening: owner. Electricity, gas: tenant."}, {"n": "19", "t": "Other services tenant pays", "v": "Internet", "say": "Any other utilities or services the tenant pays.", "mean": "Internet, pool service…", "ex": "Internet."}, {"n": "20–23", "t": "Who owns stove, fridge, washer/dryer, microwave", "v": "Fridge, washer/dryer: tenant", "say": "Each appliance is checked Tenant or Housing Provider.", "mean": "Tenant-owned items leave with the tenant.", "ex": "Stove, microwave: owner. Fridge, washer/dryer: tenant."}, {"n": "24", "t": "Other tenant-owned appliances", "v": "Water filter", "say": "Any other appliances the tenant owns.", "mean": "Avoids disputes at move-out.", "ex": "Water filter."}, {"n": "25", "t": "Lease in effect · no side deals", "v": "Exceptions: none", "say": "The original lease is in full force and is the entire agreement, except listed modifications, addenda, assignments, extensions, or rights/options to purchase or lease. No other verbal or written agreements.", "mean": "Flushes out verbal promises, like a past owner promising a right to buy first.", "ex": "None."}, {"n": "26", "t": "Tenant actually occupies", "v": "Thu is in possession", "say": "Tenant occupies and possesses the premises; has not assigned, transferred or pledged the lease. Required improvements are complete.", "mean": "No hidden third party.", "ex": "Thu Example lives there and has not sublet."}, {"n": "27", "t": "Owner has performed", "v": "No complaints", "say": "The owner has met all lease duties and is not in default. Tenant has no defenses or offsets against rent.", "mean": "Waiting on a water-heater repair? Write it here, or it is hard to claim later.", "ex": "None."}, {"n": "28", "t": "No free rent or concessions", "v": "$200/month off since 6/2026", "say": "No free rent, partial rent, rebates, abatements or concessions, except as listed.", "mean": "Rent on paper is $3,200 but a discount means less actually collected.", "ex": "\"$200/month off since June 2026 because the AC is broken.\""}, {"n": "29", "t": "No bankruptcy", "v": "No", "say": "Tenant has not filed and is not subject to a bankruptcy or reorganization filing.", "mean": "Bankruptcy can slow collecting rent or regaining possession.", "ex": "No."}, {"n": "30", "t": "Tenant not in default", "v": "No notices", "say": "Tenant is not in default, has not breached, and has no uncured notice of default.", "mean": "You are not buying a dispute in progress.", "ex": "None."}, {"n": "31", "t": "Notice address", "v": "1234 Example Lane", "say": "Notices go to the premises unless another address is shown.", "mean": "Where to send paperwork.", "ex": "1234 Example Lane, San Jose, CA 95100."}, {"n": "32", "t": "Signer is authorized", "v": "Thu signs herself", "say": "The signer is authorized by the tenant to sign.", "mean": "Avoids \"the signer was not the tenant.\"", "ex": "Thu Example signs."}, {"n": "33", "t": "Lender and buyer rely on it", "v": "—", "say": "Tenant understands a lender may lend, and a buyer may buy, in material reliance on this certificate.", "mean": "This is why the TEC matters. Once signed, it is hard to claim otherwise.", "ex": "The buyer of 1234 Example Lane relies on it for rent figures."}, {"n": "✍", "t": "Signatures", "v": "Thu Example · owner acknowledges receipt", "say": "Tenant signs and dates. Housing Provider signs \"Receipt Acknowledged\".", "mean": "The owner signing means received, not agreeing with every statement.", "ex": "Thu signs; Minh acknowledges receipt."}], "t_h": "Compare “what the lease says” with “what the tenant says”", "t_lead": "Enter the lease figures and the TEC figures. Any mismatch is a red flag to raise with the seller before removing contingencies.", "c_lease": "Lease says", "c_tec": "Tenant says (TEC)", "r_rent": "Monthly rent (¶5)", "r_dep": "Security deposit (¶7)", "r_end": "Lease end date (¶9)", "l_owed": "Rent the tenant owes (¶6) — 0 if paid in full", "x_conc": "TEC lists a discount or free rent (¶28)", "x_side": "TEC lists side deals, extensions or an option to buy (¶25)", "x_def": "Tenant says the owner has not done something (¶27)", "x_occ": "Occupants or animals differ from the seller’s papers (¶4, ¶12)", "v_k": "Comparison result", "v_n": "{n} mismatch(es)", "v_0": "Matches", "v_s": "Ask the seller about each one in writing before removing contingencies.", "v_s0": "The lease and TEC match on everything you entered.", "v_rent": "Rent differs by {m}/month = {y}/year.", "lower": "lower than", "higher": "higher than", "f_rent": "<b>Rent:</b> the tenant reports {a}/month {dir} the lease. Ask the seller to explain and show any increase/discount papers.", "f_dep": "<b>Deposit:</b> the tenant reports {a} {dir} the lease. On a sale the deposit goes to the buyer or back to the tenant, and the buyer is jointly liable for it (Civil Code §1950.5). Pin down the number before closing.", "f_end": "<b>End date:</b> lease says {l}, tenant says {t}. Is there an extension nobody mentioned?", "f_owed": "<b>{a} owed:</b> who gets this after closing? Spell it out in escrow.", "f_conc": "<b>Discount or free rent:</b> actual income is lower than on paper. Ask how long it lasts and whether a credit is due.", "f_side": "<b>Side deal or option to buy:</b> a big red flag. Review that document with a lawyer before going further.", "f_def": "<b>Owner has not finished something:</b> the tenant may offset rent or demand repairs. Agree who fixes and pays before closing.", "f_occ": "<b>Occupants / animals differ:</b> get an accurate list. It affects insurance and tenancy rules.", "f_ok": "No mismatches found. Still read ¶25–30 on the real TEC.", "sum": "TEC check: {n} mismatch(es). Rent lease {rl} / TEC {rt}. Deposit {dl} / {dt}. End {el} / {et}.", "mail_subj": "T441 · My TEC comparison", "myth": "<b>Common mistake:</b> “We have the lease, so why a TEC?” The lease is the seller’s old story. The TEC is today’s story from the person living there: increases, discounts, verbal promises, unpaid rent.", "next": ["Buyers: ask in your offer for a TEC from every tenant, due before contingency removal.", "Sellers: request TECs early. No statute sets a deadline — the lease does. Under an RLMM 6/26 lease, the tenant has 3 days (¶34).", "Put the lease and TEC side by side and compare line by line with this tool.", "Any mismatch: ask the seller in writing before removing contingencies."]}};
let lang='vi'; try{ if(localStorage.getItem('kl_lang')==='en') lang='en'; }catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(n<0?'−':'')+'$'+Math.round(Math.abs(n)).toLocaleString('en-US');
const num=id=>{const v=parseFloat($(id).value);return isFinite(v)?v:0};
function setSeg(group,val){ document.querySelectorAll('[data-g="'+group+'"] button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===val?'true':'false')); }
function segVal(group){ const b=document.querySelector('[data-g="'+group+'"] button[aria-pressed="true"]'); return b?b.dataset.v:''; }
document.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('.seg[data-g] button'); if(!b) return; setSeg(b.parentElement.dataset.g,b.dataset.v); update(); });
function renderStatic(){
  const d=I18N[lang];
  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.getAttribute('data-i'); if(typeof d[k]==='string') el.innerHTML=d[k];});
  $('chips').innerHTML=d.chips.map(c=>'<span class="chip">'+c[0]+': <b>'+c[1]+'</b></span>').join('');
  $('mockTitle').textContent=d.mock_title;
  $('paras').innerHTML=d.paras.map(p=>'<details class="para"><summary><span class="pn">'+p.n+'</span><span class="pt">'+p.t+'</span><span class="pi" aria-hidden="true">+</span><span class="pv">'+p.v+'</span></summary><div class="pb"><p><b>'+d.k_say+'</b> '+p.say+'</p><p><b>'+d.k_mean+'</b> '+p.mean+'</p><p><b>'+d.k_ex+'</b> '+p.ex+'</p></div></details>').join('');
  $('myth').innerHTML=d.myth;
  $('nextList').innerHTML=d.next.map(x=>'<li>'+x+'</li>').join('');
  $('langBtn').textContent=d.lang; document.documentElement.lang=lang;
  $('klBack').textContent=d.back;
  document.title=d.doc_title;
}
function setContact(summary){
  const d=I18N[lang];
  $('emailBtn').href='mailto:ken@kenlamrealty.com?subject='+encodeURIComponent(d.mail_subj)+'&body='+encodeURIComponent(summary+'\n\n'+d.mail_tail);
  $('smsBtn').href='sms:4086662825?&body='+encodeURIComponent(d.sms_pre+' '+summary.split('\n')[0]);
}

function tec(i){
  const f=[];
  const rentGap=i.rentL-i.rentT, depGap=i.depL-i.depT;
  if(Math.abs(rentGap)>0.5) f.push({k:'rent',amt:rentGap});
  if(Math.abs(depGap)>0.5) f.push({k:'dep',amt:depGap});
  if(i.endL&&i.endT&&i.endL!==i.endT) f.push({k:'end'});
  if(i.owed>0.5) f.push({k:'owed',amt:i.owed});
  ['conc','side','def','occ'].forEach(k=>{ if(i[k]) f.push({k}); });
  return {flags:f,count:f.length,rentGap,rentYear:rentGap*MONTHS,depGap};
}
function update(){
  const d=I18N[lang];
  const i={rentL:num('rentL'),rentT:num('rentT'),depL:num('depL'),depT:num('depT'),endL:$('endL').value,endT:$('endT').value,owed:num('owed'),
    conc:$('xConc').checked,side:$('xSide').checked,def:$('xDef').checked,occ:$('xOcc').checked};
  const r=tec(i);
  $('vv').textContent=r.count?d.v_n.replace('{n}',r.count):d.v_0;
  $('verdict').className='verdict'+(r.count?' warn':'');
  let s=r.count?d.v_s:d.v_s0;
  if(Math.abs(r.rentGap)>0.5) s+=' '+d.v_rent.replace('{m}',fmt(Math.abs(r.rentGap))).replace('{y}',fmt(Math.abs(r.rentYear)));
  $('vs').innerHTML=s;
  const fd=x=>{ if(!x) return '—'; const p=x.split('-'); return lang==='vi'?p[2]+'/'+p[1]+'/'+p[0]:p[1]+'/'+p[2]+'/'+p[0]; };
  $('flags').innerHTML=r.flags.map(x=>{
    let t=d['f_'+x.k];
    t=t.replace('{a}',fmt(Math.abs(x.amt||0))).replace('{dir}',(x.amt||0)>0?d.lower:d.higher).replace('{l}',fd(i.endL)).replace('{t}',fd(i.endT));
    return '<li class="w">'+t+'</li>'; }).join('') + (r.count?'':'<li>'+d.f_ok+'</li>');
  setContact(d.sum.replace('{n}',r.count).replace('{rl}',fmt(i.rentL)).replace('{rt}',fmt(i.rentT)).replace('{dl}',fmt(i.depL)).replace('{dt}',fmt(i.depT)).replace('{el}',fd(i.endL)).replace('{et}',fd(i.endT)));
  window.__last=r;
}
['rentL','rentT','depL','depT','endL','endT','owed','xConc','xSide','xDef','xOcc'].forEach(id=>{ $(id).addEventListener('input',update); $(id).addEventListener('change',update); });

function applyLang(){ renderStatic(); update(); }
$('langBtn').onclick=()=>{ lang=lang==='vi'?'en':'vi'; try{localStorage.setItem('kl_lang',lang)}catch(e){} applyLang(); };

applyLang();
</script>
