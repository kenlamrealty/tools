"qa_who": "Agent đưa cho người mua/người thuê và người bán/chủ cho thuê.",
"qa_sign": "Buyer/Tenant và Seller/Housing provider ký là đã đọc, hiểu và nhận một bản.",

"qa_pages": "2 trang, 12 mục",

"e0t": "1. Nhà ở là cho mọi người",
"e0b": "Mọi căn nhà ở California đều mở cho mọi người. Kỳ thị theo các nhóm ghi trong form là phạm luật. Ai bị đối xử không công bằng thì có nơi để nhờ.",
"e1t": "2. Các luật liên bang và tiểu bang",
"e1b": "Form kể tên: Fair Housing Act (FHA, luật liên bang), FEHA (luật California về việc làm và nhà ở), Unruh Civil Rights Act (doanh nghiệp phải phục vụ mọi người như nhau), ADA (người khuyết tật ở nơi công cộng), và vài luật khác kể cả luật địa phương của city hay county.",
"e2t": "3. Vi phạm thì bị gì",
"e2b": "Có thể bị phạt tiền, bị tòa ra lệnh ngưng, phải bồi thường thiệt hại (kể cả bồi thường mang tính trừng phạt), và trả tiền luật sư.",
"e3t": "4. Các nhóm được bảo vệ",
"e3b": "Chủng tộc, màu da, nguồn gốc tổ tiên, quốc gia, tôn giáo, tuổi, giới tính, xu hướng tính dục, bản dạng giới, tình trạng hôn nhân, gia đình có con dưới 18, quốc tịch, tình trạng di trú, ngôn ngữ chính, quân nhân/cựu chiến binh, nguồn thu nhập (như voucher Section 8), bệnh, khuyết tật, thông tin di truyền, tiền án không liên quan, và bất cứ đặc điểm tùy tiện nào. Kể cả khi người ta chỉ \"bị nghĩ là\" thuộc nhóm đó, hoặc quen biết người thuộc nhóm đó.",
"e4t": "5. DRE bắt agent học và bị giám sát",
"e4b": "Agent phải học 3 giờ về Fair Housing mỗi lần gia hạn bằng. Broker giám sát agent phải nắm luật chống kỳ thị. Agent vi phạm có thể bị treo hoặc mất bằng.",
"e5t": "6. Hội REALTORS® cấm kỳ thị",
"e5b": "Điều 10 của Code of Ethics (NAR) cấm REALTOR® kỳ thị khi tuyển người hoặc khi làm dịch vụ nhà đất.",
"e6t": "7. Ai phải tuân thủ",
"e6b": "Không chỉ agent. Người bán, chủ cho thuê, người cho thuê lại, công ty môi giới, quản lý nhà, mobile home park, HOA, ngân hàng, hãng bảo hiểm, cơ quan nhà ở của chính phủ, appraiser (người thẩm định giá).",
"e7t": "8. Không cố ý mà vẫn gây kỳ thị",
"e7b": "Hai ví dụ: (A) trước khi nhận offer, xin hoặc gửi thông tin cá nhân, thư từ người mua, nhất là có hình — dễ lộ thông tin được bảo vệ, dễ bị kiện. (B) Không cho người già thuê tầng trên vì sợ leo cầu thang, hoặc không cho gia đình có con nhỏ thuê nhà có hồ bơi.",
"e8t": "9. Việc làm sai luật (A–O)",
"e8b": "Từ chối thương lượng, không trình offer; không cho coi nhà; lái khách tới/tránh một khu (steering); gây hoảng để người ta bán (blockbusting); quảng cáo thể hiện ưu tiên; hỏi đặc điểm được bảo vệ; dùng tiền án trước khi xét đủ điều kiện mà không có lý do chính đáng; tính thu nhập trên cả tiền thuê thay vì phần người thuê có trợ cấp tự trả; từ chối cho vay hay bảo hiểm; điều kiện tệ hơn; tiêu chí khác nhau; quấy rối; bất lợi vì đặc điểm được bảo vệ; từ chối sửa đổi hợp lý hay điều chỉnh hợp lý cho người khuyết tật (kể cả thú phục vụ/hỗ trợ); trả đũa người đòi quyền.",
"e9t": "10. Cách làm đúng",
"e9b": "Agent dùng cùng tiêu chí khách quan (khu vực, đặc điểm nhà, tầm giá) cho mọi khách; đưa thông tin đầy đủ theo tiêu chí của khách; cùng sự lịch sự với mọi người. Chủ nhà không viết câu kiểu \"không nhận con nít\" hay \"chỉ người nói tiếng Anh\", và chọn offer/đơn thuê bằng thông tin khách quan, ví dụ bảng tóm tắt SUM-MO.",
"e10t": "11. Hỏi ở đâu, khiếu nại ở đâu",
"e10b": "HUD (liên bang), Civil Rights Department của California, Fair Housing Council địa phương (miễn phí), DRE (khiếu nại agent), hội REALTORS® địa phương, hoặc luật sư về Fair Housing.",
"e11t": "12. Vài ngoại lệ hẹp",
"e11b": "Nhà cho người lớn tuổi hợp lệ (chỉ về tuổi và gia đình có con); chủ ở chung nhà với 1 người thuê phòng; chủ không quá 3 căn tự bán/cho thuê không qua agent; chủ ở trong nhà 1–4 căn tự cho thuê; ở chung phòng (roommate). Hầu hết mất ngoại lệ nếu có agent tham gia. Ngoại lệ không bao giờ cho phép kỳ thị chủng tộc. Form nói agent không có chuyên môn tư vấn về ngoại lệ — hỏi luật sư trước.",
"ex_story": "Bà Mai Trần bán căn 1234 Example Lane, San Jose, CA 95100. Cuối tuần nhận 4 offer. Một offer kèm lá thư dài và tấm hình cả nhà. Agent của bà khuyên đừng đọc thư, gom 4 offer vào một bảng tóm tắt chỉ có số. Anh Tâm & chị Hoa Nguyễn (Ken là agent bên mua) không gửi thư, chỉ gửi giá và điều kiện gọn gàng. Hai bên đều ký FHDA từ đầu.",

"e1b": "The form names the federal Fair Housing Act (FHA), California's FEHA, the Unruh Civil Rights Act (businesses must serve everyone equally), the ADA (disability in public places), and others, including city or county ordinances.",

"e4b": "Agents need 3 hours of fair housing training to renew their license. Supervising brokers must know these laws. A violating agent can lose or have their license suspended.",
"e5t": "6. REALTOR® Code of Ethics",
"e5b": "Article 10 of the NAR Code of Ethics bans REALTORS® from discriminating in hiring or in real estate services.",
"e6t": "7. Who must comply",
"e6b": "Not only agents: sellers, landlords, sublessors, brokerages, property managers, mobile home parks, HOAs, banks and lenders, insurers, government housing services, appraisers.",
"e7t": "8. No intent, still a discriminatory effect",
"e7b": "Two examples: (A) before accepting an offer, asking for or giving buyer letters or personal info, especially photos — they can reveal protected traits and invite claims. (B) Refusing an upstairs unit to an older tenant over stairs, or a pool home to a family with small kids.",
"e8t": "9. Unlawful conduct (A–O)",
"e8b": "Refusing to negotiate or present offers; refusing to show; steering; blockbusting; ads with a preference; asking about protected traits; using criminal history too early without justification; applying income ratios to the whole rent instead of the subsidized tenant's share; denying loans or insurance; worse terms; different criteria; harassment; adverse action; refusing reasonable modifications or accommodations for disability (including service/support animals); retaliation.",
"e9t": "10. Positive practices",
"e9b": "Agents use the same objective criteria (area, features, price) for everyone, give complete info based on the client's criteria, and the same courtesy to all. Owners avoid lines like \"no children\" or \"English speakers only\" and choose offers or applicants on objective info, for example with a SUM-MO summary.",
"e10t": "11. Resources",
"e10b": "HUD (federal), California's Civil Rights Department, your local Fair Housing Council (free), the DRE (agent complaints), the local REALTOR® association, or a fair housing attorney.",
"e11t": "12. Limited exceptions",
"e11b": "Lawful senior housing (age and familial status only); owner living with one lodger; owner of no more than three homes selling/renting without an agent; owner living in a 1–4 unit building renting without an agent; roommate situations. Most are lost if an agent is involved. No exemption allows race discrimination. Agents can't advise on exemptions — ask a lawyer first.",
"ex_story": "Bà Mai Trần is selling 1234 Example Lane, San Jose, CA 95100. Over the weekend, 4 offers come in. One has a long letter and a family photo. Her agent advises her not to read it and puts all 4 offers into a numbers-only summary. Anh Tâm & chị Hoa Nguyễn (Ken is their agent) send no letter — just clean price and terms. Both sides signed the FHDA at the start.",
"ex_mh": "FHDA form (mock) + offer summary (example numbers)",
"ex_end": "Bà Mai picks offer B: slightly lower than A but shorter contingencies and a faster close. The choice rests on numbers, not a photo. If a rejected buyer ever questions it, the summary shows she chose fairly.",
"m0l": "Buyer/Tenant",

"my1": "<b>\"Asking 'do you have kids?' is just small talk.\"</b> In a rental or sale, the form lists it as asking about a protected trait — not allowed.",

"ken": "Many Vietnamese buyers think a letter with a family photo is a secret weapon. I don't send them, and I tell sellers not to read them. Not to be difficult. A photo reveals things the law says you can't use to pick a buyer. Win with price, clean terms and a solid deposit. That's enough.",

let lang='vi'; try{ if(localStorage.getItem('kl_lang')==='en') lang='en'; }catch(e){}
const $=id=>document.getElementById(id);
const fmt=n=>'$'+Math.round(n).toLocaleString('en-US');
const fill=(s,v)=>String(s).replace(/\{(\w+)\}/g,(m,k)=>v[k]??m);
const strip=s=>String(s).replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&nbsp;/g,' ');
let last={sum:'',r:''};
function applyLang(){
  const d=I18N[lang];
  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.getAttribute('data-i'); if(typeof d[k]==='string') el.innerHTML=d[k];});
  $('langBtn').textContent=d.lang; document.documentElement.lang=lang; document.title=d.doc_title;
  calc();
}
function done(){ const d=I18N[lang];
  $('smsBtn').href='sms:4086662825?&body='+encodeURIComponent(fill(d.sms,last)); }
$('langBtn').onclick=()=>{lang=lang==='vi'?'en':'vi'; try{localStorage.setItem('kl_lang',lang)}catch(e){} applyLang();};
$('emailBtn').onclick=()=>{$('form').classList.toggle('open'); if($('form').classList.contains('open')) $('fname').focus();};
$('sendBtn').onclick=()=>{
  const d=I18N[lang], n=$('fname').value.trim()||'—', e=$('femail').value.trim()||'—', ph=$('fphone').value.trim()||'—';
  const v=Object.assign({},last,{n,e,ph});
  /* LEAD: email tới ken@kenlamrealty.com (FUB email parsing). */
  const body=fill(d.mail_head,v)+'\n\n'+last.sum+'\n\n'+d.mail_foot;
  const href='mailto:ken@kenlamrealty.com?subject='+encodeURIComponent(fill(d.subj,v))+'&body='+encodeURIComponent(body);
  window.__lastMailto=href;
  const a=document.createElement('a'); a.href=href; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove();
  $('sent').hidden=false;
};
$('copyBtn').onclick=async()=>{ try{ await navigator.clipboard.writeText('4086662825'); $('copyBtn').textContent='✓'; }catch(e){ const r=document.createRange(); r.selectNodeContents($('copyBtn').previousElementSibling); const s=getSelection(); s.removeAllRanges(); s.addRange(r);} };


let picks={};
function score(p){ let c=0,dn=0; CFG.ANS.forEach((a,i)=>{ if(p[i]){dn++; if(p[i]===a) c++;} }); return {c,dn,t:CFG.ANS.length}; }
function calc(){
  const d=I18N[lang], s=score(picks);
  $('quiz').innerHTML=d.QS.map((q,i)=>{
    const p=picks[i], a=CFG.ANS[i], st=p?(p===a?'good':'bad'):'';
    const btn=['ok','no','risk'].map(k=>'<button type="button" data-q="'+i+'" data-v="'+k+'" aria-pressed="'+(p===k)+'">'+d.C[k]+'</button>').join('');
    const ex=p?'<p class="ex">'+(p===a?'<b class="g">'+d.g+'</b> ':'<b class="b">'+fill(d.b,{a:d.C[a]})+'</b> ')+q.w+'</p>':'';
    return '<div class="qc '+st+'"><span class="qn">'+fill(d.qn,{i:i+1,t:s.t})+'</span><p>'+q.q+'</p><div class="ch">'+btn+'</div>'+ex+'</div>';
  }).join('');
  $('oScore').textContent=s.c+'/'+s.t;
  $('oMeter').innerHTML=CFG.ANS.map((a,i)=>'<i class="'+(picks[i]?('on '+(picks[i]===a?'l0':'l3')):'')+'"></i>').join('');
  $('oHint').textContent=s.dn===0?d.H.start:(s.dn<s.t?fill(d.H.mid,{d:s.dn,t:s.t}):(s.c>=CFG.PASS?d.H.pass:d.H.fail));
  const wrong=d.QS.map((q,i)=>picks[i]&&picks[i]!==CFG.ANS[i]?('- '+q.q+' → '+d.C[CFG.ANS[i]]):null).filter(Boolean);
  last={s:s.c+'/'+s.t,r:s.c+'/'+s.t};
  last.sum=fill(d.S,{s:s.c+'/'+s.t+' ('+s.dn+'/'+s.t+')',w:wrong.length?wrong.join('\n'):d.none});
  done();
}
$('quiz').addEventListener('click',e=>{const b=e.target.closest('button[data-q]'); if(!b) return; picks[b.dataset.q]=b.dataset.v; calc();});
$('resetBtn').onclick=()=>{picks={}; calc(); window.scrollTo(0,0);};
window.__score=score;

applyLang();
</script>
