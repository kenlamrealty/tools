", "crop": "s02.jpg", "pins": [{"t": {"vi": "Owner và Broker", "en": "Owner and Broker"}, "d": {"vi": "Ghi đủ tên mọi người đứng tên đất. Broker là công ty môi giới, không phải tên agent.", "en": "Write every owner on title. The Broker is the brokerage firm, not the agent's name."}, "x": 7.52, "y": 29.4}, {"box": [10.94, 40.52, 22.36, 18.96], "t": {"vi": "Độc quyền", "en": "Exclusive right"}, "d": {"vi": "Trong thời gian listing, ai bán được (kể cả chủ tự bán) thì broker vẫn có hoa hồng. Chọn SELL, LEASE, hoặc ghi khác.", "en": "During the listing, whoever finds the buyer (even the owner), the broker earns the fee. Pick SELL, LEASE, or write another."}, "x": 9.96, "y": 50.0}, {"t": {"vi": "Địa chỉ, city, county", "en": "Address, city, county"}, "d": {"vi": "Ví dụ: 1234 Example Lane, San Jose, Santa Clara, 95100.", "en": "Example: 1234 Example Lane, San Jose, Santa Clara, 95100."}, "x": 47.48, "y": 58.05}, {"t": {"vi": "Số APN rất quan trọng", "en": "The APN matters"}, "d": {"vi": "Đất trống hay không có số nhà. APN là cách chắc nhất để biết đúng lô nào. Lấy trên tax bill.", "en": "Vacant land often has no street number. The APN is the surest way to identify the lot. It's on the tax bill."}, "x": 7.52, "y": 81.04}], "page": "p03.jpg"}, {"title": {"vi": "2A–2B: Thời hạn và giá list", "en": "2A–2B: Listing period and price"}, "short": {"vi": "Thời hạn, giá", "en": "Term, price"}, "ref": "Trang 3 · Mục 2A–2B", "crop": "s03.jpg", "pins": [{"t": {"vi": "Ngày bắt đầu", "en": "Beginning date"}, "d": {"vi": "Từ ngày này broker có quyền độc quyền. Các hạn 5 ngày (giấy tờ, báo cáo) cũng tính từ ngày này.", "en": "The exclusive right starts here. The 5-day deadlines (ID, reports) count from this date."}, "x": 19.2, "y": 54.58}, {"box": [64.65, 47.16, 14.8, 14.7], "t": {"vi": "Hết hạn 11:59 tối", "en": "Ends 11:59 P.M."}, "d": {"vi": "Phải ghi ngày cụ thể. Luật bắt listing độc quyền có ngày kết thúc rõ ràng. Đất thường list 6–12 tháng <span class=\"tag\">Thực hành</span>.", "en": "A specific date is required. The law requires a definite end date. Land is often listed 6–12 months <span class=\"tag\">Practice</span>."}, "x": 63.66, "y": 54.51}, {"t": {"vi": "Giá list", "en": "Listing price"}, "d": {"vi": "Ghi bằng chữ và bằng số. Seller tự quyết giá (mục 7D), agent chỉ đề nghị.", "en": "Written in words and numbers. The owner decides the price (7D); the agent only advises."}, "x": 19.2, "y": 65.1}, {"t": {"vi": "Có mobile home, probate", "en": "Mobile home, probate"}, "d": {"vi": "Có mobile home trên đất thì kèm MHLA. Bán đất trong probate thì kèm PLA.", "en": "A mobile home on the land needs the MHLA. A probate sale needs the PLA."}, "x": 45.44, "y": 75.55}], "example": {"vi": "Anh Tâm list lô 1234 Example Lane giá $650,000, bắt đầu 01/03/2026, 6 tháng. Ghi ngày hết hạn 31/08/2026, 11:59 tối. Tool bên dưới tính giùm.", "en": "Mr. Tâm lists the 1234 Example Lane lot at $650,000, starting 03/01/2026 for 6 months. End date: 08/31/2026 at 11:59 P.M. The tool below does the math."}, "page": "p03.jpg"}, {"title": {"vi": "2C: Hoa hồng và “Continuation Period”", "en": "2C: Commission and the Continuation Period"}, "short": {"vi": "Hoa hồng", "en": "Commission"}, "ref": "Trang 3 · Mục 2C", "crop": "s04.jpg", "pins": [{"t": {"vi": "Hoa hồng không do luật định", "en": "Commission isn't set by law"}, "d": {"vi": "Mỗi broker tự đặt, thương lượng được. Form BCA (trang 13–14) nói thêm.", "en": "Each broker sets it and it's negotiable. The BCA (pages 13–14) explains more."}, "x": 10.38, "y": 8.47}, {"box": [50.29, 17.37, 14.72, 7.46], "t": {"vi": "C(1): chỉ phía seller", "en": "C(1): seller's side only"}, "d": {"vi": "% này chỉ trả cho broker bên bán. Có hợp đồng mua thì % tính trên <b>giá bán thật</b>. Cũng có thể ghi số tiền cố định.", "en": "This % pays only the listing side. Once there's a purchase contract the % is based on the <b>actual price</b>. A flat fee is also possible."}, "x": 49.31, "y": 21.1}, {"t": {"vi": "C(2): buyer không có agent", "en": "C(2): unrepresented buyer"}, "d": {"vi": "Nếu đánh dấu: buyer tự đi một mình, broker làm thêm việc, seller trả thêm %. Không áp dụng khi dual agency.", "en": "If checked: when the buyer has no agent, the broker does extra work and gets an extra %. Not for dual agency."}, "x": 20.61, "y": 41.74}, {"box": [45.02, 65.74, 19.55, 7.46], "t": {"vi": "C(3): số ngày bảo vệ", "en": "C(3): protection days"}, "d": {"vi": "Form để <b>trống</b>, hai bên tự ghi số ngày. Hết listing mà người broker đã dẫn coi quay lại mua trong số ngày này, broker vẫn có hoa hồng (xem 4D(2)).", "en": "The form leaves it <b>blank</b>; you write the number. If a buyer the broker showed comes back within these days, the broker is still paid (see 4D(2))."}, "x": 44.04, "y": 69.47}], "warn": {"vi": "Tiền trả cho agent bên mua <b>không</b> nằm trong C(1). Seller muốn trả thì thường ghi trong offer hoặc thỏa thuận riêng (mục 10).", "en": "Pay for the buyer's agent is <b>not</b> in C(1). If the seller agrees to pay it, that's usually in the offer or a separate agreement (section 10)."}, "page": "p03.jpg"}, {"title": {"vi": "2F–2J: Offer, báo cáo phải đặt, lockbox, bảng", "en": "2F–2J: Offers, reports, lockbox, sign"}, "short": {"vi": "Báo cáo", "en": "Reports"}, "ref": "Trang 4 · Mục 2F–2J", "crop": "s05.jpg", "pins": [{"t": {"vi": "F(1): Khi nào coi offer", "en": "F(1): When to review offers"}, "d": {"vi": "Mặc định: có offer là đưa liền. Hoặc hẹn ngày coi offer cùng lúc.", "en": "Default: offers are presented as they come. Or set a review date."}, "x": 19.04, "y": 9.03}, {"t": {"vi": "F(2): Báo cáo seller đặt", "en": "F(2): Reports the owner orders"}, "d": {"vi": "Đánh dấu báo cáo nào (NHD, title, septic…). Seller phải đặt và trả tiền trong <b>5 ngày</b> (hoặc số khác) từ ngày bắt đầu.", "en": "Tick which reports (NHD, title, septic…). The owner orders and pays within <b>5 days</b> (or another number) of the beginning date."}, "x": 19.04, "y": 21.72}, {"t": {"vi": "Đất trống: septic, title", "en": "Land: septic, title"}, "d": {"vi": "Với đất, đáng đặt nhất là NHD, preliminary title, septic/perc. Pool, roof thường bỏ trống.", "en": "For land, the useful ones are NHD, preliminary title, septic/perc. Pool and roof usually stay blank."}, "x": 45.28, "y": 48.56}, {"t": {"vi": "J: Không lockbox, không bảng", "en": "J: No lockbox, no sign"}, "d": {"vi": "Đánh dấu thì broker không gắn lockbox hoặc bảng FOR SALE. Đất trống thường cần bảng để người chạy ngang thấy.", "en": "Tick to refuse a lockbox or FOR SALE sign. Vacant land usually benefits from a sign."}, "x": 19.04, "y": 81.27}], "page": "p04.jpg"}, {"title": {"vi": "4D: Khi nào broker có quyền lấy hoa hồng", "en": "4D: When the broker earns the commission"}, "short": {"vi": "Khi nào trả", "en": "When earned"}, "ref": "Trang 4 · Mục 4D", "crop": "s06.jpg", "pins": [{"t": {"vi": "(1) Bán xong, hoặc seller phá", "en": "(1) Sale closes, or owner defaults"}, "d": {"vi": "Ai tìm được buyer trong thời gian listing và offer được nhận, buyer mua xong (hoặc seller làm hỏng) là có hoa hồng, kể cả close sau khi hết hạn.", "en": "Anyone finds a buyer during the listing, the offer is accepted, and it closes (or the owner blocks it): commission is earned, even if escrow closes after expiration."}, "x": 13.23, "y": 17.65}, {"box": [14.21, 34.5, 43.58, 10.98], "t": {"vi": "(2) Người cũ quay lại", "en": "(2) A prior buyer returns"}, "d": {"vi": "Trong Continuation Period, seller bán cho người đã được dẫn coi hoặc đã gửi offer viết, broker vẫn có hoa hồng.", "en": "During the Continuation Period, if the owner sells to someone who was shown the land or made a written offer, the broker is still paid."}, "x": 13.23, "y": 39.99}, {"box": [74.8, 74.69, 13.31, 10.91], "t": {"vi": "Phải có danh sách NPB", "en": "The NPB list is required"}, "d": {"vi": "Điều (2) chỉ có hiệu lực nếu broker gửi seller danh sách tên người mua tiềm năng (form NPB) <b>trước khi listing hết hạn</b>.", "en": "(2) only applies if the broker gives the owner a written list of names (Form NPB) <b>before the listing expires</b>."}, "x": 73.82, "y": 80.15}, {"t": {"vi": "(3) Seller tự rút", "en": "(3) Owner withdraws"}, "d": {"vi": "Seller rút đất khỏi thị trường, cho thuê, sang tên mà broker không đồng ý bằng giấy: vẫn có thể phải trả.", "en": "Withdrawing, leasing or transferring the land without the broker's written consent can still trigger the fee."}, "x": 13.23, "y": 84.67}], "example": {"vi": "Listing 1234 Example Lane hết hạn 31/08. Anh Bình từng được dẫn coi lô hồi tháng 5. Broker gửi NPB có tên anh Bình ngày 25/08. Ngày 15/09 anh Tâm ký bán cho anh Bình. Continuation 30 ngày (tới 30/09): broker vẫn có hoa hồng.", "en": "The 1234 Example Lane listing ends 08/31. Mr. Bình was shown the lot in May. The broker sent an NPB naming him on 08/25. On 09/15 the owner signs with Mr. Bình. With a 30-day continuation (to 09/30), the broker is still paid."}, "page": "p04.jpg"}, {"title": {"vi": "Mục 6–7B: Seller cam kết và trình giấy tờ", "en": "Sections 6–7B: Owner promises and ID"}, "short": {"vi": "Cam kết", "en": "Promises"}, "ref": "Trang 5 · Mục 6–7B", "crop": "s07.jpg", "pins": [{"t": {"vi": "Không có nợ, kiện tụng ẩn", "en": "No hidden defaults or lawsuits"}, "d": {"vi": "Seller cam kết không biết có Notice of Default, nợ trễ, phá sản, kiện tụng, special assessment. Có thì phải nói.", "en": "The owner says they know of no Notice of Default, late loans, bankruptcy, lawsuits or special assessments. If there are, say so."}, "x": 86.69, "y": 11.14}, {"t": {"vi": "Phát sinh thì báo ngay", "en": "Report new ones promptly"}, "d": {"vi": "Trong lúc listing có chuyện mới thì báo broker bằng giấy.", "en": "Anything new during the listing goes to the broker in writing."}, "x": 41.53, "y": 29.42}, {"box": [11.44, 74.13, 22.34, 11.23], "t": {"vi": "7B: Giấy tờ tùy thân trong 5 ngày", "en": "7B: Photo ID within 5 days"}, "d": {"vi": "Seller đưa ID có hình trong 5 ngày từ ngày bắt đầu. Không đưa, broker được tự hủy listing. Chống lừa đảo bán đất trống (người lạ giả chủ).", "en": "The owner shows photo ID within 5 days of the start. If not, the broker may cancel. This fights vacant-land seller fraud (impostors)."}, "x": 10.46, "y": 79.75}], "warn": {"vi": "Đất trống không người ở là mục tiêu số một của lừa đảo giả chủ bán đất. Agent kiểm ID kỹ là bảo vệ chính chủ đất.", "en": "Empty land is the top target for seller-impersonation fraud. Careful ID checks protect the real owner."}, "page": "p05.jpg"}, {"title": {"vi": "Mục 14–19: Bảng, quản lý duyệt, hòa giải", "en": "Sections 14–19: Sign, manager approval, mediation"}, "short": {"vi": "Điều khoản cuối", "en": "Final terms"}, "ref": "Trang 7 · Mục 14–19", "crop": "s08.jpg", "pins": [{"t": {"vi": "14: Bảng FOR SALE", "en": "14: FOR SALE sign"}, "d": {"vi": "Không đánh dấu opt-out ở 2J thì broker được cắm bảng.", "en": "Unless you opted out in 2J, the broker may put up a sign."}, "x": 7.52, "y": 7.13}, {"box": [8.5, 23.91, 20.48, 7.14], "t": {"vi": "17: Broker được hủy trong 5 ngày", "en": "17: Broker may cancel in 5 days"}, "d": {"vi": "Agent ký thay công ty thì broker/manager có 5 ngày sau khi ký để hủy bằng giấy.", "en": "If an agent signs for the firm, the broker or manager has 5 days after signing to cancel in writing."}, "x": 7.52, "y": 27.48}, {"t": {"vi": "19A: Hòa giải trước", "en": "19A: Mediate first"}, "d": {"vi": "Có tranh chấp phải hòa giải trước khi kiện. Bỏ qua hòa giải là mất quyền đòi phí luật sư.", "en": "Disputes go to mediation before court. Skip it and you may lose the right to attorney fees."}, "x": 10.46, "y": 46.37}, {"t": {"vi": "19C: Trọng tài là tùy chọn", "en": "19C: Arbitration is optional"}, "d": {"vi": "Muốn trọng tài thay vì ra tòa thì ký thêm form ARB riêng.", "en": "To use arbitration instead of court, sign a separate ARB form."}, "x": 10.46, "y": 87.06}], "page": "p07.jpg"}], "tool": {"intro": {"vi": "Nhập giá list, % hoa hồng phía seller, ngày bắt đầu và số tháng. Tool ra <b>ngày hết hạn</b>, <b>tiền hoa hồng</b>, <b>tiền ròng ước tính</b> và <b>ngày hết Continuation Period</b>.", "en": "Enter the price, the listing-side commission %, the start date and months. The tool gives the <b>end date</b>, <b>commission in dollars</b>, an <b>estimated net</b> and the <b>Continuation Period end</b>."}, "inputs": [{"id": "price", "type": "number", "def": 650000, "min": 0, "step": 1000, "label": {"vi": "Giá list ($)", "en": "Listing price ($)"}}, {"id": "pct", "type": "number", "def": 3, "min": 0, "max": 10, "step": 0.25, "label": {"vi": "Hoa hồng phía seller, mục 2C(1) (%)", "en": "Listing-side commission, 2C(1) (%)"}}, {"id": "start", "type": "date", "def": "2026-03-01", "label": {"vi": "Ngày bắt đầu (2A(1))", "en": "Beginning date (2A(1))"}}, {"id": "months", "type": "number", "def": 6, "min": 1, "max": 24, "step": 1, "label": {"vi": "Số tháng listing", "en": "Listing months"}}, {"id": "cont", "type": "number", "def": 30, "min": 0, "max": 365, "step": 1, "label": {"vi": "Continuation Period (ngày, 2C(3))", "en": "Continuation Period (days, 2C(3))"}, "hint": {"vi": "Form để trống. Số ngày do hai bên ghi.", "en": "Blank on the form. You and the broker fill it in."}}]}, "myths": [{"t": {"vi": "“Hết hạn listing là hết nợ broker.”", "en": "“Once the listing ends, I owe the broker nothing.”"}, "d": {"vi": "Còn Continuation Period. Người broker đã dẫn coi hoặc đã gửi offer, có tên trong NPB, quay lại mua trong số ngày đó thì vẫn phải trả.", "en": "There's the Continuation Period. If someone on the NPB list who was shown the land or made an offer comes back in time, the fee is still owed."}}, {"t": {"vi": "“Hoa hồng 2C(1) là trả cho cả hai agent.”", "en": "“The 2C(1) commission covers both agents.”"}, "d": {"vi": "Bản 6/26 ghi rõ: C(1) chỉ là phía seller. Trả agent bên mua là chuyện riêng, thường nằm trong offer.", "en": "The 6/26 version says it plainly: C(1) is the owner's side only. Buyer-agent pay is separate, usually in the offer."}}, {"t": {"vi": "“Tự tìm được người mua thì khỏi trả hoa hồng.”", "en": "“If I find the buyer myself, no commission.”"}, "d": {"vi": "Đây là listing <b>độc quyền</b>: trong thời gian listing, chủ tự bán vẫn phải trả, trừ khi có ghi ngoại lệ (ví dụ người có tên ở 2C(4)).", "en": "It's an <b>exclusive right</b> listing: even if the owner finds the buyer during the term, the fee is owed unless an exception is written (e.g. names in 2C(4))."}}], "next": [{"href": "/t501/", "t": {"vi": "T501 · SVLA: Lời dặn seller đất trống", "en": "T501 · SVLA: Vacant land seller advisory"}, "d": {"vi": "Trang 17–18 của bộ này.", "en": "Pages 17–18 of this package."}}, {"href": "/t504/", "t": {"vi": "T504 · VLQ: Bảng câu hỏi seller đất trống", "en": "T504 · VLQ: Seller vacant land questionnaire"}, "d": {"vi": "Seller điền sau khi có buyer.", "en": "The seller completes it once there's a buyer."}}, {"href": "/t21/", "t": {"vi": "T21 · Bán xong cầm về bao nhiêu", "en": "T21 · What you take home"}, "d": {"vi": "Tính tiền ròng kỹ hơn.", "en": "A more detailed net sheet."}}, {"href": "/t321/", "t": {"vi": "T321 · Transfer tax từng city", "en": "T321 · Transfer tax by city"}, "d": {"vi": "Thuế sang tên theo county và city.", "en": "Transfer tax by county and city."}}], "sources": [{"t": "Bus. & Prof. Code §10176", "u": "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=BPC&sectionNum=10176"}, {"t": "Civil Code §2079.14 (AD form)", "u": "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=2079.14"}, {"t": "Bus. & Prof. Code §10140.8 (altered images)", "u": "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=BPC&sectionNum=10140.8"}, {"t": "C.A.R. Form VLL 6/26", "u": "https://www.car.org/"}]};
FORM.tool.compute=(function (v, H) {
      const vi = H.lang() === 'vi';
      const T = (a, b) => vi ? a : b;
      const s = H.parseDate(v.start);
      const price = Number(v.price) || 0, pct = Number(v.pct) || 0, m = Math.max(1, Math.round(Number(v.months) || 0)), cd = Math.max(0, Math.round(Number(v.cont) || 0));
      if (!s || !price) return { big: '—', sub: T('Nhập giá list và ngày bắt đầu.', 'Enter a price and a start date.') };
      const y = s.getFullYear(), mo = s.getMonth() + m, d = s.getDate();
      const last = new Date(y, mo + 1, 0).getDate();
      const end = d > last ? new Date(y, mo, last) : H.addDays(new Date(y, mo, d), -1);
      const contEnd = H.addDays(end, cd);
      const fee = price * pct / 100, other = price * 0.01, net = price - fee - other;
      const items = [
        T('Hoa hồng phía seller (2C(1)): <b>', 'Listing-side commission (2C(1)): <b>') + H.fmtMoney(fee) + '</b> (' + pct + '% × ' + H.fmtMoney(price) + ')',
        T('Tiền ròng ước tính: <b>', 'Estimated net: <b>') + H.fmtMoney(net) + '</b> <span class="tag">' + T('Ước tính', 'Estimate') + '</span> ' + T('= giá − hoa hồng − 1% chi phí khác (escrow, title, thuế sang tên county $1.10/$1,000). Chưa trừ nợ vay, thuế lời, tiền agent bên mua nếu seller đồng ý trả, thuế bị giữ.', '= price − commission − 1% other costs (escrow, title, county transfer tax $1.10/$1,000). Not counting loan payoff, capital gains, buyer-agent pay if the seller agrees, or withholding.'),
        (cd ? T('Continuation Period hết: <b>', 'Continuation Period ends: <b>') + H.fmtDate(contEnd) + '</b> (' + cd + T(' ngày sau khi hết listing). Broker phải gửi danh sách NPB <b>trước khi listing hết hạn (11:59 tối ', ' days after the listing ends). The broker must deliver the NPB list <b>before the listing expires (11:59 P.M. ') + H.fmtDate(end) + ')</b>' + T(' thì điều này mới có hiệu lực (4D(2)).', ' for this to apply (4D(2)).') : T('Continuation Period 0 ngày: hết listing là hết quyền đòi hoa hồng với người mua cũ (trừ khi offer đã được nhận trong thời hạn, 4D(1)).', 'Continuation Period of 0 days: once the listing ends, no fee for returning buyers (unless an offer was accepted during the term, 4D(1)).')),
        T('Seller đưa ID có hình (7B) và đặt báo cáo đã chọn (2F(2)) trước: <b>', 'Owner photo ID (7B) and ordering selected reports (2F(2)) due by: <b>') + H.fmtDate(H.addDays(s, 5)) + '</b> ' + T('(5 ngày từ ngày bắt đầu).', '(5 days from the start).'),
        T('Giá bán thật khác giá list thì hoa hồng tính theo giá bán. Ví dụ bán ', 'If it sells for a different price, the % applies to the sale price. E.g. selling at ') + H.fmtMoney(price * 0.95) + T(' → hoa hồng ', ' → commission ') + H.fmtMoney(price * 0.95 * pct / 100) + '.'
      ];
      if (pct > 6) items.unshift(T('<span class="tag">Kiểm lại</span> % phía seller cao bất thường. Có thể anh chị đã cộng luôn phần agent bên mua.', '<span class="tag">Check</span> This listing-side % is unusually high. You may have included the buyer-agent share.'));
      if (m > 12) items.push(T('Listing trên 12 tháng: thương lượng được, nhưng nhớ chỉ ghi một ngày hết hạn cụ thể.', 'Listing over 12 months: negotiable, just make sure a specific end date is written.'));
      return { big: T('Hết hạn: 11:59 tối ', 'Ends 11:59 P.M. ') + H.fmtDate(end), sub: T('Hoa hồng ', 'Commission ') + H.fmtMoney(fee) + T(' · Ròng ước tính ', ' · Est. net ') + H.fmtMoney(net), items, bad: pct > 6 };
    });
const UI={
 vi:{eb:"Ken Lam Library · Giải nghĩa Forms",lang:"English",vidH:"Xem 45 giây trước",vidP:"Clip ngắn tóm form này. Không tiếng, có chữ. Xem xong rồi đi từng phần bên dưới.",walkH:"Đi từng phần của form",walkP:"Hình chụp thật từ form (địa chỉ đã đổi thành ví dụ 1234 Example Lane). Chấm đỏ khớp với số giải thích bên dưới.",prev:"← Trước",nxt:"Tiếp →",zoom:"Phóng to trang",hint:"Kéo ngang để coi hết",ex:"Ví dụ với 1234 Example Lane",warn:"Coi chừng",toolH:"Tool: thử với nhà của anh chị",mythH:"Nhiều người hiểu sai",nextH:"Bước tiếp theo",mail:"Email kết quả cho Ken",sms:"Nhắn Ken",vbtn:"Xem video 45 giây",src:"Nguồn",upd:"Cập nhật",allF:"Mọi forms giải nghĩa",allT:"Tất cả tools",disc:"Trang này giải thích cho dễ hiểu, không thay form gốc và không phải tư vấn pháp lý hay thuế. Hình trích từ form để minh họa. Chuyện tranh chấp, đứng tên, thuế: hỏi luật sư hoặc CPA.",step:"Phần",of:"/",keys:{k1:"Ai điền / ký",k2:"Khi nào gặp",k3:"Số trang",k4:"Luật nào bắt"}},
 en:{eb:"Ken Lam Library · Forms explained",lang:"Tiếng Việt",vidH:"Watch the 45-second version first",vidP:"A short clip that sums up this form. No sound, on-screen text in Vietnamese. Then walk through it part by part below.",walkH:"Walk through the form",walkP:"Real images from the form (the address was changed to the example 1234 Example Lane). Red pins match the numbered notes.",prev:"← Back",nxt:"Next →",zoom:"Open full page",hint:"Swipe sideways to see it all",ex:"Example: 1234 Example Lane",warn:"Watch out",toolH:"Tool: try it with your home",mythH:"What people get wrong",nextH:"Next steps",mail:"Email my result to Ken",sms:"Text Ken",vbtn:"Watch the 45-second video",src:"Sources",upd:"Updated",allF:"All forms explained",allT:"All tools",disc:"Plain-language explanation only. It does not replace the actual form and is not legal or tax advice. Form images are shown for illustration. For disputes, title or tax questions, ask an attorney or CPA.",step:"Part",of:"/",keys:{k1:"Who fills / signs",k2:"When you see it",k3:"Pages",k4:"Required by"}}
};
let lang='vi';try{const s=localStorage.getItem('kl_lang');if(s==='en'||s==='vi')lang=s;}catch(e){}
const qs=new URLSearchParams(location.search);if(qs.get('lang')==='en'||qs.get('lang')==='vi')lang=qs.get('lang');
const $=id=>document.getElementById(id);
const L=o=>o==null?'':(typeof o==='string'?o:(o[lang]??o.vi??''));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur=0, last=null;
function fmtMoney(n){return '$'+Math.round(n).toLocaleString('en-US')}
function fmtDate(d){if(!(d instanceof Date)||isNaN(d))return '—';return lang==='vi'?(String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()):d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function parseDate(s){if(!s)return null;const [y,m,dd]=s.split('-').map(Number);return new Date(y,m-1,dd)}
const H={fmtMoney,fmtDate,addDays,parseDate,L:o=>L(o),lang:()=>lang};

function renderStatic(){
  const u=UI[lang];document.documentElement.lang=lang;
  document.title=L(FORM.title)+' · Ken Lam Tools';
  $('eb').textContent=u.eb;$('lang').textContent=u.lang;
  $('code').textContent=FORM.code+' · '+FORM.form+' · '+FORM.rev;
  $('h1').textContent=L(FORM.title);$('one').innerHTML=L(FORM.one);
  $('facts').innerHTML=['k1','k2','k3','k4'].map((k,i)=>'<div><b>'+u.keys[k]+'</b><span>'+L(FORM.facts[i])+'</span></div>').join('');
  $('eli').innerHTML=L(FORM.eli10);
  ['vidH','vidP','walkH','walkP','toolH','mythH','nextH','mail','sms','vbtn','upd','allF','allT','disc'].forEach(k=>$(k).textContent=u[k]);
  $('prev').textContent=u.prev;$('nxt').textContent=u.nxt;
  $('srcL').innerHTML=u.src+': '+FORM.sources.map(s=>'<a href="'+s.u+'" target="_blank" rel="noopener">'+esc(s.t)+'</a>').join(' · ');
  $('myths').innerHTML=FORM.myths.map(m=>'<div class="warn"><b>'+L(m.t)+'</b>'+L(m.d)+'</div>').join('');
  $('next').innerHTML=FORM.next.map(n=>'<li><a href="'+n.href+'"><b>'+L(n.t)+'</b><br><span style="color:var(--muted);font-size:15px">'+L(n.d)+'</span></a></li>').join('');
  $('toolP').innerHTML=L(FORM.tool.intro);
  renderInputs();renderStep();compute();
}
function renderInputs(){
  const vals=readInputs(true);
  $('inputs').innerHTML=FORM.tool.inputs.map(f=>{
    const lab=L(f.label), hint=f.hint?'<small>'+L(f.hint)+'</small>':'';
    if(f.type==='check')return '<label class="chk" style="grid-column:1/-1"><input type="checkbox" id="f_'+f.id+'"'+((vals[f.id]??f.def)?' checked':'')+'><span>'+lab+hint+'</span></label>';
    if(f.type==='select')return '<label class="fld" for="f_'+f.id+'">'+lab+'<select id="f_'+f.id+'">'+f.options.map(o=>'<option value="'+o.v+'"'+(String(vals[f.id]??f.def)===String(o.v)?' selected':'')+'>'+L(o.l)+'</option>').join('')+'</select>'+hint+'</label>';
    const v=vals[f.id]??f.def??'';
    return '<label class="fld" for="f_'+f.id+'">'+lab+'<input id="f_'+f.id+'" type="'+f.type+'"'+(f.type==='number'?' inputmode="decimal"':'')+(f.min!=null?' min="'+f.min+'"':'')+(f.max!=null?' max="'+f.max+'"':'')+(f.step!=null?' step="'+f.step+'"':'')+' value="'+esc(v)+'">'+hint+'</label>';
  }).join('');
  $('inputs').querySelectorAll('input,select').forEach(e=>e.addEventListener('input',compute));
}
function readInputs(soft){
  const o={};FORM.tool.inputs.forEach(f=>{const e=$('f_'+f.id);if(!e){if(!soft)o[f.id]=f.def;return}
    o[f.id]=f.type==='check'?e.checked:(f.type==='number'?(e.value===''?null:Number(e.value)):e.value)});return o;
}
function compute(){
  let r;try{r=FORM.tool.compute(readInputs(false),H)}catch(e){r={big:'—',items:[]};console.error(e)}
  last=r;
  $('res').innerHTML='<div class="big'+(r.bad?' bad':'')+'">'+r.big+'</div>'+(r.sub?'<div class="sub">'+r.sub+'</div>':'')+(r.items&&r.items.length?'<ul>'+r.items.map(i=>'<li>'+i+'</li>').join('')+'</ul>':'');
}
function renderStep(){
  const u=UI[lang],s=FORM.steps[cur];
  $('chips').innerHTML=FORM.steps.map((x,i)=>'<button type="button" class="chip'+(i<cur?' done':'')+'" data-i="'+i+'"'+(i===cur?' aria-current="step"':'')+'>'+(i+1)+'. '+L(x.short||x.title)+'</button>').join('');
  const pins=(s.pins||[]).map((p,i)=>(p.box?'<span class="mark" style="left:'+p.box[0]+'%;top:'+p.box[1]+'%;width:'+p.box[2]+'%;height:'+p.box[3]+'%"></span>':'')+'<span class="pin" style="left:'+p.x+'%;top:'+p.y+'%">'+(i+1)+'</span>').join('');
  $('step').innerHTML='<div class="ref">'+u.step+' '+(cur+1)+' · '+esc(s.ref||'')+'</div><h3>'+L(s.title)+'</h3>'+(s.intro?'<p>'+L(s.intro)+'</p>':'')+
   (s.crop?'<div class="desk"><div class="scroll"><div class="sheet"><img src="'+s.crop+'" alt="'+esc(L(s.title))+'" loading="lazy">'+pins+'</div></div><div class="zoom"><span class="hint">'+u.hint+'</span><button type="button" id="zbtn" data-p="'+s.page+'">'+u.zoom+' ↗</button></div></div>':'')+
   '<ol class="pins">'+(s.pins||[]).map((p,i)=>'<li><span class="n">'+(i+1)+'</span><div><b class="pt">'+L(p.t)+'</b>'+L(p.d)+'</div></li>').join('')+'</ol>'+
   (s.example?'<div class="ex"><b>'+u.ex+'</b>'+L(s.example)+'</div>':'')+
   (s.warn?'<div class="warn"><b>'+u.warn+'</b>'+L(s.warn)+'</div>':'');
  $('cnt').textContent=(cur+1)+u.of+FORM.steps.length;
  $('prev').disabled=cur===0;$('nxt').disabled=cur===FORM.steps.length-1;
  const z=$('zbtn');if(z)z.onclick=()=>{$('lbImg').src=z.dataset.p;$('lb').hidden=false};
}
$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;cur=+b.dataset.i;renderStep()});
$('prev').onclick=()=>{if(cur>0){cur--;renderStep();$('walkH').scrollIntoView({behavior:'smooth'})}};
$('nxt').onclick=()=>{if(cur<FORM.steps.length-1){cur++;renderStep();$('walkH').scrollIntoView({behavior:'smooth'})}};
$('lbX').onclick=()=>{$('lb').hidden=true};
$('lang').onclick=()=>{lang=lang==='vi'?'en':'vi';try{localStorage.setItem('kl_lang',lang)}catch(e){}renderStatic()};
$('mail').onclick=()=>{
  const tmp=document.createElement('div');tmp.innerHTML=(last?last.big+'\n'+(last.sub||'')+'\n'+(last.items||[]).join('\n'):'');
  const vals=readInputs(false);
  const lines=FORM.tool.inputs.map(f=>'- '+L(f.label).replace(/<[^>]+>/g,'')+': '+(f.type==='check'?(vals[f.id]?'✓':'—'):(f.type==='select'?L((f.options.find(o=>String(o.v)===String(vals[f.id]))||{}).l):vals[f.id]))).join('\n');
  const subj=(lang==='vi'?'Hỏi về form ':'Question about form ')+FORM.form+' ('+FORM.code+')';
  const body=(lang==='vi'?'Chào anh Ken,\n\nEm vừa dùng tool '+FORM.code+'. Em nhập:\n':'Hi Ken,\n\nI just used tool '+FORM.code+'. My inputs:\n')+lines+'\n\n'+(lang==='vi'?'Kết quả:\n':'Result:\n')+tmp.textContent+'\n\n'+(lang==='vi'?'Em muốn hỏi thêm: ':'My question: ');
  location.href='mailto:ken@kenlamrealty.com?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
};
$('sms').href='sms:4086662825?&body='+encodeURIComponent('Chào anh Ken, em hỏi về form '+FORM.form+' ('+FORM.code+').');
renderStatic();
</script>
