function CALC(d){
  const acc=pd($('iAcc').value)||new Date(2026,10,16);
  const fdays=Math.max(1,Math.round(num('iFind',C.FIND_DAYS_DEFAULT)));
  const coeN=Math.max(1,Math.round(num('iCoe',30))), repN=Math.max(0,Math.round(num('iRep',0)));
  const dl=cal(acc,fdays), remIn=pd($('iRem').value), rem=remIn||dl.d;
  const nsp=addD(dl.d,-C.NSP_MIN_DAYS), can=addD(dl.d,1);
  const dep=biz(rem,C.DEPOSIT_BIZ_DAYS), cont=cal(rem,C.BUYER_CONT_DAYS), coe=cal(rem,coeN), rep=repN?cal(rem,repN):null;
  let h='<div class="bigk">'+d.r_big+'</div><div class="big">'+fd(dl.d)+'</div>'+(dl.r?'<p class="roll">'+COMMON[lang].rolled+'</p>':'');
  if(remIn&&remIn<acc)h+='<div class="bad">'+d.w_bad+'</div>';
  if(!remIn)h+='<p class="muted">'+d.assume+'</p>';
  if(remIn&&remIn>dl.d)h+='<div class="warn">'+d.w_late+'</div>';
  const row=(k,o)=>'<tr><td>'+k+'</td><td class="d">'+fd(o.d)+(o.r?'<span class="roll">'+COMMON[lang].rolled+'</span>':'')+'</td></tr>';
  h+='<div class="tbl"><table>'+row(d.r_dl,dl)+row(d.r_nsp,{d:nsp})+row(d.r_can,{d:can})+row(d.r_rem,{d:rem})+row(d.r_dep,dep)+row(d.r_cont,cont)+row(d.r_coe,coe)+(rep?row(d.r_rep,rep):'')+'</table></div>';
  if(rep){const a=iso(rep.d),b=iso(coe.d);h+='<div class="'+(a===b?'life':'warn')+'">'+(a===b?d.w_same:(a<b?d.w_before:d.w_after))+'</div>'}
  h+='<p class="muted">'+d.w_fixed+'</p><h3>'+d.buyer_h+'</h3><ul class="ck" style="padding-left:0">'+d.buyer_li.replace(/<li>/g,'<li>✓ ')+'</ul>';
  const o={acc:fds(acc),find:fdays,dl:fds(dl.d),rem:fds(rem),dep:fds(dep.d),cont:fds(cont.d),coe:fds(coe.d),rep:rep?fds(rep.d):d.none};
  return {html:h,subj:fill(d.subj,o),body:fill(d.body,o),sms:fill(d.sms,o)};
}

let lang='en';
try{ if(localStorage.getItem('kl_lang')==='vi') lang='vi'; }catch(e){}
const $=id=>document.getElementById(id);
const D=()=>Object.assign({},COMMON[lang],I18N[lang]);
const pad=n=>String(n).padStart(2,'0');
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pd(s){const a=String(s||'').split('-');return a.length===3&&+a[0]>1900?new Date(+a[0],+a[1]-1,+a[2]):null}
function addD(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function offDay(d){const w=d.getDay();return w===0||w===6||C.HOLIDAYS.indexOf(iso(d))>=0}
/* "Days" = calendar days; a performance day on Sat/Sun/holiday rolls to next business day (RPA ¶25I, Civ. Code §11) */
function cal(d,n){const raw=addD(d,n);let x=raw,r=false;while(offDay(x)){x=addD(x,1);r=true}return {d:x,r:r,raw:raw}}
function biz(d,n){let x=new Date(d),k=0;while(k<n){x=addD(x,1);if(!offDay(x))k++}return {d:x,r:false,raw:x}}
function fd(d){if(!d)return '—';const L=COMMON[lang];return lang==='vi'?L.days[d.getDay()]+', '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear():d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}
function fds(d){return lang==='vi'?pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear():pad(d.getMonth()+1)+'/'+pad(d.getDate())+'/'+d.getFullYear()}
function money(n,c){const v=Math.abs(n);return (n<0?'−':'')+'$'+v.toLocaleString('en-US',{minimumFractionDigits:c?2:0,maximumFractionDigits:c?2:0})}
function num(id,def){const v=parseFloat(String($(id).value).replace(/[,$\s]/g,''));return isNaN(v)?def:v}
function V(x){return '<span class="v">'+x+'</span>'}
function DL(o){return V(fd(o.d))+(o.r?'<span class="roll">'+COMMON[lang].rolled+'</span>':'')}
function fill(s,o){return s.replace(/\{(\w+)\}/g,(m,k)=>o[k]!=null?o[k]:m)}
function strip(h){const t=document.createElement('div');t.innerHTML=h;return t.textContent.replace(/[ \t]+/g,' ').trim()}

let cur=0;
function chips(){const c=$('chips');c.innerHTML='';STEPS.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.className='chip'+(i<cur?' done':'');b.textContent=(i+1)+'. '+s.chip[lang];if(i===cur)b.setAttribute('aria-current','step');b.onclick=()=>go(i,true);c.appendChild(b)})}
function renderStep(){
  const d=D(),s=STEPS[cur];
  let h='<div class="ref">'+s.ref[lang]+'</div><h3>'+s.q[lang]+'</h3>'+
   '<figure class="desk" style="margin:12px 0 6px"><div class="scroll"><img src="'+s.img+'" width="1164" alt="'+d.alt+' '+s.ref[lang]+' · '+C.CODE+'" loading="eager"></div><div class="zoom"><span class="legend"><span class="hint">'+d.drag+'</span>'+d.legend+'</span><button type="button" data-z="'+s.img+'">'+d.zoom+'</button></div></figure>'+
   '<div class="says">'+d.says+'</div><ol class="pins">'+s.pins[lang].map((q,i)=>'<li><span class="n">'+(i+1)+'</span><div><span class="pt">'+q[0]+'</span>'+q[1]+'</div></li>').join('')+'</ol>'+
   '<div class="life"><b>'+d.exh+'</b>'+s.ex[lang]+'</div>'+(s.warn?'<div class="warn"><b>'+d.warnh+'</b>'+s.warn[lang]+'</div>':'');
  $('step').innerHTML=h;
  $('count').textContent=(cur+1)+' / '+STEPS.length;
  $('prev').disabled=cur===0;
  $('next').textContent=cur===STEPS.length-1?d.again:d.next;
  chips();
  const a=$('chips').querySelector('[aria-current]');if(a){const c=$('chips');c.scrollLeft=a.offsetLeft-c.clientWidth/2+a.clientWidth/2}
}
function go(i,scroll){cur=(i+STEPS.length)%STEPS.length;renderStep();if(scroll){const t=$('walk_h');window.scrollTo({top:t.getBoundingClientRect().top+window.scrollY-8,behavior:'smooth'})}}
function runCalc(){
  const d=D(),r=CALC(d);
  $('res').innerHTML=r.html;
  $('mailBtn').href='mailto:ken@kenlamrealty.com?subject='+encodeURIComponent(r.subj)+'&body='+encodeURIComponent(r.body+'\n\n— '+C.CODE+' · tools.kenlamrealty.com/'+C.SLUG+'/');
  $('smsBtn').href='sms:4086662825?&body='+encodeURIComponent(r.sms);
}
function applyLang(){
  const d=D();
  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.getAttribute('data-i');if(typeof d[k]==='string')el.innerHTML=d[k]});
  $('langBtn').textContent=d.lang;document.documentElement.lang=lang;$('klBack').textContent=d.back;document.title=d.title;
  $('lbX').textContent=d.close;
  if(typeof onLang==='function')onLang(d);
  renderStep();runCalc();
}
$('prev').onclick=()=>go(cur-1,true);
$('next').onclick=()=>go(cur+1,true);
$('langBtn').onclick=()=>{lang=lang==='vi'?'en':'vi';try{localStorage.setItem('kl_lang',lang)}catch(e){}applyLang()};
document.querySelectorAll('#calc input,#calc select').forEach(el=>{el.addEventListener('input',runCalc);el.addEventListener('change',runCalc)});
document.addEventListener('click',e=>{const z=e.target.closest('[data-z]');if(z){$('lbImg').src=z.getAttribute('data-z');$('lb').hidden=false}});
$('lbX').onclick=()=>{$('lb').hidden=true};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('lb').hidden=true});
if(typeof initTool==='function')initTool();
applyLang();

</script>
